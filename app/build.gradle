plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

android {
    namespace 'io.github.oogiemudia.capgown'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.oogiemudia.capgown'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
        // The speech engine (the app's own listening) is built for phones' processors. The test build that
        // runs on an emulator in the checks (-Pemulator) also carries the build for a computer's processor.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
            if (project.hasProperty('emulator')) abiFilters 'x86_64'
        }
    }

    signingConfigs {
        release {
            // Keep the same key for every build, so a new version installs over the old one and keeps your ticks.
            storeFile file('capgown.keystore')
            storePassword '4ttV6ukXzQZhs0y3oqFUQv4Q'
            keyAlias 'capgown'
            keyPassword '4ttV6ukXzQZhs0y3oqFUQv4Q'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // Keeps the app file small to download: the speech engine is packed tight and unpacked when the app is installed.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // The app's own listening for mentor meetings (OwnSpeech): Moonshine Voice turns speech into words on the
    // phone. Only its engine is used, so none of the libraries it lists for its other parts are brought in.
    implementation('ai.moonshine:moonshine-voice:0.1.6') {
        transitive = false
    }
}
