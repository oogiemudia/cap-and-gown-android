<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cap and Gown Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ff8a3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Lexend:wght@400;700&display=swap">
<style>
/* Layout: phone-first single column. A colourful hero band carries the cap and tonight's work,
   the plan reads as a diary of weekday evenings, and a fixed tab bar sits at the bottom. */
:root {
  --bg: #f4f5fa;
  --surface: #ffffff;
  --surface-2: #eceef6;
  --ink: #18213d;
  --muted: #586180;
  --line: #dadff0;
  --pgce: #d9364f;
  --pgce-soft: rgba(217, 54, 79, 0.12);
  --assess: #0b8f7d;
  --assess-soft: rgba(11, 143, 125, 0.13);
  --other: #6b5bd2;
  --other-soft: rgba(107, 91, 210, 0.13);
  --ok: #1f8a4c;
  --warn: #b45309;
  --warn-soft: rgba(217, 119, 6, 0.14);
  --danger: #c62c45;
  --danger-soft: rgba(198, 44, 69, 0.12);
  --review: #a35a00;
  --review-soft: rgba(196, 110, 0, 0.13);

  /* Set by the theme picker in app.js */
  --hero-a: #ffc23d;
  --hero-b: #ff6a4d;
  --on-hero: #18213d;
  --cap-board: #18213d;
  --tassel: #ffe066;
  --accent: #ff7a2f;
  --accent-ink-l: #a34400;
  --accent-ink-d: #ffb37d;
  --accent-ink: var(--accent-ink-l);
  --accent-soft: rgba(255, 122, 47, 0.14);
  --on-accent: #18213d;

  --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --radius: 16px;
  --tabbar-h: 4.25rem;
  --scale: 1;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-mode="light"]) {
    --bg: #0e1222;
    --surface: #161c31;
    --surface-2: #1e2640;
    --ink: #eef0fa;
    --muted: #a5adc8;
    --line: #2a3352;
    --pgce: #ff6b81;
    --pgce-soft: rgba(255, 107, 129, 0.16);
    --assess: #3dd6bf;
    --assess-soft: rgba(61, 214, 191, 0.15);
    --other: #a99bff;
    --other-soft: rgba(169, 155, 255, 0.16);
    --ok: #4ade80;
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.14);
    --danger: #ff7389;
    --danger-soft: rgba(255, 115, 137, 0.14);
    --review: #ffb454;
    --review-soft: rgba(255, 180, 84, 0.15);
    --accent-ink: var(--accent-ink-d);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]),
:root[data-mode="dark"] {
  --bg: #0e1222;
  --surface: #161c31;
  --surface-2: #1e2640;
  --ink: #eef0fa;
  --muted: #a5adc8;
  --line: #2a3352;
  --pgce: #ff6b81;
  --pgce-soft: rgba(255, 107, 129, 0.16);
  --assess: #3dd6bf;
  --assess-soft: rgba(61, 214, 191, 0.15);
  --other: #a99bff;
  --other-soft: rgba(169, 155, 255, 0.16);
  --ok: #4ade80;
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.14);
  --danger: #ff7389;
  --danger-soft: rgba(255, 115, 137, 0.14);
  --review: #ffb454;
  --review-soft: rgba(255, 180, 84, 0.15);
  --accent-ink: var(--accent-ink-d);
  color-scheme: dark;
}

html {
  font-size: calc(100% * var(--scale));
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body.font-lexend { --font-body: "Lexend", "Segoe UI", Roboto, system-ui, sans-serif; }
body.font-system { --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

h1, h2, h3 {
  font-family: var(--font-display);
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
  letter-spacing: -0.01em;
}
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap {
  max-width: 46rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Hero band */
.hero {
  background:
    linear-gradient(120deg, transparent 0 62%, rgba(255, 255, 255, 0.16) 62% 68%, transparent 68%),
    linear-gradient(135deg, var(--hero-a), var(--hero-b));
  color: var(--on-hero);
  padding-block: 1rem 1.4rem;
  border-radius: 0 0 28px 28px;
}
.hero .wrap { position: relative; }
.hero-top {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding-top: 1.4rem;
}
.cap {
  width: 4rem;
  height: 4rem;
  flex: none;
  transform-origin: 50% 80%;
}
.cap .board { fill: var(--cap-board); }
.cap .edge { fill: var(--cap-board); opacity: 0.75; }
.cap .tassel { fill: var(--tassel); }
.cap .cord { stroke: var(--tassel); }
.cap .tassel-group { transform-origin: 404px 252px; animation: swing 2.8s ease-in-out 0.3s 2; }
.cap.toss { animation: toss 1.1s cubic-bezier(.3,.7,.4,1); }
@keyframes swing { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(9deg); } 65% { transform: rotate(-6deg); } }
@keyframes toss { 0% { transform: translateY(0) rotate(0); } 45% { transform: translateY(-2.2rem) rotate(-200deg); } 100% { transform: translateY(0) rotate(-360deg); } }
@media (prefers-reduced-motion: reduce) {
  .cap .tassel-group, .cap.toss { animation: none; }
  * { scroll-behavior: auto !important; transition: none !important; }
}
.brand { min-width: 0; }
.brand h1 { font-size: 1.45rem; font-weight: 800; }
.brand p { font-size: 0.9rem; opacity: 0.85; }
.sync-pill {
  position: absolute;
  top: 0;
  right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.25rem 0.6rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.28);
  white-space: nowrap;
}
.tonight {
  margin-top: 1rem;
  background: var(--surface);
  color: var(--ink);
  border-radius: var(--radius);
  padding: 1rem;
  box-shadow: 0 10px 30px rgba(14, 18, 34, 0.18);
  display: grid;
  gap: 0.7rem;
}
.tonight-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.eyebrow {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  color: var(--muted);
}
.tonight-head .mins { font-family: var(--font-display); font-weight: 700; color: var(--accent-ink); }

main { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 1.5rem); }
.view { display: grid; gap: 1.25rem; padding-block: 1.25rem 0; }
.section { display: grid; gap: 0.65rem; }
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.section-head .hint { font-size: 0.85rem; color: var(--muted); }

/* Course chips and filter */
.chips { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.chip {
  border: 1.5px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 0.35rem 0.85rem;
  font-size: 0.9rem;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.12rem 0.5rem;
  border-radius: 999px;
  white-space: nowrap;
}
.tag.pgce { background: var(--pgce-soft); color: var(--pgce); }
.tag.assess { background: var(--assess-soft); color: var(--assess); }
.tag.other { background: var(--other-soft); color: var(--other); }
.tag.status-check, .tag.status-estimate { background: var(--warn-soft); color: var(--warn); }
.tag.status-target { background: var(--accent-soft); color: var(--accent-ink); }
.tag.status-confirmed { background: var(--surface-2); color: var(--muted); }
.tag.late { background: var(--danger-soft); color: var(--danger); }

/* A step row */
.steps { display: grid; gap: 0.5rem; list-style: none; margin: 0; padding: 0; }
.step {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 0.7rem;
  align-items: start;
  padding: 0.7rem 0.75rem;
  background: var(--surface);
  border-radius: 12px;
  border-left: 4px solid var(--c, var(--line));
}
.step.pgce { --c: var(--pgce); }
.step.assess { --c: var(--assess); }
.step.other { --c: var(--other); }
.tonight .step { background: var(--surface-2); }
.step.is-done .step-title { text-decoration: line-through; color: var(--muted); }
.step-body { min-width: 0; display: grid; gap: 0.2rem; }
.step-title { font-weight: 700; }
.step-meta { font-size: 0.85rem; color: var(--muted); display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
.step-tip { font-size: 0.88rem; color: var(--muted); }
.step-for { font-size: 0.85rem; color: var(--muted); font-style: italic; }
.step-actions { display: flex; gap: 0.35rem; align-items: center; }

.tick {
  appearance: none;
  -webkit-appearance: none;
  width: 1.7rem;
  height: 1.7rem;
  margin: 0;
  border-radius: 50%;
  border: 2px solid var(--c, var(--muted));
  background: transparent;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background 0.15s;
}
.tick:checked { background: var(--c, var(--ok)); }
.tick:checked::after {
  content: "";
  width: 0.45rem;
  height: 0.8rem;
  border: solid var(--surface);
  border-width: 0 3px 3px 0;
  transform: translateY(-1px) rotate(45deg);
}

.icon-btn {
  width: 2.2rem;
  height: 2.2rem;
  display: inline-grid;
  place-items: center;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  text-decoration: none;
  flex: none;
}
.icon-btn svg { width: 1.15rem; height: 1.15rem; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  min-height: 2.75rem;
  padding: 0.55rem 1rem;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  color: var(--ink);
}
.btn svg { width: 1.1rem; height: 1.1rem; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { min-height: 2.2rem; padding: 0.35rem 0.75rem; font-size: 0.88rem; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }

/* Deadlines */
.deadline {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1rem;
  display: grid;
  gap: 0.6rem;
  border-top: 5px solid var(--c, var(--line));
}
.deadline.pgce { --c: var(--pgce); }
.deadline.assess { --c: var(--assess); }
.deadline.other { --c: var(--other); }
.deadline-top { display: flex; justify-content: space-between; gap: 0.75rem; align-items: start; }
.deadline-top > div { min-width: 0; }
.due-box { text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.due-box .big { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; line-height: 1; }
.due-box .small { font-size: 0.78rem; color: var(--muted); }
.deadline .how { font-size: 0.9rem; color: var(--muted); }
.deadline .note { font-size: 0.88rem; background: var(--surface-2); border-radius: 10px; padding: 0.5rem 0.7rem; }
.bar { height: 0.55rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--accent)); }
.bar-label { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
details > summary { cursor: pointer; font-weight: 700; color: var(--accent-ink); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; }
details[open] > summary::before { content: "– "; }
details .steps { margin-top: 0.6rem; }

/* Plan: weeks and days */
.week { display: grid; gap: 0.6rem; }
.week-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 2px solid var(--line);
  padding-bottom: 0.35rem;
  gap: 0.5rem;
}
.week-head .load { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.day { display: grid; grid-template-columns: 3.4rem 1fr; gap: 0.6rem; }
.day-date { text-align: center; padding-top: 0.35rem; }
.day-date .dow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.day-date .num { font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; line-height: 1.05; }
.day.is-today .day-date .num { color: var(--accent-ink); }
.day.is-today .day-date .dow { color: var(--accent-ink); }
.day-items { display: grid; gap: 0.45rem; min-width: 0; }
.milestone {
  display: flex;
  gap: 0.5rem;
  align-items: center;
  flex-wrap: wrap;
  padding: 0.55rem 0.75rem;
  border-radius: 12px;
  border: 2px dashed var(--c, var(--line));
  font-weight: 700;
}
.milestone.pgce { --c: var(--pgce); }
.milestone.assess { --c: var(--assess); }
.milestone.other { --c: var(--other); }
.milestone .flag { color: var(--c); }

/* Week strip on the Today view */
.strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; }
.strip-day {
  background: var(--surface);
  border-radius: 12px;
  padding: 0.5rem 0.3rem;
  text-align: center;
  display: grid;
  gap: 0.25rem;
  border: 2px solid transparent;
}
.strip-day.is-today { border-color: var(--accent); }
.strip-day .dow { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.strip-day .m { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.dots { display: flex; justify-content: center; gap: 3px; min-height: 8px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.dots i.pgce { --c: var(--pgce); }
.dots i.assess { --c: var(--assess); }
.dots i.other { --c: var(--other); }
.dots i.done { opacity: 0.3; }

.empty {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1rem;
  color: var(--muted);
}
.callout {
  background: var(--warn-soft);
  border-radius: 12px;
  padding: 0.75rem 0.9rem;
  font-size: 0.92rem;
}

/* Forms and settings */
.panel {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1rem;
  display: grid;
  gap: 0.9rem;
}
.field { display: grid; gap: 0.35rem; }
.field label, .field .label { font-weight: 700; font-size: 0.95rem; }
.field .help { font-size: 0.85rem; color: var(--muted); }
.field input[type="text"], .field input[type="date"], .field input[type="time"], .field input[type="number"], .field select, .field textarea {
  width: 100%;
  min-height: 2.75rem;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--bg);
  padding: 0.5rem 0.7rem;
}
.field textarea { min-height: 5rem; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.two > * { min-width: 0; }
@media (max-width: 380px) { .two { grid-template-columns: 1fr; } }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button {
  flex: 1;
  border: 0;
  background: var(--surface);
  padding: 0.55rem 0.4rem;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.9rem;
}
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); gap: 0.5rem; }
.swatch {
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 0.35rem;
  background: var(--surface);
  cursor: pointer;
  display: grid;
  gap: 0.3rem;
  font-size: 0.75rem;
  font-weight: 700;
  text-align: center;
}
.swatch span.paint { display: block; height: 2.2rem; border-radius: 8px; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
.range-row { display: flex; align-items: center; gap: 0.75rem; }
.range-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.range-row output { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 3.2rem; text-align: right; }
.preview-text { background: var(--surface-2); border-radius: 10px; padding: 0.6rem 0.8rem; }
.colour-input { display: flex; gap: 0.6rem; align-items: center; }
.colour-input input[type="color"] { width: 3rem; height: 2.6rem; border: 0; background: none; padding: 0; cursor: pointer; }
ol.howto { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.35rem; font-size: 0.95rem; }
.small-print { font-size: 0.85rem; color: var(--muted); }
.confirm-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; background: var(--danger-soft); padding: 0.6rem; border-radius: 10px; }

/* Bottom tab bar */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabbar-inner { max-width: 46rem; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tab {
  border: 0;
  background: none;
  padding: 0.5rem 0.1rem 0.55rem;
  display: grid;
  justify-items: center;
  gap: 0.15rem;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  min-height: var(--tabbar-h);
  min-width: 0;
}
.tab svg { width: 1.45rem; height: 1.45rem; }
.tab[aria-current="page"] { color: var(--accent-ink); }
.tab[aria-current="page"] svg { background: var(--accent-soft); border-radius: 10px; padding: 2px; box-sizing: content-box; margin: -2px; }

.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 0.75rem);
  background: var(--ink);
  color: var(--bg);
  padding: 0.65rem 1rem;
  border-radius: 12px;
  font-weight: 700;
  max-width: min(92vw, 30rem);
  z-index: 30;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}

/* Weekly PebblePad review and portfolio */
.tag.review { background: var(--review-soft); color: var(--review); }
.milestone.review { --c: var(--review); width: 100%; background: transparent; cursor: pointer; text-align: left; color: var(--ink); font: inherit; font-weight: 700; }
.milestone.review.is-done { opacity: 0.6; border-style: solid; }
.dots i.review { --c: var(--review); border-radius: 2px; }
.review-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 1rem;
  display: grid;

  const isWeekday = (k) => { const w = dow(k); return w >= 1 && w <= 5; };
  const mondayOf = (k) => { const w = dow(k); return addDays(k, w === 0 ? -6 : 1 - w); };
  const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 86400000);
  const fmt = (k, opts) => parseKey(k).toLocaleDateString('en-GB', opts);
  const fmtShort = (k) => fmt(k, { weekday: 'short', day: 'numeric', month: 'short' });
  const fmtLong = (k) => fmt(k, { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtYear = (k) => fmt(k, { day: 'numeric', month: 'short', year: 'numeric' });
  const atTime = (k, hhmm) => { const d = parseKey(k); const [h, m] = (hhmm || '19:00').split(':').map(Number); d.setHours(h, m || 0, 0, 0); return d; };
  const mins = (m) => (m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}` : `${m} min`);
  const prevWeekday = (k) => { let d = k; while (!isWeekday(d)) d = addDays(d, -1); return d; };
  const nextWeekday = (k) => { let d = k; while (!isWeekday(d)) d = addDays(d, 1); return d; };
  const minusWorkingDays = (k, n) => { let d = k; let left = n; while (left > 0) { d = addDays(d, -1); if (isWeekday(d)) left--; } return d; };

  /* ---------- state and saving ---------- */
  function freshState() {
    return { v: 1, updatedAt: 0, done: {}, moved: {}, due: {}, hidden: {}, custom: [], reviews: {}, portfolio: freshPortfolio(), settings: { ...DEFAULT_SETTINGS } };
  }
  function freshPortfolio() {
    return { nums: {}, obs: {}, checks: {}, duties: {}, approach: '' };
  }
  function normalise(s) {
    const base = freshState();
    if (!s || typeof s !== 'object') return base;
    const out = { ...base, ...s };
    out.settings = { ...DEFAULT_SETTINGS, ...(s.settings || {}) };
    ['done', 'moved', 'due', 'hidden', 'reviews'].forEach((k) => { if (!out[k] || typeof out[k] !== 'object') out[k] = {}; });
    if (!Array.isArray(out.custom)) out.custom = [];
    const p = out.portfolio && typeof out.portfolio === 'object' ? out.portfolio : {};
    out.portfolio = { ...freshPortfolio(), ...p };
    ['nums', 'obs', 'checks', 'duties'].forEach((k) => { if (!out.portfolio[k] || typeof out.portfolio[k] !== 'object') out.portfolio[k] = {}; });
    return out;
  }
  function loadLocal() {
    try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function saveLocal() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage can be blocked */ }
  }

  function loadFromApp() {
    if (!APP) return null;
    try { const raw = APP.loadState(); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  let state = normalise(loadLocal() || loadFromApp());
  let view = 'today';
  try { view = localStorage.getItem(VIEW_KEY) || 'today'; } catch (e) { /* ignore */ }
  if (/^#(today|plan|portfolio|deadlines|add|settings)$/.test(location.hash)) view = location.hash.slice(1);
  let addDraft = null; // the plan preview in the Add view
  let prefill = null;
  let confirmReset = false;
  let editingDue = null;
  let confirmDelete = null;

  const Remote = {
    ref: null,
    writing: false,
    pending: false,
    timer: null,
    status: IS_ARTIFACT ? 'connecting' : 'device',
    async connect() {
      if (!IS_ARTIFACT) return;
      try {
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (!db || !user) { this.setStatus('device'); return; }
        const id = await user.id();
        if (!id) { this.setStatus('device'); return; }
        this.ref = db.collection('data/users/' + id).doc('planner');
        this.ref.onSnapshot((snap) => {
          if (snap.metadata && snap.metadata.hasPendingWrites) return;
          if (!snap.exists) { this.setStatus('synced'); if (state.updatedAt) this.queue(); return; }
          const remote = normalise(snap.data());
          if ((remote.updatedAt || 0) > (state.updatedAt || 0)) {
            state = remote;
            saveLocal();
            applyLook();
            renderAll();
          } else if ((remote.updatedAt || 0) < (state.updatedAt || 0)) {
            this.queue();
          }
          this.setStatus('synced');
        }, () => { this.ref = null; this.setStatus('device'); });
      } catch (e) {
        this.setStatus('device');
      }
    },
    queue() {
      if (!this.ref) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.flush(), 700);
    },
    async flush() {
      if (!this.ref) return;
      if (this.writing) { this.pending = true; return; }
      this.writing = true;
      try {
        await this.ref.set(clone(state));
        this.setStatus('synced');
      } catch (e) {
        this.setStatus(e && e.code === 'invalid_argument' ? 'device' : 'retry');
        if (e && e.code === 'invalid_argument') this.ref = null;
      }
      this.writing = false;
      if (this.pending) { this.pending = false; this.flush(); }
    },
    setStatus(s) {
      this.status = s;
      const pill = $('#sync-pill');
      if (!pill) return;
      pill.textContent = { connecting: 'Connecting', device: APP ? 'On this phone' : 'This device', synced: 'Synced', retry: 'Saving later' }[s] || 'This device';
      pill.title = s === 'synced' ? 'Your ticks are saved to your Claude account and show on every device you open this on.' : 'Your ticks are saved in this browser.';
    }
  };

  function commit() {
    state.updatedAt = Date.now();
    saveLocal();
    if (APP) { try { APP.saveState(JSON.stringify(state)); } catch (e) { /* not essential */ } }
    Remote.queue();
    writeNudgeSnapshot();
    syncAlarms();
  }

  /* ---------- the model ---------- */
  function deadlines() {
    const base = (DATA.deadlines || []).filter((d) => !state.hidden[d.id]);
    return base.concat(state.custom || []).map((d) => {
      const course = COURSES[d.course] ? d.course : 'other';
      const due = state.due[d.id] || d.due || null;
      const chunks = (d.chunks || []).map((c) => ({
        ...c,
        dl: d.id,
        course,
        dateEff: state.moved[c.id] || c.date,
        done: !!state.done[c.id]
      }));
      const doneCount = chunks.filter((c) => c.done).length;
      const custom = !!d.custom;
      const status = due ? (d.status === 'nodate' ? 'target' : (d.status || 'confirmed')) : 'nodate';
      const complete = chunks.length ? doneCount === chunks.length : (due ? due < todayKey() : false);
      return { ...d, course, due, chunks, doneCount, custom, status, complete };
    });
  }
  function allChunks(list) {
    const out = [];
    list.forEach((d) => d.chunks.forEach((c) => out.push({ ...c, deadline: d })));
    return out.sort((a, b) => (a.dateEff + (a.time || '')).localeCompare(b.dateEff + (b.time || '')));
  }
  function loadMap(exceptId) {
    const map = {};
    allChunks(deadlines()).forEach((c) => {
      if (c.done || c.id === exceptId) return;
      map[c.dateEff] = (map[c.dateEff] || 0) + (c.mins || 0);
    });
    return map;
  }
  function passesFilter(course) {
    const f = state.settings.course;
    return f === 'all' || f === course;
  }
  function nextFreeEvening(fromKey, m, exceptId) {
    const load = loadMap(exceptId);
    const cap = Number(state.settings.cap) || 60;
    let d = fromKey;
    for (let i = 0; i < 120; i++) {
      if (isWeekday(d) && (load[d] || 0) + m <= cap) return d;
      d = addDays(d, 1);
    }
    return nextWeekday(fromKey);
  }
  function chunkStart(c) { return atTime(c.dateEff || c.date, c.time || state.settings.evening); }
  function chunkEnd(c) { return new Date(chunkStart(c).getTime() + (c.mins || 30) * 60000); }

  /* ---------- weekly PebblePad review ---------- */
  function reviewDayNum() { return clamp(Number(state.settings.reviewDay) || (REVIEW && REVIEW.day) || 5, 1, 7); }
  function reviewDayKey(mon) { return addDays(mon, reviewDayNum() - 1); }
  function reviewItems(mon) {
    if (!REVIEW) return [];
    const sun = addDays(mon, 6);
    return (REVIEW.items || []).filter((it) => (!it.from || sun >= it.from) && (!it.until || mon <= it.until));
  }
  function inReviewRange(mon) {
    return !!REVIEW && mon >= mondayOf(REVIEW.start) && mon <= REVIEW.end && !(REVIEW.breaks || []).includes(mon);
  }
  function reviewWeek(mon) {
    const items = reviewItems(mon);
    const ticks = state.reviews[mon] || {};
    const done = items.filter((it) => ticks[it.id]).length;
    const skipped = !!ticks.__skip;
    const day = reviewDayKey(mon);
    const today = todayKey();
    const complete = skipped || (items.length > 0 && done === items.length);
    const stateName = complete ? 'done' : (day < today ? 'overdue' : (day === today ? 'tonight' : 'upcoming'));
    return { mon, day, items, ticks, done, total: items.length, skipped, complete, state: stateName };
  }
  function reviewWeeksSoFar() {
    if (!REVIEW) return [];
    const out = [];
    const last = mondayOf(todayKey());
    for (let mon = mondayOf(REVIEW.start); mon <= last && mon <= REVIEW.end; mon = addDays(mon, 7)) {
      if (inReviewRange(mon)) out.push(reviewWeek(mon));
    }
    return out;
  }
  function overdueReviews() { return reviewWeeksSoFar().filter((w) => w.state === 'overdue'); }
  function thisWeekReview() {
    const mon = mondayOf(todayKey());
    return inReviewRange(mon) ? reviewWeek(mon) : null;
  }
  function nextReview() {
    if (!REVIEW) return null;
    for (let mon = mondayOf(todayKey()); mon <= REVIEW.end; mon = addDays(mon, 7)) {
      if (inReviewRange(mon)) { const w = reviewWeek(mon); if (!w.complete) return w; }
    }
    return null;
  }
  function weekLabel(mon) { return 'w/c ' + fmt(mon, { day: 'numeric', month: 'short' }); }
  function reviewRecurGcal(followUp) {
    if (!REVIEW) return '#';
    let mon = mondayOf(todayKey());
    while (!inReviewRange(mon) && mon <= REVIEW.end) mon = addDays(mon, 7);
    let day = reviewDayKey(mon);
    if (followUp) day = nextWeekday(addDays(day, 1));
    if (day < todayKey()) day = addDays(day, 7);
    const start = atTime(day, state.settings.evening);
    const end = new Date(start.getTime() + (REVIEW.mins || 20) * 60000);
    const until = REVIEW.end.replace(/-/g, '') + 'T230000Z';
    const title = followUp ? 'PGCE: PebblePad review done? If not, do it tonight' : `PGCE: weekly PebblePad review (${REVIEW.mins || 20} min)`;
    const details = 'Mentor meeting record, hours log, observation paperwork, this week\'s session, KSB mapping, placements, feedback actions.\n\nTick it off in the Portfolio tab of Cap and Gown Planner.';
    return gcalUrl(title, start, end, details, `RRULE:FREQ=WEEKLY;UNTIL=${until}`);
  }

  /* ---------- alarms (Android app only) ----------
     The page works out the alarms for the next four weeks from what is still open and hands
     them to the app, which sets the next one with the phone's alarm clock. Every tick sends a
     fresh list, so finished work goes quiet and unfinished work keeps ringing. */
  function alarmPlan() {
    const s = state.settings;
    if (s.alarms === false) return { on: false, alarms: [] };
    const lead = clamp(Number(s.alarmLead == null ? 5 : s.alarmLead) || 0, 0, 60);
    const catchup = s.alarmCatchup !== false;
    const today = todayKey();
    const nowMs = now().getTime();
    const undone = allChunks(deadlines()).filter((c) => !c.done);
    const breaks = (REVIEW && REVIEW.breaks) || [];
    const quietWeek = (d) => breaks.includes(mondayOf(d));
    const stepLine = (c) => `${c.title} (${mins(c.mins || 30)})`;
    const out = [];
    for (let i = 0; i < 28; i++) {
      const d = addDays(today, i);
      const groups = {};
      undone.filter((c) => c.dateEff === d).forEach((c) => {
        const t = c.time || s.evening;
        (groups[t] = groups[t] || []).push(c);
      });
      // weekly review: this week's on its day, unfinished earlier weeks on every weekday after
      const reviewLines = [];
      let reviewMins = 0;
      if (REVIEW) {
        let dueToday = false;
        const late = [];
        for (let mon = mondayOf(REVIEW.start); mon <= mondayOf(d) && mon <= REVIEW.end; mon = addDays(mon, 7)) {
          if (!inReviewRange(mon)) continue;
          const w = reviewWeek(mon);
          if (w.complete) continue;
          if (w.day === d) dueToday = true;
          else if (w.day < d && isWeekday(d) && !quietWeek(d)) late.push(w);
        }
        if (late.length) reviewLines.push(late.length === 1 ? `PebblePad review for ${weekLabel(late[0].mon)} is still open` : `PebblePad review still open for ${late.length} weeks`);
        if (dueToday) reviewLines.push(`Weekly PebblePad review (${mins(REVIEW.mins || 20)})`);
        if (late.length || dueToday) reviewMins = REVIEW.mins || 20;
      }
      const behind = catchup && isWeekday(d) && !quietWeek(d) ? undone.filter((c) => c.dateEff < d).length : 0;
      if (!groups[s.evening] && (reviewLines.length || behind)) groups[s.evening] = [];
      Object.keys(groups).sort().forEach((t) => {
        const steps = groups[t];
        const isEvening = t === s.evening;
        const lines = steps.slice(0, 5).map(stepLine);
        if (steps.length > 5) lines.push(`and ${steps.length - 5} more`);
        let total = steps.reduce((a, c) => a + (c.mins || 30), 0);
        if (isEvening) {
          lines.push(...reviewLines);
          total += reviewMins;
          if (behind) lines.push(`${behind} earlier step${behind === 1 ? '' : 's'} not ticked off yet`);
        }
        if (!lines.length) return;
        let title;
        if (steps.length) title = `Study time: ${mins(total)}`;
        else if (reviewLines.length) title = reviewLines.some((l) => l.includes('still open')) ? 'PebblePad review still open' : 'Weekly PebblePad review';
        else title = 'Catch-up evening';
        const at = atTime(d, t).getTime() - lead * 60000;
        if (at <= nowMs + 60000) return;
        out.push({ at, day: d, title, lines });
      });
    }
    return { on: true, generated: Date.now(), lead, alarms: out };
  }
  let alarmTimer = null;
  function syncAlarms() {
    if (!APP) return;
    clearTimeout(alarmTimer);
    alarmTimer = setTimeout(() => {
      try { APP.setAlarms(JSON.stringify(alarmPlan())); } catch (e) { /* the app will keep its last list */ }
      if (view === 'settings') { const p = $('#alarm-next'); if (p) p.innerHTML = nextAlarmText(); }
      if (state.settings.alarms !== false) { const line = $('#tonight .alarm-line'); if (line) line.innerHTML = nextAlarmText(); }
    }, 250);
  }
  function appStatus() {
    if (!APP) return {};
    try { return JSON.parse(APP.status() || '{}') || {}; } catch (e) { return {}; }
  }
  function fmtAlarm(ms) {
    const d = new Date(ms);
    const k = keyOf(d);
    const day = k === todayKey() ? 'Today' : (k === addDays(todayKey(), 1) ? 'Tomorrow' : fmtShort(k));
    return `${day}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function nextAlarmText() {
    if (state.settings.alarms === false) return 'Alarms are off.';
    const st = appStatus();
    if (st.snoozeAt && st.snoozeAt > Date.now() && (!st.next || st.snoozeAt < st.next)) return `Snoozed until ${esc(fmtAlarm(st.snoozeAt))}`;
    return st.next ? `Next alarm: ${esc(fmtAlarm(st.next))}` : 'No alarm needed in the next four weeks.';
  }

  /* ---------- colours and type ---------- */
  function hexToRgb(h) {
    let x = h.replace('#', '');
    if (x.length === 3) x = x.split('').map((c) => c + c).join('');
    const n = parseInt(x, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const rgbToHex = (r, g, b) => '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b); const min = Math.min(r, g, b);
    let h = 0; let s = 0; const l = (max + min) / 2;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }
  function hslToHex(h, s, l) {
    h = ((h % 360) + 360) % 360;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r = 0; let g = 0; let b = 0;
    if (h < 60) [r, g, b] = [c, x, 0];
    else if (h < 120) [r, g, b] = [x, c, 0];
    else if (h < 180) [r, g, b] = [0, c, x];
    else if (h < 240) [r, g, b] = [0, x, c];
    else if (h < 300) [r, g, b] = [x, 0, c];
    else [r, g, b] = [c, 0, x];
    return rgbToHex((r + m) * 255, (g + m) * 255, (b + m) * 255);
  }
  function lum(hex) {
    const [r, g, b] = hexToRgb(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  const contrast = (a, b) => { const la = lum(a); const lb = lum(b); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); };
  function inkFor(bg, target, lighten) {
    const [h, s, l0] = rgbToHsl(...hexToRgb(bg));
    let l = l0;
    for (let i = 0; i < 40; i++) {
      const hex = hslToHex(h, s, l);
      if (contrast(hex, target) >= 4.6) return hex;
      l = lighten ? Math.min(0.96, l + 0.025) : Math.max(0.08, l - 0.025);
    }
    return hslToHex(h, s, l);
  }
  function themeColours() {
    const s = state.settings;
    let t = THEMES.find((x) => x.id === s.theme) || THEMES[0];
    if (t.id === 'custom') {
      const base = /^#[0-9a-f]{6}$/i.test(s.custom) ? s.custom : '#14b8a6';
      const [h, sat, l] = rgbToHsl(...hexToRgb(base));
      t = { id: 'custom', a: base, b: hslToHex(h + 38, clamp(sat, 0.45, 0.95), clamp(l - 0.14, 0.18, 0.6)), accent: base };
    }
    return t;
  }
  function applyLook() {
    const s = state.settings;
    const root = document.documentElement;
    const t = themeColours();
    const navy = '#18213d';
    const white = '#ffffff';
    const heroText = Math.min(contrast(navy, t.a), contrast(navy, t.b)) >= Math.min(contrast(white, t.a), contrast(white, t.b)) ? navy : white;
    const onAccent = contrast(navy, t.accent) >= contrast(white, t.accent) ? navy : white;
    const [r, g, b] = hexToRgb(t.accent);
    const vars = {
      '--hero-a': t.a,
      '--hero-b': t.b,
      '--on-hero': heroText,
      '--cap-board': heroText === navy ? navy : '#f4f5fa',
      '--tassel': '#ffe066',
      '--accent': t.accent,
      '--accent-soft': `rgba(${r}, ${g}, ${b}, 0.16)`,
      '--on-accent': onAccent,
      '--accent-ink-l': inkFor(t.accent, '#ffffff', false),
      '--accent-ink-d': inkFor(t.accent, '#161c31', true),
      '--scale': String(clamp(Number(s.scale) || 1, 0.85, 1.5))
    };
    Object.entries(vars).forEach(([k, v]) => root.style.setProperty(k, v));
    if (s.mode === 'light' || s.mode === 'dark') root.setAttribute('data-mode', s.mode);
    else root.removeAttribute('data-mode');
    document.body.classList.toggle('font-lexend', s.font === 'lexend');
    document.body.classList.toggle('font-system', s.font === 'system');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t.a);
  }

  /* ---------- calendar links and files ---------- */
  const stamp = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  function gcalUrl(title, start, end, details, recur) {
    const p = new URLSearchParams({ action: 'TEMPLATE', text: title, dates: `${stamp(start)}/${stamp(end)}`, details, ctz: TZ });
    if (recur) p.set('recur', recur);
    return 'https://calendar.google.com/calendar/render?' + p.toString();
  }
  function chunkDetails(c) {
    const d = c.deadline;
    const lines = [`Small step for: ${d.title}`];
    if (d.due) lines.push(`Due: ${fmtLong(d.due)}${d.how ? ' (' + d.how + ')' : ''}`);
    if (c.tip) lines.push('', c.tip);
    lines.push('', 'From Cap and Gown Planner');
    return lines.join('\n');
  }
  function chunkGcal(c) {
    const short = (COURSES[c.course] || COURSES.other).short;
    return gcalUrl(`${short}: ${c.title} (${c.mins} min)`, chunkStart(c), chunkEnd(c), chunkDetails(c));
  }
  function deadlineGcal(d) {
    const short = (COURSES[d.course] || COURSES.other).short;
    const start = atTime(d.due, d.dueTime || (DATA.defaults && DATA.defaults.dueTime) || '09:00');
    const label = d.kind === 'event' ? `${short}: ${d.title}` : `${short} due: ${d.title}`;
    return gcalUrl(label, start, new Date(start.getTime() + 30 * 60000), `${d.how || ''}\n${d.note || ''}\n\nFrom Cap and Gown Planner`.trim());
  }

  function icsEscape(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
  function icsFold(line) {
    const enc = new TextEncoder();
    if (enc.encode(line).length <= 75) return line;
    const parts = [];
    let cur = '';
    for (const ch of line) {
      const limit = parts.length ? 74 : 75;
      if (enc.encode(cur + ch).length > limit) { parts.push(cur); cur = ch; } else cur += ch;
    }
    parts.push(cur);
    return parts.join('\r\n ');
  }
  function buildIcs() {
    const list = deadlines();
    const today = todayKey();
    const dtstamp = stamp(new Date());
    const lines = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Cap and Gown Planner//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'X-WR-CALNAME:Study plan (PGCE and Assessor)', `X-WR-TIMEZONE:${TZ}`
    ];
    const pad2 = (n) => String(n).padStart(2, '0');
    const local = (d) => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
    const when = (key, d, wall) => (wall ? `${key};TZID=${TZ}:${local(d)}` : `${key}:${stamp(d)}`);
    const ev = (o) => {
      // Repeating events use wall-clock time in TZ, so they stay at the same hour after the clocks change.
      lines.push('BEGIN:VEVENT', `UID:${o.uid}@capgown-planner`, `DTSTAMP:${dtstamp}`, when('DTSTART', o.start, !!o.rrule), when('DTEND', o.end, !!o.rrule),
        `SUMMARY:${icsEscape(o.title)}`, `DESCRIPTION:${icsEscape(o.details)}`, `CATEGORIES:${icsEscape(o.cat)}`);
      if (o.rrule) lines.push(o.rrule);
      (o.exdates || []).forEach((x) => lines.push(when('EXDATE', x, true)));
      o.alarms.forEach((a) => lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(o.title)}`, `TRIGGER:${a}`, 'END:VALARM'));
      lines.push('END:VEVENT');
    };
    allChunks(list).forEach((c) => {
      if (c.done || c.dateEff < today) return;
      const short = (COURSES[c.course] || COURSES.other).short;
      ev({ uid: c.id, start: chunkStart(c), end: chunkEnd(c), title: `${short}: ${c.title} (${c.mins} min)`, details: chunkDetails(c), cat: short, alarms: ['-PT10M', 'PT0M'] });
    });
    list.forEach((d) => {
      if (!d.due || d.due < today) return;
      const short = (COURSES[d.course] || COURSES.other).short;
      const start = atTime(d.due, d.dueTime || (DATA.defaults && DATA.defaults.dueTime) || '09:00');
      const isEvent = d.kind === 'event';
      ev({
        uid: d.id + '-due', start, end: new Date(start.getTime() + 30 * 60000),
        title: isEvent ? `${short}: ${d.title}` : `${short} DUE: ${d.title}`,
        details: [d.how, d.note, STATUS_LABEL[d.status] && d.status !== 'confirmed' ? STATUS_LABEL[d.status] : ''].filter(Boolean).join('\n'),
        cat: short,
        alarms: isEvent ? ['-P1D', '-PT1H'] : ['-P7D', '-P2D', '-PT1H']
      });
    });
    if (REVIEW && TZ === 'Europe/London') {
      lines.splice(7, 0, 'BEGIN:VTIMEZONE', 'TZID:Europe/London',
        'BEGIN:DAYLIGHT', 'TZOFFSETFROM:+0000', 'TZOFFSETTO:+0100', 'TZNAME:BST', 'DTSTART:19700329T010000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'END:DAYLIGHT',
        'BEGIN:STANDARD', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0000', 'TZNAME:GMT', 'DTSTART:19701025T020000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD',
        'END:VTIMEZONE');
    }
    if (REVIEW) {
      let mon = mondayOf(today);
      while (!inReviewRange(mon) && mon <= REVIEW.end) mon = addDays(mon, 7);
      if (mon <= REVIEW.end) {
        const until = REVIEW.end.replace(/-/g, '') + 'T230000Z';
        [false, true].forEach((follow) => {
          let first = reviewDayKey(mon);
          if (follow) first = nextWeekday(addDays(first, 1));
          const start = atTime(first, state.settings.evening);
          const shift = daysBetween(reviewDayKey(mon), first);
          const exdates = (REVIEW.breaks || []).filter((b) => b >= mon).map((b) => atTime(addDays(reviewDayKey(b), shift), state.settings.evening));
          ev({
            uid: follow ? 'review-followup' : 'review-weekly', start, end: new Date(start.getTime() + (REVIEW.mins || 20) * 60000),
            title: follow ? 'PGCE: PebblePad review done? If not, do it tonight' : `PGCE: weekly PebblePad review (${REVIEW.mins || 20} min)`,
            details: 'Tick it off in the Portfolio tab of Cap and Gown Planner. An unfinished review stays on your Today screen until it is done.',
            cat: 'PGCE', alarms: ['-PT10M', 'PT0M'], rrule: `RRULE:FREQ=WEEKLY;UNTIL=${until}`, exdates
          });
        });
      }
    }
    lines.push('END:VCALENDAR');
    return lines.map(icsFold).join('\r\n') + '\r\n';
  }

  async function saveFile(filename, text, mime) {
    if (APP) {
      let ok = false;
      try { ok = APP.saveFile(filename, text, mime); } catch (e) { ok = false; }
      toast(ok ? 'Saved to the Downloads folder on your phone.' : 'That file could not be saved.');
      return;
    }
    if (IS_ARTIFACT) {
      const dl = await window.claude.use('downloads');
      if (!dl) { toast('Saving files is not available in this view.'); return; }
      try {
        await dl.save({ filename, data: text });
        toast('File saved.');
      } catch (e) {
        if (e && e.code === 'declined') return;
        if (e && e.code === 'rate_limited') toast('A save is already waiting for you. Try again in a moment.');
        else toast('That file could not be saved here.');
      }
      return;
    }
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast('Saved to your downloads.');
  }

  function spread(steps, dueKey) {
    const today = todayKey();
    const cap = Number(state.settings.cap) || 60;
    let days = [];
    for (let d = today; d < dueKey && days.length < 400; d = addDays(d, 1)) if (isWeekday(d)) days.push(d);
    if (!days.length) days = [today];
    const n = steps.length;
    let usable = days.length > n + 1 ? days.slice(0, -1) : days;
    const maxSpan = Math.max(n * 3, 10);
    if (usable.length > maxSpan) usable = usable.slice(usable.length - maxSpan);
    const load = loadMap();
    let last = 0;
    return steps.map((s, i) => {
      const target = n === 1 ? usable.length - 1 : Math.round((i * (usable.length - 1)) / (n - 1));
      const from = Math.max(target, last);
      let pick = -1;
      for (let j = from; j < usable.length; j++) if ((load[usable[j]] || 0) + s.mins <= cap) { pick = j; break; }
      if (pick < 0) for (let j = from; j >= last; j--) if ((load[usable[j]] || 0) + s.mins <= cap) { pick = j; break; }
      if (pick < 0) {
        // nothing fits under the limit: use the lightest evening that keeps the order
        pick = Math.min(from, usable.length - 1);
        for (let j = last; j < usable.length; j++) if ((load[usable[j]] || 0) < (load[usable[pick]] || 0)) pick = j;
      }
      load[usable[pick]] = (load[usable[pick]] || 0) + s.mins;
      last = pick;
      return { ...s, date: usable[pick] };
    });
  }

  };

  function tag(course) {
    const c = COURSES[course] || COURSES.other;
    return `<span class="tag ${esc(course)}">${esc(c.short)}</span>`;
  }
  function statusTag(s) {
    if (!STATUS_LABEL[s]) return '';
    return `<span class="tag status-${esc(s)}">${esc(STATUS_LABEL[s])}</span>`;
  }

  function stepRow(c, opts = {}) {
    const today = todayKey();
    const late = !c.done && c.dateEff < today;
    const moved = state.moved[c.id] && state.moved[c.id] !== c.date;
    const pastDue = c.deadline.due && c.dateEff > c.deadline.due;
    const meta = [];
    if (opts.showCourse !== false) meta.push(tag(c.course));
    meta.push(`<span>${esc(mins(c.mins || 0))}</span>`);
    if (opts.showDate) meta.push(`<span>${esc(fmtShort(c.dateEff))}</span>`);
    if (late) meta.push('<span class="tag late">Behind</span>');
    if (pastDue) meta.push('<span class="tag late">After the deadline</span>');
    else if (moved) meta.push('<span>moved</span>');
    return `<li class="step ${esc(c.course)}${c.done ? ' is-done' : ''}">
      <input type="checkbox" class="tick" data-action="tick" data-id="${esc(c.id)}" aria-label="Done: ${esc(c.title)}"${c.done ? ' checked' : ''}>
      <div class="step-body">
        <span class="step-title">${esc(c.title)}</span>
        <span class="step-meta">${meta.join('<span aria-hidden="true">·</span>')}</span>
        ${opts.showFor !== false ? `<span class="step-for">for ${esc(c.deadline.title)}</span>` : ''}
        ${c.tip && opts.showTip !== false ? `<span class="step-tip">${esc(c.tip)}</span>` : ''}
      </div>
      <div class="step-actions">
        ${c.done ? '' : `<button class="icon-btn" data-action="move" data-id="${esc(c.id)}" aria-label="Move to the next free evening" title="Move to the next free evening">${ICON.move}</button>`}
        <a class="icon-btn" href="${esc(chunkGcal(c))}" target="_blank" rel="noopener" aria-label="Add to Google Calendar" title="Add to Google Calendar">${ICON.cal}</a>
      </div>
    </li>`;
  }

  function dueBox(d) {
    const today = todayKey();
    if (!d.due) return '<div class="due-box"><div class="big">?</div><div class="small">no date yet</div></div>';
    if (d.complete && d.chunks.length) return `<div class="due-box"><div class="big" style="color:var(--ok)">Done</div><div class="small">${esc(fmtYear(d.due))}</div></div>`;
    const n = daysBetween(today, d.due);
    let big; let small;
    if (n === 0) { big = 'Today'; small = fmtShort(d.due); }
    else if (n === 1) { big = '1'; small = 'day left'; }
    else if (n > 1) { big = String(n); small = 'days left'; }
    else { big = String(-n); small = d.kind === 'event' ? 'days ago' : 'days ago'; }
    return `<div class="due-box"><div class="big">${esc(big)}</div><div class="small">${esc(small)}</div></div>`;
  }

  function deadlineCard(d, opts = {}) {

    const dueLine = d.due ? `${d.kind === 'event' ? 'On' : 'Due'} ${fmtLong(d.due)} ${parseKey(d.due).getFullYear()}` : 'No date yet';

    return `<article class="deadline ${esc(d.course)}" id="dl-${esc(d.id)}">
      <div class="deadline-top">

  function renderTonight() {
    const el = $('#tonight');
    const today = todayKey();
    const list = deadlines();
    const chunks = allChunks(list);
    const todays = chunks.filter((c) => c.dateEff === today);
    const left = todays.filter((c) => !c.done);
    const total = left.reduce((a, c) => a + (c.mins || 0), 0);
    const next = chunks.find((c) => !c.done && c.dateEff > today);
    const weekend = !isWeekday(today);
    const rw = thisWeekReview();
    const overdue = overdueReviews();
    const reviewTonight = rw && rw.state === 'tonight';
    const reviewMins = REVIEW ? (REVIEW.mins || 20) : 0;
    const shownTotal = total + (reviewTonight || overdue.length ? reviewMins : 0);
    let head = `<div class="tonight-head"><span class="eyebrow">${weekend ? 'This weekend' : 'Tonight'} · ${esc(fmtShort(today))}</span>${left.length || reviewTonight || overdue.length ? `<span class="mins">${esc(mins(shownTotal))}</span>` : ''}</div>`;
    let nudge = '';
    if (overdue.length) {
      const w = overdue[0];
      nudge = `<div class="nudge is-overdue"><p><strong>PebblePad review still open</strong> for ${esc(weekLabel(w.mon))}${overdue.length > 1 ? ` and ${overdue.length - 1} more week${overdue.length > 2 ? 's' : ''}` : ''}. ${w.done} of ${w.total} checked. It stays here until it is done.</p><div class="btn-row"><button class="btn small primary" data-action="open-review" data-id="${esc(w.mon)}">Finish the review</button></div></div>`;
    } else if (reviewTonight) {
      nudge = `<div class="nudge"><p><strong>Weekly PebblePad review tonight</strong>, about ${esc(mins(reviewMins))}. ${rw.done} of ${rw.total} checked so far.</p><div class="btn-row"><button class="btn small primary" data-action="open-review" data-id="${esc(rw.mon)}">Start the review</button></div></div>`;
    }
    let body = '';
    if (todays.length) {
      body = `<ul class="steps">${todays.map((c) => stepRow(c, { showTip: true })).join('')}</ul>`;
      if (!left.length) body = `<p><strong>All done for tonight.</strong> That is one less thing for later.</p>` + body;
    } else if (next) {
      body = `<p>${weekend ? 'Nothing planned. Enjoy the weekend.' : 'Nothing planned tonight.'} Next step is on <strong>${esc(fmtLong(next.dateEff))}</strong>:</p><ul class="steps">${stepRow(next, { showTip: false })}</ul>`;
    } else if (!nudge) {
      body = '<p>No steps left in the plan. Add a deadline when you get one.</p>';
    }
    if (nudge && !todays.length) body = body.replace(/^<p>Nothing planned[^<]*/, '<p>No other steps tonight.');
    let alarmLine = '';
    if (APP) {
      alarmLine = state.settings.alarms === false
        ? '<p class="alarm-line">Alarms are off. <button class="linkish" data-tab-link="settings">Turn them on</button></p>'
        : `<p class="alarm-line">${nextAlarmText()}</p>`;
    }
    el.innerHTML = head + nudge + body + alarmLine;
    const hour = now().getHours();
    $('#greeting').textContent = `${hour < 12 ? 'Morning' : hour < 18 ? 'Afternoon' : 'Evening'}, ${DATA.owner || 'there'}`;
    const upcoming = list.filter((d) => d.due && d.due >= today && !d.complete).sort((a, b) => a.due.localeCompare(b.due))[0];
    let line = fmtLong(today);
    if (upcoming) {
      const n = daysBetween(today, upcoming.due);
      const what = upcoming.kind === 'event' ? 'Next date' : 'Next deadline';
      line = n === 0 ? `${what} is today: ${upcoming.title}` : `${what} in ${n} day${n === 1 ? '' : 's'}: ${upcoming.title}`;
    }
    $('#today-line').textContent = line;
  }

  function renderToday() {
    const today = todayKey();
    const list = deadlines();
    const chunks = allChunks(list);
    const behind = chunks.filter((c) => !c.done && c.dateEff < today && passesFilter(c.course));
    const mon = mondayOf(today);
    const week = [0, 1, 2, 3, 4].map((i) => addDays(mon, i));
    const upcoming = list.filter((d) => d.due && d.due >= today && !d.complete && passesFilter(d.course)).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 3);
    const nodate = list.filter((d) => !d.due);
    let html = '';
    if (APP && !state.settings.alarmSetupSeen) {
      html += `<div class="callout"><strong>Check your alarms once.</strong> Open Settings, fix anything marked with a red mark, then tap Test the alarm. It takes two minutes. <div class="btn-row" style="margin-top:.5rem"><button class="btn small primary" data-action="goto-alarms">Check the alarms</button><button class="btn small" data-action="dismiss-alarms">Later</button></div></div>`;
    } else if (!APP && !state.settings.remindersSeen) {
      html += `<div class="callout"><strong>Get these on your phone.</strong> Each step has a calendar button, and Settings shows how to put the whole plan into Google Calendar with notifications. <div class="btn-row" style="margin-top:.5rem"><button class="btn small primary" data-action="goto-reminders">Set up reminders</button><button class="btn small" data-action="dismiss-reminders">Later</button></div></div>`;
    }
    if (REVIEW) {
      const overdue = overdueReviews();
      const rw = thisWeekReview();
      if (overdue.length) {
        html += `<div class="section"><div class="section-head"><h2>PebblePad review</h2><button class="btn small" data-tab-link="portfolio">Portfolio</button></div>
          ${overdue.map((w) => `<div class="nudge is-overdue"><p><strong>${esc(weekLabel(w.mon))} is not done yet.</strong> ${w.done} of ${w.total} checked. This stays at the top until you finish it.</p><div class="btn-row"><button class="btn small primary" data-action="open-review" data-id="${esc(w.mon)}">Finish it now</button></div></div>`).join('')}</div>`;
      } else if (rw) {
        const when = rw.complete ? 'Done for this week.' : (rw.state === 'tonight' ? 'Due tonight.' : `Due ${esc(fmtLong(rw.day))}.`);
        html += `<div class="section"><div class="section-head"><h2>PebblePad review</h2><span class="hint">${rw.done} of ${rw.total} checked</span></div>
          <div class="nudge"><p><strong>${when}</strong> ${rw.complete ? 'Next one is next week.' : `About ${esc(mins(REVIEW.mins || 20))}: reflections, hours, observations, KSBs and placements.`}</p><div class="btn-row"><button class="btn small primary" data-action="open-review" data-id="${esc(rw.mon)}">${rw.complete ? 'See this week' : 'Open the review'}</button></div></div></div>`;
      }
    }
    if (behind.length) {
      html += `<div class="section"><div class="section-head"><h2>Catch up</h2><button class="btn small" data-action="move-all">Spread them over free evenings</button></div>
        <ul class="steps">${behind.map((c) => stepRow(c, { showDate: true })).join('')}</ul></div>`;
    }
    html += `<div class="section"><div class="section-head"><h2>This week</h2><span class="hint">w/c ${esc(fmt(mon, { day: 'numeric', month: 'short' }))}</span></div>
      <div class="strip">${week.map((d) => {
        const items = chunks.filter((c) => c.dateEff === d);
        const rv = REVIEW && inReviewRange(mon) && reviewDayKey(mon) === d ? reviewWeek(mon) : null;
        const m = items.reduce((a, c) => a + (c.done ? 0 : c.mins || 0), 0) + (rv && !rv.complete ? (REVIEW.mins || 20) : 0);
        return `<div class="strip-day${d === today ? ' is-today' : ''}"><span class="dow">${esc(fmt(d, { weekday: 'short' }))}</span><span class="m">${m ? esc(m) : '–'}</span><span class="dots">${items.map((c) => `<i class="${esc(c.course)}${c.done ? ' done' : ''}"></i>`).join('')}${rv ? `<i class="review${rv.complete ? ' done' : ''}" title="PebblePad review"></i>` : ''}</span></div>`;
      }).join('')}</div><p class="small-print">Minutes left each evening. Round dots are steps, coloured by course. The square is the PebblePad review.</p></div>`;
    html += `<div class="section"><div class="section-head"><h2>Coming up</h2><button class="btn small" data-tab-link="deadlines">All deadlines</button></div>
      ${upcoming.length ? upcoming.map((d) => deadlineCard(d, { compact: true })).join('') : '<p class="empty">Nothing due. Add one from the Add tab.</p>'}</div>`;
    if (nodate.length) {
      html += `<div class="section"><div class="section-head"><h2>Needs a date</h2></div><p class="empty">${nodate.length} item${nodate.length === 1 ? '' : 's'} waiting for a date: ${nodate.map((d) => esc(d.title)).join(', ')}. <button class="btn small" data-tab-link="deadlines" style="margin-top:.5rem">Add the dates</button></p></div>`;
    }
    $('#view-today').innerHTML = html;
  }

  function filterChips() {
    const f = state.settings.course;
    const opts = [['all', 'Both'], ['pgce', 'PGCE'], ['assess', 'Assessor']];
    if ((state.custom || []).some((d) => d.course === 'other')) opts.push(['other', 'Other']);
    return `<div class="chips" role="group" aria-label="Show course">${opts.map(([id, label]) => `<button class="chip" data-action="filter" data-id="${id}" aria-pressed="${f === id}">${label}</button>`).join('')}</div>`;
  }

  function renderPlan() {
    const today = todayKey();
    const list = deadlines();
    const chunks = allChunks(list).filter((c) => passesFilter(c.course));
    const showPast = state.settings.showPast;
    const startKey = showPast ? '0000-00-00' : mondayOf(today);
    const byDate = {};
    chunks.forEach((c) => { if (c.dateEff >= startKey) (byDate[c.dateEff] = byDate[c.dateEff] || { chunks: [], marks: [] }).chunks.push(c); });
    list.filter((d) => d.due && passesFilter(d.course) && d.due >= startKey).forEach((d) => { (byDate[d.due] = byDate[d.due] || { chunks: [], marks: [] }).marks.push(d); });
    if (REVIEW && passesFilter('pgce')) {
      for (let mon = mondayOf(REVIEW.start); mon <= REVIEW.end; mon = addDays(mon, 7)) {
        if (!inReviewRange(mon)) continue;
        const day = reviewDayKey(mon);
        if (day < startKey) continue;
        (byDate[day] = byDate[day] || { chunks: [], marks: [] }).review = reviewWeek(mon);
      }
    }
    const keys = Object.keys(byDate).sort();
    const weeks = [];
    keys.forEach((k) => {
      const w = mondayOf(k);
      let wk = weeks[weeks.length - 1];
      if (!wk || wk.mon !== w) { wk = { mon: w, days: [] }; weeks.push(wk); }
      wk.days.push(k);
    });
    let html = `<div class="section-head"><h2>Plan</h2>${filterChips()}</div>
      <div class="btn-row"><button class="btn small" data-action="toggle-past">${showPast ? 'Hide finished weeks' : 'Show finished weeks'}</button></div>`;
    if (!weeks.length) html += '<p class="empty">Nothing in the plan for this filter.</p>';
    weeks.forEach((wk) => {
      const all = wk.days.flatMap((k) => byDate[k].chunks || []);
      const left = all.filter((c) => !c.done);
      const isThis = wk.mon === mondayOf(today);
      html += `<section class="week" aria-label="Week commencing ${esc(fmtLong(wk.mon))}">
        <div class="week-head"><h3>${isThis ? 'This week' : 'w/c ' + esc(fmt(wk.mon, { day: 'numeric', month: 'short', year: parseKey(wk.mon).getFullYear() !== parseKey(today).getFullYear() ? 'numeric' : undefined }))}</h3>
        <span class="load">${left.length ? `${left.length} step${left.length === 1 ? '' : 's'} · ${esc(mins(left.reduce((a, c) => a + (c.mins || 0), 0)))}` : (all.length ? 'all done' : '')}</span></div>
        ${wk.days.map((k) => `<div class="day${k === today ? ' is-today' : ''}">
          <div class="day-date"><div class="dow">${esc(fmt(k, { weekday: 'short' }))}</div><div class="num">${parseKey(k).getDate()}</div><div class="dow">${esc(fmt(k, { month: 'short' }))}</div></div>
          <div class="day-items">
            ${byDate[k].marks.map((d) => `<div class="milestone ${esc(d.course)}"><span class="flag" aria-hidden="true">${d.kind === 'event' ? '●' : '⚑'}</span>${tag(d.course)}<span>${d.kind === 'event' ? '' : 'Due: '}${esc(d.title)}</span>${d.status !== 'confirmed' ? statusTag(d.status) : ''}</div>`).join('')}
            ${byDate[k].review ? reviewMilestone(byDate[k].review) : ''}
            ${byDate[k].chunks.length ? `<ul class="steps">${byDate[k].chunks.map((c) => stepRow(c, { showTip: k === today })).join('')}</ul>` : ''}
          </div></div>`).join('')}
      </section>`;
    });
    $('#view-plan').innerHTML = html;
  }

  let focusWeek = null;
  function reviewMilestone(w) {
    const label = w.complete ? (w.skipped ? 'skipped' : 'done') : `${w.done} of ${w.total}`;
    const late = w.state === 'overdue';
    return `<button class="milestone review${w.complete ? ' is-done' : ''}" data-action="open-review" data-id="${esc(w.mon)}"><span class="flag" aria-hidden="true">■</span><span class="tag review">Portfolio</span><span>PebblePad review</span><span class="tag ${late ? 'late' : 'status-confirmed'}">${esc(late ? 'Overdue, ' + label : label)}</span></button>`;
  }

  function reviewCard(w) {
    const pct = w.total ? Math.round((w.done / w.total) * 100) : 0;
    const eyebrow = { overdue: 'Overdue', tonight: 'Tonight', upcoming: 'This week', done: w.skipped ? 'Skipped' : 'Done' }[w.state];
    const items = w.items.map((it) => {
      const on = !!w.ticks[it.id];
      const fid = `rv-${w.mon}-${it.id}`;
      return `<li class="${on ? 'is-done' : ''}"><input type="checkbox" class="tick" id="${esc(fid)}" data-action="rtick" data-week="${esc(w.mon)}" data-id="${esc(it.id)}"${on ? ' checked' : ''}><label for="${esc(fid)}"><span class="step-title">${esc(it.title)}</span><span class="step-tip">${esc(it.tip || '')}</span></label></li>`;
    }).join('');
    return `<article class="review-card${w.state === 'overdue' ? ' is-overdue' : ''}" id="rv-${esc(w.mon)}">
      <div class="review-head">
        <div><span class="eyebrow" style="color:${w.state === 'overdue' ? 'var(--danger)' : 'var(--review)'}">${esc(eyebrow)}</span>
          <h3 style="margin-top:.25rem">PebblePad review, ${esc(weekLabel(w.mon))}</h3>
          <p class="small-print">${esc(DAY_NAMES[reviewDayNum() - 1])} ${esc(fmt(w.day, { day: 'numeric', month: 'long' }))} · about ${esc(mins(REVIEW.mins || 20))}</p></div>
        <div class="due-box"><div class="big">${w.done}/${w.total}</div><div class="small">checked</div></div>
      </div>
      <div class="bar" role="img" aria-label="${pct}% checked"><span style="width:${pct}%"></span></div>
      <p class="small-print">Tick each one once you have looked at it, even if there was nothing to add this week.</p>
      ${w.complete && !w.skipped ? `<details><summary>What you checked</summary><ul class="checks" style="margin-top:.6rem">${items}</ul></details>` : `<ul class="checks">${items}</ul>`}
      <div class="btn-row">
        ${w.complete ? '' : `<button class="btn small" data-action="review-all" data-id="${esc(w.mon)}">Tick them all</button>`}
        ${w.skipped ? `<button class="btn small" data-action="review-unskip" data-id="${esc(w.mon)}">Undo skip</button>` : (w.complete ? '' : `<button class="btn small" data-action="review-skip" data-id="${esc(w.mon)}">No review this week</button>`)}
      </div>
    </article>`;
  }

  function numField(key, label, target, help) {
    const v = state.portfolio.nums[key];
    const n = Number(v) || 0;
    const pct = target ? clamp(Math.round((n / target) * 100), 0, 100) : 0;
    return `<div class="counter"><label for="p-${esc(key)}">${esc(label)}</label>
      <div class="num-row"><input type="number" id="p-${esc(key)}" min="0" step="0.5" inputmode="decimal" value="${v == null || v === '' ? '' : esc(v)}" data-action="pnum" data-id="${esc(key)}" placeholder="0"><span class="of">of ${esc(target)}</span></div>
      <div class="bar" role="img" aria-label="${pct}%"><span style="width:${pct}%"></span></div>
      ${help ? `<span class="help small-print">${esc(help)}</span>` : ''}</div>`;
  }

  function renderPortfolio() {
    const el = $('#view-portfolio');
    if (!REVIEW || !PORT) { el.innerHTML = '<p class="empty">No portfolio data in this version.</p>'; return; }
    const p = state.portfolio;
    const overdue = overdueReviews();
    const rw = thisWeekReview();
    const upcoming = rw || nextReview();
    let html = `<div class="section-head"><h2>Portfolio</h2><span class="hint">Weekly PebblePad review</span></div>
      <p class="small-print">Your Module 3 portfolio needs evidence for every KSB, ten observation forms and reflections, both placement reflections, your Safeguarding and Prevent certificates and 150 hours of lead teaching. A short check each week keeps it from piling up. An unfinished week stays on Today until you finish it.</p>`;
    if (overdue.length) html += `<div class="section"><h3>Still to finish</h3>${overdue.map(reviewCard).join('')}</div>`;
    if (upcoming && !overdue.some((w) => w.mon === upcoming.mon)) html += `<div class="section"><h3>${rw && upcoming.mon === rw.mon ? 'This week' : 'Next review'}</h3>${reviewCard(upcoming)}</div>`;
    const shown = overdue.map((w) => w.mon).concat(upcoming ? [upcoming.mon] : []);
    if (focusWeek && inReviewRange(focusWeek) && !shown.includes(focusWeek)) {
      html = html.replace('</p>', '</p>' + `<div class="section"><h3>The week you opened</h3>${reviewCard(reviewWeek(focusWeek))}</div>`);
    }
    const past = reviewWeeksSoFar().filter((w) => w.complete).reverse();
    if (past.length) {
      html += `<details class="section"><summary>Finished weeks (${past.length})</summary><div class="history">${past.map((w) => `<button data-action="open-review" data-id="${esc(w.mon)}"><span>${esc(weekLabel(w.mon))}</span><span>${w.skipped ? 'skipped' : 'done'}</span></button>`).join('')}</div></details>`;
    }
    // progress
    const obsDone = PORT.observations.reduce((a, o) => a + (p.obs['f' + o.n] ? 1 : 0) + (p.obs['r' + o.n] ? 1 : 0), 0);
    const checksDone = PORT.checks.filter((c) => p.checks[c.id]).length;
    const dutiesDone = PORT.duties.filter((d, i) => p.duties['d' + (i + 1)]).length;
    html += `<div class="section"><div class="section-head"><h2>Module 3 checklist</h2><span class="hint">Update the numbers in each weekly review</span></div>
      <div class="panel">
        <h3>Numbers so far</h3>
        <div class="counters">
          ${numField('ksb', 'KSBs with evidence', PORT.ksbTotal, 'K1 to K20, S1 to S25, B1 to B6. One piece each is the minimum.')}
          ${numField('hours', 'Lead teaching hours', PORT.hoursTarget, '100 of these in your subject.')}
          ${numField('setting', 'Hours in your setting', PORT.settingTarget, 'Everything on placement, teaching included.')}
          ${numField('remote', 'Remote teaching hours', PORT.remoteTarget, 'The handbook asks you to aim for 20.')}
        </div>
      </div>
      <div class="panel">
        <div class="section-head"><h3>Observations</h3><span class="hint">${obsDone} of ${PORT.observations.length * 2} uploaded</span></div>
        <p class="small-print">Each one needs the feedback form and your 200 to 300 word reflection in PebblePad.</p>
        <div class="obs-list">${PORT.observations.map((o) => `<div class="obs-row"><div class="what"><strong>${esc(o.label)}</strong> ${esc(o.kind)}${o.window ? `<span>${esc(o.window)}</span>` : ''}</div>
          <label class="mini" for="o-f${o.n}">Form<input type="checkbox" class="tick" id="o-f${o.n}" data-action="pobs" data-id="f${o.n}"${p.obs['f' + o.n] ? ' checked' : ''}></label>
          <label class="mini" for="o-r${o.n}">Reflection<input type="checkbox" class="tick" id="o-r${o.n}" data-action="pobs" data-id="r${o.n}"${p.obs['r' + o.n] ? ' checked' : ''}></label></div>`).join('')}</div>
      </div>
      <div class="panel">
        <div class="section-head"><h3>Placements, certificates and records</h3><span class="hint">${checksDone} of ${PORT.checks.length} done</span></div>
        <ul class="checks">${PORT.checks.map((c) => `<li class="${p.checks[c.id] ? 'is-done' : ''}"><input type="checkbox" class="tick" id="c-${esc(c.id)}" data-action="pcheck" data-id="${esc(c.id)}"${p.checks[c.id] ? ' checked' : ''}><label for="c-${esc(c.id)}"><span class="step-title">${esc(c.title)}</span><span class="step-tip">${esc(c.group)}</span></label></li>`).join('')}</ul>
      </div>
      <div class="panel">
        <div class="section-head"><h3>Professional discussion</h3><span class="hint">${dutiesDone} of 9 ready</span></div>
        <div class="field"><span class="label" id="ap-label">Your approach</span>
          <div class="seg" role="group" aria-labelledby="ap-label">${[['story', 'Visual storytelling'], ['qa', 'Question and answer'], ['', 'Not decided']].map(([id, l]) => `<button data-action="approach" data-id="${id}" aria-pressed="${(p.approach || '') === id}">${l}</button>`).join('')}</div>
          <span class="help">Nine stories or nine answers, one for each occupational duty, backed by evidence you can show on screen.</span></div>
        <ul class="checks">${PORT.duties.map((d, i) => `<li class="${p.duties['d' + (i + 1)] ? 'is-done' : ''}"><input type="checkbox" class="tick" id="d-${i + 1}" data-action="pduty" data-id="d${i + 1}"${p.duties['d' + (i + 1)] ? ' checked' : ''}><label for="d-${i + 1}"><span class="step-title">Duty ${i + 1}: ${esc(d)}</span><span class="step-tip">Story or answer drafted, with one piece of evidence to show</span></label></li>`).join('')}</ul>
      </div>
      <details class="panel"><summary>Learning outcomes for Modules 2 and 3</summary>
        ${Object.entries(PORT.los).map(([k, v]) => `<h3 style="margin-top:.7rem">${esc(k)}</h3><ul class="lo-list">${v.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}
      </details>
    </div>`;
    el.innerHTML = html;
  }

  function renderDeadlines() {
    const today = todayKey();
    const list = deadlines().filter((d) => passesFilter(d.course));
    const nodate = list.filter((d) => !d.due);
    const open = list.filter((d) => d.due && !(d.complete) && !(d.due < today && !d.chunks.length)).sort((a, b) => a.due.localeCompare(b.due));
    const finished = list.filter((d) => d.due && (d.complete || (d.due < today && !d.chunks.length))).sort((a, b) => b.due.localeCompare(a.due));
    let html = `<div class="section-head"><h2>Deadlines</h2>${filterChips()}</div>`;
    if (nodate.length) {
      html += `<div class="section"><h3>Needs a date</h3><div class="panel">${nodate.map((d) => `<div style="display:flex;gap:.75rem;align-items:center;justify-content:space-between;flex-wrap:wrap">
        <div style="min-width:0">${tag(d.course)} <strong>${esc(d.title)}</strong><p class="small-print">${esc(d.how || '')}</p></div>
        <button class="btn small primary" data-action="set-date" data-id="${esc(d.id)}">Set a date</button></div>`).join('<hr style="border:0;border-top:1px solid var(--line);margin:0">')}</div></div>`;
    }
    html += `<div class="section">${open.length ? open.map((d) => deadlineCard(d)).join('') : '<p class="empty">Nothing open for this filter.</p>'}</div>`;
    if (finished.length) {
      html += `<details class="section"><summary>Finished and past (${finished.length})</summary><div class="section" style="margin-top:.6rem">${finished.map((d) => deadlineCard(d)).join('')}</div></details>`;
    }
    $('#view-deadlines').innerHTML = html;
  }

  function renderAdd() {
    const p = prefill || {};
    const tpl = p.template || 'assignment';
    let html = `<div class="section-head"><h2>Add a deadline</h2></div>

        <div class="two">
          <div class="field"><label for="f-course">Course</label>

              <option value="assess"${p.course === 'assess' ? ' selected' : ''}>Assessor Awards</option>

        </div>
        <div class="two" data-only="assignment"${tpl === 'assignment' ? '' : ' hidden'}>
          <div class="field"><label for="f-words">Word count</label><input type="number" id="f-words" name="words" min="300" max="12000" step="100" value="${esc(p.words || 3000)}"></div>
        </div>
        <div class="two" data-only="custom"${tpl === 'custom' ? '' : ' hidden'}>
          <div class="field"><label for="f-steps">How many steps</label><input type="number" id="f-steps" name="steps" min="1" max="20" value="${esc(p.steps || 4)}"></div>
          <div class="field"><label for="f-mins">Minutes each</label><input type="number" id="f-mins" name="mins" min="5" max="120" step="5" value="${esc(p.mins || 30)}"></div>
