          <div class="row"><button class="btn sm" data-act="open-review" data-id="${esc(ns.week.mon)}">${ic('play', 14)} Start now</button><button class="btn sm ghost" data-act="why-next">Why this?</button></div></div>`;
      } else {

        const ahead = ns.type === 'ahead';
        html += `<div class="card nextstep"><div class="label">${ahead ? 'Next in your plan' : 'Your one next step'}</div><h3 style="font-size:18px">${esc(c.title)}: ${c.mins || 30} min</h3>
          <div class="small" style="opacity:.8">${esc(courseShort(c.course))} · ${esc(c.deadline.title)}. ${esc(ns.why)}</div>
          <div class="row">${ahead ? `<button class="btn sm" data-act="pull" data-id="${esc(c.id)}">${ic('play', 14)} Do it tonight</button>` : `<button class="btn sm" data-act="start-step" data-id="${esc(c.id)}">${ic('play', 14)} Start now</button>`}<button class="btn sm ghost" data-act="why-next">Why this?</button></div></div>`;
      }
    }
    html += m2HomeCard();
    html += axHomeCard();
    html += coachHomeCard();
    if (state.settings.energyCheck !== false) {
      html += `<div class="card"><div class="row between"><h3>How's your energy today?</h3>${e === 'low' ? '<span class="pill warn">low</span>' : e === 'high' ? '<span class="pill good">high</span>' : e === 'okay' ? '<span class="pill info">okay</span>' : ''}</div>
        <div class="chips">${[['low', 'Low, keep it light'], ['okay', 'Okay'], ['high', 'Good, push me']].map(([k, l]) => `<button class="chip" data-act="energy" data-id="${k}" aria-pressed="${e === k}">${l}</button>`).join('')}</div></div>`;
    }
    {
      const R = recommend();
      const p = R.picks.find((x) => !x.extra) || R.picks[0];
      // today's podcast plays from here, even when it is not the first pick
      const pc = R.picks.find((x) => podOf(x.it));
      if (p) {
        html += `<div class="card"><div class="row between"><div class="label">For you ${isWeekday(today) ? 'tonight' : 'today'}</div><button class="small" data-act="fy-open" style="color:var(--accent);font-weight:700">See all</button></div>
          <div class="list">${resRow(p.it, `<span class="pill kpill k-${esc(p.it.kind)}">${esc(KIND_VERB[p.it.kind])}</span>`)}${pc && pc !== p ? resRow(pc.it, `<span class="pill kpill k-${esc(pc.it.kind)}">${esc(KIND_VERB[pc.it.kind])}</span>`) : ''}</div>
          <div class="small muted">${esc(p.why[0] || '')}</div>
          ${pc && podReady() ? `<div class="btnrow"><button class="btn sm" data-act="pod-go" data-id="${esc(pc.it.id)}">${ic(POD.id === pc.it.id && POD.state === 'playing' ? 'pause' : 'play', 14)} ${POD.id === pc.it.id && POD.state !== 'idle' ? (POD.state === 'paused' ? 'Carry on with today’s podcast' : 'Playing today’s podcast') : 'Play today’s podcast here'}</button></div>` : ''}</div>`;
      }
    }
    const mon = mondayOf(today);
    let week = 0;
    for (let d = mon; d <= today; d = addDays(d, 1)) week += studiedOn(d);
    const st = streak();

    html += `<div class="card"><div class="row between"><h3>Today's plan</h3><button class="small" data-tab="plan" style="color:var(--accent);font-weight:700">Planner</button></div>

      ${APP ? `<div class="small muted" id="alarm-line">${state.settings.alarms === false ? 'Alarms are off.' : nextAlarmText()}</div>` : ''}</div>`;
    const healOff = state.settings.heal === false;

    if (stale.length) {

      html += `<div class="card" style="border-color:var(--warn)"><div class="row between"><h3>${healOff ? 'Catch up' : 'Check these'}</h3>${healOff ? '<button class="btn sm ghost" data-act="move-all">Spread them out</button>' : ''}</div>

        <div class="list">${Object.values(groups).map((g) => `<div class="li"><div class="grow"><b>${esc(g.d.title)}</b><div class="small muted">${plural(g.n, 'step')} · due ${esc(shortDate(g.d.due))}</div></div>${healOff ? '' : `<button class="btn sm ghost" data-act="tick-group" data-id="${esc(g.d.id)}">It went in</button>`}</div>`).join('')}</div></div>`;

    html += `<div class="notice tap" data-go="log"><span class="ic">${ic('spark', 16)}</span><div><b>${esc(insight.h)}</b><p>${esc(insight.p)}</p></div></div>`;
    const dls = deadlines().filter((d) => d.due && d.due >= today && !d.complete).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 4);
    html += `<div class="card"><div class="row between"><div class="label">Next deadlines</div><button class="small" data-go="deadlines" style="color:var(--accent);font-weight:700">All</button></div>
      <div class="list">${dls.map((d) => { const n = daysBetween(today, d.due); return `<div class="li tap" data-go="deadlines"><span class="cdot" style="background:${colOf(d.course)}"></span><div class="grow"><b>${esc(d.title)}</b><div class="small muted">${esc(courseName(d.course))}${d.status !== 'confirmed' ? ' · ' + esc(STATUS_LABEL[d.status] || '') : ''}</div></div><div style="text-align:right;flex:0 0 auto"><div class="small"><b>${esc(shortDate(d.due))}</b></div><div class="small muted num">${n === 0 ? 'today' : n === 1 ? '1 day' : n + ' days'}</div></div></div>`; }).join('') || '<div class="small muted">Nothing due.</div>'}</div></div>`;

  /* ---------- Planner ---------- */
  V.plan = () => {
    const today = todayKey();

    const mon = mondayOf(d);
    const days = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(mon, i));
    const load = loadMap();
    const used = (k) => sessionsFor(k).reduce((a, x) => a + (x.kind === 'review' ? ((x.w.complete ? 0 : (REVIEW.mins || 20))) : (x.c.done ? 0 : x.c.mins || 0)), 0);
    const list = sessionsFor(d);
    const dues = deadlines().filter((x) => x.due === d);
    const note = state.log.find((x) => !x.undone && ['heal', 'replan', 'check', 'energy', 'reflect'].includes(x.kind) && x.at > now().getTime() - 2 * 86400000);
    const capD = capFor(d);

      if (x.kind === 'review') {
        const w = x.w;
        return w.complete ? '<span class="pill good">Done</span>' : `<button class="btn sm ghost" data-act="open-review" data-id="${esc(w.mon)}">Open</button>`;

      if (d < today) return '<span class="pill bad">Missed</span>';

      return moved ? '<span class="pill gold">Moved</span>' : '<span class="pill info">Planned</span>';

      <div class="weeknav"><button data-act="plan-week" data-id="-7" aria-label="Previous week">${ic('back', 16)}</button><span class="label">${mon === mondayOf(today) ? 'This week' : esc(weekLabel(mon))}</span><button data-act="plan-week" data-id="7" aria-label="Next week">${ic('fwd', 16)}</button></div>
      <div class="week">${days.map((k) => { const m = load[k] || 0; const cap = capFor(k); return `<button class="day" data-act="day" data-id="${k}" aria-pressed="${k === d}">${esc(fmt(k, { weekday: 'short' }))}<b class="num">${parseKey(k).getDate()}</b><span class="load${isWeekday(k) && m > cap ? ' over' : ''}"><i style="width:${isWeekday(k) ? Math.min(100, (m / cap) * 100) : (m ? 100 : 0)}%"></i></span></button>`; }).join('')}</div>
      ${note ? `<div class="notice"><span class="ic">${ic('spark', 16)}</span><div><b>Plan updated</b><p>${esc(note.what)}. ${esc(note.why)}</p></div></div>` : ''}

      <div style="display:flex;flex-direction:column;gap:8px">

        ${list.length ? list.map((x) => x.kind === 'review'
          ? `<div class="sess"><span class="t">${esc(x.t)}</span><div style="min-width:0" class="tap" data-act="open-review" data-id="${esc(x.w.mon)}"><b class="ttl">PebblePad review</b><div class="small muted">Portfolio · ${(REVIEW.mins || 20)} min · ${x.w.done} of ${x.w.total} checked</div></div>${status(x)}</div>`
          : `<div class="sess${!x.c.done && d < today ? ' missed' : ''}${state.moved[x.c.id] && state.moved[x.c.id] !== x.c.date && !x.c.done ? ' moved' : ''}"><span class="t">${esc(x.t)}</span><div style="min-width:0" class="tap" data-act="step" data-id="${esc(x.c.id)}"><b class="ttl">${esc(x.c.title)}</b><div class="small muted">${esc(courseName(x.c.course))} · ${x.c.mins || 30} min${state.moved[x.c.id] && state.moved[x.c.id] !== x.c.date ? ` · moved from ${esc(fmt(x.c.date, { weekday: 'short' }))}` : ''}</div></div>${status(x)}</div>`).join('')
          : (dues.length ? '' : `<div class="card small muted">${isWeekday(d) ? 'Nothing planned.' : 'Weekends stay free unless you move a step here.'}</div>`)}

        <button class="btn sm ghost" data-go="settings" style="align-self:flex-start">Study hours: ${esc(state.settings.cap)} min weekday evenings from ${esc(state.settings.evening)}</button></div>`;
  };

  // A step's details, from the planner or Home
  function stepSheet(id) {
    const c = allChunks(deadlines()).find((x) => x.id === id);
    if (!c) return;
    const d = c.deadline;
    sheet(`<div class="row"><span class="cdot" style="background:${colOf(c.course)}"></span><span class="label">${esc(courseName(c.course))}</span></div>
      <h3>${esc(c.title)}</h3>

  function stepPrompt(c) {

  }

  /* ---------- Study ---------- */
  let quiz = null;
  let fcFlip = false;
  V.study = () => {
    const tab = ['foryou', 'quiz', 'cards', 'mistakes', 'papers'].includes(sub.stab) ? sub.stab : 'foryou';
    const due = dueCards(sub.cardSrc ? null : sub.cardTopic, sub.cardSrc || null).length;
    const seg = `<div class="seg five">${[['foryou', 'For you'], ['quiz', 'Quiz'], ['cards', 'Cards'], ['mistakes', 'Mistakes'], ['papers', 'Papers']].map(([k, l]) => `<button data-act="stab" data-id="${k}" aria-pressed="${tab === k}">${l}${k === 'cards' && due ? ` <span class="num">${due}</span>` : k === 'mistakes' && state.mistakes.length ? ` <span class="num">${state.mistakes.length}</span>` : ''}</button>`).join('')}</div>`;

  const kindPill = (it) => `<span class="pill kpill k-${esc(it.kind)}">${ic(KIND_ICON[it.kind] || 'link', 12)} ${esc(it.kind === 'Course' ? 'Course' : KIND_VERB[it.kind] || 'Open')}${it.link ? ' · ' + esc(minsLabel(it)) : ''}</span>`;
  function recCard(s) {

    return `<div class="card rec"><div class="row between">${kindPill(it)}${r.done ? `<span class="pill good">${ic('check', 12)} Done before</span>` : ''}</div>
      <h3>${esc(it.title)}</h3><div class="small muted">${esc(it.by || '')}${it.by ? ' · ' : ''}${esc(TOPICS[s.t].name)}</div>
      <div class="why">${s.why.map((w) => esc(w)).join(' ')}</div>
      ${accessNote(it) ? `<div class="small muted">${esc(accessNote(it))}</div>` : ''}
      ${openedToday && !r.done ? `<div class="small muted">${playsHere(it) ? 'Opened today. Watch it to the end and the app marks it done and adds its cards to your review cards.' : 'Opened today. Tap Done when you finish, and the app learns what works for you.'}${it.link ? ` <button class="linkish" data-act="res-locked" data-id="${esc(it.id)}">It was locked or asked me to pay</button>` : ''}</div>` : ''}
      <div class="btnrow">${podOf(it) && podReady() ? `<button class="btn sm" data-act="pod-go" data-id="${esc(it.id)}">${ic(POD.id === it.id && POD.state === 'playing' ? 'pause' : 'play', 14)} ${POD.id === it.id && POD.state !== 'idle' ? (POD.state === 'paused' ? 'Carry on' : 'Playing') : 'Play here'}</button>` : `<button class="btn sm" data-act="res-open" data-id="${esc(it.id)}">${ic(KIND_ICON[it.kind] || 'link', 14)} ${!it.link ? 'Review with tutor' : playsHere(it) && resumeAt(it.id) ? `Carry on at ${clock(resOf(it.id).pos)}` : isVideo(it) && (canRead() || playsHere(it)) && !opensOutside(it) ? (openedToday ? 'Watch again' : 'Watch here') : openedToday ? 'Open again' : 'Open'}</button>`}<button class="btn sm ghost" data-act="res-done" data-id="${esc(it.id)}">${ic('check', 14)} Done</button><button class="btn sm ghost" data-act="res-skip" data-id="${esc(it.id)}">Not for me</button><button class="btn sm ghost" data-act="fav" data-id="${esc(it.id)}" aria-label="${state.favs[it.id] ? 'Remove from favourites' : 'Add to favourites'}" aria-pressed="${!!state.favs[it.id]}"${state.favs[it.id] ? ' style="color:var(--gold)"' : ''}>${ic('star', 14)}</button></div></div>`;

  // The free study platforms: each does one job, and each opens in the browser or its own app.

          <div class="btnrow"><button class="btn sm" data-act="paper" data-id="${pp.id}">${done ? 'Continue' : 'Start'}</button>${done ? `<button class="btn sm ghost" data-act="paper-review" data-id="${pp.id}">Review with tutor</button>` : ''}</div></div>`;
      }).join('');
  }

  /* ---------- Learn: a topic lesson, or a planned step with a timer ---------- */
  let timer = null;
  V.learn = () => {
    if (sub.stepId) {
      const c = allChunks(deadlines()).find((x) => x.id === sub.stepId);
      if (c) {
        const t = timer && timer.id === c.id ? timer : { id: c.id, left: (c.mins || 30) * 60, running: false };
        timer = t;
        const mm = Math.floor(t.left / 60);
        const ss = t.left % 60;
        return `<div class="card"><div class="row between"><span class="label">${esc(courseName(c.course))}</span><span class="pill info">${c.mins || 30} min</span></div><h3 style="font-size:19px">${esc(c.title)}</h3><div class="small muted">For ${esc(c.deadline.title)}${c.deadline.due ? `, due ${esc(fmtLong(c.deadline.due))}` : ''}.</div>${c.tip ? `<div class="step">${esc(c.tip)}</div>` : ''}</div>
          <div class="card" style="align-items:center"><div class="label">Focus timer</div><div class="timer num" id="timer">${pad(mm)}:${pad(ss)}</div>
            <div class="btnrow"><button class="btn sm" data-act="timer">${t.running ? ic('pause', 14) + ' Pause' : ic('play', 14) + (t.left < (c.mins || 30) * 60 ? ' Carry on' : ' Start')}</button><button class="btn sm ghost" data-act="timer-reset">Reset</button></div></div>
          <div class="row"><button class="btn grow" data-act="step-done" data-id="${esc(c.id)}">${c.done ? 'Done already' : 'Done'}</button><button class="btn ghost grow" data-act="move" data-id="${esc(c.id)}">Not tonight</button></div>
          <button class="btn ghost" data-act="ask" data-q="${esc(stepPrompt(c))}">${ic('spark', 14)} Ask tutor to help me start</button>`;
      }
    }
    const topic = sub.topic && TOPICS[sub.topic] ? sub.topic : weakTopics(1)[0].id;
    const T = TOPICS[topic];
    const L = LESSONS[topic];
    const fmts = ['Worked example', 'Short video', 'Audio summary', 'Flashcards'];
    const fmtNow = sub.fmt || (state.energy[todayKey()] === 'low' ? 'Audio summary' : bestFormat());
    const m = mastery(topic);
    const stick = `<div class="card"><h3>Did that stick?</h3><div class="small muted">Your answer teaches the app which format to lead with.</div><div class="chips">${['Yes', 'Partly', 'No'].map((a) => `<button class="chip" data-act="stick" data-id="${a}">${a}</button>`).join('')}</div></div>`;
    let body = '';
    if (fmtNow === 'Worked example') {
      const shown = sub.steps || 1;
      body = L.steps.slice(0, shown).map(([h, b]) => `<div class="step"><b>${esc(h)}</b><div>${esc(b)}</div></div>`).join('') + (shown < L.steps.length ? '<button class="btn ghost" data-act="next-step">Show next step</button>' : stick);
    } else if (fmtNow === 'Short video') {
      const vids = catalogue().filter((x) => x.kind === 'Watch' && x.link && x.ts.includes(topic)).slice(0, 3);
      body = (vids.length
        ? `<div class="card"><h3>Videos on this topic</h3><div class="list">${vids.map((x) => resRow(x)).join('')}</div><div class="small muted">Tap one to open it${canRead() ? ' inside the app' : ''}, then come back and say if it stuck.</div></div>`
        : `<div class="card"><div class="small muted">No video is filed under this topic yet.</div><button class="btn ghost" data-act="open-url" data-url="https://www.youtube.com/results?search_query=${encodeURIComponent(T.name + ' teaching further education')}" data-title="Videos: ${esc(T.name)}">${ic('play', 16)} Search YouTube for one</button><div class="small muted">Pick one under ten minutes from a source you trust. Tap Save at the top to keep it in your Library.</div></div>`) + stick;
    } else if (fmtNow === 'Audio summary') {
      body = `<div class="card"><div class="row"><button class="btn" data-act="speak">${ic('speaker', 16)} Listen · 1 min</button><span class="small muted">Read aloud, with pause and speed</span></div><div class="small" style="line-height:1.6">${esc(L.sum)}</div></div>${stick}`;
    } else {
      const n = allCards().filter((c) => c.t === topic).length;
      body = `<div class="card"><h3>${n} cards on ${esc(T.name)}</h3><div class="small muted">${esc(L.sum)}</div><button class="btn" data-act="cards-topic" data-id="${topic}">Review cards</button></div>`;
    }
    const libFor = catalogue().filter((x) => x.ts.includes(topic) && (x.link || x.kind === 'File') && !(fmtNow === 'Short video' && x.kind === 'Watch')).sort((x, y) => (resOf(x.id).done ? 1 : 0) - (resOf(y.id).done ? 1 : 0)).slice(0, 4);
    const why = sub.fmt ? 'You picked this format.' : state.energy[todayKey()] === 'low' ? 'Your energy is low, so this starts with audio.' : formatRate(fmtNow) != null ? `Chosen because ${fmtNow.toLowerCase()}s work best for you (${formatRate(fmtNow)}% stuck).` : 'Starting with a worked example. Rate each format and the app learns what works for you.';
    return `<div class="card"><div class="row between"><span class="label">${esc(courseName(T.c))}</span><span class="pill ${mState(m)[0]} num">${m == null ? 'Not checked' : m + '%'}</span></div><h3 style="font-size:19px">${esc(T.name)}</h3><div class="small muted">${esc(why)}</div>${listenOn() ? `<button class="btn sm ghost" data-act="listen-lesson" data-id="${topic}" style="align-self:flex-start">${ic('speaker', 14)} Listen to this lesson</button>` : ''}</div>
      <div class="chips">${fmts.map((f) => `<button class="chip" data-act="fmt" data-id="${f}" aria-pressed="${f === fmtNow}">${f}</button>`).join('')}</div>
      ${body}
      ${libFor.length ? `<div class="card"><div class="row between"><h3>From your library</h3><button class="linkish" data-act="lib-topic" data-id="${topic}">All on this topic</button></div><div class="list">${libFor.map((x) => resRow(x)).join('')}</div></div>` : ''}
      <button class="btn ghost" data-act="ask" data-q="${esc(`Explain ${T.name} to me in a different way, with one everyday example and one from teaching T Level Engineering in FE. Keep it short and ask me a question at the end to check I understood.`)}">${ic('spark', 14)} Explain it a different way</button>`;
  };

  /* ---------- a practice paper ---------- */
  V.paper = () => {
    const pp = PAPERS.find((x) => x.id === sub.paper) || PAPERS[0];
    const qs = paperQs(pp);
    const rec = (state.papers[pp.id] = state.papers[pp.id] || { answers: {} });
    return `<div class="card"><div class="row"><span class="cdot" style="background:${colOf(pp.c)}"></span><span class="label">${esc(courseName(pp.c))} · ${pp.mins} min</span></div><h3>${esc(pp.title)}</h3>
        <div class="small muted">Write in your own words. Answers save as you type.${pp.c === 'assess' ? ' The question wording may differ slightly from your workbook, so check it there.' : ''}</div></div>
      ${qs.map((q, i) => `<div class="card"><b class="small">${esc(q)}</b><textarea id="pa-${pp.id}-${i}" data-input="paper" data-id="${pp.id}" data-i="${i}" aria-label="Your answer to question ${i + 1}" placeholder="Your answer">${esc(rec.answers[i] || '')}</textarea><div class="row between"><span class="wc muted" id="wc-${pp.id}-${i}">${wordCount(rec.answers[i])} words</span></div></div>`).join('')}
      <button class="btn" data-act="paper-review" data-id="${pp.id}">${ic('spark', 16)} Review with tutor</button>
      <button class="btn ghost" data-act="paper-copy" data-id="${pp.id}">Copy my answers</button>`;
  };
  function paperPrompt(pp) {
    const qs = paperQs(pp);
    const a = (state.papers[pp.id] && state.papers[pp.id].answers) || {};
    const body = qs.map((q, i) => `Q${i + 1}. ${q}\nMy answer: ${String(a[i] || '(not answered yet)').trim()}`).join('\n\n');
    return `These are my practice answers for "${pp.title}". For each answer, tell me what is strong, what is missing against the criterion, and one thing to add. Please do not rewrite my answers: my tutor wants them in my own words.\n\n${body}`;
  }

  /* ---------- Portfolio: a workbook laid out like your PebblePad one ----------
     Pages down the workbook, evidence tagged to KSBs, records that feed the progress bars.
     It does not sync with PebblePad itself: upload there, then mark it here. */
  const PP_PAGES = [
    ['overview', 'Overview'], ['review', 'Weekly review'], ['ksb', 'KSB evidence'], ['hours', 'Teaching hours'],
    ['obs', 'Observations'], ['meetings', 'Mentor meetings'], ['placements', 'Placements'], ['records', 'Records'], ['pd', 'Professional discussion']
  ];
  const EV_STATUS = [['draft', 'Draft'], ['uploaded', 'In PebblePad'], ['feedback', 'Feedback received']];
  const statusPill = (s) => (s === 'uploaded' ? '<span class="pill good">In PebblePad</span>' : s === 'feedback' ? '<span class="pill gold">Feedback received</span>' : '<span class="pill">Draft</span>');
  const toggle = (on, act, id, label) => `<button class="toggle" role="switch" aria-checked="${!!on}" data-act="${act}" data-id="${esc(id)}" aria-label="${esc(label)}"></button>`;

  V.portfolio = () => {
    if (!PORT || !REVIEW) return '<div class="card small muted">No portfolio data in this version.</div>';
    const page = sub.ppage || 'overview';
    const parts = portfolioParts();
    const pct = portfolioPct();
    const counts = { ksb: ksbCovered().size + '/51', obs: parts.find((x) => x.id === 'obs').have + '/20', meetings: String(state.portfolio.meetings.length), review: overdueReviews().length ? '!' : '' };
    const head = `<div class="wb-head"><div class="row between"><div class="label">Workbook · Module 3 (7X-710021)</div><span class="pill ${pctState(pct)[0]} num">${pct}%</span></div>
        <h3>PGCE FES portfolio</h3><div class="bar"><i style="width:${pct}%"></i></div>
        <div class="small muted">${parts.filter((x) => x.pct >= 100).length} of ${parts.length} parts complete. Everything must be uploaded before the professional discussion.</div></div>
      <nav class="wb-pages" aria-label="Workbook pages">${PP_PAGES.map(([k, l]) => `<button data-act="ppage" data-id="${k}" ${page === k ? 'aria-current="page"' : ''}>${l}${counts[k] ? ` <span class="n">${counts[k]}</span>` : ''}</button>`).join('')}</nav>`;
    return head + (PP[page] || PP.overview)();
  };
  const PP = {};

  PP.overview = () => {
    const parts = portfolioParts();
    const rw = thisWeekReview() || nextReview();
    const late = overdueReviews();
    const recent = state.portfolio.evidence.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 3);
    return `${late.length ? `<div class="notice warn"><span class="ic">${ic('bell', 16)}</span><div><b>Weekly review still open for ${esc(weekLabel(late[0].mon))}</b><p>${late[0].done} of ${late[0].total} checked. It stays at the top until it is done.</p><button class="linkish" data-act="ppage" data-id="review">Finish it</button></div></div>` : ''}
      ${pfUpdateCard()}
      ${KSB_BASE ? ksbBaseNotice() : ''}
      <div class="card"><h3>Portfolio parts</h3><div style="display:flex;flex-direction:column;gap:10px">${parts.map((x) => `<button class="tap" data-act="ppage" data-id="${x.page}" style="text-align:left"><div class="row between small"><span>${esc(x.label)}</span><span class="row" style="gap:6px"><span class="pill ${pctState(x.pct)[0]}">${pctState(x.pct)[1]}</span><b class="num">${x.have}/${x.need}</b></span></div><div class="bar" style="margin-top:4px"><i style="width:${x.pct}%;background:${x.pct >= 100 ? 'var(--good)' : 'var(--accent)'}"></i></div></button>`).join('')}</div></div>
      <button class="btn" data-act="ev-new">${ic('plus', 16)} Add evidence</button>
      ${rw ? `<div class="card tap" data-act="ppage" data-id="review"><div class="row between"><h3>Weekly review</h3><span class="pill ${rw.complete ? 'good' : rw.state === 'tonight' ? 'warn' : 'info'}">${rw.complete ? 'Done' : rw.state === 'tonight' ? 'Tonight' : 'Due ' + esc(fmt(rw.day, { weekday: 'short' }))}</span></div><div class="small muted">${esc(weekLabel(rw.mon))} · ${rw.done} of ${rw.total} checked · about ${(REVIEW.mins || 20)} min</div></div>` : ''}
      <div class="card"><div class="row between"><h3>Recent evidence</h3><button class="small" data-act="ppage" data-id="ksb" style="color:var(--accent);font-weight:700">Evidence log</button></div>
        ${recent.length ? recent.map(evRow).join('') : '<div class="small muted">Nothing logged yet. Add a lesson plan, observation feedback or a reflection, and tag the KSBs it shows.</div>'}</div>
      <div class="btnrow"><button class="btn sm ghost" data-act="pebblepad">${ic('out', 14)} Open PebblePad</button></div>`;
  };

  function evRow(e) {
    return `<div class="ev tap" data-act="ev-edit" data-id="${esc(e.id)}"><div class="row between"><b class="grow">${esc(e.title || 'Untitled evidence')}</b>${statusPill(e.status)}</div>
      <div class="small muted">${esc(e.type || 'Evidence')}${e.date ? ' · ' + esc(shortDate(e.date)) : ''}${e.link ? ' · has a link' : ''}</div>
      ${(e.ksbs || []).length ? `<div class="tags">${e.ksbs.map((k) => `<span class="pill info">${esc(k)}</span>`).join('')}</div>` : '<div class="small" style="color:var(--warn)">Not tagged to any KSB yet</div>'}</div>`;
  }

  PP.review = () => {
    const late = overdueReviews();
    const rw = thisWeekReview();
    const next = rw || nextReview();
    const shown = late.slice();
    if (next && !shown.some((w) => w.mon === next.mon)) shown.push(next);
    if (sub.reviewWeek && inReviewRange(sub.reviewWeek) && !shown.some((w) => w.mon === sub.reviewWeek)) shown.unshift(reviewWeek(sub.reviewWeek));
    const past = reviewWeeksSoFar().filter((w) => w.complete).reverse();
    const pageFor = { mentor: 'meetings', hours: 'hours', obs: 'obs', ksb: 'ksb', ap: 'placements' };
    // The hours item can log your usual week in one tap, and ticks itself when it does.
    const uw = usualWeek();
    const hoursBtn = (mon) => (!uw ? '' : weekLogged(mon) ? '<div class="small" style="color:var(--good)">This week is in the hours log.</div>' : TEACH_BREAKS.includes(mon) ? '<div class="small muted">Half term or holiday week: no teaching to log.</div>' : `<button class="linkish" data-act="hours-week" data-id="${esc(mon)}" style="margin-right:16px">Log ${uw} h for this week</button>`);
    const card = (w) => `<div class="card" id="rv-${esc(w.mon)}" style="${w.state === 'overdue' ? 'border-color:var(--bad)' : ''}">
      <div class="row between"><div><div class="label" style="color:${w.state === 'overdue' ? 'var(--bad)' : 'var(--c-review)'}">${{ overdue: 'Overdue', tonight: 'Tonight', upcoming: 'This week', done: w.skipped ? 'Skipped' : 'Done' }[w.state]}</div><h3>PebblePad review, ${esc(weekLabel(w.mon))}</h3><div class="small muted">${esc(DAY_NAMES[reviewDayNum() - 1])} ${esc(fmt(w.day, { day: 'numeric', month: 'long' }))} · about ${REVIEW.mins || 20} min</div></div><span class="pill ${w.complete ? 'good' : 'warn'} num">${w.done}/${w.total}</span></div>
      <div class="bar"><i style="width:${w.total ? (w.done / w.total) * 100 : 0}%;background:var(--c-review)"></i></div>
      <div class="list">${w.items.map((it) => { const on = !!w.ticks[it.id]; return `<div class="li top"><button class="check ${on ? 'on' : ''}" data-act="rtick" data-week="${esc(w.mon)}" data-id="${esc(it.id)}" aria-pressed="${on}" aria-label="${esc(it.title)}">${ic('check', 14)}</button><div class="grow"><b style="${on ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(it.title)}</b><div class="small muted">${esc(it.tip || '')}</div>${it.id === 'hours' ? hoursBtn(w.mon) : ''}${pageFor[it.id] ? `<button class="linkish" data-act="ppage" data-id="${pageFor[it.id]}">Open ${esc(PP_PAGES.find((p) => p[0] === pageFor[it.id])[1].toLowerCase())}</button>` : ''}</div></div>`; }).join('')}</div>
      <div class="btnrow">${w.complete ? '' : `<button class="btn sm ghost" data-act="review-all" data-id="${esc(w.mon)}">Tick them all</button>`}${w.skipped ? `<button class="btn sm ghost" data-act="review-unskip" data-id="${esc(w.mon)}">Undo skip</button>` : (w.complete ? '' : `<button class="btn sm ghost" data-act="review-skip" data-id="${esc(w.mon)}">No review this week</button>`)}</div></div>`;
    return `<div class="small muted">Each week, check the parts of your PebblePad portfolio that change. Tick each one once you have looked at it, even if there was nothing to add. An open week stays on Home until it is done.</div>
      ${shown.map(card).join('') || '<div class="card small muted">No review this week.</div>'}
      ${past.length ? `<div class="card"><h3>Finished weeks</h3><div class="list">${past.map((w) => `<button class="li tap" data-act="open-review" data-id="${esc(w.mon)}" style="width:100%;text-align:left"><div class="grow">${esc(weekLabel(w.mon))}</div><span class="pill ${w.skipped ? '' : 'good'}">${w.skipped ? 'skipped' : 'done'}</span></button>`).join('')}</div></div>` : ''}`;
  };

  PP.ksb = () => {
    const f = sub.ksbFilter || 'all';
    const covered = ksbCovered();
    const ids = KSB_IDS.filter((k) => f === 'all' || (f === 'gaps' ? !covered.has(k) : k[0] === f));
    const p = state.portfolio;
    const ev = p.evidence.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    return `<div class="card"><div class="row between"><h3>KSB map</h3><span class="pill ${pctState(Math.round((covered.size / 51) * 100))[0]} num">${covered.size}/51</span></div>
        <div class="small muted">Green means at least one piece of evidence${KSB_BASE && state.settings.baseCount !== false ? ', including the Strong KSBs on your reset baseline' : ''}. One piece can cover several KSBs. Tap a KSB for its wording and evidence.${Number(p.nums.ksb) && !p.evidence.length && !Object.keys(p.ksbDone).length ? ` Your old count was ${esc(p.nums.ksb)}: tap those KSBs and mark them as already in PebblePad.` : ''}</div>
        <div class="chips">${[['all', 'All'], ['K', 'Knowledge'], ['S', 'Skills'], ['B', 'Behaviours'], ['gaps', 'Gaps']].map(([k, l]) => `<button class="chip" data-act="ksb-filter" data-id="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>
        <div class="ksbgrid">${ids.map((k) => { const n = evidenceFor(k).length; return `<button class="ksb${covered.has(k) ? ' on' : ''}" data-act="ksb" data-id="${k}">${k}<small>${n ? n + ' item' + (n === 1 ? '' : 's') : p.ksbDone[k] ? 'in PP' : baseCounts(k) ? 'Strong' : '–'}</small></button>`; }).join('') || '<div class="small muted">No gaps. Every KSB has evidence.</div>'}</div></div>
      ${KSB_BASE ? ksbBaseCard() : ''}
      <button class="btn" data-act="ev-new">${ic('plus', 16)} Add evidence</button>
      <div class="card"><div class="row between"><h3>Evidence log</h3><span class="small muted">${plural(ev.length, 'item')}</span></div>${ev.length ? ev.map(evRow).join('') : '<div class="small muted">Nothing logged yet.</div>'}</div>`;
  };

  // The reset baseline on the KSB page: counts, the Gap and Partial KSBs to tap, and what the codes mean.
  function ksbBaseCard() {
    const b = KSB_BASE;
    const c = b.counts || {};
    const list = (s) => KSB_IDS.filter((k) => b.items[k] && b.items[k].s === s);
    const btns = (ids) => ids.map((k) => `<button class="chip" data-act="ksb" data-id="${k}">${k}</button>`).join('') || '<span class="small muted">None.</span>';
    return `<div class="card"><div class="row between"><h3>Reset baseline</h3><span class="small muted">${esc(shortDate(b.date))}</span></div>
      <div class="small muted">Where your evidence stood when you restarted the portfolio. From your ${esc(b.doc || 'KSB Coverage Reset')}.</div>
      <div class="li" style="border:0;padding:0"><div class="grow"><b class="small">Count the ${Number(c.Strong) || 0} Strong KSBs as evidenced</b><div class="small muted">They show green and count in your progress. Partial and Gap KSBs still need evidence tagged.</div></div>${toggle(state.settings.baseCount !== false, 'base-count', 'on', 'Count the Strong KSBs as evidenced')}</div>
      <div class="row" style="gap:6px;flex-wrap:wrap"><span class="pill good num">${Number(c.Strong) || 0} Strong</span><span class="pill warn num">${Number(c.Partial) || 0} Partial</span><span class="pill bad num">${Number(c.Gap) || 0} Gap</span></div>
      <div class="label">Gaps on the baseline</div><div class="chips">${btns(list('Gap'))}</div>
      <div class="label">Partial on the baseline</div><div class="chips">${btns(list('Partial'))}</div>
      <details><summary class="small" style="color:var(--accent);font-weight:700;cursor:pointer">What the evidence codes mean</summary><div class="list" style="margin-top:6px">${(b.sources || []).map((s) => `<div class="li"><b class="small" style="min-width:64px">${esc(s[0])}</b><div class="grow small">${esc(s[1])}</div></div>`).join('')}</div></details></div>`;
  }
  // A short notice on the Portfolio overview, so the reset is seen where progress is read.
  function ksbBaseNotice() {
    const c = KSB_BASE.counts || {};
    const on = state.settings.baseCount !== false;
    return `<div class="notice"><span class="ic">${ic('spark', 16)}</span><div><b>KSB reset baseline, ${esc(shortDate(KSB_BASE.date))}</b><p>${Number(c.Strong) || 0} Strong, ${Number(c.Partial) || 0} Partial, ${Number(c.Gap) || 0} Gap. ${on ? 'The Strong ones count in KSBs with evidence below.' : 'The Strong ones are not counted below (the switch is off).'}</p><button class="linkish" data-act="ppage" data-id="ksb">Open KSB evidence</button></div></div>`;
  }
  // The baseline for one KSB, shown at the top of its sheet.
  function ksbBaseBox(k) {
    const it = KSB_BASE && KSB_BASE.items[k];
    if (!it) return '';
    return `<div class="card" style="gap:6px"><div class="row between"><b class="small">Reset baseline, ${esc(shortDate(KSB_BASE.date))}</b><span class="pill ${BASE_PILL[it.s] || 'info'}">${esc(it.s)}</span></div>
      <div class="small"><b>Evidence:</b> ${esc(it.ev)}</div>
      <div class="small"><b>Next step:</b> ${esc(it.next)}</div>
      <div class="small muted">Mapped in PebblePad before the reset: ${esc(it.pp)}</div></div>`;
  }

  function ksbSheet(k) {
    const p = state.portfolio;
    const ev = evidenceFor(k);
    const duties = DUTY_KSBS.map((list, i) => (list.includes(k) ? i : -1)).filter((i) => i >= 0);
    sheet(`<div class="row between"><span class="pill info" style="font-family:var(--f-mono)">${k}</span>${baseOnly(k) ? '<span class="pill good">Evidenced (baseline)</span>' : ksbCovered().has(k) ? '<span class="pill good">Evidenced</span>' : '<span class="pill bad">Gap</span>'}</div>
      <h3 style="font-size:16px">${esc(KSBS[k])}</h3>

  // Saves the evidence being edited. Returns it, or null when it has no title yet.
  function evSave() {
    const p = state.portfolio;
    if (!evDraft) return null;
    if (!String(evDraft.title || '').trim()) { toast('Give it a title first.'); return null; }
    evDraft.ksbs.sort((x, y) => KSB_IDS.indexOf(x) - KSB_IDS.indexOf(y));
    if (evDraft.id) { const i = p.evidence.findIndex((x) => x.id === evDraft.id); if (i >= 0) p.evidence[i] = evDraft; else p.evidence.push(evDraft); } else { evDraft.id = 'e' + uid(); p.evidence.push(evDraft); }
    const saved = evDraft;
    evDraft = null;
    commit();
    return saved;
  }

    return html;
  };
  function weekChart(tw, lw) {
    const W = 320; const H = 130; const pl = 28; const pb = 20; const bw = 18;
    const max = Math.max(60, ...tw, ...lw);
    const y = (v) => H - pb - (v / max) * (H - pb - 8);
    const today = todayKey();
    const mon = mondayOf(today);
    let g = '';
    [0, Math.round(max / 2), max].forEach((v) => { g += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`; });
    ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach((d, i) => {
      const cx = pl + 18 + i * ((W - pl - 24) / 6);
      g += `<rect x="${cx - bw / 2 - 5}" y="${y(lw[i])}" width="${bw / 2}" height="${H - pb - y(lw[i])}" rx="2" fill="var(--line)"/>`;
      g += `<rect x="${cx - bw / 2 + 5}" y="${y(tw[i])}" width="${bw / 1.6}" height="${H - pb - y(tw[i])}" rx="3" fill="${addDays(mon, i) === today ? 'var(--gold)' : 'var(--accent)'}"/>`;
      g += `<text x="${cx}" y="${H - 5}" text-anchor="middle">${d}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Minutes studied each day this week against last week">${g}</svg><div class="row small muted" style="gap:14px"><span class="row" style="gap:6px"><span class="cdot" style="background:var(--accent)"></span>This week</span><span class="row" style="gap:6px"><span class="cdot" style="background:var(--line)"></span>Last week</span><span>minutes</span></div>`;

  /* ---------- live updates ----------

  const PAGE = Number((document.querySelector('meta[name="capgown-page"]') || {}).content) || 0;
  const startedAt = Date.now();
  let lastTouch = 0;
  let liveMsg = '';

  function liveStatus() {
    if (!APP || typeof APP.liveStatus !== 'function') return null;
    try { return JSON.parse(APP.liveStatus() || 'null'); } catch (e) { return null; }
  }
  // Which update this run of the app has already tried to show. Kept in two places, because a note written to
  // session storage just before the page reloads does not always survive the reload; the window's name does.
  const appliedPage = () => {
    let a = 0;
    try { a = Number(sessionStorage.getItem('capgown-applied')) || 0; } catch (e) { /* storage can be blocked */ }
    const m = /^capgown-applied:(\d+)$/.exec(window.name || '');
    return Math.max(a, m ? Number(m[1]) : 0);
  };
  const setApplied = (n) => {
    try { sessionStorage.setItem('capgown-applied', String(n)); } catch (e) { /* ignore */ }

  };
  // A newer page is on the phone. Show it straight away if you are not in the middle of something.
  function updateReady(n) {
    n = Number(n) || 0;
    if (!(n > PAGE) || !APP || typeof APP.applyUpdate !== 'function') return;
    if (appliedPage() >= n) return; // tried once this session and it did not come up: wait for the next start
    const busy = sheetOpen || tutorOpen || (quiz && quiz.i < quiz.qs.length) || (timer && timer.running) || route === 'paper' || route === 'add';
    // Never reload under a finger: straight after opening only if nothing has been tapped in the last few seconds.
    const quiet = Date.now() - lastTouch;
    const idle = (Date.now() - startedAt < 20000 && quiet > 5000) || quiet > 30000;
    if (!busy && idle) {
      setApplied(n);
      try { APP.applyUpdate(); return; } catch (e) { /* offer it instead */ }

by what has worked for you.'], ['Updates by itself', 'New library items, deadlines and fixes arrive without a new install.'], ['Tutor that knows your week', 'Ask tutor opens your Claude account in the app, with your plan ready to go in the message box.'], ['One next step', 'The single best thing to do now: an open review first, then the closest deadline.'], ['Portfolio readiness', 'Eight parts of the Module 3 portfolio, measured from your own records.'], ['Self-healing planner', 'Missed steps move to the next evening with room before their deadline.'], ['Energy check-in', 'Low evenings keep only the most urgent step.'], ['Mistake notebook', 'Wrong answers become review cards.'], ['Spaced repetition', 'Cards come back just before you forget them.'], ['Format that fits', 'Leads with the format that sticks for you.'], ['Real alarms', 'Rings like an alarm clock until the work is ticked off.'], ['Decision log', 'Every change explained, most can be undone.']].map(([a, b]) => `<div class="card"><b>${esc(a)}</b><div class="small muted">${esc(b)}</div></div>`).join('')}`;

  const canListen = () => !!(APP && typeof APP.listenStart === 'function');

      let short = t;

  // The player's buttons. In the app the phone does the work and answers with its new state.

  // Claude's reply, sorted into the boxes of the record by its headings. With no headings it all goes in "What you discussed".
  function meetParse(raw) {
    const text = String(raw || '').replace(/\r/g, '');
    const marks = [];
    // Capitals first, as asked for, so a line of the notes that happens to start "Strengths:" is not taken for a heading.
    MEET_FIELDS.forEach(([k, , head, alts]) => {
      for (const [name, flags] of [head].concat(alts).map((x) => [x, 'm']).concat([head].concat(alts).map((x) => [x, 'im']))) {
        const m = new RegExp(`^[ \\t>#*_-]*${name.replace(/ /g, '[ \\t]+')}[ \\t*_]*(?::[ \\t*_]*|$)`, flags).exec(text);
        if (m) { marks.push({ k, at: m.index, end: m.index + m[0].length }); break; }
      }
    });
    marks.sort((a, b) => a.at - b.at);
    const clean = (t) => { const c = t.replace(/\*\*|__/g, '').replace(/^[ \t]*[*•][ \t]+/gm, '- ').replace(/[ \t]+$/gm, '').replace(/\n{3,}/g, '\n\n').trim(); return /^not discussed\.?$/i.test(c) ? '' : c; };
    const out = {};
    marks.forEach((mk, i) => { out[mk.k] = clean(text.slice(mk.end, i + 1 < marks.length ? marks[i + 1].at : text.length)); });
    if (!marks.length) out.discussed = clean(text);
    return out;
  }

    { id: '1.2', q: 'Define the key concepts and principles of assessment.', t: 'vacsr',
      learn: [['Concepts and principles are different things', 'Concepts are the ideas that describe how assessment is organised. Principles are the rules that make every decision trustworthy. A good answer defines each one in a sentence. It does not just list them.'],
        ['Key concepts', 'Competence-based: the candidate proves they can do the job to the standard. There are no marks, only competent or not yet competent (Wolf, 1995). Criterion-referenced: judged against fixed criteria, not against other candidates (Glaser, 1963). Others to define: initial, formative and summative assessment, direct and indirect evidence, holistic assessment, recognition of prior learning, and standardisation.'],
        ['Key principles', 'Validity: the method assesses what the criterion asks for (Messick, 1989). Reliability: the same evidence gets the same decision from any assessor, on any day. Fairness: every candidate has an equal chance to show competence. Gravells (2021) sums up the rules for evidence as VACSR: valid, authentic, current, sufficient and reliable.']],
      check: [['Two assessors look at the same evidence and reach different decisions. Which principle has failed?', ['Validity', 'Currency', 'Reliability'], 2, 'Reliability is about consistency between assessors and over time. Validity is about assessing the right thing.'],
        ['Criterion-referenced assessment means the candidate is judged…', ['Against the rest of the group', 'Against their own earlier work', 'Against fixed, published criteria'], 2, 'Judging against the group is norm-referencing. Judging against earlier work is ipsative assessment.']],
      cover: ['A sentence defining each concept and each principle, not a list', 'Competence-based and criterion-referenced assessment', 'Validity, reliability and fairness', 'VACSR for evidence'],
      trap: 'Mixing up validity (the right thing is assessed) with reliability (the same decision every time).',
      own: 'Pick one principle and say how you applied it in a recent assessment.',
      start: ['A concept is… For example…', 'Validity means…'], src: ['gr21', 'wolf', 'glaser', 'messick'] },
    { id: '1.3', q: 'Explain the responsibilities of the assessor.', t: 'vacsr',
      learn: [['The core responsibility', 'The assessor makes accurate, fair and defensible decisions against the standards, and records them so they can be quality assured. The national standard for the role is Standard 9, Assess learner achievement (Lifelong Learning UK, 2010).'],
        ['What that means day to day', 'Know the standards and the awarding organisation’s assessment strategy. Plan with the candidate and the employer. Carry out the assessment with valid methods. Judge the evidence using VACSR. Give clear feedback. Record, sign and date, and track progress.'],
        ['Integrity and staying competent', 'Take part in internal quality assurance (IQA) sampling and standardisation. Declare conflicts of interest and report suspected malpractice. Resist pressure to pass someone who is not yet competent (Read, 2016). Follow health and safety, safeguarding, equality and data protection law. Keep your occupational and assessment practice current through CPD. Until you are qualified, your decisions are countersigned.']],
      check: [['Who owns the assessment decision?', ['The assessor', 'The internal quality assurer', 'The employer'], 0, 'The assessor makes and owns the decision. The IQA samples it to check it is sound.'],
        ['An employer asks you to sign off an apprentice who is not yet competent, to meet a target. You should…', ['Refuse: decisions are made only against the standards', 'Sign, because the employer knows the apprentice best', 'Ask the candidate to decide'], 0, 'Independence from pressure is part of the role. If the pressure continues, report it through your centre.']],
      cover: ['Occupational competence and knowing the standards', 'Plan, assess, decide, give feedback and record', 'Quality assurance and standardisation', 'Integrity: conflicts of interest, malpractice and pressure', 'Legal duties and CPD, with countersigning until qualified'],
      trap: 'Saying the IQA makes the decision. The assessor decides, and the IQA samples.',
      own: 'Which of these do you already do for the learners you assess, and which is new to you?',
      start: ['The assessor is responsible for…', 'In my own practice this means…'], src: ['lluk', 'read', 'ofqual'] },
    { id: '1.4', q: 'Identify the regulations and requirements relevant to the assessment in own area of practice.', t: 'law',
      learn: [['Think in three layers', 'The rules of the qualification, the law, and the standards of your industry. “Identify” means name each one and say briefly why it applies to your own assessments.'],
        ['Qualification rules', 'Ofqual regulates awarding organisations through its General Conditions of Recognition. Your centre is bound through its agreement with the awarding organisation. Day to day you follow the qualification specification and the assessment strategy: what must be observed, whether simulation is allowed, who may assess, and the rules on AI in assessed work (Joint Council for Qualifications, 2025).'],
        ['The law', 'Health and Safety at Work etc. Act 1974. Equality Act 2010, including reasonable adjustments. Data Protection Act 2018 and UK GDPR. Safeguarding: Keeping children safe in education for learners under 18, and the Prevent duty. Copyright, Designs and Patents Act 1988.'],
        ['Your industry', 'Candidates are judged against current industry standards. In engineering these include BS 8888:2025 for drawings and BS 7671:2018+A4:2026 for electrical work. An assessor must know which edition is current.']],
      check: [['Who does Ofqual regulate directly?', ['Colleges and training providers', 'Awarding organisations', 'Individual assessors'], 1, 'Ofqual regulates awarding organisations. Centres are bound through their centre agreement.'],
        ['Where do you find which criteria must be directly observed?', ['The Equality Act 2010', 'The college timetable', 'The awarding organisation’s assessment strategy'], 2, 'The qualification specification and the assessment strategy set the rules for evidence.']],
      cover: ['Ofqual’s conditions and the awarding organisation’s assessment strategy', 'Health and safety, equality, data protection and safeguarding law', 'Standards from your own industry, with current dates', 'Each one tied to your own area of practice'],
      trap: 'Saying Ofqual regulates the college. It regulates awarding organisations.',
      own: 'Name your own qualification, its awarding organisation and the industry standards your learners work to.',
      start: ['In my area of practice, which is…', 'The assessment strategy requires…'], src: ['ofqual', 'jcq', 'hswa', 'eqa'] },
    { id: '2.1', q: 'Compare the strengths and limitations of a range of assessment methods with reference to the needs of individual learners.', t: 'methods',
      parts: ['Observation', 'Oral Questioning', 'Professional / Guided Discussion', 'Witness Testimony', 'Examination of Product Evidence', 'Written Questioning'],
      learn: [['Direct methods', 'Observation shows real performance, so it is the most valid method for practical criteria. But people can act differently when watched, and it does not show the knowledge behind the action. Examining a product is concrete and can be checked again, but you must confirm that the candidate made it.'],
        ['Questioning and discussion', 'Oral questioning is quick and checks the “why” behind the work, but it must be planned and recorded. A professional discussion covers many criteria in one planned, two-way talk and draws out tacit knowledge (Eraut, 2000), but a fluent talker can seem more competent than they are. Written questions give a permanent record, but answers can be copied or written by AI, and writing can disadvantage candidates with low literacy.'],
        ['Witness testimony', 'A statement from someone who saw the work, such as a supervisor. It covers what you cannot see, like night shifts. It is indirect evidence, so check who the witness is and what they know, and keep to the limits in the assessment strategy (Read, 2016).'],
        ['Match the method to the person', 'For each method, say who it suits. Oral questioning suits a candidate with dyslexia. Share a discussion agenda in advance with an anxious candidate. A reader, a scribe or extra time can support written questions. The standard itself never changes.']],
      check: [['Which method is the most valid for a practical performance criterion?', ['Written questioning', 'Observation of real work', 'Witness testimony'], 1, 'Observation shows the candidate doing it. Miller (1990) puts “does” at the top of his framework.'],
        ['A candidate hands in a well-made component. What must you still check?', ['That it is heavier than the last one', 'Nothing, a product speaks for itself', 'That it is authentic: they made it'], 2, 'Authenticity is the main risk with products. Confirm it by questioning, observation or a witness.']],
      cover: ['For each of the six methods: a strength, a limitation and a point about individual needs', 'Some judgement across the methods, because the verb is Compare', 'Authenticity checks for products and written answers', 'Checks on whether a witness is suitable'],
      trap: 'Listing the methods without comparing them or linking them to individual learners.',
      own: 'Which two methods do you use most with your learners, and who do they suit or not suit?',
      start: ['Compared with observation, written questioning…', 'For a learner who…, the better method is…'], src: ['miller', 'eraut00', 'read', 'bloom'] },
    { id: '3.1', q: 'Summarise key factors to consider when planning assessment.', t: 'planning',
      learn: [['Plan with the candidate', 'The assessor plans with the candidate, and usually the employer, and records it in an assessment plan. Gravells (2021) suggests who, what, when, where, why and how. A good plan is SMART (Doran, 1981).'],
        ['Factors about the standard and the person', 'The standards and the assessment strategy: which criteria, what evidence, what must be observed. The candidate: their job, prior learning, readiness, needs and adjustments, and shift pattern. Methods: valid for each criterion, without over-assessing.'],
        ['Factors about the setting', 'Holistic opportunities. Timing around real work and deadlines. Location and safety: access, induction, risk assessment and PPE. Others involved: the employer, witnesses and the IQA. Authenticity and the AI rules. Recording and data protection. A contingency in case the work is not available.']],
      check: [['“Summarise” asks you to…', ['Argue for and against', 'Give the main points briefly', 'Describe one factor in great depth'], 1, 'Summarise means the key points in brief. Keep the weighing up for Evaluate questions.'],
        ['Before you plan an observation, who should confirm the candidate is ready?', ['The candidate, with the trainer or employer', 'Nobody: readiness is the assessor’s guess', 'The external quality assurer'], 0, 'Readiness is confirmed with those who know the candidate’s work, so the assessment is fair and safe.']],
      cover: ['The standards and the assessment strategy', 'The candidate: role, prior learning, readiness and needs', 'Methods, holistic opportunities and timing', 'Location, health and safety, and others involved', 'Authenticity, recording and quality assurance'],
      trap: 'Describing lesson planning. This is about planning an assessment.',
      own: 'Use an assessment plan you have written, or are about to write, as your example.',
      start: ['The key factors I consider are…', 'When I planned the assessment of…'], src: ['gr21', 'doran', 'knowles'] },
    { id: '3.2', q: 'Evaluate the benefits of using a holistic approach to assessment.', t: 'planning',
      learn: [['What holistic means', 'One piece of real work is used to collect evidence for criteria across several units, instead of assessing each criterion on its own. Hager and Gonczi (1996) argue that competence is knowledge, skill and judgement working together, so it is best judged together.'],
        ['Benefits', 'More valid: competence is seen as it happens in the job. More efficient: fewer visits, less duplicated evidence and less disruption for the employer. Less over-assessment and stress. Knowledge and performance are linked through questioning. Units can be achieved sooner.'],
        ['Limits, and a judgement', 'Planning and mapping are harder, and criteria can be missed without a mapping grid. Records must cross-reference every criterion. It needs an experienced assessor. “Evaluate” means you weigh both sides and say where you land. For competence-based qualifications the benefits usually outweigh the limits, if the mapping is careful (Gravells, 2021).']],
      check: [['What makes an answer an evaluation, not a description?', ['Benefits, limitations and a reasoned conclusion', 'A longer list of benefits', 'More references'], 0, 'Evaluate needs both sides and your own judgement.'],
        ['Which tool stops criteria being missed in holistic assessment?', ['A seating plan', 'A mapping grid', 'A longer observation'], 1, 'Mapping shows which criteria each activity can cover, and which still need other evidence.']],
      cover: ['What a holistic approach is', 'Benefits: validity, efficiency and less over-assessment', 'Limitations: mapping, recording and assessor skill', 'A reasoned conclusion', 'A work example of one activity covering several units'],
      trap: 'Only listing benefits. Evaluate needs the limits and a conclusion.',
      own: 'One task your learners do that could cover criteria from more than one unit.',
      start: ['The main benefit of a holistic approach is…', 'On balance, I judge that…'], src: ['hager', 'wolf', 'gr21'] },
    { id: '3.3', q: 'Explain how to plan a holistic approach to assessment', t: 'planning',
      learn: [['Start from the work', 'Plan from the candidate’s real work, not from the list of criteria (Gravells, 2021; Read, 2016). First find out what tasks the candidate does, and when.'],
        ['The steps', 'Know the standards and what must be observed. Find out about the job. Choose a natural activity that covers many criteria. Map it against the units. Agree a SMART plan with the candidate and the employer. Prepare: risk assessment, questions for the gaps, and a briefing for any witness.'],
        ['After the activity', 'Assess, and cross-reference each piece of evidence to every criterion it meets. Give feedback. Update the tracking record, plan for what is not yet met, and include the decision in IQA sampling.']],
      check: [['Where does holistic planning start?', ['From criterion 1.1, in order', 'From the IQA sampling plan', 'From the candidate’s real work activities'], 2, 'The plan follows the work. The standards are then used to judge it.'],
        ['Knowledge criteria not seen during the activity are usually covered by…', ['Leaving them out', 'Questioning or a professional discussion', 'A second identical observation'], 1, 'Questioning fills the knowledge gaps without repeating the task.']],
      cover: ['Identify a suitable real work activity', 'Map and cross-reference criteria across units', 'Agree the plan with the candidate and the employer', 'Record against all the criteria, then review'],
      trap: 'Repeating your answer to 3.2. This one asks how to plan it, so give the steps.',
      own: 'Walk through how you would plan one holistic assessment for a learner you know.',
      start: ['First, I would find out…', 'I would then map the activity to…'], src: ['gr21', 'read', 'hager'] },
    { id: '3.4', q: 'Summarise the types of risks that may be involved in assessment in own area of responsibility.', t: 'planning',
      learn: [['What counts as a risk', 'A risk is anything that could cause harm, make a decision invalid or unfair, or damage the integrity of the qualification. Stobart (2008) shows that high-stakes assessment creates pressures that can distort decisions, so risks are not only physical.'],
        ['Risks to people', 'Health and safety: machinery, electricity, lifting, hazardous substances, unfamiliar sites and lone working. Safeguarding and welfare: learners under 18, one-to-one or online contact, stress and anxiety. Equality: arrangements that disadvantage some candidates.'],
        ['Risks to the decision', 'Validity and reliability: wrong methods, bias, inconsistent decisions, too little evidence or over-assessment. Malpractice: plagiarism, undeclared AI use, false witness testimony, or signing off without evidence. Conflicts of interest and pressure to pass. Information: lost evidence or a data breach. Organisational: wrong certification claims and sanctions.']],
      check: [['Which of these is a risk to the integrity of an assessment decision?', ['Pressure from an employer to pass a candidate', 'A noisy workshop', 'A long drive to the site'], 0, 'Pressure and conflicts of interest threaten the decision itself.'],
        ['Assessing a relative is an example of…', ['Holistic assessment', 'A reasonable adjustment', 'A conflict of interest'], 2, 'Declare it, so that another assessor can be arranged.']],
      cover: ['Health and safety', 'Safeguarding and welfare', 'Validity, reliability and bias', 'Malpractice and authenticity, including AI', 'Conflicts of interest, information and organisational risks'],
      trap: 'Covering only health and safety. Risks to the decision matter just as much.',
      own: 'The two or three risks that are most real where you assess.',
      start: ['The types of risk in my area include…', 'A risk to the decision itself is…'], src: ['stobart', 'hse', 'jcq'] },
    { id: '3.5', q: 'Explain how to minimise risks through the planning process.', t: 'planning',
      learn: [['Use the risk assessment steps', 'The Health and Safety Executive’s steps work for every kind of assessment risk: identify the hazards, assess the risks, control them, record, and review (Health and Safety Executive, 2014). Most risks are reduced by what you do when you plan.'],
        ['Planning actions for people', 'Safety: check the risk assessments, induction and PPE, confirm the candidate is trained and ready, and agree that you will stop if anything is unsafe. Safeguarding: use visible areas, follow lone-working rules, and know who the designated safeguarding lead is. Fairness: agree and record adjustments in advance.'],
        ['Planning actions for the decision', 'Validity: plan methods from the assessment strategy and map the criteria. Reliability: standardisation and planned IQA sampling. Authenticity: brief candidates on plagiarism and AI, use declarations, and plan questions on products. Conflicts: declare them early. Information: use the secure e-portfolio. Agree a contingency.']],
      check: [['You find you are due to assess a friend. The planning action is to…', ['Assess them anyway, but more strictly', 'Declare the conflict, so another assessor can be arranged', 'Ask the friend not to mention it'], 1, 'Conflicts are declared when candidates are allocated, before any assessment.'],
        ['Which planning action reduces the risk of product evidence that is not the candidate’s own?', ['Allowing more time', 'Planning questions about how the product was made', 'Using a bigger room'], 1, 'A candidate who made it can explain how.']],
      cover: ['A planning action for each type of risk in 3.4', 'Health and safety checks before an observation', 'Adjustments agreed in advance', 'Standardisation, IQA sampling and authenticity checks', 'Conflicts declared, and a contingency'],
      trap: 'Restating the risks from 3.4. Here every risk needs a planning action.',
      own: 'For the risks you named in 3.4, what do you put in the plan?',
      start: ['To minimise this risk, I plan…', 'Before an observation I check…'], src: ['hse', 'gr21', 'ofqual'] },
    { id: '4.1', q: 'Explain the importance of involving the learner and others in the assessment process.', t: 'involve',
      learn: [['Assessment is done with people', 'Adults expect a say in decisions that affect them (Knowles, Holton and Swanson, 2015), and motivation grows with autonomy and competence (Ryan and Deci, 2000). A candidate who helped to plan knows what is expected.'],
        ['Why involve the candidate', 'Ownership and readiness. Better evidence: they know their job, where evidence occurs naturally and what prior learning they have. Fairness: they can tell you about needs and commitments. Transparency: fewer disputes and appeals.'],
        ['Why involve others', 'Employers give access to work, agree timing, confirm readiness and act as witnesses. Trainers confirm readiness and pick up the gaps. Witnesses cover work you cannot see. IQAs and external quality assurers (EQAs) sample and standardise. Support staff help with adjustments. Other assessors help to avoid over-assessment.']],
      check: [['Why does involving the candidate in planning reduce appeals?', ['They can choose their own result', 'The assessor has less to record', 'They understand the standard and how the decision is made'], 2, 'Transparency makes decisions more likely to be accepted.'],
        ['Which “other” can give evidence of work the assessor cannot see?', ['A workplace witness, such as a supervisor', 'The external quality assurer', 'Another candidate’s parent'], 0, 'Witness testimony covers work outside the assessor’s visits.']],
      cover: ['Why the learner’s involvement matters: ownership, valid evidence and fairness', 'Named others, and what each one contributes', 'The effect on the process: planned, transparent, accepted decisions'],
      trap: 'Naming others without saying why each one matters to assessment.',
      own: 'Who, besides the learner, is involved when you assess, and what do they add?',
      start: ['Involving the learner matters because…', 'The employer contributes by…'], src: ['knowles', 'ryan', 'gr21'] },
    { id: '4.2', q: 'Summarise types of information that should be made available to learners and others involved in the assessment process.', t: 'involve',
      learn: [['Transparency', 'Fair assessment needs everyone to know what will be assessed, how, when and by whom, and what happens to the decision and the records (Gravells, 2021).'],
        ['For candidates', 'The units and criteria in plain language. The assessment plan. What competent and not yet competent mean, and how feedback is given. The rules on authenticity, plagiarism and AI. Their rights: reasonable adjustments, special consideration, appeals and complaints. Safety and safeguarding arrangements, and how their data is used.'],
        ['For others', 'Employers: the plan, dates, progress and what is needed from them. Witnesses: the criteria and what a valid statement must contain. Trainers: the gaps found. IQAs and EQAs: plans, records, decisions and tracking. The awarding organisation: registrations, claims and adjustment requests. Share only with those entitled to it.']],
      check: [['Which must every candidate be told about?', ['How to appeal against a decision', 'Other candidates’ results', 'The assessor’s salary'], 0, 'Appeals and reasonable adjustments are rights that candidates must know about.'],
        ['What does a witness need before writing a statement?', ['The candidate’s medical history', 'The relevant criteria, and what a valid statement contains', 'Nothing'], 1, 'A briefed witness writes evidence that is specific to the criteria.']],
      cover: ['Information for learners: standards, plan, process, rules and rights', 'Appeals and reasonable adjustments', 'Information for employers, witnesses, IQA and EQA, and the awarding organisation', 'Shared only with those entitled to it, and kept secure'],
      trap: 'Covering only the learner. The question says learners and others.',
      own: 'What do you give your learners at the start, and what does the employer or the IQA get?',
      start: ['Learners need to know…', 'Others involved need…'], src: ['gr21', 'ofqual', 'dpa'] },
    { id: '4.3', q: 'Explain how peer and self-assessment can be used effectively to promote learner involvement and personal responsibility in the assessment of learning.', t: 'involve',
      learn: [['What they are', 'Self-assessment: the candidate judges their own competence and evidence against the standards. Peer assessment: colleagues or fellow candidates comment on each other’s work. Neither replaces the assessor’s decision. Boud (1995) argues that judging your own work against standards is what makes learning last.'],
        ['How they build involvement and responsibility', 'A skills scan at the start lets the candidate say what they can already prove. Saying “I am ready to be assessed” makes readiness their responsibility. Reflective accounts mapped to the criteria deepen understanding. Checking their own product against the drawing builds the habits the job needs. Peer review mirrors the second check that happens at work.'],
        ['Using them well', 'Give the standards in plain language, with examples. Use checklists and templates. Discuss the self-assessment, and confirm or challenge it. Keep the boundary clear: both are formative, and only the assessor decides. Torrance (2007) warns against ticking criteria without understanding them.']],
      check: [['Peer and self-assessment are…', ['Summative: they replace the assessor', 'Formative: they inform, but the assessor decides', 'Only for written work'], 1, 'They build involvement. The decision stays with the assessor.'],
        ['A candidate measures their component against the drawing tolerances before handing it in. This is…', ['Self-assessment', 'Witness testimony', 'Standardisation'], 0, 'Checking your own work against the specification is self-assessment, and good working practice.']],
      cover: ['What self-assessment and peer assessment mean', 'How they increase involvement and responsibility: gap analysis, readiness, reflective accounts', 'How to use them effectively: clear criteria, tools and discussion', 'The assessor still makes the final decision'],
      trap: 'Treating peer comments as assessment decisions, or as witness testimony.',
      own: 'A time a learner judged their own work before you assessed it. What changed?',
      start: ['Self-assessment promotes responsibility because…', 'To use it effectively, I…'], src: ['boud', 'torrance'] },
    { id: '4.4', q: 'Explain how assessment arrangements can be adapted to meet the needs of individual learners.', t: 'involve',
      learn: [['The rule', 'You can change how the assessment is carried out, but not the standard being assessed. The Equality Act 2010 (section 20) requires reasonable adjustments for disabled candidates, and awarding organisations must have arrangements for adjustments and for special consideration.'],
        ['Ways of adapting', 'Timing: extra time, breaks, several visits, shift patterns or religious observance. Method: oral instead of written, where the assessment strategy allows. Presentation: plain language, enlarged print or coloured paper. Support: a reader, scribe or interpreter. Environment: a quiet room or an adapted workstation.'],
        ['Doing it properly', 'Plan early with the candidate, from evidence of need. Some adjustments need the awarding organisation’s approval first. Record them on the plan so the IQA can see them. A reasonable adjustment is agreed before the assessment. Special consideration is applied after an assessment that was affected by illness or other circumstances.']],
      check: [['A candidate with dyslexia answers the knowledge questions orally. Safe isolation must still be…', ['Excused', 'Described in writing instead', 'Demonstrated to the same standard'], 2, 'The method can change. The competence cannot.'],
        ['Special consideration is applied…', ['After an assessment affected by temporary illness or other circumstances', 'Before the assessment, for a known need', 'Whenever a candidate asks'], 0, 'Reasonable adjustments are planned in advance. Special consideration comes after the event.']],
      cover: ['A range of adaptations: timing, method, presentation, support and environment', 'The standard and the competence do not change', 'Reasonable adjustment compared with special consideration', 'Agreed early, approved where needed, and recorded'],
      trap: 'Suggesting an adjustment that lowers the standard.',
      own: 'An adjustment you made, or would make, for a learner you assess.',
      start: ['Arrangements can be adapted by…', 'The standard stays the same because…'], src: ['eqa', 'ofqual', 'gr21'] },
    { id: '5.1', q: 'Explain how to judge whether evidence is sufficient, authentic and current.', t: 'decisions',
      parts: ['Sufficient', 'Authentic', 'Current'],
      learn: [['Sufficient', 'Enough evidence to cover every criterion, the range and the knowledge, and to show the candidate can do it consistently, not once by chance. You judge it by checking against the standards and the tracking record. Wolf (1995) explains that competence is inferred from a sample, so the sample must be large and varied enough. More than enough is over-assessment.'],
        ['Authentic', 'The candidate’s own work. You judge it by observing directly, questioning them about products and written work, and checking witness statements, signed declarations and version histories. Warning signs are a sudden change in style, or work they cannot explain. Misuse of AI is malpractice (Joint Council for Qualifications, 2025). It is reported, not handled privately.'],
        ['Current', 'Shows competence now, against today’s standards. Check the date against any time limit in the assessment strategy, and that it reflects current law and industry standards. For recognition of prior learning, confirm by questioning or observation that the skill has been kept up (Gravells, 2021).']],
      check: [['How do you judge that a written answer is authentic?', ['Count the words', 'Question the candidate about it, and compare it with their usual work', 'Check the date on it'], 1, 'If it is theirs, they can explain it. The date tells you about currency, not authenticity.'],
        ['A certificate from eight years ago is offered as evidence. What do you do first?', ['Accept it: a certificate is proof', 'Reject it without discussion', 'Confirm through questioning or observation that the skill is still current'], 2, 'Older evidence can count through recognition of prior learning, once currency is confirmed.']],
      cover: ['For each of the three: how the assessor judges it, not only what it means', 'Sufficient: coverage, consistency, tracking and no over-assessment', 'Authentic: questioning, observation, declarations, AI and malpractice', 'Current: dates, current standards and checks for prior learning'],
      trap: 'Only defining the three words. The question asks how you judge each one.',
      own: 'One piece of evidence you judged recently: how did you know it was the learner’s own?',
      start: ['I judge evidence to be sufficient when…', 'To check authenticity, I…'], src: ['wolf', 'jcq', 'gr21'] },
    { id: '5.2', q: 'Explain how to ensure that assessment decisions are made against specified criteria, valid, reliable and fair.', t: 'decisions',
      parts: ['Made against specified criteria', 'Valid', 'Reliable', 'Fair'],
      learn: [['Made against specified criteria', 'Judge only against the published criteria, not against other candidates or your own idea of good work (Glaser, 1963). Work from the current standards, reference each piece of evidence to the criteria, and record your reason. Criteria can be read in different ways, so exemplars and standardisation matter (Sadler, 1987).'],
        ['Valid', 'The method and the evidence actually assess the criterion (Messick, 1989). Observe performance, question knowledge, follow the assessment strategy, and remove barriers that are not part of the competence.'],
        ['Reliable', 'The same decision, whoever assesses and whenever. Use guidance and exemplars, take part in standardisation, act on IQA feedback and keep clear records. Harlen (2005) found that practitioners’ judgements are dependable when the criteria are clear and they take part in moderation.'],
        ['Fair', 'Nobody is advantaged or disadvantaged by anything unrelated to the competence. Give the same information and chances, make reasonable adjustments, avoid bias, declare conflicts, give reasons, and explain how to appeal. Gipps and Murphy (1994) show that fairness is an equal chance to show achievement, not identical treatment.']],
      check: [['Which activity most directly improves reliability?', ['Longer feedback', 'Assessing faster', 'Standardisation meetings'], 2, 'Comparing decisions on the same evidence brings assessors to the same standard.'],
        ['The halo effect, where a good impression colours the decision, is a threat to…', ['Fairness', 'Currency', 'Sufficiency'], 0, 'Bias makes decisions unfair. Judge only the evidence against the criteria.']],
      cover: ['For each of the four: what the assessor does to ensure it', 'Criteria: current standards, evidence referenced and reasons recorded', 'Validity: the right method for the criterion', 'Reliability: standardisation, IQA and exemplars', 'Fairness: adjustments, no bias, and appeals'],
      trap: 'Defining the four words without saying how you make sure of each.',
      own: 'What you do, or will do, to keep your decisions consistent with other assessors.',
      start: ['To make sure my decision is valid, I…', 'Reliability is ensured by…'], src: ['glaser', 'sadler', 'messick', 'harlen', 'gipps'] },
    { id: '6.1', q: 'Evaluate the importance of quality assurance in the assessment process.', t: 'qa',
      learn: [['What quality assurance is', 'Quality assurance checks that assessors’ decisions are accurate, consistent and meet the awarding organisation’s requirements. Internal quality assurance (IQA) is done by the centre. External quality assurance (EQA) is done by the awarding organisation (Gravells, 2016).'],
        ['Why it matters', 'Accurate decisions: sampling catches errors before certificates are claimed. Consistency between assessors. Protection for candidates, including a route for appeals. Credibility with employers. Development for assessors, and countersigning for those not yet qualified. The centre keeps its approval.'],
        ['The other side, and a judgement', 'Quality assurance costs time and paperwork, and it can slide into box-ticking. O’Neill (2002) warns that heavy audit can undermine professional trust. It works best when it is risk-based and developmental. “Evaluate” means you finish with a judgement, for example that it is essential because decisions could not be relied on without it.']],
      check: [['Who carries out external quality assurance?', ['The centre’s own IQA', 'The awarding organisation', 'The employer'], 1, 'IQA is internal to the centre. EQA comes from the awarding organisation.'],
        ['Risk-based sampling means…', ['Sampling nothing unless there is a complaint', 'Sampling every decision equally', 'Sampling more where the risk is higher, such as new assessors'], 2, 'New assessors, new qualifications and new sites get more attention.']],
      cover: ['What quality assurance is, with IQA and EQA told apart', 'Why it matters: accuracy, consistency, candidates, credibility and assessor development', 'Its costs or limitations', 'A reasoned conclusion'],
      trap: 'Describing quality assurance without weighing it up. The verb is Evaluate.',
      own: 'What has IQA feedback or sampling changed in the way you assess?',
