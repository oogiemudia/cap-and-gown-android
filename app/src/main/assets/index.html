    : `<h3 style="font-size:17px">${done ? 'Today’s coach steps are done' : 'Nothing from the coach today'}</h3><div class="row"><button class="btn sm ghost" data-act="co-go" data-path="" data-id="">Open the coach</button></div>`}</div>`;
  }
  function coachHow() {
    sheet(`<h3>How the coach works</h3>
      <ol class="steps"><li><b>It plans.</b> It counts what is left and the days to your date, and sets a small step for each day. Miss a day and it spreads the rest again. Low energy on Home means one light step.</li>
        <li><b>It teaches first.</b> Each workbook question has a short lesson to read or listen to, then two quick checks.</li>
        <li><b>It helps you plan.</b> What the question word asks for, what a good answer covers, the common slip, and sources.</li>
        <li><b>You write.</b> Your own words and your own example, typed or spoken. The coach never writes it for you.</li>
        <li><b>Claude joins in when you ask.</b> Coach me live opens your own Claude with the question, the checklist and where you are, and it teaches you one step at a time. Check my answer gets feedback against the checklist, without rewriting.</li></ol>
      <div class="small muted">The plan and the lessons work without a connection. The live coaching needs one, and you tap Send in Claude yourself: the app cannot run Claude on its own.</div>
      <button class="btn block" data-act="close-sheet">Got it</button>`);
  }
  document.addEventListener('change', (e) => {
    const k = e.target && e.target.dataset ? e.target.dataset.coEnd : '';
    if (k !== 'aw' && k !== 'ksb') return;
    const v = e.target.value;
    if (/^\d{4}-\d{2}-\d{2}$/.test(v) && v >= todayKey()) state.coach.end[k] = v; else delete state.coach.end[k];
    commit();
    render();
  });

  /* ---------- Ask tutor: your own Claude account, inside the app ----------
     On Android a second web view with claude.ai sits under the tutor's top bar.
     Suggestions and "Ask tutor" buttons put your week and the question into the message box. */
  const CHAT = { type: '', url: '' };
  let tutorOpen = false;
  const chatReady = () => !!(APP && typeof APP.chatShow === 'function');
  const isClaudeUrl = (u) => /^https:\/\/([a-z0-9-]+\.)*claude\.ai(\/|$)/i.test(String(u || ''));
  function chatUrl(where) {
    const s = state.settings;
    if (where === 'new') return 'https://claude.ai/new';
    if (where === 'recents') return 'https://claude.ai/recents';
    if (where === 'project') return isClaudeUrl(s.claudeProject) ? s.claudeProject : 'https://claude.ai/projects';
    return s.chatStart === 'new' ? 'https://claude.ai/new' : chatUrl('project');
  }
  function chatSubText() {
    if (!chatReady()) return 'Opens Claude in your browser';
    if (/\/login|magic-link|\/verify/i.test(CHAT.url)) return 'Sign in: tap Continue with email';
    if (CHAT.type === 'start') return 'Loading…';
    return /\/project\//.test(CHAT.url) ? 'PGCE project' : 'Your account';
  }
  function positionChat() {
    if (!chatReady()) return;
    try {
      if (!tutorOpen || sheetOpen) { APP.chatHide(); return; }
      const top = $('#tutor-sugg').getBoundingClientRect().bottom;
      APP.chatShow(Math.round(top), 0, Math.round(window.innerWidth), chatUrl());
    } catch (e) { /* shown next time */ }
  }
  const SUGG = ['What should I study tonight?', 'Help me plan my next deadline', 'Quiz me on my weakest topic', 'What is missing from my portfolio?'];
  function openTutor(prompt) {
    const el = $('#tutor');
    el.innerHTML = `<div class="appbar"><button class="back" type="button" data-act="close-tutor" aria-label="Close">${ic('x', 16)}</button><h2>Tutor <span class="small muted" style="font-family:var(--f-body);font-weight:600">· Claude</span><span class="sub" id="chat-sub">${esc(chatSubText())}</span></h2><button class="iconbtn" type="button" data-act="chat-menu" aria-label="Chat options">${ic('dots', 18)}</button></div>
      <div class="chips" id="tutor-sugg">${SUGG.map((s) => `<button class="chip" type="button" data-act="ask" data-q="${esc(s)}" data-week="1">${esc(s)}</button>`).join('')}</div>
      <div class="tutor-hole">${chatReady() ? '<div><p><b>Opening Claude…</b></p><p class="small">If this stays, check your connection, then tap the three dots and Reload.</p></div>' : `<div class="card" style="text-align:left"><h3>Your Claude tutor</h3><p class="small">In the Android app, this opens your own Claude account here, with your week ready to paste. In a browser, open Claude in a new tab and paste your question.</p><div class="btnrow"><a class="btn" href="${esc(chatUrl())}" target="_blank" rel="noopener">Open Claude</a><button class="btn ghost" type="button" data-act="copy-week">Copy my week</button></div></div>`}</div>`;
    el.hidden = false;
    tutorOpen = true;
    if (chatReady() && !state.settings.chatTipSeen) { signInHelp(true); return; }
    positionChat();
    if (prompt) setTimeout(() => sendToTutor(prompt), 250);
  }
  function closeTutor() {
    tutorOpen = false;
    $('#tutor').hidden = true;
    positionChat();
  }
  function sendToTutor(text) {
    if (chatReady()) { try { APP.chatInsert(text); return; } catch (e) { /* copy instead */ } }
    copyText(text, 'Copied. Paste it into Claude and send.');
  }
  // From a suggestion chip: the week first, then the question. From anywhere else: the question as written.
  function ask(q, withWeek) {
    const text = withWeek ? weekText().replace(/My question: $/, 'My question: ' + q) : q;
    if (!tutorOpen) openTutor(text); else sendToTutor(text);
  }
  function signInHelp(first) {
    sheet(`<h3>Signing in to Claude here</h3>
      <ol class="steps"><li>Tap <b>Continue with email</b> and type the email you use for Claude. Google sign-in does not work inside apps, but your Gmail address works here.</li>
        <li>Open the email called <b>Secure link to log in to Claude.ai</b>.</li>
        <li><b>Either</b> hold the link, tap Copy link address, come back and tap <b>Paste sign-in link</b>. <b>Or</b> tap the link: your browser shows a six-digit code. Come back and type it.</li></ol>
      <div class="small muted">You stay signed in after that. Your chats and the PGCE project are the same ones as on the Claude app and website.</div>
      <button class="btn block" data-act="chat-paste">${ic('link', 16)} Paste sign-in link</button>
      <button class="btn ghost block" data-act="${first ? 'chat-tip-done' : 'close-sheet'}">Got it</button>`);
  }
  function chatMenu() {
    sheet(`<h3>Claude</h3><div class="menu">
      <button data-act="chat-go" data-id="new">${ic('plus')} New chat</button>
      <button data-act="chat-go" data-id="project">${ic('folder')} PGCE project</button>
      <button data-act="chat-go" data-id="recents">${ic('chats')} Your chats</button>
      <button data-act="chat-week">${ic('list')} Put my week in the message box</button>
      <button data-act="chat-paste">${ic('link')} Paste sign-in link</button>
      <button data-act="chat-help">${ic('help')} How to sign in</button>
      <button data-act="chat-reload">${ic('reload')} Reload</button>
      <button data-act="chat-browser">${ic('out')} Open in your browser</button></div>
      <button class="btn ghost block" data-act="close-sheet">Close</button>`);
  }

  /* ---------- actions ---------- */
  function tick(id, on) {
    if (on) state.done[id] = Date.now(); else delete state.done[id];
    commit();
    render();
    if (on) {
      const d = deadlines().find((x) => x.chunks.some((c) => c.id === id));
      if (d && d.complete) celebrate(d); else toast(`<b>Done.</b> Evening streak: ${streak()}.`);
    }
  }
  function moveChunk(id, why) {
    const c = allChunks(deadlines()).find((x) => x.id === id);
    if (!c) return;
    const today = todayKey();
    const from = c.dateEff < today ? today : addDays(c.dateEff, 1);
    const slot = findSlot(c, from, loadMap(id));
    const to = slot ? slot.day : nextFreeEvening(from, c.mins || 30, id);
    const undo = { [id]: state.moved[id] || null };
    state.moved[id] = to;
    if (why === 'miss') {
      addLog({ kind: 'miss', what: `Re-planned: ${c.title}`, why: `You said you would miss it tonight. It moved to ${fmtLong(to)}, the next evening with room before ${c.deadline.due ? 'the deadline (' + fmtShort(c.deadline.due) + ')' : 'its deadline'}.`, lines: [], undo: { moved: undo } });
    }
    commit();
    closeSheet(true);
    render();
    const note = c.deadline.due && to > c.deadline.due ? ' That is after the deadline, so check it still works.' : (slot && !slot.fits ? ' That evening is over your limit, because the deadline is close.' : '');
    toast(`<b>${why === 'miss' ? 'Re-planned.' : 'Moved.'}</b> ${esc(c.title)} is now on ${esc(fmtShort(to))}.${note}`);
  }
  function pullToTonight(id) {
    const c = allChunks(deadlines()).find((x) => x.id === id);
    if (!c) return;
    const undo = { [id]: state.moved[id] || null };
    state.moved[id] = todayKey();
    addLog({ kind: 'pull', what: `Brought forward: ${c.title}`, why: `You chose to do it tonight instead of ${fmtLong(c.dateEff)}.`, lines: [], undo: { moved: undo } });
    commit();
    render();
    toast('On tonight. Tick it off when it is done.');
  }
  let timerT = null;
  function runTimer() {
    clearInterval(timerT);
    if (!timer || !timer.running) return;
    timerT = setInterval(() => {
      if (!timer || !timer.running) { clearInterval(timerT); return; }
      timer.left = Math.max(0, timer.left - 1);
      const el = $('#timer');
      if (el) el.textContent = `${pad(Math.floor(timer.left / 60))}:${pad(timer.left % 60)}`;
      if (timer.left === 0) { timer.running = false; clearInterval(timerT); toast('<b>Time is up.</b> Tick it off if it is done.'); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ } if (route === 'learn') render(); }
    }, 1000);
  }

  document.addEventListener('click', (e) => {
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) { go(tabBtn.dataset.tab); return; }
    const goEl = e.target.closest('[data-go]');
    if (goEl && !e.target.closest('[data-act]')) { go(goEl.dataset.go); return; }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const a = el.dataset.act;
    const id = el.dataset.id;
    const s = state.settings;
    const p = state.portfolio;
    switch (a) {
      case 'back': back(); break;
      case 'close-sheet': closeSheet(); break;
      case 'close-tutor': closeTutor(); break;
      case 'ask': closeSheet(true); ask(el.dataset.q || '', !!el.dataset.week); break;
      // the coach
      case 'co-path': if (COACH_PATHS.some(([k]) => k === id)) { sub.cpath = id; state.coach.path = id; sub.cq = null; commit(); render(); } break;
      case 'co-how': coachHow(); break;
      case 'co-live': {
        const kind = el.dataset.k;
        let brief = '';
        if (kind === 'aw' && AW_BY[id]) brief = awTeachPrompt(AW_BY[id]);
        else if (kind === 'ksb' && KSBS[id]) brief = ksbTeachPrompt(id);
        else if (kind === 'cp') { const st = cpSteps(); const c = st.find((x) => x.id === id) || st[0]; if (c) brief = cpCoachPrompt(c); }
        else if (kind === 'week') brief = coachWeekPrompt();
        if (brief) { closeSheet(true); ask(brief); }
        break;
      }
      case 'co-go': {
        const path = el.dataset.path;
        if (COACH_PATHS.some(([k]) => k === path)) { sub.cpath = path; if (state.coach.path !== path) { state.coach.path = path; commit(); } }
        sub.cq = path === 'aw' && AW_BY[id] ? id : null; sub.cs = null; sub.cn = 1;
        if (path === 'ksb' && KSBS[id]) sub.ck = id;
        go('coach');
        break;
      }
      case 'co-open': if (AW_BY[id]) { closeSheet(true); sub.cq = id; sub.cs = null; sub.cn = 1; render(); $('#screen').scrollTop = 0; } break;
      case 'co-step': if (CO_STEPS.some(([k]) => k === id)) { sub.cs = id; render(); $('#screen').scrollTop = 0; } break;
      case 'co-more': sub.cn = (Number(sub.cn) || 1) + 1; render(); break;
      case 'co-listen': { const q = AW_BY[id]; if (q) listen(`Workbook question ${q.id}`, awLessonText(q)); break; }
      case 'co-read': { const q = AW_BY[id]; if (q) { const u = awSet(id); if (!u.r) { u.r = todayKey(); commit(); } sub.cs = 'check'; render(); $('#screen').scrollTop = 0; } break; }
      case 'co-ans': { const q = AW_BY[id]; const i = Number(el.dataset.i); if (q && q.check[i]) { const u = awSet(id); if (u.q[i] == null) { u.q[i] = Number(el.dataset.o) || 0; if (!u.r) u.r = todayKey(); commit(); } render(); } break; }
      case 'co-retry': if (AW_BY[id]) { awSet(id).q = {}; commit(); render(); } break;
      case 'co-conf': {
        const q = AW_BY[id];
        if (!q) break;
        const u = awSet(id);
        u.f = clamp(Number(el.dataset.n) || 0, 1, 3);
        const first = !u.k;
        if (first) { u.k = todayKey(); coachDid(10); }
        commit(); render();
        if (first) toast(`<b>${esc(id)} learned.</b> ${u.f === 1 ? 'A second pass will help it settle.' : 'Next: plan it and write it.'}`);
        break;
      }
      case 'co-tick': { const q = AW_BY[id]; const i = Number(el.dataset.i); if (q && q.cover[i]) { const u = awSet(id); if (u.t[i]) delete u.t[i]; else u.t[i] = 1; commit(); render(); } break; }
      case 'co-heads': { const q = AW_BY[id]; if (q && q.parts) { const u = awSet(id); if (!wordCount(u.a)) { u.a = q.parts.map((x) => `${x}:\n`).join('\n'); commit(); render(); } } break; }
      case 'co-import': {
        const pp = AW_PAPER[id];
        if (!pp || !AW_BY[id]) break;
        const old = state.papers[pp[0]] && state.papers[pp[0]].answers ? String(state.papers[pp[0]].answers[pp[1]] || '') : '';
        const u = awSet(id);
        if (old.trim() && !wordCount(u.a)) { u.a = old.slice(0, 20000); commit(); render(); toast('Brought in from Practice papers.'); }
        break;
      }
      case 'co-check': { const q = AW_BY[id]; if (q) { if (!wordCount(awU(id).a)) toast('Write your answer first, then Claude can check it.'); else ask(awCheckPrompt(q)); } break; }
      case 'co-copy': { const q = AW_BY[id]; if (q) { if (!wordCount(awU(id).a)) toast('There is no answer here yet.'); else copyText(`${q.id} ${q.q}\n\n${String(awU(id).a).trim()}`, 'Copied. Paste it into your workbook.'); } break; }
      case 'co-written': {
        if (!AW_BY[id]) break;
        const u = awSet(id);
        if (!wordCount(u.a)) { toast('Write your answer first.'); break; }
        if (!u.w) { u.w = todayKey(); coachDid(20); }
        commit(); render();
        toast(`<b>${esc(id)} written.</b> Copy it into your workbook when you are ready.`);
        break;
      }
      case 'co-unwrite': if (AW_BY[id]) { delete awSet(id).w; commit(); render(); } break;
      case 'co-handed': if (AW_BY[id]) { awSet(id).h = !awE(AW_BY[id]).h; commit(); render(); } break;
      case 'co-handed-lo': { const qs = AW.filter((x) => String(x.lo) === id); if (qs.length) { const HL = awHandedLo(); const on = !qs.every((x) => awE(x, HL).h); qs.forEach((x) => { awSet(x.id).h = on; }); commit(); render(); } break; }
      case 'co-copy-all': { const t = awAllText(); if (!t) toast('No answers written yet.'); else copyText(t, 'All your answers are copied.'); break; }
      case 'co-save-all': { const t = awAllText(); if (!t) toast('No answers written yet.'); else saveFile(`assessor-workbook-my-answers-${todayKey()}.txt`, t, 'text/plain'); break; }
      case 'co-tag': {
        const ev = p.evidence.find((x) => x.id === id);
        const k = el.dataset.k;
        if (!ev || !KSBS[k]) break;
        ev.ksbs = Array.isArray(ev.ksbs) ? ev.ksbs : [];
        if (!ev.ksbs.includes(k)) { ev.ksbs.push(k); ev.ksbs.sort((x, y) => KSB_IDS.indexOf(x) - KSB_IDS.indexOf(y)); }
        sub.ck = k;
        commit(); render();
        toast(`<b>Tagged ${esc(k)}.</b> Now write your two lines.`);
        break;
      }
      case 'co-ksb-done': {
        if (!KSBS[id]) break;
        const u = ksbSet(id);
        if (u.d !== todayKey()) { u.d = todayKey(); coachDid(10); }
        sub.ck = null;
        commit(); render();
        toast(`<b>${esc(id)} done for today.</b>${ksbCovered().has(id) ? '' : ' It stays on the list until its evidence is tagged or in PebblePad.'}`);
        break;
      }
      case 'co-ksb-next': { const g = ksbGaps(); if (g.length) { sub.ck = g[(g.indexOf(id) + 1) % g.length]; render(); } break; }
      case 'co-ksb-pick': if (KSBS[id]) { sub.ck = id; render(); $('#screen').scrollTop = 0; } break;
      case 'co-cp-done': if (!cpDoneToday()) { state.coach.cp[todayKey()] = 1; coachDid(5); commit(); render(); toast('<b>Five minutes done.</b> That is how the workload shrinks.'); } break;
      case 'co-note-copy': if (!String(state.coach.cpNote || '').trim()) toast('Your notes are empty.'); else copyText(state.coach.cpNote, 'Notes copied.'); break;
      case 'co-note-ask': if (!String(state.coach.cpNote || '').trim()) toast('Write or speak a few notes first.'); else ask(cpNotesPrompt()); break;
      case 'copy': copyText(el.dataset.q || '', 'Copied.'); break;
      case 'copy-week': copyText(weekText(), 'Your week is copied. Paste it into Claude and add your question.'); break;
      // Home and the planner
      case 'tick': { const c = allChunks(deadlines()).find((x) => x.id === id); closeSheet(true); tick(id, !(c && c.done)); break; }
      case 'untick': closeSheet(true); tick(id, false); break;
      case 'step': stepSheet(id); break;
      case 'start-step': closeSheet(true); timer = null; sub.stepId = id; go('learn'); break;
      case 'step-done': timer = null; clearInterval(timerT); tick(id, true); back(); break;
      case 'move': moveChunk(id); break;
      case 'miss': moveChunk(id, 'miss'); break;
      case 'pull': pullToTonight(id); break;
      case 'why-next':
        sheet(`<h3>Why this step?</h3><div class="small">${esc((nextStep() || {}).why || '')}</div><div class="small muted">The app looks at everything planned for tonight and anything that slipped, then picks the step with the closest deadline. An open PebblePad review comes first, because it stays open until you finish it. ${state.energy[todayKey()] === 'low' ? 'Your energy is low, so the evening can stop after this one.' : 'If your energy is low, say so on Home: tonight keeps only the most urgent step.'}</div><button class="btn ghost block" data-act="close-sheet">Got it</button>`);
        break;
      case 'energy': {
        const r = setEnergy(id);
        render();
        toast(id === 'low' ? (r.moved ? `<b>Lighter evening.</b> ${plural(r.moved, 'step')} moved to later evenings.` : '<b>Lighter evening.</b> Nothing needed to move.') : id === 'high' ? (r.bonus ? `<b>Bonus added:</b> ${esc(r.bonus.title)} tonight.` : 'Nothing from later in the week fits tonight.') : 'Plan kept as it was.');
        break;
      }
      case 'tick-group': {
        const today = todayKey();
        allChunks(deadlines()).filter((c) => c.deadline.id === id && !c.done && c.dateEff < today).forEach((c) => { state.done[c.id] = Date.now(); });
        commit(); render(); toast('Ticked off.');
        break;
      }
      case 'move-all': {
        const today = todayKey();
        allChunks(deadlines()).filter((c) => !c.done && c.dateEff < today).forEach((c) => { state.moved[c.id] = nextFreeEvening(today, c.mins || 30, c.id); commit(); });
        render(); toast('Moved to free evenings.');
        break;
      }
      case 'replan': { const r = replan(); render(); toast(r.healed || r.moved ? `<b>Plan updated.</b> ${[r.healed ? plural(r.healed, 'missed step') + ' moved' : '', r.moved ? plural(r.moved, 'step') + ' evened out' : ''].filter(Boolean).join(', ')}.` : '<b>Plan checked.</b> Nothing needed to move.'); break; }

      case 'clear-prefill': prefill = null; addDraft = null; render(); break;
      case 'discard-add': addDraft = null; render(); break;
      case 'confirm-add': {
        if (!addDraft) break;
        const dl = { id: uid(), custom: true, course: addDraft.course, kind: addDraft.kind, title: addDraft.title, due: addDraft.due, dueTime: addDraft.time, status: 'confirmed', how: addDraft.how, note: addDraft.note, template: addDraft.template, chunks: addDraft.steps.map((st) => ({ id: uid(), date: st.date, mins: st.mins, title: st.title, tip: st.tip })) };
        state.custom.push(dl);
        if (addDraft.fromId) state.hidden[addDraft.fromId] = true;
        addDraft = null; prefill = null; commit();
        go('deadlines', { replace: true });
        toast(`<b>Added</b> with ${plural(dl.chunks.length, 'step')}.`);
        break;
      }
      // Settings
      case 'set-toggle': { s[id] = !(id === 'heal' || id === 'energyCheck' || id === 'readAloud' || id === 'dictate' ? s[id] !== false : !!s[id]); commit(); applyLook(); if (id === 'heal' && s.heal) heal(); if (id === 'readAloud' && !s.readAloud) listenCmd('stop'); if (id === 'dictate' && !s.dictate) dictStop(); render(); break; }
      case 'mode': s.mode = id; commit(); applyLook(); render(); break;
      case 'alarms': s.alarms = s.alarms === false; commit(); render(); toast(s.alarms ? 'Alarms are on.' : 'Alarms are off. Nothing will ring.'); break;
      case 'alarm-catchup': s.alarmCatchup = id === 'on'; commit(); render(); break;
      case 'alarm-test': if (APP) { try { APP.testAlarm(15); toast('<b>Test alarm in 15 seconds.</b> Lock your phone now.'); } catch (err) { toast('The test alarm could not be set.'); } } break;
      case 'alarm-fix': if (APP) { try { APP.fix(id); } catch (err) { /* ignore */ } } break;
      case 'ics': saveFile('study-plan.ics', buildIcs(), 'text/calendar'); break;
      case 'backup': saveFile(`cap-and-gown-backup-${todayKey()}.json`, JSON.stringify(state, null, 2), 'application/json'); break;
      case 'copy-backup': copyText(JSON.stringify(state), 'Backup copied. Paste it into a note to keep it.'); break;
      case 'ask-reset': confirmReset = true; render(); break;
      case 'cancel-reset': confirmReset = false; render(); break;
      case 'reset': { const keep = { ...state.settings }; state = freshState(); state.settings = keep; confirmReset = false; commit(); render(); toast('Progress cleared.'); break; }
      // Chat
      case 'chat-start': s.chatStart = id; commit(); render(); break;
      case 'chat-menu': chatMenu(); break;
      case 'chat-help': signInHelp(false); break;
      case 'chat-tip-done': s.chatTipSeen = true; commit(); closeSheet(); break;
      case 'chat-week': closeSheet(); sendToTutor(weekText()); break;
      case 'chat-go': closeSheet(); if (chatReady()) { try { APP.chatGo(chatUrl(id)); } catch (err) { /* ignore */ } } break;
      case 'chat-reload': closeSheet(); if (chatReady()) { try { APP.chatReload(); } catch (err) { /* ignore */ } } break;
      case 'chat-browser': closeSheet(); if (chatReady()) { try { APP.chatOpenBrowser(); } catch (err) { /* ignore */ } } break;
      case 'chat-paste': {
        if (!chatReady()) break;
        let r = '';
        try { r = APP.chatPasteLink(); } catch (err) { r = ''; }
        if (r === 'ok') { s.chatTipSeen = true; commit(); closeSheet(); if (!tutorOpen) openTutor(); toast('Opening your sign-in link…'); }
        else toast(r === 'nolink' ? 'What you copied is not a link. In the email, hold the sign-in link and tap Copy link address.' : 'Nothing copied yet. In the email, hold the sign-in link and tap Copy link address.');
        break;
      }
      case 'chat-signout': sheet(`<h3>Sign out of Claude in this app?</h3><div class="small muted">Only the tutor in this app signs out. Your Claude account, chats and projects are not touched.</div><button class="btn danger block" data-act="chat-signout-yes">Sign out</button><button class="btn ghost block" data-act="close-sheet">Cancel</button>`); break;
      case 'chat-signout-yes': closeSheet(); if (chatReady()) { try { APP.chatSignOut(); toast('Signed out of Claude in this app.'); } catch (err) { /* ignore */ } } break;
      default: break;
    }
  });

  document.addEventListener('input', (e) => {
    const el = e.target;
    const d = el.dataset || {};
    if (d.input === 'refl') { if (reflectDraft) reflectDraft.text = el.value; return; }
    if (d.input === 'vpad') { state.voicePad = el.value; clearTimeout(window.__padT); window.__padT = setTimeout(commit, 600); return; }
    if (d.input === 'paper') {
      const rec = (state.papers[d.id] = state.papers[d.id] || { answers: {} });
      rec.answers[d.i] = el.value;
      const wc = $(`#wc-${d.id}-${d.i}`); if (wc) wc.textContent = `${wordCount(el.value)} words`;
      clearTimeout(window.__paperT); window.__paperT = setTimeout(commit, 600);
      return;
    }
    if (d.input === 'co') {
      if (!AW_BY[d.id]) return;
      awSet(d.id)[d.k === 'n' ? 'n' : 'a'] = el.value;
      if (d.k === 'a') { const wc = $('#co-wc'); if (wc) wc.textContent = `${wordCount(el.value)} words`; }
      clearTimeout(window.__coT); window.__coT = setTimeout(commit, 600);
      return;
    }
    if (d.input === 'cok') { if (KSBS[d.id]) { ksbSet(d.id).n = el.value; clearTimeout(window.__coT); window.__coT = setTimeout(commit, 600); } return; }
    if (d.input === 'conote') { state.coach.cpNote = el.value; clearTimeout(window.__coT); window.__coT = setTimeout(commit, 600); return; }
    if (d.ev && evDraft) { evDraft[d.ev] = el.value; return; }
    if (d.obs) {
      const info = (state.portfolio.obsInfo[d.obs] = state.portfolio.obsInfo[d.obs] || {});
      info[d.k] = el.value;
      if (d.k === 'refl') { const w = wordCount(el.value); const wc = $('#o-wc'); if (wc) { wc.textContent = `${w} words · aim for 200 to 300`; wc.style.color = w >= 200 && w <= 300 ? 'var(--good)' : 'var(--muted)'; } }
      clearTimeout(window.__obsT); window.__obsT = setTimeout(commit, 600);
      return;
    }
    if (d.pl) {
      const info = (state.portfolio.placements[d.pl] = state.portfolio.placements[d.pl] || {});
      info[d.k] = el.value;
      clearTimeout(window.__plT); window.__plT = setTimeout(commit, 600);
      return;
    }
    if (d.pd !== undefined) {
      state.portfolio.dutyNotes[d.pd] = el.value;
      clearTimeout(window.__pdT); window.__pdT = setTimeout(commit, 600);
      return;
    }
    if (d.set === 'cap') { const v = $('#capv'); if (v) v.textContent = el.value + ' min'; }
  });

  document.addEventListener('change', (e) => {
    const el = e.target;
    const d = el.dataset || {};
    const s = state.settings;
    if (d.base) { state.portfolio.nums[d.base] = el.value === '' ? '' : clamp(Number(el.value) || 0, 0, 9999); commit(); return; }
    if (d.pl && el.tagName === 'SELECT') { commit(); return; }
    if (d.set === 'cap') { s.cap = clamp(Number(el.value) || 60, 20, 180); commit(); render(); return; }
    if (d.set === 'evening' && /^\d\d:\d\d$/.test(el.value)) { s.evening = el.value; commit(); render(); return; }
    if (d.set === 'reviewDay') { s.reviewDay = clamp(Number(el.value) || 5, 1, 7); commit(); render(); toast(`Weekly review moved to ${DAY_NAMES[s.reviewDay - 1]}.`); return; }
    if (d.set === 'alarmLead') { s.alarmLead = clamp(Number(el.value) || 0, 0, 60); commit(); render(); return; }
    if (d.set === 'pebblepad') { const v = el.value.trim(); if (v && !/^https?:\/\//.test(v)) { toast('That does not look like a link.'); return; } s.pebblepad = v; commit(); toast('PebblePad link saved.'); return; }
    if (d.set === 'claudeProject') {
      const v = el.value.trim();
      if (!v) { s.claudeProject = DEFAULT_SETTINGS.claudeProject; commit(); render(); return; }
      if (!isClaudeUrl(v)) { toast('That is not a claude.ai link. Copy the address from the project page on claude.ai.'); el.value = s.claudeProject || ''; return; }
      s.claudeProject = v; commit(); toast('Project link saved.');
      return;
    }
    if (d.input === 'restore' && el.files && el.files[0]) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (!parsed || typeof parsed !== 'object' || !parsed.settings) throw new Error('not a backup');
          state = normalise(parsed); commit(); applyLook(); render(); toast('Backup restored.');
        } catch (err) { toast('That file is not a Cap and Gown backup.'); }
      };
      reader.readAsText(el.files[0]);
      return;
    }
    if (el.id === 'f-template') document.querySelectorAll('[data-only]').forEach((n) => { n.hidden = n.dataset.only !== el.value; });
  });

  document.addEventListener('submit', (e) => {
    const form = e.target;
    if (!form.dataset || !form.dataset.form) return;
    e.preventDefault();
    if (form.dataset.form === 'due') {
      const id = form.dataset.id;
      const v = form.querySelector('input[type="date"]').value;
      if (!v) return;
      const base = (DATA.deadlines || []).find((d) => d.id === id);
      if (base && !base.due) { prefill = { fromId: id, title: base.title, course: base.course, template: base.template || 'custom', how: base.how, due: v }; editingDue = null; go('add'); return; }
      const custom = state.custom.find((d) => d.id === id);
      if (custom) custom.due = v; else state.due[id] = v;
      editingDue = null; commit(); render(); toast(`Date changed to ${esc(fmtLong(v))}.`);
      return;
    }
    if (form.dataset.form === 'add') {
      const o = Object.fromEntries(new FormData(form).entries());
      if (!o.due || !o.title) return;
      if (o.due < todayKey()) { toast('That date has already passed. Pick a date from today on.'); return; }
      const tpl = TEMPLATES[o.template] || TEMPLATES.custom;
      prefill = { ...(prefill || {}), ...o };
      addDraft = { fromId: prefill.fromId || null, course: o.course, template: o.template, kind: o.template === 'observation' || o.template === 'event' ? 'event' : 'submission', title: o.title.trim(), due: o.due, time: o.time || '09:00', how: (o.how || '').trim(), note: (o.note || '').trim(), steps: tpl.build(o) };
      render();
      setTimeout(() => { const x = $('#preview'); if (x) x.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30);
    }
  });
  // The library's topic filter, the Add sheet's smart filing, and edits to your own items.
  document.addEventListener('change', (e) => {
    const el = e.target;
    const d = el.dataset || {};
    if (d.sub === 'lt') { sub.lt = TOPICS[el.value] ? el.value : ''; render(); return; }
    if (d.libpick) { libGuess = false; return; }
    if (d.libedit) {
      const u = state.library.find((x) => x.id === d.id);
      if (!u) return;
      if (d.libedit === 't' && TOPICS[el.value]) { u.t = el.value; u.c = TOPICS[el.value].c; }
      if (d.libedit === 'kind' && KIND_VERB[el.value]) u.kind = el.value;
      commit(); render(); toast('Saved.');
    }
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if ((el.id === 'l-title' || el.id === 'l-link') && libGuess) {
      const text = (($('#l-title') || {}).value || '') + ' ' + (($('#l-link') || {}).value || '');
      const t = guessTopic(text);
      if (t && $('#l-topic')) $('#l-topic').value = t;
      if ($('#l-kind')) $('#l-kind').value = guessKind(text);
    }
  });
  document.addEventListener('pointerdown', () => { lastTouch = Date.now(); }, true);
  document.addEventListener('keydown', () => { lastTouch = Date.now(); }, true);
  $('#fab').addEventListener('click', () => openTutor());

  /* ---------- start ---------- */
  let lastDay = todayKey();
  applyLook();
  heal();
  render();
  Remote.connect();
  writeNudgeSnapshot();
  if (APP) {
    syncAlarms();
    if (!loadLocal()) saveLocal();
    window.__capgownGo = (v) => { if (ROUTE_NAMES.includes(routeOf(v))) go(v); };
    window.__capgownResume = () => { lastDay = todayKey(); heal(); syncAlarms(); render(); takeSavedLinks(); listenSync(); podSync(); setTimeout(liveWaiting, 1500); };
    window.__capgownListen = (st) => listenState(st);
    window.__capgownPod = (st) => podState(st);
    window.__capgownPodFeed = (req, d) => { const f = PODF.cb[String(req)]; if (f) f(d); };
    podSync();
    window.__capgownDictate = (kind, text) => dictEvent(String(kind || ''), String(text || ''));
    listenSync();
    window.__capgownBack = () => {
      if (DICT.on) dictStop();
      if (sheetOpen) { closeSheet(); return true; }
      if (tutorOpen) { closeTutor(); return true; }
      if (stack.length || (route === 'coach' && sub.cq)) { back(); return true; }
      if (route !== 'home') { go('home'); return true; }
      return false;
    };
    window.__capgownChatEvent = (type, url) => { CHAT.type = type || ''; CHAT.url = url || ''; const x = $('#chat-sub'); if (x) x.textContent = chatSubText(); };
    window.__capgownChatInserted = (ok) => toast(ok ? 'Your question is in the message box. Check it, then tap send.' : 'Copied. Tap the message box, hold, then Paste.');
    window.__capgownUpdateReady = (n) => updateReady(n);
    window.__capgownUpdateResult = (st, n) => {
      liveMsg = st === 'ready' ? `Version ${Number(n)} is ready.` : st === 'none' ? 'You have the latest version.' : st === 'busy' ? 'Already checking.' : 'Could not check. Are you online?';
      if (route === 'settings') render();
      if (st === 'ready') { setApplied(0); toast(`<b>Version ${Number(n)} is ready.</b> <button class="linkish" data-act="live-apply">Show it now</button>`, 9000); } else toast(esc(liveMsg));
    };
    // Tell the app this page works, so it keeps it. If a downloaded page fails its own check, go back to the built-in one.
    try {
      const st = liveStatus();
      if (selfTest()) { if (typeof APP.pageReady === 'function') APP.pageReady(PAGE); }
      else if (st && PAGE > (Number(st.bundled) || 0) && typeof APP.revertUpdate === 'function') APP.revertUpdate();
    } catch (e) { /* an older app without live updates */ }
    takeSavedLinks();
    setTimeout(liveWaiting, 4000);
  }
  // The keyboard: hide the tabs and Ask tutor while typing, and keep the chat lined up.
  let fullH = window.innerHeight;
  let fullW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (window.innerWidth !== fullW) { fullW = window.innerWidth; fullH = window.innerHeight; }
    if (window.innerHeight > fullH) fullH = window.innerHeight;
    document.body.classList.toggle('kb', window.innerHeight < fullH - 150);
    positionChat();
  });
  function newDay() { lastDay = todayKey(); heal(); render(); }
  setInterval(() => { if (todayKey() !== lastDay) newDay(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && todayKey() !== lastDay) newDay(); });

  // Exposed for testing only
  window.__planner = { deadlines, alarmPlan, heal, replan, setEnergy, saveReflection, nextStep, patterns, streak, weekText, lastDayFor, capFor, portfolioParts, portfolioPct, portfolioReadiness, ksbCovered, dueCards, weakTopics, buildIcs, go, recommend, catalogue, guessTopic, guessKind, topicHeat, selfTest, takeSavedLinks, listen, listenCmd, listenState, podOf, findEp, epFor, podFeed, podState, podCmd, podQuick, POD, PODQ, PODF, SHOWS, dictEvent, dictToggle, splitParts, spokenText, spokenPlain, lessonText, LS, DICT, LESSONS, ONLINE, HUBS, TOPICS, PAGE, AW, AW_BY, REFS, VERBS, CP_DAILY, KSBS, awToday, awSittings, awOrder, awEnd, awHandedLo, ksbToday, ksbGaps, coachToday, coachStreak, awTeachPrompt, awCheckPrompt, coachWeekPrompt, ksbTeachPrompt, cpCoachPrompt, awAllText, get sub() { return sub; }, get route() { return route; }, get state() { return state; } };
})();

</script>
