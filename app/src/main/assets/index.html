        <div class="field"><label for="f-how">How it is handed in (optional)</label><input type="text" id="f-how" name="how" value="${esc(p.how || '')}" placeholder="Turnitin, PebblePad, email to Andrea"></div>
        <div class="field"><label for="f-note">Notes (optional)</label><textarea id="f-note" name="note">${esc(p.note || '')}</textarea></div>
        <div class="btn-row"><button class="btn primary" type="submit">Plan the steps</button>${prefill ? '<button class="btn" type="button" data-action="clear-prefill">Start again</button>' : ''}</div>
      </form>`;
    if (addDraft) {
      const heavy = addDraft.steps.filter((s) => (loadMap()[s.date] || 0) + s.mins > (Number(state.settings.cap) || 60));
      html += `<div class="section" id="preview"><div class="section-head"><h2>Your steps</h2><span class="hint">${addDraft.steps.length} steps · ${esc(mins(addDraft.steps.reduce((a, s) => a + s.mins, 0)))}</span></div>
        ${addDraft.steps.length ? '' : '<p class="empty">No steps for this one. It goes in as a date in your plan.</p>'}
        ${heavy.length ? `<p class="callout">${heavy.length} evening${heavy.length === 1 ? ' is' : 's are'} over your limit because the date is close. You can move steps after adding.</p>` : ''}
        <ul class="steps">${addDraft.steps.map((s) => `<li class="step ${esc(addDraft.course)}"><span class="tag ${esc(addDraft.course)}" style="align-self:center">${esc(fmtShort(s.date))}</span><div class="step-body"><span class="step-title">${esc(s.title)}</span><span class="step-meta">${esc(mins(s.mins))}${s.tip ? ' · ' + esc(s.tip) : ''}</span></div><span></span></li>`).join('')}</ul>
        <div class="btn-row"><button class="btn primary" data-action="confirm-add">Add to my plan</button><button class="btn" data-action="discard-add">Change something</button></div></div>`;
    }
    $('#view-add').innerHTML = html;
  }

  function alarmPanel() {
    const s = state.settings;
    const st = appStatus();
    const on = s.alarms !== false;
    const vol = Number(st.alarmVolume || 0);
    const checks = [
      ['notifications', !!st.notifications, 'Notifications allowed', 'Needed for the alarm screen and its buttons.'],
      ['fullscreen', st.fullScreen !== false, 'Full-screen alarm allowed', 'Lets the alarm fill the screen when the phone is locked.'],
      ['exact', st.exact !== false, 'Alarms on the dot', 'Without this Android may ring a few minutes late.'],
      ['sound', vol > 0, vol > 0 ? 'Alarm volume is up' : 'Alarm volume is off', 'The app rings on your phone\'s alarm volume, like the Clock app.'],
      ['battery', !!st.battery, 'Battery saving will not stop the app', 'Recommended. Some phones close apps to save battery.']
    ];
    const leads = [0, 5, 10, 15];
    return `<div class="panel" id="alarms">
      <h3>Alarms</h3>
      <p>The app rings like an alarm clock on evenings that have steps. If the weekly review or earlier steps are still open, it rings again each weekday evening until you tick them off.</p>
      <div class="field"><span class="label" id="al-label">Alarms</span>
        <div class="seg" role="group" aria-labelledby="al-label">${[['on', 'On'], ['off', 'Off']].map(([id, l]) => `<button data-action="alarms" data-id="${id}" aria-pressed="${(on ? 'on' : 'off') === id}">${l}</button>`).join('')}</div></div>
      ${on ? `<p class="next-alarm" id="alarm-next">${nextAlarmText()}</p>
      <div class="two">
        <div class="field"><label for="f-lead">Ring before the start time</label>
          <select id="f-lead" data-action="alarm-lead">${leads.map((m) => `<option value="${m}"${Number(s.alarmLead == null ? 5 : s.alarmLead) === m ? ' selected' : ''}>${m ? m + ' min before' : 'At start time'}</option>`).join('')}</select>
          <span class="help">Your start time is ${esc(s.evening)}, set under Evenings.</span></div>
        <div class="field"><span class="label" id="cu-label">Catch-up evenings</span>
          <div class="seg" role="group" aria-labelledby="cu-label">${[['on', 'Ring'], ['off', 'Do not ring']].map(([id, l]) => `<button data-action="alarm-catchup" data-id="${id}" aria-pressed="${((s.alarmCatchup !== false) ? 'on' : 'off') === id}">${l}</button>`).join('')}</div>
          <span class="help">Weekday evenings with nothing planned, when earlier steps are still open.</span></div>
      </div>
      <h3 style="margin-top:.4rem">Phone checks</h3>
      <ul class="stat-list">${checks.map(([id, ok, title, help]) => `<li><span class="stat ${ok ? 'ok' : 'bad'}" aria-hidden="true">${ok ? '✓' : '!'}</span><span class="what"><strong>${esc(title)}</strong><span>${esc(help)}</span></span>${ok ? '' : `<button class="btn small" data-action="alarm-fix" data-id="${id}">Fix</button>`}</li>`).join('')}</ul>
      <div class="btn-row"><button class="btn primary" data-action="alarm-test">Test the alarm</button></div>
      <p class="small-print">The test rings 15 seconds after you tap it. Lock the phone straight away to see the full alarm screen.</p>` : ''}
    </div>`;
  }

  function renderSettings() {
    const s = state.settings;
    const t = themeColours();
    const pct = Math.round((Number(s.scale) || 1) * 100);
    let html = `<div class="section-head"><h2>Settings</h2></div>
    <div class="panel">
      <h3>Colours</h3>
      <div class="swatches" role="group" aria-label="Colour theme">${THEMES.map((th) => {
        const a = th.id === 'custom' ? (s.custom || '#14b8a6') : th.a;
        const b = th.id === 'custom' ? themeColours().b : th.b;
        const paint = th.id === 'custom' && s.theme !== 'custom' ? `background:conic-gradient(from 90deg, #ff5f6d, #ffc371, #3fd6a0, #38bdf8, #8b5cf6, #ff5f6d)` : `background:linear-gradient(135deg, ${a}, ${b})`;

      <div class="field"><label for="f-colour">Your own colour</label>
        <div class="colour-input"><input type="color" id="f-colour" value="${esc(s.custom || '#14b8a6')}" data-action="custom-colour"><span class="small-print">Pick any colour. The header and buttons follow it.</span></div></div>
      <div class="field"><span class="label" id="mode-label">Light or dark</span>
        <div class="seg" role="group" aria-labelledby="mode-label">${[['auto', 'Match phone'], ['light', 'Light'], ['dark', 'Dark']].map(([id, l]) => `<button data-action="mode" data-id="${id}" aria-pressed="${s.mode === id}">${l}</button>`).join('')}</div></div>
    </div>
    <div class="panel">
      <h3>Text</h3>
      <div class="field"><label for="f-scale">Text size</label>
        <div class="range-row"><button class="icon-btn" data-action="scale-down" aria-label="Smaller text">A−</button><input type="range" id="f-scale" min="85" max="150" step="5" value="${pct}" data-action="scale"><button class="icon-btn" data-action="scale-up" aria-label="Bigger text">A+</button><output for="f-scale" id="scale-out">${pct}%</output></div></div>
      <div class="field"><span class="label" id="font-label">Reading font</span>
        <div class="seg" role="group" aria-labelledby="font-label">${[['atkinson', 'Atkinson'], ['lexend', 'Lexend'], ['system', 'Phone font']].map(([id, l]) => `<button data-action="font" data-id="${id}" aria-pressed="${s.font === id}">${l}</button>`).join('')}</div>
        <span class="help">Atkinson Hyperlegible and Lexend were both designed to be easier to read.</span></div>
      <p class="preview-text">Tonight: Answer Q1.2 for the assessor workbook. 40 minutes, then stop.</p>
    </div>
    <div class="panel">
      <h3>Evenings</h3>
      <div class="two">
        <div class="field"><label for="f-evening">Start time</label><input type="time" id="f-evening" value="${esc(s.evening)}" data-action="evening"><span class="help">Used for calendar times</span></div>
        <div class="field"><label for="f-cap">Most minutes per evening</label><input type="number" id="f-cap" min="15" max="180" step="5" value="${esc(s.cap)}" data-action="cap"><span class="help">The planner tries to stay under this</span></div>
      </div>
    </div>
    <div class="panel">
      <h3>Weekly PebblePad review</h3>
      <div class="two">
        <div class="field"><label for="f-review-day">Review day</label>
          <select id="f-review-day" data-action="review-day">${DAY_NAMES.map((n, i) => `<option value="${i + 1}"${reviewDayNum() === i + 1 ? ' selected' : ''}>${n}</option>`).join('')}</select>
          <span class="help">An unfinished review stays on Today until you tick it off.</span></div>
        <div class="field"><span class="label">Calendar reminders</span>
          <div class="btn-row"><a class="btn small" href="${esc(reviewRecurGcal(false))}" target="_blank" rel="noopener">${ICON.cal} Every week</a><a class="btn small" href="${esc(reviewRecurGcal(true))}" target="_blank" rel="noopener">${ICON.cal} Follow-up</a></div>
          <span class="help">The follow-up lands the next weekday evening, in case the review slipped.</span></div>
      </div>
    </div>
    ${APP ? alarmPanel() : ''}
    ${APP ? '<details class="panel" id="reminders"><summary>Calendar reminders as well (optional)</summary>' : '<div class="panel" id="reminders">'}
      <h3>${APP ? 'Calendar' : 'Phone reminders'}</h3>
      <p>${APP ? 'The alarms above do the main job. Use the calendar too if you want your study plan in Google Calendar.' : 'A web page cannot set the alarm clock on your phone, so this uses your calendar, which buzzes like a reminder at the time of each step.'}</p>
      <p><strong>One step at a time:</strong> tap the calendar button on any step or deadline. Google Calendar opens with the event filled in. Tap Save.</p>
      <p><strong>The whole plan at once (best):</strong></p>
      <ol class="howto">
        <li>On a laptop, open calendar.google.com and make a new calendar called Study plan (Settings, Add calendar, Create new calendar).</li>
        <li>In that calendar's settings, set Event notifications to <strong>At start of event</strong> and <strong>10 minutes before</strong>. Google uses these for imported events.</li>
        <li>Tap <strong>Download calendar file</strong> below and copy it to the laptop. It includes the weekly PebblePad review and its follow-up.</li>
        <li>Settings, Import and export, Import. Pick the file and choose the Study plan calendar.</li>
        <li>On your phone, open the Google Calendar app, tap the menu and make sure Study plan is ticked. Check notifications for Google Calendar are allowed in Android settings.</li>
      </ol>
      <div class="btn-row"><button class="btn primary" data-action="download-ics">${ICON.cal} Download calendar file (.ics)</button></div>
      <p class="small-print">If you tick off or move steps, download the file again and import it into the same calendar. Repeat imports do not make duplicates, but they will not delete a step you moved, so delete the old event by hand if it matters.</p>
      ${IS_ARTIFACT || APP ? '' : `<div class="field"><span class="label">Daily nudge (extra, best effort)</span>
        <span class="help">Needs the app installed on your home screen. Android decides when to run it, so it can be late or skipped. Treat the calendar as the main reminder.</span>
        <div class="btn-row">${s.nudges ? '<button class="btn small" data-action="nudges-off">Turn nudges off</button>' : '<button class="btn small" data-action="nudges-on">Turn nudges on</button>'}</div></div>`}
    ${APP ? '</details>' : '</div>'}
    <div class="panel">
      <h3>Backup</h3>
      <p class="small-print">${Remote.status === 'synced' ? 'Your ticks are saved to your Claude account and come back on any device you open this on.' : 'Your ticks are saved on this phone. Save a backup now and then, or before you clear your browser.'}</p>
      <div class="btn-row">
        <button class="btn small" data-action="backup">Save a backup (.json)</button>
        <button class="btn small" data-action="copy-backup">Copy backup text</button>
        <label class="btn small" for="f-restore">Restore a backup</label>
        <input type="file" id="f-restore" accept="application/json,.json" class="sr-only" data-action="restore">
      </div>
      ${confirmReset ? `<div class="confirm-row"><span>Clear every tick, move and added deadline?</span><button class="btn small danger" data-action="reset">Yes, clear it</button><button class="btn small" data-action="cancel-reset">Keep everything</button></div>` : '<div><button class="btn small danger" data-action="ask-reset">Clear my progress</button></div>'}
    </div>
    <p class="small-print">Deadlines last checked ${esc(fmtYear(DATA.updated || todayKey()))}. Dates marked Check the date or Date to confirm still need confirming with your tutor or assessor.</p>`;
    $('#view-settings').innerHTML = html;
  }

  function renderView() {
    document.querySelectorAll('.view').forEach((v) => { v.hidden = v.dataset.view !== view; });
    document.querySelectorAll('.tab').forEach((t) => { if (t.dataset.tab === view) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
    if (view === 'today') renderToday();
    if (view === 'plan') renderPlan();
    if (view === 'portfolio') renderPortfolio();
    if (view === 'deadlines') renderDeadlines();
    if (view === 'add') renderAdd();
    if (view === 'settings') renderSettings();
  }
  function renderAll() { renderTonight(); renderView(); }

  function go(v, anchor) {
    view = v;
    try { localStorage.setItem(VIEW_KEY, v); } catch (e) { /* ignore */ }
    renderView();
    if (anchor) { const el = document.getElementById(anchor); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else window.scrollTo({ top: $('#main').offsetTop - 8, behavior: 'smooth' });
  }

  let toastTimer = null;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3800);
  }
  function reviewDone(mon) {
    const w = reviewWeek(mon);
    if (!w.complete || w.skipped) return;
    const cap = $('#cap');
    cap.classList.remove('toss');
    void cap.getBoundingClientRect();
    cap.classList.add('toss');
    const left = overdueReviews().length;
    toast(left ? `PebblePad review for ${weekLabel(mon)} done. ${left} more week${left === 1 ? '' : 's'} to catch up.` : `PebblePad review for ${weekLabel(mon)} done.`);
  }
  function celebrate(d) {
    const cap = $('#cap');
    cap.classList.remove('toss');
    void cap.getBoundingClientRect();
    cap.classList.add('toss');
    toast(`Every step done for "${d.title}". Cap in the air.`);
  }

  /* ---------- actions ---------- */
  function tick(id, on) {
    if (on) state.done[id] = Date.now(); else delete state.done[id];
    commit();
    if (on) {
      const d = deadlines().find((x) => x.chunks.some((c) => c.id === id));
      if (d && d.complete) celebrate(d);
    }
    renderAll();
  }
  function moveChunk(id) {
    const c = allChunks(deadlines()).find((x) => x.id === id);
    if (!c) return;
    const today = todayKey();
    const from = c.dateEff < today ? today : addDays(c.dateEff, 1);
    const to = nextFreeEvening(from, c.mins || 30, id);
    state.moved[id] = to;
    commit();
    renderAll();
    toast(`Moved to ${fmtLong(to)}${c.deadline.due && to > c.deadline.due ? '. That is after the deadline, so check it still works.' : '.'}`);
  }
  function moveAllBehind() {
    const today = todayKey();
    const behind = allChunks(deadlines()).filter((c) => !c.done && c.dateEff < today);
    behind.forEach((c) => { state.moved[c.id] = nextFreeEvening(today, c.mins || 30, c.id); commit(); });
    renderAll();
    toast(`${behind.length} step${behind.length === 1 ? '' : 's'} moved to free evenings.`);
  }

  document.addEventListener('click', (e) => {
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) { go(tabBtn.dataset.tab); return; }
    const link = e.target.closest('[data-tab-link]');
    if (link) { go(link.dataset.tabLink); return; }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    const id = el.dataset.id;
    const s = state.settings;
    switch (a) {
      case 'move': moveChunk(id); break;
      case 'open-review': focusWeek = id; go('portfolio', 'rv-' + id); break;
      case 'review-all': {
        const w = reviewWeek(id);
        const t = (state.reviews[id] = state.reviews[id] || {});
        w.items.forEach((it) => { if (!t[it.id]) t[it.id] = Date.now(); });
        commit(); renderAll(); reviewDone(id); break;
      }
      case 'review-skip': { (state.reviews[id] = state.reviews[id] || {}).__skip = Date.now(); commit(); renderAll(); toast('Marked as no review this week.'); break; }
      case 'review-unskip': { if (state.reviews[id]) delete state.reviews[id].__skip; commit(); renderAll(); break; }
      case 'approach': state.portfolio.approach = id; commit(); renderView(); break;
      case 'move-all': moveAllBehind(); break;
      case 'filter': s.course = id; commit(); renderView(); break;
      case 'toggle-past': s.showPast = !s.showPast; commit(); renderView(); break;
      case 'theme': s.theme = id; commit(); applyLook(); renderView(); break;
      case 'mode': s.mode = id; commit(); applyLook(); renderView(); break;
      case 'font': s.font = id; commit(); applyLook(); renderView(); break;
      case 'scale-down': s.scale = clamp(Math.round(((Number(s.scale) || 1) - 0.05) * 100) / 100, 0.85, 1.5); commit(); applyLook(); renderView(); break;
      case 'scale-up': s.scale = clamp(Math.round(((Number(s.scale) || 1) + 0.05) * 100) / 100, 0.85, 1.5); commit(); applyLook(); renderView(); break;
      case 'goto-reminders': s.remindersSeen = true; commit(); go('settings', 'reminders'); break;
      case 'goto-alarms': s.alarmSetupSeen = true; commit(); go('settings', 'alarms'); break;
      case 'dismiss-alarms': s.alarmSetupSeen = true; commit(); renderView(); break;
      case 'dismiss-reminders': s.remindersSeen = true; commit(); renderView(); break;
      case 'download-ics': saveFile('study-plan.ics', buildIcs(), 'text/calendar'); break;
      case 'alarms': s.alarms = id === 'on'; commit(); renderAll(); toast(s.alarms ? 'Alarms are on.' : 'Alarms are off. Nothing will ring.'); break;
      case 'alarm-catchup': s.alarmCatchup = id === 'on'; commit(); renderView(); break;
      case 'alarm-test': if (APP) { try { APP.testAlarm(15); toast('Test alarm in 15 seconds. Lock your phone now.'); } catch (e) { toast('The test alarm could not be set.'); } } break;
      case 'alarm-fix': if (APP) { try { APP.fix(id); } catch (e) { /* ignore */ } } break;
      case 'nudges-on': enableNudges(); break;
      case 'nudges-off': disableNudges(); break;
      case 'backup': saveFile(`cap-and-gown-backup-${todayKey()}.json`, JSON.stringify(state, null, 2), 'application/json'); break;
      case 'copy-backup': {
        const text = JSON.stringify(state);
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Backup copied. Paste it into a note to keep it.'), () => toast('Copy did not work here. Use Save a backup instead.'));
        else toast('Copy did not work here. Use Save a backup instead.');
        break;
      }
      case 'ask-reset': confirmReset = true; renderView(); break;
      case 'cancel-reset': confirmReset = false; renderView(); break;
      case 'reset': {
        const keep = { ...state.settings };
        state = freshState();
        state.settings = keep;
        confirmReset = false;
        commit();
        renderAll();
        toast('Progress cleared.');
        break;
      }
      case 'edit-due': editingDue = id; confirmDelete = null; renderView(); break;
      case 'cancel-due': editingDue = null; renderView(); break;
      case 'ask-delete': confirmDelete = id; editingDue = null; renderView(); break;
      case 'cancel-delete': confirmDelete = null; renderView(); break;
      case 'delete': state.custom = state.custom.filter((d) => d.id !== id); confirmDelete = null; commit(); renderAll(); toast('Deleted.'); break;
      case 'set-date': {
        const d = deadlines().find((x) => x.id === id);
        if (!d) break;
        prefill = { fromId: d.id, title: d.title, course: d.course, template: d.template || 'custom', how: d.how };
        addDraft = null;
        go('add');
        break;
      }
      case 'clear-prefill': prefill = null; addDraft = null; renderView(); break;
      case 'discard-add': addDraft = null; renderView(); break;
      case 'confirm-add': {
        if (!addDraft) break;
        const dl = {
          id: uid(), custom: true, course: addDraft.course, kind: addDraft.kind, title: addDraft.title, due: addDraft.due,
          dueTime: addDraft.time, status: 'confirmed', how: addDraft.how, note: addDraft.note, template: addDraft.template,
          chunks: addDraft.steps.map((st) => ({ id: uid(), date: st.date, mins: st.mins, title: st.title, tip: st.tip }))
        };
        state.custom.push(dl);
        if (addDraft.fromId) state.hidden[addDraft.fromId] = true;
        addDraft = null;
        prefill = null;
        commit();
        renderTonight();
        go('deadlines');
        setTimeout(() => { const el = document.getElementById('dl-' + dl.id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60);
        toast(`Added with ${dl.chunks.length} step${dl.chunks.length === 1 ? '' : 's'}.`);
        break;
      }
      default: break;
    }
  });

  document.addEventListener('change', (e) => {
    const el = e.target;
    const a = el.dataset && el.dataset.action;
    const s = state.settings;
    if (a === 'tick') { tick(el.dataset.id, el.checked); return; }
    if (a === 'rtick') {
      const mon = el.dataset.week;
      const t = (state.reviews[mon] = state.reviews[mon] || {});
      if (el.checked) t[el.dataset.id] = Date.now(); else delete t[el.dataset.id];
      commit(); renderAll();
      if (el.checked) reviewDone(mon);
      const back = document.getElementById(el.id); if (back) back.focus({ preventScroll: true });
      return;
    }
    if (a === 'pobs' || a === 'pcheck' || a === 'pduty') {
      const bucket = { pobs: 'obs', pcheck: 'checks', pduty: 'duties' }[a];
      if (el.checked) state.portfolio[bucket][el.dataset.id] = Date.now(); else delete state.portfolio[bucket][el.dataset.id];
      commit(); renderView();
      const back = document.getElementById(el.id); if (back) back.focus({ preventScroll: true });
      return;
    }
    if (a === 'pnum') {
      const v = el.value === '' ? '' : clamp(Number(el.value) || 0, 0, 9999);
      state.portfolio.nums[el.dataset.id] = v;
      commit(); renderView();
      return;
    }
    if (a === 'review-day') { s.reviewDay = clamp(Number(el.value) || 5, 1, 7); commit(); renderAll(); toast(`Weekly review moved to ${DAY_NAMES[s.reviewDay - 1]}. Update the calendar reminders too.`); return; }
    if (a === 'custom-colour') { s.custom = el.value; s.theme = 'custom'; commit(); applyLook(); renderView(); return; }
    if (a === 'evening' && /^\d\d:\d\d$/.test(el.value)) { s.evening = el.value; commit(); renderAll(); return; }
    if (a === 'cap') { s.cap = clamp(Number(el.value) || 60, 15, 180); commit(); return; }
    if (a === 'alarm-lead') { s.alarmLead = clamp(Number(el.value) || 0, 0, 60); commit(); renderView(); return; }
    if (a === 'scale') { s.scale = clamp(Number(el.value) / 100, 0.85, 1.5); commit(); applyLook(); renderView(); return; }
    if (a === 'restore' && el.files && el.files[0]) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (!parsed || typeof parsed !== 'object' || !parsed.settings) throw new Error('not a backup');
          state = normalise(parsed);
          commit();
          applyLook();
          renderAll();
          toast('Backup restored.');
        } catch (err) { toast('That file is not a Cap and Gown backup.'); }
      };
      reader.readAsText(el.files[0]);
      return;
    }
    if (el.id === 'f-template') {
      document.querySelectorAll('[data-only]').forEach((n) => { n.hidden = n.dataset.only !== el.value; });
    }
  });

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.action === 'scale') {
      const out = $('#scale-out');
      if (out) out.textContent = `${el.value}%`;
      document.documentElement.style.setProperty('--scale', String(clamp(Number(el.value) / 100, 0.85, 1.5)));
    }
  });

  document.addEventListener('paste', (e) => {
    if (view !== 'settings') return;
    const text = e.clipboardData && e.clipboardData.getData('text');
    if (!text || text.trim()[0] !== '{') return;
    try {
      const parsed = JSON.parse(text);
      if (!parsed.settings) return;
      state = normalise(parsed);
      commit();
      applyLook();
      renderAll();
      toast('Backup restored from pasted text.');
    } catch (err) { /* not ours */ }
  });

  document.addEventListener('submit', (e) => {
    const form = e.target;
    if (!form.dataset || !form.dataset.form) return;
    e.preventDefault();
    if (form.dataset.form === 'due') {
      const id = form.dataset.id;
      const v = form.querySelector('input[type="date"]').value;
      if (!v) return;
      const base = (DATA.deadlines || []).find((d) => d.id === id);
      if (base && !base.due) {
        // a "needs a date" item: plan it properly through the Add form instead
        prefill = { fromId: id, title: base.title, course: base.course, template: base.template || 'custom', how: base.how, due: v };
        editingDue = null;
        go('add');
        return;
      }
      const custom = state.custom.find((d) => d.id === id);
      if (custom) custom.due = v; else state.due[id] = v;
      editingDue = null;
      commit();
      renderAll();
      toast(`Date changed to ${fmtLong(v)}.`);
      return;
    }
    if (form.dataset.form === 'add') {
      const f = new FormData(form);
      const o = Object.fromEntries(f.entries());
      if (!o.due || !o.title) return;
      if (o.due < todayKey()) { toast('That date has already passed. Pick a date from today on.'); return; }
      const tpl = TEMPLATES[o.template] || TEMPLATES.custom;
      prefill = { ...(prefill || {}), ...o };
      addDraft = {
        fromId: prefill.fromId || null,
        course: o.course,
        template: o.template,
        kind: o.template === 'observation' || o.template === 'event' ? 'event' : 'submission',
        title: o.title.trim(),
        due: o.due,
        time: o.time || '09:00',
        how: (o.how || '').trim(),
        note: (o.note || '').trim(),
        steps: tpl.build(o)
      };
      renderView();
      setTimeout(() => { const el = $('#preview'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30);
    }
  });

  /* ---------- start ---------- */
  applyLook();
  renderAll();
  Remote.setStatus(Remote.status);
  Remote.connect();
  writeNudgeSnapshot();
  if (APP) {
    syncAlarms();
    if (!loadLocal()) saveLocal();
    window.__capgownGo = (v) => { if (/^(today|plan|portfolio|deadlines|add|settings)$/.test(v)) go(v); };
    window.__capgownResume = () => { lastDay = todayKey(); syncAlarms(); renderAll(); };
  }

  // Re-render when the day changes while the app is open (e.g. left open overnight)
  let lastDay = todayKey();
  setInterval(() => { if (todayKey() !== lastDay) { lastDay = todayKey(); renderAll(); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && todayKey() !== lastDay) { lastDay = todayKey(); renderAll(); } });

  if (!IS_ARTIFACT && !APP && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is optional */ }); });
  }

  // Exposed for testing only
  window.__planner = { buildIcs, deadlines, spread, TEMPLATES, reviewWeeksSoFar, overdueReviews, alarmPlan, get state() { return state; } };
})();

</script>
