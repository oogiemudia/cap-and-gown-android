  const QBANK = [
    { t: 'retrieval', q: 'What is retrieval practice?', o: ['Re-reading notes until they feel familiar', 'Bringing information back to mind from memory, for example in a low-stakes quiz', 'Highlighting the key points in a handout', 'Copying a worked example from the board'], a: 1, why: 'Retrieval practice means recalling from memory. The effort of recalling strengthens the memory; re-reading only builds familiarity.' },
    { t: 'retrieval', q: 'Why should some questions in a retrieval round come back two or three weeks later?', o: ['So learners can copy last week’s answers', 'Recall after a gap is harder, and that effort makes learning last longer', 'It saves planning time', 'Older content is always easier'], a: 1, why: 'This is the spacing effect. Recall after a gap is more effortful, and that desirable difficulty improves long-term retention.' },
    { t: 'retrieval', q: 'Which keeps a retrieval round low-stakes?', o: ['Scores go on the learner’s record', 'Answers are checked straight away and scores are not used to judge learners', 'Only the top scorers are named', 'It is always done in exam conditions'], a: 1, why: 'Low-stakes means the quiz is for learning, not grading. Quick self-checking keeps anxiety down and attention on the content.' },
    { t: 'memory', q: 'Cognitive load theory says working memory is…', o: ['Unlimited if learners concentrate', 'Limited, so new material should come in manageable chunks', 'Only used in maths', 'The same as long-term memory'], a: 1, why: 'Working memory can hold only a few new items at once. Chunking and worked examples stop it being overloaded.' },
    { t: 'memory', q: 'Showing a worked example, then a similar problem with less help, then one on their own is…', o: ['Discovery learning', 'Fading guidance (I do, we do, you do)', 'Ipsative assessment', 'Interleaving'], a: 1, why: 'Worked examples reduce load for novices, and support is faded as learners become more able.' },
    { t: 'memory', q: 'Dual coding means…', o: ['Teaching two topics at once', 'Combining words with visuals, such as a labelled diagram', 'Marking work twice', 'Giving two versions of a test'], a: 1, why: 'Words and images are processed in different channels, so pairing them gives learners two routes back to the idea.' },
    { t: 'change', q: 'What are the three stages in Lewin’s change model?', o: ['Plan, do, review', 'Unfreeze, change, refreeze', 'Forming, storming, norming', 'Assess, plan, do'], a: 1, why: 'Lewin: unfreeze (make the case and loosen old habits), change (make the move), refreeze (embed it as normal practice).' },
    { t: 'change', q: 'In Lewin’s model, what happens at the refreeze stage?', o: ['The need for change is explained', 'The change becomes part of normal practice so it lasts', 'Staff decide to stop the change', 'A trial run starts'], a: 1, why: 'Refreezing embeds the new way of working, for example by building it into routines, schemes of learning or policy.' },
    { t: 'change', q: 'A force field analysis compares…', o: ['Driving forces for a change with restraining forces against it', 'Two groups’ exam results', 'Learners’ targets with their grades', 'Costs this year with last year'], a: 0, why: 'Lewin’s force field analysis lists what pushes a change forward and what holds it back, so you can strengthen one side or weaken the other.' },
    { t: 'adaptive', q: 'In current UK practice, adaptive teaching means…', o: ['Writing three versions of every worksheet in advance', 'Adjusting support in the lesson, such as scaffolds and questioning, while keeping high expectations for everyone', 'Grouping learners permanently by ability', 'Letting some learners choose easier work'], a: 1, why: 'Adaptive teaching responds to need during learning, with the same ambitious goal for all, rather than pre-sorting learners into different tasks.' },
    { t: 'adaptive', q: 'The SEND Code of Practice (2015) covers children and young people up to what age?', o: ['16', '18', '19', '25'], a: 3, why: 'The Code covers 0 to 25, which is why it matters in FE: an EHC plan can continue into college.' },
    { t: 'adaptive', q: 'The graduated approach in the SEND Code of Practice is a cycle of…', o: ['Unfreeze, change, refreeze', 'Assess, plan, do, review', 'Plan, teach, test', 'Identify, refer, exclude'], a: 1, why: 'Assess, plan, do, review: support is planned, tried, then reviewed and adjusted.' },
    { t: 'adaptive', q: 'What is an EHC plan?', o: ['A behaviour contract', 'A legal document setting out a young person’s education, health and care needs and the support to meet them', 'An exam access form', 'A timetable for practical sessions'], a: 1, why: 'An Education, Health and Care plan is legally binding; the provider must deliver the education support it names.' },
    { t: 'afl', q: 'Which is the clearest example of formative assessment?', o: ['An end-of-unit grade', 'A hinge question mid-lesson, then reteaching the step most learners got wrong', 'A certificate at the end of the course', 'End-of-year results'], a: 1, why: 'Formative assessment changes what happens next in teaching. The hinge question shows where the gap is, and the reteach closes it.' },
    { t: 'afl', q: 'Feedback that tells a learner what to do next time is often called…', o: ['Feed-forward', 'Summative feedback', 'Norm referencing', 'Ipsative grading'], a: 0, why: 'Feed-forward focuses on the next attempt, which learners are more likely to act on than a list of errors.' },
    { t: 'afl', q: 'Ipsative assessment compares a learner’s work with…', o: ['Other learners in the group', 'National averages', 'Their own earlier work', 'The teacher’s model answer'], a: 2, why: 'Ipsative means measured against yourself. It can motivate learners who are far from the top grades.' },
    { t: 'agency', q: 'Learner agency is best described as…', o: ['Learners making choices and taking responsibility for their own learning', 'Learners working silently', 'The teacher deciding every step', 'Learners marking each other’s exams'], a: 0, why: 'Agency is about ownership: setting goals, choosing strategies and checking their own progress.' },
    { t: 'agency', q: 'Which scaffold builds independence?', o: ['The teacher finishing the task for them', 'A checklist learners use to check their own work before handing it in', 'Removing all support from the first day', 'Only teacher-led questioning'], a: 1, why: 'A self-check list hands the checking over to the learner, and it can be faded once the habit is there.' },
    { t: 'ofsted', q: 'Under Ofsted’s renewed framework (from November 2025), how are FE providers graded?', o: ['One overall grade from outstanding to inadequate', 'A report card grading each area on a five-point scale, from urgent improvement to exceptional', 'Pass or fail', 'A percentage score'], a: 1, why: 'Report cards grade separate evaluation areas as exceptional, strong standard, expected standard, needs attention or urgent improvement.' },
    { t: 'ofsted', q: 'Since September 2024, what are FE initial teacher education courses mapped to?', o: ['The Teachers’ Standards for schools', 'The occupational standard for the Learning and Skills Teacher', 'The Ofsted handbook', 'The awarding body specification'], a: 1, why: 'Your companion booklet explains that FE ITE courses are mapped to and assessed against the occupational standard.' },
    { t: 'standards', q: 'How many KSBs does your Module 3 portfolio need evidence for?', o: ['20', '25', '45', '51'], a: 3, why: 'K1 to K20, S1 to S25 and B1 to B6: 51 in total. One piece of evidence can cover several KSBs.' },
    { t: 'standards', q: 'How many occupational duties does the professional discussion cover?', o: ['Six', 'Eight', 'Nine', 'Ten'], a: 2, why: 'Nine duties, with one story or one answer for each, whichever approach you choose.' },
    { t: 'standards', q: 'Which of these must be in the portfolio before the professional discussion?', o: ['A lesson plan for every week', 'Feedback and a reflection for each of the ten observations', 'A written essay', 'Your exam timetable'], a: 1, why: 'The Module 3 handbook lists ten observation forms and reflections, both placement reflections, Safeguarding and Prevent certificates and 150 lead teaching hours.' },
    { t: 'reflect', q: 'Which of these is a stage of Gibbs’ reflective cycle?', o: ['Refreeze', 'Feelings', 'Standardisation', 'Hinge'], a: 1, why: 'Gibbs: description, feelings, evaluation, analysis, conclusion, action plan.' },
    { t: 'reflect', q: 'Brookfield’s four lenses are the autobiographical, the learners’, colleagues’ and…', o: ['the parents’', 'the theoretical (literature) lens', 'the inspector’s', 'the employer’s'], a: 1, why: 'Looking through all four lenses stops reflection relying only on your own view.' },
    { t: 'reflect', q: 'Kolb’s cycle moves from concrete experience to…', o: ['reflective observation, abstract conceptualisation, active experimentation', 'planning, teaching, testing', 'unfreezing, changing, refreezing', 'description, feelings, action plan'], a: 0, why: 'Kolb: do it, reflect on it, make sense of it with theory, then try something new.' },
    { t: 'vacsr', q: 'In VACSR, "authentic" means…', o: ['It is recent', 'There is enough of it', 'It is the learner’s own work', 'It measures what it should'], a: 2, why: 'Authentic: the learner’s own. Current is recent, sufficient is enough, valid is the right thing measured.' },
    { t: 'vacsr', q: 'An assessment that gives the same result with a different assessor is…', o: ['valid', 'reliable', 'sufficient', 'current'], a: 1, why: 'Reliability is consistency across assessors and occasions.' },
    { t: 'vacsr', q: '"Current" evidence shows…', o: ['what the learner can do now, against the current standards', 'what the learner did last year', 'the newest piece of paper in the file', 'the assessor’s current opinion'], a: 0, why: 'Old evidence may not prove competence now, especially if standards or practice have changed.' },
    { t: 'methods', q: 'Which method best shows practical competence at work?', o: ['A multiple-choice test', 'Direct observation of the learner doing the task', 'An essay', 'A spelling test'], a: 1, why: 'Observation in real conditions is the main method for competence; questioning can then check the knowledge behind it.' },
    { t: 'methods', q: 'RPL stands for…', o: ['Recognition of prior learning', 'Record of practical learning', 'Reliable portfolio list', 'Regulated pass level'], a: 0, why: 'RPL gives credit for learning the learner can already show, so they are not assessed twice.' },
    { t: 'methods', q: 'A witness testimony is…', o: ['A learner’s own diary', 'A statement from someone who saw the learner perform, such as a supervisor', 'An exam paper', 'A note from the IQA'], a: 1, why: 'Witness testimony supports other evidence; the assessor still decides whether it is valid and sufficient.' },
    { t: 'planning', q: 'Holistic assessment means…', o: ['Assessing several criteria or units with one activity', 'Assessing everything at the end', 'Only assessing practical skills', 'Letting learners self-assess'], a: 0, why: 'One well-planned activity can cover several criteria, which saves time for the learner and the assessor.' },
    { t: 'planning', q: 'An assessment plan should be agreed with…', o: ['Only the IQA', 'The learner', 'Nobody, the assessor decides', 'The awarding body'], a: 1, why: 'Agreeing the plan with the learner (and the employer where relevant) means everyone knows what, how and when.' },
    { t: 'involve', q: 'Why involve learners in planning their assessment?', o: ['It removes the need for an assessor', 'They know what is expected and take ownership', 'It makes assessment easier to pass', 'It is only needed for adults'], a: 1, why: 'Learners who understand the criteria and the plan prepare better and take responsibility for their evidence.' },
    { t: 'involve', q: 'Changing assessment arrangements for a learner with a disability, without changing the standard, is…', o: ['a reasonable adjustment', 'a special consideration fail', 'lowering the bar', 'not allowed'], a: 0, why: 'Reasonable adjustments, such as extra time or a reader, let learners show what they can do against the same standard.' },
    { t: 'decisions', q: 'If the evidence is not enough to meet a criterion, the assessor should…', o: ['Pass it anyway', 'Give feedback and agree what further evidence is needed', 'Ask another learner', 'Ignore that criterion'], a: 1, why: 'Decisions must be against the criteria. Clear feedback and an agreed next step keep it fair.' },
    { t: 'decisions', q: 'An assessment decision must be…', o: ['Made against the specified criteria, valid, reliable and fair', 'Based on how hard the learner tried', 'Agreed by the whole group', 'Made by the learner'], a: 0, why: 'Effort is not evidence. The decision rests on the criteria and VACSR evidence.' },
    { t: 'qa', q: 'Standardisation meetings are for…', o: ['Making sure assessors judge work in the same way', 'Setting learners’ targets', 'Planning the timetable', 'Choosing the awarding body'], a: 0, why: 'Assessors compare decisions on the same evidence so standards stay consistent across the centre.' },
    { t: 'qa', q: 'Internal quality assurance includes…', o: ['Writing learners’ work', 'Sampling assessment decisions and observing assessors', 'Setting exam papers', 'Marking every piece twice'], a: 1, why: 'The IQA samples decisions, observes assessors, supports standardisation and feeds back.' },
    { t: 'qa', q: 'A learner disagrees with your decision. What should happen?', o: ['The decision stands with no discussion', 'They follow the centre’s appeals procedure', 'They complain to Ofsted', 'They redo the whole unit'], a: 1, why: 'Every centre has an appeals process, usually starting with the assessor, then the IQA, then the awarding organisation.' },
    { t: 'records', q: 'Assessment records should be…', o: ['Kept in your car', 'Accurate, signed and dated, and stored securely', 'Thrown away after the unit', 'Shared on social media'], a: 1, why: 'Records are the audit trail for the IQA and EQA, and they hold personal data.' },
    { t: 'records', q: 'How do feedback and questioning help assessment?', o: ['They replace evidence', 'Questioning checks understanding behind a performance, and feedback tells the learner where they stand and what is next', 'They are only for the IQA', 'They slow assessment down'], a: 1, why: 'Questions confirm knowledge and authenticity; feedback closes the loop for the learner.' },
    { t: 'law', q: 'Which law protects learners from discrimination in assessment?', o: ['Health and Safety at Work etc. Act 1974', 'Equality Act 2010', 'Children Act 1989', 'Apprenticeships Act 2009'], a: 1, why: 'The Equality Act 2010 covers the protected characteristics and the duty to make reasonable adjustments.' },
    { t: 'law', q: 'Under data protection law, learner assessment records should…', o: ['Be shared with anyone who asks', 'Only be shared with people who need them, and be kept securely', 'Be kept forever in any format', 'Be stored on personal phones'], a: 1, why: 'UK GDPR and the Data Protection Act 2018 apply to assessment records, so access is limited and storage is secure.' },
    { t: 'law', q: 'CPD for an assessor means…', o: ['Keeping occupational knowledge and assessment practice up to date', 'Completing the qualification once', 'Attending only compulsory training', 'Copying colleagues’ decisions'], a: 0, why: 'Assessors need to stay current in their vocational area and in assessment practice.' }
  ];

  // Short lessons. "Worked example" applies the idea to a T Level Engineering group.
  const LESSONS = {
    retrieval: { sum: 'Retrieval practice means learners pull information out of memory rather than reading it again. A short low-stakes quiz at the start of a lesson is the classic form. Mixing in questions from two or three weeks ago adds spacing, which makes the learning last.', steps: [['The problem', 'Your Electrical group forgot Ohm’s law rearrangements a fortnight after the unit.'], ['Plan the round', 'Five questions: two from last lesson, two from two weeks ago, one from a month ago. At least one asks learners to explain or apply.'], ['Run it low-stakes', 'Five minutes, no names, answers on mini whiteboards, check straight away.'], ['Act on it', 'Note the most-missed question and reteach that step before moving on.'], ['Check later', 'Bring the same idea back in three weeks and compare scores with the first attempt.']] },
    memory: { sum: 'Working memory holds only a few new things at once. Break new material into steps, remove anything that distracts, and use worked examples before asking learners to solve problems alone. Pair words with a clear diagram so learners have two routes back to the idea.', steps: [['The problem', 'Learners struggle to calculate the moment of a force from a wordy question.'], ['Reduce the load', 'Show one labelled diagram and one fully worked example, nothing else on the slide.'], ['Fade the help', 'Second example with blanks to fill, then a third on their own.'], ['Check', 'Ask one learner to explain the step most people get wrong.']] },
    change: { sum: 'Lewin describes change in three stages. Unfreeze: show why the current way is not working and loosen old habits. Change: introduce the new practice with support. Refreeze: build it into routines so it lasts. A force field analysis helps you see what pushes the change forward and what holds it back.', steps: [['Unfreeze', 'Share the baseline: scores on questions from September were low when they came back in November.'], ['Change', 'Introduce weekly retrieval rounds with returning questions in both groups.'], ['Refreeze', 'Write the rounds into the scheme of learning and share the template with your colleague.'], ['Forces', 'Driving: better recall, learner feedback. Restraining: lesson time, absence. Plan for each.']] },
    adaptive: { sum: 'Adaptive teaching keeps the same ambitious goal for everyone and adjusts support during the lesson: scaffolds, questioning, grouping, resources. The SEND Code of Practice (2015) covers ages 0 to 25 and uses a graduated approach: assess, plan, do, review. Check support plans and EHC plans before you plan, not after.', steps: [['Start from the plan', 'Read support plans: who needs enlarged text, extra time or a reader?'], ['Same goal', 'Everyone will wire and test the circuit.'], ['Adjust support', 'Step cards for those who need them, extension questions for those who finish early.'], ['Review', 'After the lesson, note what worked for each learner and update the plan.']] },
    afl: { sum: 'Assessment for learning is assessment that changes the next step in teaching. Use hinge questions at key points, check the whole group (mini whiteboards, cards), and give feedback that tells learners what to do next. Ipsative feedback compares a learner with their own earlier work.', steps: [['Hinge question', 'Before moving on from series circuits, ask one multiple-choice question with tempting wrong answers.'], ['Read the room', 'All learners show an answer at once.'], ['Decide', 'If fewer than about four in five are right, reteach the step instead of moving on.'], ['Feed forward', 'Give each learner one thing to do in the next practical.']] },
    agency: { sum: 'Learner agency is learners taking ownership: setting goals, choosing strategies and checking their own progress. Build it with clear success criteria, self-check lists and choices within a structure, then fade the support as habits form.', steps: [['Make criteria visible', 'Share what a good test report looks like.'], ['Self-check', 'Learners tick a checklist before handing in.'], ['Choice', 'Offer two ways to show understanding: a labelled diagram or a short explanation.'], ['Fade', 'Remove the checklist once most learners use it without prompting.']] },
    ofsted: { sum: 'From November 2025 Ofsted inspects FE providers with report cards: each evaluation area gets one of five grades, from urgent improvement to exceptional. FE initial teacher education is mapped to the Learning and Skills Teacher occupational standard, which is what your portfolio evidences.', steps: [['Know the scale', 'Exceptional, strong standard, expected standard, needs attention, urgent improvement.'], ['Link to your practice', 'Curriculum and teaching, inclusion and achievement all show in your lessons.'], ['Evidence it', 'Tag lesson evidence to the KSBs it shows in your portfolio.']] },
    standards: { sum: 'Your portfolio is assessed against the Learning and Skills Teacher occupational standard: 20 knowledge, 25 skills and 6 behaviours, grouped under nine duties. One piece of evidence can cover several KSBs. The professional discussion asks for one story or answer per duty.', steps: [['Pick evidence', 'Your Obs 4 lesson plan and feedback.'], ['Tag it', 'K5 (inclusive strategies), S4 (variety of methods), S11 (ongoing feedback).'], ['Link to a duty', 'Duty 4: evidence-informed teaching, assessment and safe use of technology.'], ['Upload', 'Upload to the portfolio and note it in the evidence log.']] },
    reflect: { sum: 'Reflection turns experience into better practice. Gibbs: description, feelings, evaluation, analysis, conclusion, action plan. Brookfield adds four lenses: your own, your learners’, colleagues’ and the literature. A good observation reflection argues with the feedback a little and ends with one concrete action.', steps: [['Describe briefly', 'What happened in two sentences.'], ['Use a second lens', 'What did learners or your mentor see that you did not?'], ['Analyse with a source', 'Link one point to a reading.'], ['Action', 'One specific change for the next lesson.']] },
    vacsr: { sum: 'Every assessment decision rests on evidence that is valid (measures the right thing), authentic (the learner’s own), current (shows what they can do now), sufficient (enough to cover the criteria) and reliable (the same decision whoever assesses it).', steps: [['Check valid', 'Does the task match the criterion?'], ['Check authentic', 'Did you see it, or can you confirm it is theirs?'], ['Check current', 'Is it recent and against the current standard?'], ['Check sufficient', 'Is every criterion covered?'], ['Check reliable', 'Would a colleague reach the same decision?']] },
    methods: { sum: 'Choose methods to suit the criteria and the learner: observation for practical competence, questioning to check knowledge, products, witness testimony, professional discussion, and recognition of prior learning so nothing is assessed twice.', steps: [['Match the method', 'Practical skill: observe it. Knowledge: question it.'], ['Consider the learner', 'Oral questioning instead of written for a learner with dyslexia, where allowed.'], ['Use RPL', 'Credit what they can already show.']] },
    planning: { sum: 'Plan assessment with the learner: what, how, when, where and who. Look for holistic opportunities where one activity covers several criteria, and think about risks such as unfairness, overload or plagiarism.', steps: [['Agree the plan', 'With the learner and employer.'], ['Go holistic', 'One observed task that covers three criteria.'], ['Spot risks', 'Time pressure, a noisy workshop, a learner who copies. Plan for each.']] },
    involve: { sum: 'Involving learners and others (employers, colleagues) makes assessment fairer and more meaningful. Learners need the criteria, the plan and the appeals process. Peer and self-assessment build responsibility, and reasonable adjustments let everyone show what they can do against the same standard.', steps: [['Share information', 'Criteria, dates, how decisions are made, how to appeal.'], ['Self-assess first', 'Learner judges their own work against the criteria.'], ['Adjust', 'Extra time or a reader where needed, same standard.']] },
    decisions: { sum: 'Make decisions only against the specified criteria, using VACSR evidence. If the evidence falls short, say so clearly, explain why and agree what is needed next. Record the decision and the feedback.', steps: [['Judge', 'Compare evidence with each criterion.'], ['Decide', 'Met, or not yet met.'], ['Feed back', 'What was good, what is missing, what to do next.'], ['Record', 'Sign and date with the learner.']] },
    qa: { sum: 'Quality assurance keeps decisions consistent and fair. Internal QA samples decisions and observes assessors; standardisation meetings compare judgements on the same evidence; external QA comes from the awarding organisation. Disputes go through the centre’s appeals procedure.', steps: [['Standardise', 'Bring one assessed piece to the meeting.'], ['Compare', 'Would others reach the same decision?'], ['Act', 'Note what you will change.']] },
    records: { sum: 'Assessment information must be accurate, signed and dated, and stored securely, because it is the audit trail for quality assurance and it holds personal data. Questioning and feedback are part of assessment too: questions check the knowledge behind a performance, and feedback tells the learner where they stand.', steps: [['Record', 'Plan, evidence, decision, feedback.'], ['Store', 'In the approved system, not on a personal device.'], ['Question', 'Note the question, the answer and your judgement.']] },
    law: { sum: 'Assessment sits inside the law and policy: the Equality Act 2010 (including reasonable adjustments), health and safety, safeguarding, and data protection (UK GDPR and the Data Protection Act 2018). Technology can help (online portfolios, Forms, video), and reflective practice and CPD keep assessors current.', steps: [['Equality', 'Plan adjustments before the assessment.'], ['Safety', 'Risk assess practical assessments.'], ['Data', 'Share records only with those who need them.'], ['CPD', 'Log what you have done to stay current.']] }
  };

      { id: 'rec', label: 'Certificates and records', have: rec.filter((c) => p.checks[c.id]).length, need: rec.length, page: 'records' },
      { id: 'pd', label: 'Discussion duties ready', have: PORT.duties.filter((d, i) => p.duties['d' + (i + 1)]).length, need: PORT.duties.length, page: 'pd' }
    ].map((x) => ({ ...x, pct: x.need ? clamp(Math.round((x.have / x.need) * 100), 0, 100) : 0 }));
  }
  function portfolioPct() {
    const parts = portfolioParts();
    return parts.length ? Math.round(parts.reduce((a, x) => a + x.pct, 0) / parts.length) : 0;
  }
  function portfolioReadiness() {
    const today = todayKey();
    const pd = deadlines().find((d) => d.id === 'pg-pd');
    const end = (pd && pd.due) || (REVIEW && REVIEW.end) || addDays(today, 180);
    const frac = clamp(daysBetween(YEAR_START, today) / Math.max(1, daysBetween(YEAR_START, end)), 0, 1);
    const pct = portfolioPct();
    const expected = Math.round(frac * 100);
    const band = pct >= expected + 10 ? ['good', 'Ahead of plan'] : pct >= expected - 5 ? ['info', 'On track'] : ['warn', 'Behind plan'];
    return { pct, expected, end, days: Math.max(0, daysBetween(today, end)), band };
  }

  /* ---------- the planner's evening sessions ---------- */
  function sessionsFor(d) {
    const s = state.settings;
    const steps = allChunks(deadlines()).filter((c) => c.dateEff === d);
    const out = steps.filter((c) => c.time).map((c) => ({ kind: 'step', c, t: c.time }));
    let t = s.evening;
    steps.filter((c) => !c.time).sort(byUrgency).forEach((c) => { out.push({ kind: 'step', c, t }); t = addMins(t, c.mins || 30); });
    if (REVIEW) {
      const mon = mondayOf(d);
      if (inReviewRange(mon) && reviewDayKey(mon) === d) out.push({ kind: 'review', w: reviewWeek(mon), t });
    }
    return out.sort((a, b) => a.t.localeCompare(b.t));
  }
  // Home's "Today's plan" also carries any open review from earlier weeks.
  function todaySessions() {
    const today = todayKey();
    const list = sessionsFor(today);
    const late = overdueReviews();
    if (late.length && !list.some((x) => x.kind === 'review')) list.push({ kind: 'review', w: late[0], t: list.length ? list[list.length - 1].t : state.settings.evening });
    return list;
  }
  function sessRow(x) {
    if (x.kind === 'review') {
      const w = x.w;
      return `<div class="li">${w.complete ? `<span class="check on">${ic('check', 14)}</span>` : `<button class="check" data-act="open-review" data-id="${esc(w.mon)}" aria-label="Open the review"></button>`}
        <div class="grow tap" data-act="open-review" data-id="${esc(w.mon)}"><b>PebblePad review${w.state === 'overdue' ? `, ${esc(weekLabel(w.mon))}` : ''}</b><div class="small muted"><span class="num">${esc(x.t)}</span> · ${(REVIEW && REVIEW.mins) || 20} min · ${w.done} of ${w.total} checked${w.state === 'overdue' ? ' · <span style="color:var(--bad)">still open</span>' : ''}</div></div>
        <span class="cdot" style="background:var(--c-review)"></span></div>`;
    }
    const c = x.c;
    const moved = state.moved[c.id] && state.moved[c.id] !== c.date;
    const box = c.done ? `<button class="check on" data-act="tick" data-id="${esc(c.id)}" aria-label="Mark not done">${ic('check', 14)}</button>` : `<button class="check" data-act="tick" data-id="${esc(c.id)}" aria-label="Mark done"></button>`;
    return `<div class="li">${box}<div class="grow tap" data-act="step" data-id="${esc(c.id)}"><b style="${c.done ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(c.title)}</b><div class="small muted"><span class="num">${esc(x.t)}</span> · ${c.mins || 30} min${moved ? ' · <span style="color:var(--gold)">moved</span>' : ''}${state.energy[todayKey()] === 'low' && c.dateEff === todayKey() ? ' · lighter evening' : ''}</div></div><span class="cdot" style="background:${colOf(c.course)}"></span></div>`;
  }

  /* ---------- Home ---------- */
  V.home = () => {
    const today = todayKey();
    const r = portfolioReadiness();
    const ns = nextStep();
    const e = state.energy[today];
    let html = '';
    if (APP && !state.settings.alarmSetupSeen) {
      html += `<div class="notice warn"><span class="ic">${ic('bell', 16)}</span><div><b>Check your alarms once</b><p>Open the alarm checks, fix anything marked red, then test the alarm. Two minutes.</p><div class="btnrow" style="margin-top:8px"><button class="btn sm" data-act="goto-alarms">Check alarms</button><button class="btn sm ghost" data-act="dismiss-alarms">Later</button></div></div></div>`;
    }
    if (PORT) {
      html += `<div class="card ready tap" data-go="progress">
        <div class="ring">${ringSVG(r.pct, 96, 9)}<div class="v num">${r.pct}%<small>ready today</small></div></div>
        <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
          <div class="label">Module 3 portfolio · ${r.days} days</div>
          <div style="font-family:var(--f-display);font-weight:600;font-size:16px">${r.band[1] === 'On track' ? 'On track' : r.band[1] === 'Ahead of plan' ? '<span style="color:var(--good)">Ahead of plan</span>' : '<span style="color:var(--warn)">Behind plan</span>'} for the <span style="color:var(--accent)">discussion</span></div>
          <div class="small muted">Expected by today: <b class="num" style="color:var(--ink)">${r.expected}%</b>. Everything must be uploaded before ${esc(shortDate(r.end))}.</div>
        </div></div>`;
    }
    if (ns) {
      if (ns.type === 'review') {
        html += `<div class="card nextstep"><div class="label">Your one next step</div><h3 style="font-size:18px">PebblePad review: ${ns.mins} min</h3><div class="small" style="opacity:.8">${esc(ns.why)}</div>
          <div class="row"><button class="btn sm" data-act="open-review" data-id="${esc(ns.week.mon)}">${ic('play', 14)} Start now</button><button class="btn sm ghost" data-act="why-next">Why this?</button></div></div>`;
      } else {
        const c = ns.c;
        const ahead = ns.type === 'ahead';
        html += `<div class="card nextstep"><div class="label">${ahead ? 'Next in your plan' : 'Your one next step'}</div><h3 style="font-size:18px">${esc(c.title)}: ${c.mins || 30} min</h3>
          <div class="small" style="opacity:.8">${esc(courseShort(c.course))} · ${esc(c.deadline.title)}. ${esc(ns.why)}</div>
          <div class="row">${ahead ? `<button class="btn sm" data-act="pull" data-id="${esc(c.id)}">${ic('play', 14)} Do it tonight</button>` : `<button class="btn sm" data-act="start-step" data-id="${esc(c.id)}">${ic('play', 14)} Start now</button>`}<button class="btn sm ghost" data-act="why-next">Why this?</button></div></div>`;
      }
    }
    if (state.settings.energyCheck !== false) {
      html += `<div class="card"><div class="row between"><h3>How's your energy today?</h3>${e === 'low' ? '<span class="pill warn">low</span>' : e === 'high' ? '<span class="pill good">high</span>' : e === 'okay' ? '<span class="pill info">okay</span>' : ''}</div>
        <div class="chips">${[['low', 'Low, keep it light'], ['okay', 'Okay'], ['high', 'Good, push me']].map(([k, l]) => `<button class="chip" data-act="energy" data-id="${k}" aria-pressed="${e === k}">${l}</button>`).join('')}</div></div>`;
    }
    const mon = mondayOf(today);
    let week = 0;
    for (let d = mon; d <= today; d = addDays(d, 1)) week += studiedOn(d);
    const st = streak();
    html += `<div class="stats"><div class="stat"><b class="num" style="color:var(--gold)">${st}</b><span>evening streak</span></div><div class="stat"><b class="num">${dueCards().length}</b><span>cards due</span></div><div class="stat"><b class="num">${hm(week)}</b><span>this week</span></div></div>`;
    const ts = todaySessions();
    html += `<div class="card"><div class="row between"><h3>Today's plan</h3><button class="small" data-tab="plan" style="color:var(--accent);font-weight:700">Planner</button></div>
      ${ts.length ? `<div class="list">${ts.map(sessRow).join('')}</div>` : `<div class="small muted">${isWeekday(today) ? 'Nothing planned tonight.' : 'Nothing planned. Enjoy the weekend.'}</div>`}
      ${APP ? `<div class="small muted" id="alarm-line">${state.settings.alarms === false ? 'Alarms are off.' : nextAlarmText()}</div>` : ''}</div>`;
    const healOff = state.settings.heal === false;
    const stale = allChunks(deadlines()).filter((c) => !c.done && c.dateEff < today && (healOff || (lastDayFor(c) && lastDayFor(c) < today)));
    if (stale.length) {
      const groups = {};
      stale.forEach((c) => { (groups[c.deadline.id] = groups[c.deadline.id] || { d: c.deadline, n: 0 }).n++; });
      html += `<div class="card" style="border-color:var(--warn)"><div class="row between"><h3>${healOff ? 'Catch up' : 'Check these'}</h3>${healOff ? '<button class="btn sm ghost" data-act="move-all">Spread them out</button>' : ''}</div>
        <div class="small muted">${healOff ? 'Not ticked off on the night.' : 'Not ticked off, and the deadline has passed, so they were left where they were. If the work went in, tick them.'}</div>
        <div class="list">${Object.values(groups).map((g) => `<div class="li"><div class="grow"><b>${esc(g.d.title)}</b><div class="small muted">${plural(g.n, 'step')} · due ${esc(shortDate(g.d.due))}</div></div>${healOff ? '' : `<button class="btn sm ghost" data-act="tick-group" data-id="${esc(g.d.id)}">It went in</button>`}</div>`).join('')}</div></div>`;
    }
    if (reflectionDue()) {
      html += `<div class="card" style="border-color:var(--gold)"><div class="label">Weekly reflection · ${esc(weekLabel(mon))}</div><h3>How did this week go?</h3><div class="small muted">Two minutes. It decides how full next week's evenings are.</div><button class="btn sm" data-go="goals" style="align-self:flex-start">Write it</button></div>`;
    }
    const recent = state.log.find((x) => !x.undone && x.kind !== 'check' && x.at > now().getTime() - 3 * 86400000);
    const pats = patterns();
    const insight = recent ? { h: recent.what, p: recent.why } : pats.length ? { h: 'What the app sees in your weeks', p: pats[0] } : { h: 'Ask tutor knows your week', p: 'Tap Ask tutor: your own Claude account opens with this week’s plan ready to paste into your question.' };
    html += `<div class="notice tap" data-go="log"><span class="ic">${ic('spark', 16)}</span><div><b>${esc(insight.h)}</b><p>${esc(insight.p)}</p></div></div>`;
    const dls = deadlines().filter((d) => d.due && d.due >= today && !d.complete).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 4);
    html += `<div class="card"><div class="row between"><div class="label">Next deadlines</div><button class="small" data-go="deadlines" style="color:var(--accent);font-weight:700">All</button></div>
      <div class="list">${dls.map((d) => { const n = daysBetween(today, d.due); return `<div class="li tap" data-go="deadlines"><span class="cdot" style="background:${colOf(d.course)}"></span><div class="grow"><b>${esc(d.title)}</b><div class="small muted">${esc(courseName(d.course))}${d.status !== 'confirmed' ? ' · ' + esc(STATUS_LABEL[d.status] || '') : ''}</div></div><div style="text-align:right;flex:0 0 auto"><div class="small"><b>${esc(shortDate(d.due))}</b></div><div class="small muted num">${n === 0 ? 'today' : n === 1 ? '1 day' : n + ' days'}</div></div></div>`; }).join('') || '<div class="small muted">Nothing due.</div>'}</div></div>`;

  };

  /* ---------- Planner ---------- */
  V.plan = () => {
    const today = todayKey();
    const d = sub.day || today;
    const mon = mondayOf(d);
    const days = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(mon, i));
    const load = loadMap();
    const used = (k) => sessionsFor(k).reduce((a, x) => a + (x.kind === 'review' ? ((x.w.complete ? 0 : (REVIEW.mins || 20))) : (x.c.done ? 0 : x.c.mins || 0)), 0);
    const list = sessionsFor(d);
    const dues = deadlines().filter((x) => x.due === d);
    const note = state.log.find((x) => !x.undone && ['heal', 'replan', 'check', 'energy', 'reflect'].includes(x.kind) && x.at > now().getTime() - 2 * 86400000);
    const capD = capFor(d);
    const status = (x) => {
      if (x.kind === 'review') {
        const w = x.w;
        return w.complete ? '<span class="pill good">Done</span>' : `<button class="btn sm ghost" data-act="open-review" data-id="${esc(w.mon)}">Open</button>`;
      }
      const c = x.c;
      const moved = state.moved[c.id] && state.moved[c.id] !== c.date;
      if (c.done) return '<span class="pill good">Done</span>';
      if (d < today) return '<span class="pill bad">Missed</span>';
      if (d === today) return `<button class="btn sm ghost" data-act="miss" data-id="${esc(c.id)}">I'll miss it</button>`;
      return moved ? '<span class="pill gold">Moved</span>' : '<span class="pill info">Planned</span>';
    };
    return `
      <div class="weeknav"><button data-act="plan-week" data-id="-7" aria-label="Previous week">${ic('back', 16)}</button><span class="label">${mon === mondayOf(today) ? 'This week' : esc(weekLabel(mon))}</span><button data-act="plan-week" data-id="7" aria-label="Next week">${ic('fwd', 16)}</button></div>
      <div class="week">${days.map((k) => { const m = load[k] || 0; const cap = capFor(k); return `<button class="day" data-act="day" data-id="${k}" aria-pressed="${k === d}">${esc(fmt(k, { weekday: 'short' }))}<b class="num">${parseKey(k).getDate()}</b><span class="load${isWeekday(k) && m > cap ? ' over' : ''}"><i style="width:${isWeekday(k) ? Math.min(100, (m / cap) * 100) : (m ? 100 : 0)}%"></i></span></button>`; }).join('')}</div>
      ${note ? `<div class="notice"><span class="ic">${ic('spark', 16)}</span><div><b>Plan updated</b><p>${esc(note.what)}. ${esc(note.why)}</p></div></div>` : ''}
      <div class="row between"><div class="label">${esc(fmt(d, { weekday: 'short', day: 'numeric', month: 'short' }))} · ${used(d)} of ${isWeekday(d) ? capD : 0} min</div>${!isWeekday(d) ? '<span class="pill info">Weekend</span>' : state.weekCap[mon] ? `<span class="pill gold">${state.weekCap[mon] < state.settings.cap ? 'Lighter week' : 'Fuller week'}</span>` : state.energy[d] === 'low' ? '<span class="pill warn">Lighter evening</span>' : ''}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${dues.map((x) => `<button class="sess due tap" data-go="deadlines"><span class="t">${x.kind === 'event' ? 'On' : 'Due'}</span><div style="min-width:0"><b class="ttl">${esc(x.title)}</b><div class="small muted">${esc(courseName(x.course))}${x.how ? ' · ' + esc(x.how) : ''}</div></div><span class="cdot" style="background:${colOf(x.course)}"></span></button>`).join('')}
        ${list.length ? list.map((x) => x.kind === 'review'
          ? `<div class="sess"><span class="t">${esc(x.t)}</span><div style="min-width:0" class="tap" data-act="open-review" data-id="${esc(x.w.mon)}"><b class="ttl">PebblePad review</b><div class="small muted">Portfolio · ${(REVIEW.mins || 20)} min · ${x.w.done} of ${x.w.total} checked</div></div>${status(x)}</div>`
          : `<div class="sess${!x.c.done && d < today ? ' missed' : ''}${state.moved[x.c.id] && state.moved[x.c.id] !== x.c.date && !x.c.done ? ' moved' : ''}"><span class="t">${esc(x.t)}</span><div style="min-width:0" class="tap" data-act="step" data-id="${esc(x.c.id)}"><b class="ttl">${esc(x.c.title)}</b><div class="small muted">${esc(courseName(x.c.course))} · ${x.c.mins || 30} min${state.moved[x.c.id] && state.moved[x.c.id] !== x.c.date ? ` · moved from ${esc(fmt(x.c.date, { weekday: 'short' }))}` : ''}</div></div>${status(x)}</div>`).join('')
          : (dues.length ? '' : `<div class="card small muted">${isWeekday(d) ? 'Nothing planned.' : 'Weekends stay free unless you move a step here.'}</div>`)}
      </div>
      <div class="card"><h3>How the planner decides</h3>
        <div class="small muted">Closest deadline first, inside the minutes you allow each evening. ${state.settings.heal === false ? 'Missed steps stay where they are until you move them.' : 'Missed steps are moved, never dropped: each goes to the first weekday evening with room before its deadline.'} If an evening is over your limit, Re-plan moves the step with the furthest deadline first. Christmas and Easter weeks stay free unless a deadline needs them.</div>
        <button class="btn sm ghost" data-go="settings" style="align-self:flex-start">Study hours: ${esc(state.settings.cap)} min weekday evenings from ${esc(state.settings.evening)}</button></div>`;
  };

  // A step's details, from the planner or Home
  function stepSheet(id) {
    const c = allChunks(deadlines()).find((x) => x.id === id);
    if (!c) return;
    const d = c.deadline;
    sheet(`<div class="row"><span class="cdot" style="background:${colOf(c.course)}"></span><span class="label">${esc(courseName(c.course))}</span></div>
      <h3>${esc(c.title)}</h3>
      <div class="small muted">${esc(fmtLong(c.dateEff))} · ${c.time ? esc(c.time) + ' · ' : ''}${c.mins || 30} min · for ${esc(d.title)}${d.due ? `, due ${esc(shortDate(d.due))}` : ''}</div>
      ${c.tip ? `<div class="step">${esc(c.tip)}</div>` : ''}
      <div class="btnrow">
        <button class="btn sm" data-act="${c.done ? 'untick' : 'tick'}" data-id="${esc(c.id)}">${c.done ? 'Mark not done' : 'Done'}</button>
        ${c.done ? '' : `<button class="btn sm ghost" data-act="start-step" data-id="${esc(c.id)}">${ic('play', 14)} Start now</button><button class="btn sm ghost" data-act="move" data-id="${esc(c.id)}">${ic('move', 14)} Next free evening</button>`}
      </div>
      <div class="btnrow"><a class="btn sm ghost" href="${esc(chunkGcal(c))}" target="_blank" rel="noopener">${ic('cal', 14)} Add to calendar</a><button class="btn sm ghost" data-act="ask" data-q="${esc(stepPrompt(c))}">${ic('spark', 14)} Ask tutor</button></div>`);
  }
  function stepPrompt(c) {
    return `I am working on a step from my study plan: "${c.title}" (${c.mins || 30} minutes) for "${c.deadline.title}"${c.deadline.due ? `, due ${fmtLong(c.deadline.due)}` : ''}.${c.tip ? ` My planner's tip: ${c.tip}` : ''}\n\nHelp me start. Ask me one question at a time and do not write the work for me: my tutor wants it in my own words.`;
  }

  /* ---------- Study ---------- */
  let quiz = null;
  let fcFlip = false;
  V.study = () => {
    const tab = sub.stab || 'quiz';
    const seg = `<div class="seg">${[['quiz', 'Quiz'], ['cards', 'Cards'], ['mistakes', 'Mistakes'], ['papers', 'Papers']].map(([k, l]) => `<button data-act="stab" data-id="${k}" aria-pressed="${tab === k}">${l}${k === 'cards' ? ` <span class="num">${dueCards(sub.cardTopic).length}</span>` : k === 'mistakes' ? ` <span class="num">${state.mistakes.length}</span>` : ''}</button>`).join('')}</div>`;
    return seg + ({ quiz: quizView, cards: cardsView, mistakes: mistakesView, papers: papersView }[tab])();
  };
  function quizView() {
    if (!quiz) {
      const weak = weakTopics(3);
      return `<div class="card"><div class="label">Smart quiz · 5 questions · about 6 min</div><h3>Picked from your weakest topics</h3>
        <div class="list">${weak.map((t) => `<div class="li"><span class="cdot" style="background:${colOf(t.c)}"></span><div class="grow">${esc(t.name)}</div><span class="pill ${mState(t.m)[0]} num">${t.m == null ? 'new' : t.m + '%'}</span></div>`).join('')}</div>
        <div class="small muted">Each answer updates your mastery score. Wrong answers go to your mistake notebook and come back as review cards.</div>
        <button class="btn block" data-act="quiz-start">Start quiz</button></div>
        <div class="card"><h3>Other quizzes</h3><div class="list">${['pgce', 'assess'].map((k) => { const m = courseMastery(k); return `<button class="li tap" data-act="quiz-start" data-id="${k}" style="width:100%;text-align:left"><span class="cdot" style="background:${colOf(k)}"></span><div class="grow">${esc(courseName(k))}<div class="small muted">10 questions, mixed topics</div></div><span class="pill info">${m == null ? 'new' : m + '%'}</span></button>`; }).join('')}</div></div>`;
    }
    if (quiz.i >= quiz.qs.length) {
      const deltas = Object.entries(quiz.deltas);
      return `<div class="card" style="align-items:center;text-align:center"><div class="ring">${ringSVG((quiz.score / quiz.qs.length) * 100, 96, 9)}<div class="v num">${quiz.score}/${quiz.qs.length}<small>correct</small></div></div><h3>Quiz complete</h3><div class="small muted">Your mastery scores and weak spots have been updated.</div></div>
        <div class="card"><h3>What changed</h3><div class="list">${deltas.map(([t, dl]) => `<div class="li"><div class="grow">${esc(TOPICS[t].name)}</div><span class="pill ${dl >= 0 ? 'good' : 'bad'} num">${mastery(t)}% (${dl >= 0 ? '+' : ''}${dl})</span></div>`).join('')}</div></div>
        <div class="row"><button class="btn grow" data-tab="home">See Home</button><button class="btn ghost grow" data-tab="progress">See Progress</button></div>
        <button class="btn ghost" data-act="quiz-reset">Another smart quiz</button>`;
    }
    const q = quiz.qs[quiz.i];
    const m = mastery(q.t);
    return `<div class="row between"><span class="label">Question ${quiz.i + 1} of ${quiz.qs.length}</span><span class="pill info">${esc(TOPICS[q.t].name)} · <span class="num">${m == null ? 'new' : m + '%'}</span></span></div>
      <div class="bar"><i style="width:${(quiz.i / quiz.qs.length) * 100}%"></i></div>
      <div class="card"><h3 style="font-size:17px;line-height:1.35">${esc(q.q)}</h3></div>
      <div style="display:flex;flex-direction:column;gap:8px">${q.o.map((o, k) => `<button class="qopt ${quiz.picked !== null ? (k === q.a ? 'right' : k === quiz.picked ? 'wrong' : '') : ''}" data-act="ans" data-id="${k}" ${quiz.picked !== null ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>
      ${quiz.picked !== null ? `<div class="notice" style="background:${quiz.picked === q.a ? 'var(--good-soft)' : 'var(--bad-soft)'}"><div><b>${quiz.picked === q.a ? 'Correct' : 'Not quite'}</b><p>${esc(q.why)}${quiz.picked !== q.a ? ' Saved to your mistakes, and it comes back as a review card.' : ''}</p><p class="num"><b>${esc(TOPICS[q.t].name)}: ${quiz.lastFrom == null ? 'new' : quiz.lastFrom + '%'} → ${m}%</b></p></div></div><button class="btn block" data-act="quiz-next">${quiz.i + 1 < quiz.qs.length ? 'Next question' : 'See results'}</button>` : ''}`;
  }
  function answer(k) {
    const q = quiz.qs[quiz.i];
    const before = mastery(q.t);
    const base = before == null ? 50 : before;
    quiz.picked = k;
    quiz.lastFrom = before;
    let after;
    if (k === q.a) { after = Math.round(base + (100 - base) * 0.16); quiz.score++; } else {
      after = Math.round(base - base * 0.12);
      state.mistakes.unshift({ t: q.t, q: q.q, your: q.o[k], right: q.o[q.a], why: q.why, at: todayKey() });
      if (state.mistakes.length > 60) state.mistakes.length = 60;
      const id = 'm' + uid();
      state.extraCards.push({ id, f: q.q, b: q.o[q.a] + '\n' + q.why, t: q.t, mistake: true });
    }
    state.mastery[q.t] = clamp(after, 0, 100);
    quiz.deltas[q.t] = (quiz.deltas[q.t] || 0) + (after - base);
    commit();
    render();
  }
  function finishQuiz() {
    const d = Object.entries(quiz.deltas).sort((a, b) => a[1] - b[1]);
    addStudy(Math.max(3, quiz.qs.length));
    const f = (state.formats['Practice quiz'] = state.formats['Practice quiz'] || { n: 0 });
    f.n++;
    if (d.length && d[0][1] < 0) {
      addLog({ kind: 'study', what: `${TOPICS[d[0][0]].name} needs another look`, why: `It dropped to ${mastery(d[0][0])}% in the quiz. It is now first in your weak spots, and the wrong answers are in your review cards.` });
    } else {
      addLog({ kind: 'study', what: 'Strong quiz', why: `${quiz.score} of ${quiz.qs.length} right. The next smart quiz moves on to the next gap.` });
    }

    toast(`<b>Mastery updated.</b> ${quiz.score} of ${quiz.qs.length} right.`);
  }
  function cardsView() {
    const topic = sub.cardTopic || null;

    const filter = topic ? `<div class="row between"><span class="pill info">${esc(TOPICS[topic].name)}</span><button class="linkish" data-act="card-topic" data-id="">Show all topics</button></div>` : '';
    if (!due.length) return filter + `<div class="card" style="align-items:center;text-align:center"><h3>All caught up</h3><div class="small muted">New cards arrive each day, ${NEW_PER_DAY} at a time. Wrong quiz answers are added automatically.</div></div>`;
    const c = due[0];
    const st = state.cards[c.id];
    return filter + `<div class="row between"><span class="label">${due.length} due · spaced repetition</span><span class="pill info">${esc(TOPICS[c.t] ? TOPICS[c.t].name : '')}</span></div>

      ${fcFlip ? `<div class="small muted" style="text-align:center">How well did you know it? Each button shows when you will see it again.</div><div class="srs">${['Again', 'Hard', 'Good', 'Easy'].map((l, g) => `<button data-act="grade" data-id="${g}">${l}<small>${ivLabel(srsNext(st, g))}</small></button>`).join('')}</div>` : ''}`;
  }
  function grade(g) {
    const c = dueCards(sub.cardTopic || null)[0];
    if (!c) return;
    const today = todayKey();
    const st = state.cards[c.id] || { iv: 0, ease: 2.5, first: today };
    const iv = srsNext(state.cards[c.id], g);
    st.iv = iv;
    st.ease = clamp(st.ease + [-0.2, -0.15, 0, 0.15][g], 1.3, 3);
    st.due = addDays(today, iv);
    st.at = now().getTime();
    state.cards[c.id] = st;
    if (TOPICS[c.t]) { const m = mastery(c.t); state.mastery[c.t] = clamp((m == null ? 50 : m) + [-3, 0, 2, 3][g], 0, 100); }
    const f = (state.formats.Flashcards = state.formats.Flashcards || { n: 0 });
    f.n++; f.yes = (f.yes || 0) + (g >= 2 ? 1 : 0); f.partly = (f.partly || 0) + (g === 1 ? 1 : 0);

  function mistakesView() {

  /* ---------- Learn: a topic lesson, or a planned step with a timer ---------- */
  let timer = null;

    } else if (fmtNow === 'Short video') {

      <div class="card"><h3>Portfolio parts</h3><div style="display:flex;flex-direction:column;gap:10px">${parts.map((x) => `<button class="tap" data-act="ppage" data-id="${x.page}" style="text-align:left"><div class="row between small"><span>${esc(x.label)}</span><span class="row" style="gap:6px"><span class="pill ${pctState(x.pct)[0]}">${pctState(x.pct)[1]}</span><b class="num">${x.have}/${x.need}</b></span></div><div class="bar" style="margin-top:4px"><i style="width:${x.pct}%;background:${x.pct >= 100 ? 'var(--good)' : 'var(--accent)'}"></i></div></button>`).join('')}</div></div>
      <button class="btn" data-act="ev-new">${ic('plus', 16)} Add evidence</button>

      <div class="card"><div class="row between"><h3>Recent evidence</h3><button class="small" data-act="ppage" data-id="ksb" style="color:var(--accent);font-weight:700">Evidence log</button></div>

      <div class="btnrow">${w.complete ? '' : `<button class="btn sm ghost" data-act="review-all" data-id="${esc(w.mon)}">Tick them all</button>`}${w.skipped ? `<button class="btn sm ghost" data-act="review-unskip" data-id="${esc(w.mon)}">Undo skip</button>` : (w.complete ? '' : `<button class="btn sm ghost" data-act="review-skip" data-id="${esc(w.mon)}">No review this week</button>`)}</div></div>`;
    return `<div class="small muted">Each week, check the parts of your PebblePad portfolio that change. Tick each one once you have looked at it, even if there was nothing to add. An open week stays on Home until it is done.</div>
      ${shown.map(card).join('') || '<div class="card small muted">No review this week.</div>'}
      ${past.length ? `<div class="card"><h3>Finished weeks</h3><div class="list">${past.map((w) => `<button class="li tap" data-act="open-review" data-id="${esc(w.mon)}" style="width:100%;text-align:left"><div class="grow">${esc(weekLabel(w.mon))}</div><span class="pill ${w.skipped ? '' : 'good'}">${w.skipped ? 'skipped' : 'done'}</span></button>`).join('')}</div></div>` : ''}`;
  };

  PP.ksb = () => {
    const f = sub.ksbFilter || 'all';
    const covered = ksbCovered();
    const ids = KSB_IDS.filter((k) => f === 'all' || (f === 'gaps' ? !covered.has(k) : k[0] === f));

    html += `<div class="card"><div class="row between"><h3>Time studied</h3><span class="small muted num">${tw.reduce((a, b) => a + b, 0)} min this week · ${lw.reduce((a, b) => a + b, 0)} last week</span></div>${weekChart(tw, lw)}</div>`;
    html += `<div class="card"><h3>What works for you</h3><div class="small muted">How often each format stuck, from your "Did that stick?" answers and card ratings. The app leads with the top one.</div>
      ${rated.length ? `<div style="display:flex;flex-direction:column;gap:9px">${rated.map(([n, f, rr], i) => `<div><div class="row between small"><span>${esc(n)}${i === 0 && rr != null ? ' <span class="pill gold">Your best</span>' : ''}</span><span class="muted num">${rr == null ? '' : rr + '% · '}${plural(f.n, 'session')}</span></div><div class="bar" style="margin-top:4px"><i style="width:${rr || 0}%;background:${i === 0 ? 'var(--gold)' : 'var(--accent)'}"></i></div></div>`).join('')}</div>` : '<div class="small muted">Nothing yet. Use Learn and Cards a few times and this fills in.</div>'}</div>`;
    return html;
  };
  function weekChart(tw, lw) {
    const W = 320; const H = 130; const pl = 28; const pb = 20; const bw = 18;
    const max = Math.max(60, ...tw, ...lw);
    const y = (v) => H - pb - (v / max) * (H - pb - 8);
    const today = todayKey();
    const mon = mondayOf(today);
    let g = '';
    [0, Math.round(max / 2), max].forEach((v) => { g += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`; });
    ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].forEach((d, i) => {
      const cx = pl + 18 + i * ((W - pl - 24) / 6);
      g += `<rect x="${cx - bw / 2 - 5}" y="${y(lw[i])}" width="${bw / 2}" height="${H - pb - y(lw[i])}" rx="2" fill="var(--line)"/>`;
      g += `<rect x="${cx - bw / 2 + 5}" y="${y(tw[i])}" width="${bw / 1.6}" height="${H - pb - y(tw[i])}" rx="3" fill="${addDays(mon, i) === today ? 'var(--gold)' : 'var(--accent)'}"/>`;
      g += `<text x="${cx}" y="${H - 5}" text-anchor="middle">${d}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Minutes studied each day this week against last week">${g}</svg><div class="row small muted" style="gap:14px"><span class="row" style="gap:6px"><span class="cdot" style="background:var(--accent)"></span>This week</span><span class="row" style="gap:6px"><span class="cdot" style="background:var(--line)"></span>Last week</span><span>minutes</span></div>`;
  }

  /* ---------- More ---------- */
  V.more = () => {
    const mon = mondayOf(todayKey());
    const tiles = [
      ['courses', 'Courses', '2 active'],
      ['learn', 'Learn', 'Today’s lesson'],
      ['library', 'Library', plural(LIBRARY.length + state.library.length, 'resource')],
      ['terms', 'Key terms & models', plural(MODELS.length + DECK.length, 'item')],
      ['goals', 'Goals & reflection', state.reflections[mon] ? '3 goals · reflected' : reflectionDue() ? '3 goals · reflection due' : '3 goals'],
      ['log', 'How it adapts', plural(state.log.length, 'decision')],
      ['settings', 'Settings', 'Hours, alarms, display'],
      ['about', 'What makes it smart', 'About this app']
    ];
    return `<div class="tiles">${tiles.map(([k, n, s]) => `<button class="tile" data-go="${k}"><b>${esc(n)}</b><span>${esc(s)}</span></button>`).join('')}</div>`;
  };

  V.courses = () => ['pgce', 'assess'].map((k) => {
    const c = COURSES[k];
    const m = courseMastery(k);
    const nd = nextDeadlineFor(k);
    const steps = allChunks(deadlines()).filter((x) => x.course === k);
    const done = steps.filter((x) => x.done).length;
    return `<div class="card"><div class="row"><span class="cdot" style="background:${colOf(k)}"></span><h3 class="grow">${esc(c.name)}</h3><span class="pill info num">${m == null ? 'new' : m + '%'}</span></div>
      <div class="small muted">${esc(c.detail || '')}</div>
      <div class="small muted">${topicList(k).length} topics · ${done} of ${steps.length} plan steps done${nd ? ` · next: ${esc(nd.title)}, ${esc(shortDate(nd.due))}` : ''}</div>
      <div class="bar"><i style="width:${steps.length ? (done / steps.length) * 100 : 0}%;background:${colOf(k)}"></i></div>
      <div class="chips">${topicList(k).map(([id, t]) => `<button class="chip" data-act="learn" data-id="${id}">${esc(t.name)} <span class="num muted">${mastery(id) == null ? '' : mastery(id) + '%'}</span></button>`).join('')}</div>
      <div class="btnrow"><button class="btn sm ghost" data-act="deadlines-for" data-id="${k}">Deadlines</button>${k === 'pgce' ? '<button class="btn sm ghost" data-tab="portfolio">Portfolio</button>' : ''}</div></div>`;
  }).join('') + '<button class="btn ghost" data-go="add">+ Add a deadline</button>';

  V.library = () => {
    const q = (sub.q || '').trim().toLowerCase();
    const f = sub.lf || 'All';
    const all = LIBRARY.concat(state.library);
    const weak = weakTopics(4).map((t) => t.id);
    let items = all.filter((it) => f === 'All' || (f === 'Favourites' ? state.favs[it.id] : it.type === f));
    if (q) items = items.filter((it) => (it.title + ' ' + (it.text || '') + ' ' + (TOPICS[it.t] ? TOPICS[it.t].name : '') + ' ' + (it.note || '')).toLowerCase().includes(q));
    const typeCol = { PDF: 'var(--bad)', Slides: 'var(--gold)', Doc: 'var(--accent)', Link: 'var(--c-assess)', Note: 'var(--c-other)' };
    const row = (it) => `<div class="res li"><span class="ftype" style="background:color-mix(in srgb,${typeCol[it.type] || 'var(--muted)'} 14%,transparent);color:${typeCol[it.type] || 'var(--muted)'}">${esc(String(it.type).slice(0, 4).toUpperCase())}</span><div style="min-width:0"><b>${esc(it.title)}</b><div class="small muted">${esc(courseShort(it.c))} · ${esc(TOPICS[it.t] ? TOPICS[it.t].name : '')} · ${esc(it.meta || 'Yours')}${state.favs[it.id] ? ' · favourite' : ''}</div></div><button class="iconbtn" data-act="res" data-id="${esc(it.id)}" aria-label="Actions for ${esc(it.title)}">${ic('dots', 18)}</button></div>`;
    const sugg = all.filter((it) => weak.includes(it.t)).slice(0, 2);
    return `<div class="search">${ic('search', 18)}<input id="libq" type="search" placeholder="Search your library" value="${esc(sub.q || '')}" autocomplete="off"></div>
      <div class="chips">${['All', 'Slides', 'Doc', 'PDF', 'Note', 'Link', 'Favourites'].map((x) => `<button class="chip" data-act="lf" data-id="${x}" aria-pressed="${f === x}">${x}</button>`).join('')}</div>
      ${!q && sugg.length ? `<div class="card"><div class="row between"><h3>Suggested for your weak topics</h3>${ic('spark', 16)}</div><div class="list">${sugg.map(row).join('')}</div></div>` : ''}
      <div class="card"><div class="label">${q ? plural(items.length, 'match', 'matches') : 'Your files and links'}</div><div class="list">${items.map(row).join('') || '<div class="small muted">No matches.</div>'}</div></div>
      <div class="small muted">The files marked Taught session, Handbook and Your work live in your PGCE project on Claude. Ask the tutor about one and Claude can read it there.</div>`;
  };
  function resSheet(id) {
    const it = LIBRARY.concat(state.library).find((x) => x.id === id);
    if (!it) return;
    const mine = state.library.some((x) => x.id === id);
    sheet(`<h3>${esc(it.title)}</h3><div class="small muted">${esc(courseName(it.c))} · ${esc(TOPICS[it.t] ? TOPICS[it.t].name : '')}</div>${it.note ? `<div class="step">${esc(it.note)}</div>` : ''}
      <button class="btn block" data-act="ask" data-q="${esc(`In my PGCE project there is a file called "${it.title}". Summarise its key points in five bullet points, then ask me two questions to check I understand it.`)}">${ic('spark', 16)} Ask the tutor about it</button>
      <button class="btn ghost block" data-act="ask" data-q="${esc(`Make me a five-question multiple-choice quiz from the file "${it.title}" in my PGCE project. Ask one question at a time and wait for my answer.`)}">Quiz me on it</button>
      ${it.link ? `<a class="btn ghost block" href="${esc(it.link)}" target="_blank" rel="noopener">${ic('out', 16)} Open the link</a>` : ''}
      <div class="row"><button class="btn ghost grow" data-act="fav" data-id="${esc(it.id)}">${state.favs[it.id] ? 'Remove favourite' : 'Favourite'}</button>${mine ? `<button class="btn ghost danger grow" data-act="lib-del" data-id="${esc(it.id)}">Delete</button>` : ''}</div>`);
  }
  function libAddSheet() {
    sheet(`<h3>Add to your library</h3>
      <div class="field"><label for="l-title">Title</label><input type="text" id="l-title" placeholder="For example: Rosenshine's principles article"></div>
      <div class="field"><label for="l-link">Link (optional)</label><input type="url" id="l-link" placeholder="https://"></div>
      <div class="two"><div class="field"><label for="l-type">Type</label><select id="l-type">${['Link', 'Note', 'PDF', 'Slides', 'Doc'].map((t) => `<option>${t}</option>`).join('')}</select></div>
        <div class="field"><label for="l-topic">Topic</label><select id="l-topic">${Object.entries(TOPICS).map(([k, t]) => `<option value="${k}">${esc(t.name)}</option>`).join('')}</select></div></div>
      <div class="field"><label for="l-note">Note (searchable)</label><textarea id="l-note" placeholder="Why it is useful, key points"></textarea></div>
      <div class="btnrow"><button class="btn" data-act="lib-save">Add</button><button class="btn ghost" data-act="close-sheet">Cancel</button></div>`);
  }

  V.terms = () => `<div class="label">Models</div>` + MODELS.map((f) => `<div class="card"><div class="row between"><b>${esc(f.k)}</b><span class="pill ${mState(mastery(f.t))[0]}">${esc(TOPICS[f.t].name)}</span></div><div class="formula">${esc(f.f)}</div><div class="row between small muted"><span></span><button class="btn sm ghost" data-act="addcard" data-id="${esc(f.k)}">Add to review</button></div></div>`).join('')
    + `<div class="label">Key terms</div>` + DECK.map((c) => `<div class="card"><div class="row between"><b>${esc(c.f)}</b><span class="pill info">In your cards</span></div><div class="small">${esc(c.b)}</div></div>`).join('');

  /* ---------- Goals & reflection ---------- */
  let reflectDraft = null;
  let reflectEditing = false;
  V.goals = () => {
    const today = todayKey();
    const mon = mondayOf(today);
    const next = addDays(mon, 7);
    const h = hoursTotals();
    const wbIds = ['as-o12', 'as-o36', 'as-o78', 'as-wb'];
    const wbSteps = allChunks(deadlines()).filter((c) => wbIds.includes(c.deadline.id));
    const wbPct = wbSteps.length ? Math.round((wbSteps.filter((c) => c.done).length / wbSteps.length) * 100) : 0;
    const pp = portfolioPct();
    const goals = [
      ['Portfolio complete before the professional discussion', pp, `${pp}% now, ${portfolioReadiness().expected}% expected by today`],
      [`${PORT ? PORT.hoursTarget : 150} lead teaching hours`, PORT ? Math.round((h.lead / PORT.hoursTarget) * 100) : 0, `${h.lead} of ${PORT ? PORT.hoursTarget : 150} hours logged`],
      ['Assessor knowledge workbook sent by 18 December', wbPct, `${wbSteps.filter((c) => c.done).length} of ${wbSteps.length} workbook steps done`]
    ];
    let html = goals.map(([g, p, s]) => `<div class="card"><div class="row between"><b>${esc(g)}</b><span class="num small">${Math.min(100, p)}%</span></div><div class="bar"><i style="width:${Math.min(100, p)}%;background:var(--good)"></i></div><div class="small muted">${esc(s)}</div></div>`).join('');
    const saved = state.reflections[mon];
    if (!reflectDraft || reflectDraft.mon !== mon) reflectDraft = { mon, text: saved ? saved.text || '' : '', moods: saved ? [...(saved.moods || [])] : [], plan: saved ? saved.plan : null };
    const sug = suggestPlan(reflectDraft.moods);
    const plan = reflectDraft.plan || sug.plan;
    if (!saved || reflectEditing) {
      html += `<div class="card"><h3>This week's reflection</h3><div class="small muted">What went well, and what got in the way?</div>
        <textarea id="refl" data-input="refl" placeholder="e.g. Evenings after teaching are hard. Mornings worked better.">${esc(reflectDraft.text)}</textarea>
        <div class="chips">${MOODS.map((m) => `<button class="chip" data-act="mood" data-id="${esc(m)}" aria-pressed="${reflectDraft.moods.includes(m)}">${esc(m)}</button>`).join('')}</div>
        <div class="field"><span class="flabel">Next week, ${esc(weekLabel(next))}</span><div class="seg">${[['lighter', `Lighter ${lighterCap()}m`], ['same', `Usual ${state.settings.cap}m`], ['push', `Fuller ${pushCap()}m`]].map(([k, l]) => `<button data-act="reflect-plan" data-id="${k}" aria-pressed="${plan === k}">${l}</button>`).join('')}</div>
          <span class="help">${!reflectDraft.plan && sug.why ? `Suggested because ${esc(sug.why)}. ` : ''}Lighter moves the least urgent steps to evenings with room before their deadlines.</span></div>
        <div class="btnrow"><button class="btn" data-act="reflect-save">Save reflection</button>${saved ? '<button class="btn ghost" data-act="reflect-cancel">Cancel</button>' : ''}</div></div>`;
    } else {
      html += `<div class="card"><div class="label">${esc(weekLabel(mon))} · saved</div>${saved.text ? `<div class="quote">${esc(saved.text)}</div>` : ''}${saved.moods && saved.moods.length ? `<div class="chips wrap">${saved.moods.map((m) => `<span class="pill info">${esc(m)}</span>`).join('')}</div>` : ''}<div class="small muted">Next week: ${esc(planLabel(saved.plan))}.</div><div class="btnrow"><button class="btn sm ghost" data-act="reflect-edit">Change it</button>${saved.text ? `<button class="btn sm ghost" data-act="copy" data-q="${esc(saved.text)}">Copy the text</button>` : ''}</div></div>`;
    }
    const pats = patterns();
    html += `<div class="notice"><span class="ic">${ic('spark', 16)}</span><div><b>What the app sees in your weeks</b><p>${pats.length ? pats.map(esc).join(' ') : 'After a few weeks of ticks and reflections, this shows which evenings work best for you and what keeps coming up.'}</p></div></div>`;
    const past = Object.entries(state.reflections).filter(([k]) => k !== mon).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 8);
    if (past.length) html += `<div class="card"><h3>Earlier weeks</h3><div class="list">${past.map(([k, rr]) => `<div class="li top"><div class="grow"><b>${esc(weekLabel(k))}</b> <span class="small muted">${esc((rr.moods || []).join(', '))}</span>${rr.text ? `<div class="small muted">${esc(rr.text)}</div>` : ''}</div>${rr.text ? `<button class="btn sm ghost" data-act="copy" data-q="${esc(rr.text)}">Copy</button>` : ''}</div>`).join('')}</div></div>`;
    return html;
  };

  /* ---------- How it adapts ---------- */
  const fmtStamp = (ms) => { const d = new Date(ms); return `${fmt(keyOf(d), { weekday: 'short' })} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  V.log = () => {
    const cutoff = now().getTime() - 7 * 86400000;
    return `<div class="small muted">Every change the app makes to your plan, your review or your study, and why. Nothing is hidden. Changes from the energy check-in, Re-plan and reflections can be undone for a week.</div>
      <div class="card"><div class="list">${state.log.map((e) => `<div class="logi${e.undone ? ' undone' : ''}"><time>${esc(fmtStamp(e.at))}</time><div><b>${esc(e.what)}</b>${e.undone ? ' <span class="pill">undone</span>' : ''}<div class="small muted">${esc(e.why || '')}</div>${e.lines && e.lines.length ? `<ul>${e.lines.slice(0, 8).map((l) => `<li>${esc(l)}</li>`).join('')}${e.lines.length > 8 ? `<li>and ${e.lines.length - 8} more</li>` : ''}</ul>` : ''}${e.undo && !e.undone && e.at > cutoff ? `<button class="btn sm ghost" data-act="undo" data-id="${esc(e.id)}" style="margin-top:6px">Undo</button>` : ''}</div></div>`).join('') || '<div class="small muted">Nothing has changed yet.</div>'}</div></div>`;
  };

  /* ---------- Settings ---------- */
  V.settings = () => {
    const s = state.settings;
    const tg = (k, on, l, h) => `<div class="li"><div class="grow"><b>${esc(l)}</b>${h ? `<div class="small muted">${esc(h)}</div>` : ''}</div>${toggle(on, 'set-toggle', k, l)}</div>`;
    let html = `<div class="card"><h3>Study hours</h3>
      <div class="two"><div class="field"><label for="f-evening">Evening start</label><input type="time" id="f-evening" value="${esc(s.evening)}" data-set="evening"></div>
        <div class="field"><label for="f-review">Review day</label><select id="f-review" data-set="reviewDay">${DAY_NAMES.map((n, i) => `<option value="${i + 1}"${reviewDayNum() === i + 1 ? ' selected' : ''}>${n}</option>`).join('')}</select></div></div>
      <label class="small" for="f-cap">Weekday evenings: <b class="num" id="capv">${esc(s.cap)} min</b> at most</label><input id="f-cap" type="range" min="20" max="180" step="5" value="${esc(s.cap)}" data-set="cap">
      <div class="list">${tg('heal', s.heal !== false, 'Move missed steps for me', 'To the first evening with room before the deadline')}${tg('energyCheck', s.energyCheck !== false, 'Energy check-in on Home', '')}</div></div>`;
    if (APP) html += alarmCard();
    html += `<div class="card"><h3>Calendar</h3><div class="small muted">${APP ? 'Optional: the alarms do the main job.' : 'A web page cannot ring like an alarm, so this puts your plan in your calendar.'} The file has every step, deadline and the weekly review.</div>
      <div class="btnrow"><button class="btn sm ghost" data-act="ics">${ic('cal', 14)} Download calendar file</button><a class="btn sm ghost" href="${esc(reviewRecurGcal(false))}" target="_blank" rel="noopener">Weekly review in Google Calendar</a></div></div>`;
    html += `<div class="card"><h3>Display and audio</h3><div class="field"><span class="flabel">Light or dark</span><div class="seg">${[['auto', 'Match phone'], ['light', 'Light'], ['dark', 'Dark']].map(([k, l]) => `<button data-act="mode" data-id="${k}" aria-pressed="${(s.mode || 'auto') === k}">${l}</button>`).join('')}</div></div>
      <div class="list">${tg('dys', !!s.dys, 'Dyslexia-friendly display', 'Lexend font, wider spacing, cream background')}${tg('readAloud', s.readAloud !== false, 'Read aloud', 'Lessons can be read aloud on your phone')}</div>
      <div class="small muted">Text size follows your phone's font size setting.</div></div>`;
    html += `<div class="card"><h3>Tutor and your data</h3><div class="small muted">The tutor is your own Claude account, opened inside the app. The app puts your week into the message box when you ask; nothing is sent until you tap send. Your plan and portfolio stay on this phone.</div>
      <div class="field"><span class="flabel">Ask tutor opens</span><div class="seg">${[['project', 'PGCE project'], ['new', 'New chat']].map(([k, l]) => `<button data-act="chat-start" data-id="${k}" aria-pressed="${(s.chatStart || 'project') === k}">${l}</button>`).join('')}</div></div>
      <div class="field"><label for="f-project">PGCE project link</label><input type="url" id="f-project" value="${esc(s.claudeProject || '')}" data-set="claudeProject" placeholder="https://claude.ai/project/..."><span class="help">If the project does not open, copy its address from claude.ai and paste it here.</span></div>
      ${chatReady() ? '<div class="btnrow"><button class="btn sm ghost" data-act="chat-help">How to sign in</button><button class="btn sm danger" data-act="chat-signout">Sign out of Claude</button></div>' : ''}</div>`;
    html += `<div class="card"><h3>PebblePad</h3><div class="field"><label for="f-pp">Your PebblePad link</label><input type="url" id="f-pp" value="${esc(s.pebblepad || '')}" data-set="pebblepad" placeholder="https://..."><span class="help">The address you use to sign in to PebblePad. Open PebblePad on the Portfolio tab uses it.</span></div></div>`;
    html += `<div class="card"><h3>Backup</h3><div class="small muted">Your ticks, portfolio and study are saved on this phone, with a copy kept by the app. Save a backup now and then.</div>
      <div class="btnrow"><button class="btn sm ghost" data-act="backup">Save a backup</button><button class="btn sm ghost" data-act="copy-backup">Copy backup text</button><label class="btn sm ghost" for="f-restore">Restore</label><input type="file" id="f-restore" accept="application/json,.json" class="sr-only" data-input="restore"></div>
      ${confirmReset ? '<div class="notice warn"><div><b>Clear every tick, move, portfolio entry and study record?</b><div class="btnrow" style="margin-top:8px"><button class="btn sm danger" data-act="reset">Yes, clear it</button><button class="btn sm ghost" data-act="cancel-reset">Keep everything</button></div></div></div>' : '<button class="btn sm danger" data-act="ask-reset" style="align-self:flex-start">Clear my progress</button>'}</div>
      <div class="small muted">Deadlines last checked ${esc(fmtYear(DATA.updated || todayKey()))}.${APP ? ` App version ${esc(appStatus().version || '')}.` : ''}</div>`;
    return html;
  };
  function alarmCard() {
    const s = state.settings;
    const st = appStatus();
    const on = s.alarms !== false;
    const vol = Number(st.alarmVolume || 0);
    const checks = [
      ['notifications', !!st.notifications, 'Notifications allowed', 'Needed for the alarm screen and its buttons.'],
      ['fullscreen', st.fullScreen !== false, 'Full-screen alarm allowed', 'Fills the screen when the phone is locked.'],
      ['exact', st.exact !== false, 'Alarms on the dot', 'Without this Android may ring a few minutes late.'],
      ['sound', vol > 0, vol > 0 ? 'Alarm volume is up' : 'Alarm volume is off', 'Rings on your alarm volume, like the Clock app.'],
      ['battery', !!st.battery, 'Battery saving will not stop the app', 'Recommended. Some phones close apps to save battery.']
    ];
    return `<div class="card" id="alarms"><div class="row between"><h3>Alarms</h3>${toggle(on, 'alarms', 'on', 'Alarms')}</div>
      <div class="small muted">Rings like an alarm clock on evenings with steps. If the weekly review or earlier steps are still open, it rings again each weekday evening until you tick them off.</div>
      ${on ? `<div style="font-family:var(--f-display);font-weight:700" id="alarm-next">${nextAlarmText()}</div>
      <div class="two"><div class="field"><label for="f-lead">Ring</label><select id="f-lead" data-set="alarmLead">${[0, 5, 10, 15].map((m) => `<option value="${m}"${Number(s.alarmLead == null ? 5 : s.alarmLead) === m ? ' selected' : ''}>${m ? m + ' min before' : 'At start time'}</option>`).join('')}</select></div>

  /* ---------- the shell: top bars, six tabs, sheets, toasts ---------- */
  const TITLES = { plan: 'Planner', study: 'Study', portfolio: 'Portfolio', progress: 'Progress', more: 'More', courses: 'Courses', learn: 'Learn', library: 'Library', terms: 'Key terms & models', goals: 'Goals & reflection', log: 'How it adapts', settings: 'Settings', about: 'What makes it smart', deadlines: 'Deadlines', add: 'Add a deadline', paper: 'Practice paper' };
  const NAV = [['home', 'Home'], ['plan', 'Plan'], ['study', 'Study'], ['portfolio', 'Portfolio'], ['progress', 'Progress'], ['more', 'More']];
  function renderNav() {
    const top = TABS.includes(route) ? route : (stack.length && TABS.includes(stack[0]) ? stack[0] : 'more');
    $('#nav').innerHTML = NAV.map(([k, l]) => `<button type="button" data-tab="${k}" ${k === top ? 'aria-current="page"' : ''}>${ic(k, 22)}${l}</button>`).join('');

  function appbar() {

  /* ---------- actions ---------- */
  function tick(id, on) {

  function moveChunk(id, why) {

    if (!c) return;
    const today = todayKey();
    const from = c.dateEff < today ? today : addDays(c.dateEff, 1);
    const slot = findSlot(c, from, loadMap(id));
    const to = slot ? slot.day : nextFreeEvening(from, c.mins || 30, id);
    const undo = { [id]: state.moved[id] || null };
    state.moved[id] = to;
