<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cap and Gown</title>
<meta name="capgown-page" content="57">
<meta name="capgown-min-app" content="0">
<meta name="theme-color" content="#3454D9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Studypath design: a top bar per screen, one scrolling screen, six tabs and an Ask tutor button. */
:root{
  --bg:#E9EDF4; --surface:#FFFFFF; --surface2:#F4F6FA; --ink:#111A2E; --muted:#5A6580; --line:#DEE3EC;
  --accent:#3454D9; --accent-ink:#FFFFFF; --accent-soft:#E7ECFC; --gold:#D9921F; --gold-soft:#FBF0DC;
  --good:#17905F; --good-soft:#E1F4EB; --warn:#B87700; --warn-soft:#FAF0D9; --bad:#C93C55; --bad-soft:#FBE6EA;
  --shadow:0 18px 50px rgba(17,26,46,.18);
  --c-pgce:#3454D9; --c-assess:#0E8C8C; --c-other:#9A4FC9; --c-review:#D9921F;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"Manrope",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080C17; --surface:#121A2C; --surface2:#19223A; --ink:#E9EDF7; --muted:#9AA5BF; --line:#263150;
  --accent:#7F98FF; --accent-ink:#0B1020; --accent-soft:#1E2950; --gold:#F0B65A; --gold-soft:#3A2D14;
  --good:#3CC48F; --good-soft:#123327; --warn:#E6AA35; --warn-soft:#3A2E12; --bad:#F27189; --bad-soft:#3D1A24;
  --shadow:0 18px 50px rgba(0,0,0,.5); --c-pgce:#7F98FF; --c-assess:#3CC4C4; --c-other:#C68BF0; --c-review:#F0B65A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080C17; --surface:#121A2C; --surface2:#19223A; --ink:#E9EDF7; --muted:#9AA5BF; --line:#263150;
  --accent:#7F98FF; --accent-ink:#0B1020; --accent-soft:#1E2950; --gold:#F0B65A; --gold-soft:#3A2D14;
  --good:#3CC48F; --good-soft:#123327; --warn:#E6AA35; --warn-soft:#3A2E12; --bad:#F27189; --bad-soft:#3D1A24;
  --shadow:0 18px 50px rgba(0,0,0,.5); --c-pgce:#7F98FF; --c-assess:#3CC4C4; --c-other:#C68BF0; --c-review:#F0B65A; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--surface2);overflow:hidden}
.appbar{flex:0 0 auto;background:var(--surface);padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);min-height:62px;position:relative;z-index:3}
.appbar h2{font-size:19px;flex:1;min-width:0}
.appbar .sub{display:block;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted)}
.appbar .back{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);flex:0 0 34px}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);position:relative;flex:0 0 36px}
.iconbtn svg,.appbar .back svg{width:18px;height:18px}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface2)}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.inner{padding:16px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom,0px));position:relative;z-index:3}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px;min-width:0}
.nav button[aria-current="page"]{color:var(--accent)}
.nav svg{width:22px;height:22px}
body.kb .nav,body.kb .fab{display:none}
.fab{position:absolute;right:16px;bottom:84px;display:flex;align-items:center;gap:8px;padding:12px 16px 12px 12px;background:var(--ink);color:var(--surface);border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:5}
.fab .spark{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.fab .spark svg{width:15px;height:15px}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:15.5px}
.label{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink);text-decoration:none;text-align:center}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.cdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .6s ease;background:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:8px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li.top{align-items:flex-start}
.tap{cursor:pointer}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 24px;color:transparent}
.check svg{width:14px;height:14px}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.check.miss{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--gold-soft)}100%{background:transparent}}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--accent-soft);color:var(--ink)}
.notice .ic{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:0 0 30px}
.notice .ic svg{width:16px;height:16px}
.notice p{margin:2px 0 0;font-size:13.5px}
.notice.warn{background:var(--warn-soft)}
.notice.warn .ic{background:var(--warn);color:#fff}
.linkish{color:var(--accent);font-weight:700;font-size:13px;text-decoration:underline;padding:0}

/* home */
.hello .sub{font-size:13px}
.ready{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1}
.ring .v small{display:block;font-family:var(--f-body);font-size:10px;font-weight:600;color:var(--muted);margin-top:2px}
.nextstep{background:var(--ink);color:var(--surface);border:0}
.nextstep .label{color:inherit;opacity:.65}
.nextstep .btn{background:var(--surface);color:var(--ink)}
.nextstep .btn.ghost{background:transparent;color:inherit;border:1px solid rgba(127,127,127,.5)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:20px}
.stat span{font-size:12px;color:var(--muted)}

/* planner */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;font-size:12px;color:var(--muted);font-weight:600}
.day b{font-family:var(--f-display);font-size:15px;color:var(--ink)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.day[aria-pressed="true"] b{color:var(--surface)}
.day .load{width:22px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.day .load i{display:block;height:100%;background:var(--accent)}
.day .load.over i{background:var(--bad)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav button{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.weeknav svg{width:16px;height:16px}
.sess{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.sess .t{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.sess.missed{opacity:.6}
.sess.missed .ttl{text-decoration:line-through}
.sess.moved{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.sess.due{border-style:dashed}

/* study */
.qopt{width:100%;text-align:left;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.qopt.right{border-color:var(--good);background:var(--good-soft)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fc{min-height:190px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;gap:10px;width:100%}
.fc .face{font-family:var(--f-display);font-size:19px;font-weight:600}
.srs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.srs button{display:flex;flex-direction:column;align-items:center;padding:9px 4px;border-radius:12px;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.srs button small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.step{padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.formula{font-family:var(--f-mono);font-size:14px;background:var(--surface2);padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.timer{font-family:var(--f-mono);font-size:34px;font-weight:600;text-align:center}

/* overlay, sheets, toast */
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--surface2)}
.overlay .appbar{padding-top:12px}
.overlay .chips{padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.tutor-hole{flex:1;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:10px;max-height:90%;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;flex:0 0 4px}
.scrim{position:absolute;inset:0;z-index:24;background:rgba(8,12,23,.4)}
.toast{position:absolute;left:14px;right:14px;top:10px;z-index:30;background:var(--ink);color:var(--surface);border-radius:14px;padding:11px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:drop .3s ease}
.toast svg{width:18px;height:18px;flex:0 0 18px;color:var(--gold)}
.toast b{color:var(--gold)}
@keyframes drop{from{transform:translateY(-12px);opacity:0}}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:700;text-align:left}
.menu svg{width:18px;height:18px;color:var(--accent)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}

/* library */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;padding:11px 0;font:inherit;color:var(--ink);outline:none}
mark{background:var(--gold-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.res{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center}
.ftype{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.04em;font-family:var(--f-mono)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tile b{font-size:14.5px}
.tile span{font-size:12px;color:var(--muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.field>.flabel{font-size:13px;font-weight:700}
.field .help{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=url],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2);color:var(--ink);font:inherit;min-height:42px}
textarea{min-height:90px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.two>*,.three>*{min-width:0}
.toggle{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:0 0 44px}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-checked="true"]{background:var(--good)}
.toggle[aria-checked="true"]::after{left:21px}
input[type=range]{width:100%;accent-color:var(--accent);padding:0;min-height:0;border:0;background:none}
.wc{font-family:var(--f-mono);font-size:12px}
/* Listen: the player bar above the tabs. Speak: the bar under every writing box. */
.player{flex:0 0 auto;background:var(--ink);color:var(--surface);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;position:relative;z-index:3}
.player .ptitle{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.player .pcount{font-size:12px;opacity:.75;white-space:nowrap}
.player .linkish{color:inherit;font-size:12px;white-space:nowrap}
.player .pbar{height:3px;border-radius:9px;background:rgba(127,127,127,.4);overflow:hidden}
.player .pbar>i{display:block;height:100%;background:var(--gold)}
.player .pbtns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.player .pbtns button{min-height:40px;border-radius:10px;background:rgba(127,127,127,.25);color:inherit;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;min-width:0;padding:4px 2px;white-space:nowrap}
.player .pbtns svg{width:17px;height:17px;flex:0 0 auto}
body.kb .player{display:none}
.player button.ptitle{background:none;color:inherit;text-align:left;padding:0;min-height:0;display:block;border:0}
.player .ptitle svg{width:13px;height:13px;vertical-align:-2px}
.player .pseek{accent-color:var(--gold);height:20px;margin:0}
.player .pbtns .num{font-size:11.5px}
.podcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;margin:2px 0}
.podcard b{line-height:1.3}
body.listening .fab{bottom:calc(84px + var(--player-h,96px))}
.vbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.vbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--ink);min-height:36px}
.vbtn svg{width:15px;height:15px;flex:0 0 auto}
.vbtn.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.vdot{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:vpulse 1.1s ease-in-out infinite}
@keyframes vpulse{0%,100%{opacity:1}50%{opacity:.25}}
.vlive{flex:1 1 100%;font-size:12.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.vlive:empty{display:none}
.mtlive{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;min-height:4.6em;overflow-wrap:anywhere;white-space:pre-wrap}
.mtlive i{font-style:normal;color:var(--muted)}
.mtclock{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;flex:0 0 auto}
.mtbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:inherit;font:inherit;line-height:1.35}
.mtbar .vdot{flex:0 0 auto}
ul.vlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* portfolio workbook */
.wb-head{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.wb-pages{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.wb-pages::-webkit-scrollbar{display:none}
.wb-pages button{flex:0 0 auto;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:flex;gap:6px;align-items:center}

.wb-pages .n{font-family:var(--f-mono);font-size:11px;opacity:.8}
.ksbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.ksb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-family:var(--f-mono);font-size:12.5px;font-weight:600}

.ksbpick{display:flex;flex-wrap:wrap;gap:6px}
.ksbpick button{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.ksbpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ev{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0;padding-top:0}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags .pill{font-family:var(--f-mono);font-size:11px}

/* reflection, log, charts */
.logi{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.logi:first-child{border-top:0}
.logi time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);padding-top:2px}
.logi ul{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.logi.undone b{text-decoration:line-through;color:var(--muted)}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.quote{white-space:pre-wrap;background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px}

/* dyslexia-friendly display */
.dys .app,.dys .app *{font-family:"Lexend",system-ui,sans-serif!important;letter-spacing:.02em}
.dys .inner{line-height:1.65}
.dys .app{--surface:#FFFDF6;--surface2:#F6F1E3}

:root[data-theme="dark"] .dys .app{--surface:#1A1D24;--surface2:#21252E}

    if (!isObj(out.m2)) out.m2 = {};
    if (!isObj(out.m2.w)) out.m2.w = {};
    keep(out.m2.w, (v, k) => isObj(v) && /^\d{1,2}$/.test(k));
    Object.values(out.m2.w).forEach((u) => {
      ['r', 'k', 'p', 'd'].forEach((f) => { if (u[f] != null && !isDay(u[f])) delete u[f]; });
      u.q = isObj(u.q) ? keep(u.q, (x) => isNum(x) && x >= 0 && x <= 9) : {};
      u.a = isObj(u.a) ? keep(u.a, flag) : {};
      u.f = clamp(Math.round(Number(u.f)) || 0, 0, 3);

  const Remote = {
    ref: null,
    writing: false,
    pending: false,
    timer: null,
    status: IS_ARTIFACT ? 'connecting' : 'device',
    async connect() {
      if (!IS_ARTIFACT) return;
      try {
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (!db || !user) { this.setStatus('device'); return; }
        const id = await user.id();
        if (!id) { this.setStatus('device'); return; }
        this.ref = db.collection('data/users/' + id).doc('planner');
        this.ref.onSnapshot((snap) => {
          if (snap.metadata && snap.metadata.hasPendingWrites) return;
          if (!snap.exists) { this.setStatus('synced'); if (state.updatedAt) this.queue(); return; }
          const remote = normalise(snap.data());
          if ((remote.updatedAt || 0) > (state.updatedAt || 0)) {
            state = remote;
            saveLocal();
            applyLook();
            heal();
            renderAll();
          } else if ((remote.updatedAt || 0) < (state.updatedAt || 0)) {
            this.queue();
          }
          this.setStatus('synced');
        }, () => { this.ref = null; this.setStatus('device'); });
      } catch (e) {
        this.setStatus('device');
      }
    },
    queue() {
      if (!this.ref) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.flush(), 700);
    },
    async flush() {
      if (!this.ref) return;
      if (this.writing) { this.pending = true; return; }
      this.writing = true;
      try {
        await this.ref.set(clone(state));
        this.setStatus('synced');
      } catch (e) {
        this.setStatus(e && e.code === 'invalid_argument' ? 'device' : 'retry');
        if (e && e.code === 'invalid_argument') this.ref = null;
      }
      this.writing = false;
      if (this.pending) { this.pending = false; this.flush(); }
    },

  /* ---------- the early plan (page 56) ----------
     An earlier evening for some steps, so the real work on an assessment ends about two weeks before it is due and
     the last fortnight stays light. Steps tied to a class, an observation or a learner's own dates are not in it.
     Each group moves together. A group is used only if its first evening had not passed on the day the plan was
     switched on (state.ax.since), so nothing lands in the past and nothing counts as missed. A step you moved
     yourself keeps your date. No evening in this plan goes over 60 minutes. */
  const AX_GROUPS = [
    // the workbook goes to the assessor before the Christmas break, not on the morning it is due

    // standardisation evidence: any quiet week will do, so it goes before the spring rush
    ['as-std', { 'as-std-1': '2027-01-25', 'as-std-2': '2027-01-27', 'as-std-3': '2027-02-01' }],
    // learner 2: the same seven steps, started two weeks sooner, so half term is free
    ['as-l2', { 'as-l2-1': '2027-01-26', 'as-l2-2': '2027-01-29', 'as-l2-3': '2027-02-02', 'as-l2-4': '2027-02-05', 'as-l2-5': '2027-02-09', 'as-l2-6': '2027-02-11', 'as-l2-7': '2027-02-12' }],
    // Module 2 slides: planned and drafted in March beside the project, the results slides once the analysis is in,
    // so a whole first draft exists before Easter and the Easter break is a break
    ['pg-m2', { 'pg-m2-1': '2027-03-01', 'pg-m2-2': '2027-03-09', 'pg-m2-4': '2027-03-15', 'pg-m2-3': '2027-04-01' }],
    // Module 2 slides: the final edit two weeks before the hand-in, straight after the peer review
    ['pg-m2', { 'pg-m2-10': '2027-05-07', 'pg-m2-11': '2027-05-10' }],
    // Module 3: check the portfolio list three weeks before the discussion, while gaps can still be filled
    ['pg-pd', { 'pg-pd-7': '2027-05-17' }]
  ];
  // Small jobs that belong close to the day: a file check, an upload, an email, speaking practice.
  const AX_LIGHT = new Set(['pg-m2-11', 'pg-m2-12', 'pg-pres-1', 'as-wb-4', 'pg-pd-4', 'pg-pd-5', 'pg-pd-6']);
  const AX_DLS = AX_GROUPS.map(([d]) => d).filter((d, i, a) => a.indexOf(d) === i);
  function axEarlyFrom(since) {
    const out = {};
    AX_GROUPS.forEach(([, steps]) => { if (Object.values(steps).sort()[0] >= since) Object.assign(out, steps); });
    return out;
  }
  const axIsDay = (v) => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
  const axEarly = () => { const a = state.ax; return a && a.early === true && axIsDay(a.since) ? axEarlyFrom(a.since) : {}; };

  /* ---------- the model ---------- */
  function deadlines() {
    const base = (DATA.deadlines || []).filter((d) => !state.hidden[d.id]);
    const early = axEarly();
    return base.concat(state.custom || []).map((d) => {
      const course = COURSES[d.course] ? d.course : 'other';
      const due = state.due[d.id] || d.due || null;
      const chunks = (d.chunks || []).map((c) => ({
        ...c,
        dl: d.id,
        course,
        dateEff: state.moved[c.id] || early[c.id] || c.date,
        done: !!state.done[c.id]
      }));
      const doneCount = chunks.filter((c) => c.done).length;
      const custom = !!d.custom;
      const status = due ? (d.status === 'nodate' ? 'target' : (d.status || 'confirmed')) : 'nodate';
      const complete = chunks.length ? doneCount === chunks.length : (due ? due < todayKey() : false);
      return { ...d, course, due, chunks, doneCount, custom, status, complete };
    });
  }
  function allChunks(list) {
    const out = [];
    list.forEach((d) => d.chunks.forEach((c) => out.push({ ...c, deadline: d })));
    return out.sort((a, b) => (a.dateEff + (a.time || '')).localeCompare(b.dateEff + (b.time || '')));
  }
  function loadMap(exceptId) {
    const map = {};
    allChunks(deadlines()).forEach((c) => {

      map[c.dateEff] = (map[c.dateEff] || 0) + (c.mins || 0);

  }
  function passesFilter(course) {

  }
  function nextFreeEvening(fromKey, m, exceptId) {
    const load = loadMap(exceptId);
    let d = fromKey;
    for (let i = 0; i < 120; i++) {
      if (isWeekday(d) && (load[d] || 0) + m <= capFor(d)) return d;

  }
  function chunkStart(c) { return atTime(c.dateEff || c.date, c.time || state.settings.evening); }
  function chunkEnd(c) { return new Date(chunkStart(c).getTime() + (c.mins || 30) * 60000); }

  /* ---------- weekly PebblePad review ---------- */
  function reviewDayNum() { return clamp(Number(state.settings.reviewDay) || (REVIEW && REVIEW.day) || 5, 1, 7); }
  function reviewDayKey(mon) { return addDays(mon, reviewDayNum() - 1); }
  function reviewItems(mon) {

  }

    return !!REVIEW && mon >= mondayOf(REVIEW.start) && mon <= REVIEW.end && !(REVIEW.breaks || []).includes(mon);
  }

    return { mon, day, items, ticks, done, total: items.length, skipped, complete, state: stateName };
  }

    for (let mon = mondayOf(REVIEW.start); mon <= last && mon <= REVIEW.end; mon = addDays(mon, 7)) {
      if (inReviewRange(mon)) out.push(reviewWeek(mon));

  }
  function overdueReviews() { return reviewWeeksSoFar().filter((w) => w.state === 'overdue'); }

    const until = REVIEW.end.replace(/-/g, '') + 'T230000Z';
    const title = followUp ? 'PGCE: PebblePad review done? If not, do it tonight' : `PGCE: weekly PebblePad review (${REVIEW.mins || 20} min)`;
    const details = 'Mentor meeting record, hours log, observation paperwork, this week\'s session, KSB mapping, placements, feedback actions.\n\nTick it off in the Portfolio tab of Cap and Gown Planner.';

  /* ---------- alarms (Android app only) ----------
     The page works out the alarms for the next four weeks from what is still open and hands
     them to the app, which sets the next one with the phone's alarm clock. Every tick sends a
     fresh list, so finished work goes quiet and unfinished work keeps ringing. */
  function alarmPlan() {
    const s = state.settings;
    if (s.alarms === false) return { on: false, alarms: [] };
    const lead = clamp(Number(s.alarmLead == null ? 5 : s.alarmLead) || 0, 0, 60);
    const catchup = s.alarmCatchup !== false;
    const today = todayKey();
    const nowMs = now().getTime();
    const undone = allChunks(deadlines()).filter((c) => !c.done);
    const breaks = (REVIEW && REVIEW.breaks) || [];
    const quietWeek = (d) => breaks.includes(mondayOf(d));
    const stepLine = (c) => `${c.title} (${mins(c.mins || 30)})`;
    const out = [];
    for (let i = 0; i < 28; i++) {
      const d = addDays(today, i);
      const groups = {};
      undone.filter((c) => c.dateEff === d).forEach((c) => {
        const t = c.time || s.evening;
        (groups[t] = groups[t] || []).push(c);
      });
      // weekly review: this week's on its day, unfinished earlier weeks on every weekday after
      const reviewLines = [];
      let reviewMins = 0;
      if (REVIEW) {
        let dueToday = false;
        const late = [];
        for (let mon = mondayOf(REVIEW.start); mon <= mondayOf(d) && mon <= REVIEW.end; mon = addDays(mon, 7)) {
          if (!inReviewRange(mon)) continue;
          const w = reviewWeek(mon);
          if (w.complete) continue;
          if (w.day === d) dueToday = true;
          else if (w.day < d && isWeekday(d) && !quietWeek(d)) late.push(w);
        }
        if (late.length) reviewLines.push(late.length === 1 ? `PebblePad review for ${weekLabel(late[0].mon)} is still open` : `PebblePad review still open for ${late.length} weeks`);
        if (dueToday) reviewLines.push(`Weekly PebblePad review (${mins(REVIEW.mins || 20)})`);
        if (late.length || dueToday) reviewMins = REVIEW.mins || 20;
      }
      const behind = catchup && isWeekday(d) && !quietWeek(d) ? undone.filter((c) => c.dateEff < d).length : 0;
      // the evening before a Module 2 class that is not revised yet
      const classWeeks = m2AlarmWeeks(d);
      if (!groups[s.evening] && (reviewLines.length || behind || classWeeks.length)) groups[s.evening] = [];
      Object.keys(groups).sort().forEach((t) => {
        const steps = groups[t];
        const isEvening = t === s.evening;
        const lines = steps.slice(0, 5).map(stepLine);
        if (steps.length > 5) lines.push(`and ${steps.length - 5} more`);
        let total = steps.reduce((a, c) => a + (c.mins || 30), 0);
        if (isEvening) {
          lines.unshift(...classWeeks.map((w) => `Class tomorrow at 9:30: revise week ${w.n} first (${mins(w.mins)})`));
          total += classWeeks.reduce((a, w) => a + w.mins, 0);
          lines.push(...reviewLines);
          total += reviewMins;
          if (behind) lines.push(`${behind} earlier step${behind === 1 ? '' : 's'} not ticked off yet`);
        }
        if (!lines.length) return;
        let title;
        if (steps.length) title = `Study time: ${mins(total)}`;
        else if (isEvening && classWeeks.length) title = 'Class tomorrow: revise first';
        else if (reviewLines.length) title = reviewLines.some((l) => l.includes('still open')) ? 'PebblePad review still open' : 'Weekly PebblePad review';
        else title = 'Catch-up evening';
        const at = atTime(d, t).getTime() - lead * 60000;
        if (at <= nowMs + 60000) return;
        out.push({ at, day: d, title, lines });
      });
    }
    return { on: true, generated: Date.now(), lead, alarms: out };
  }
  let alarmTimer = null;
  function syncAlarms() {
    if (!APP) return;

      try { APP.setAlarms(JSON.stringify(alarmPlan())); } catch (e) { /* the app will keep its last list */ }
      if (route === 'settings') { const p = $('#alarm-next'); if (p) p.innerHTML = nextAlarmText(); }
      if (state.settings.alarms !== false) { const line = $('#alarm-line'); if (line) line.innerHTML = nextAlarmText(); }
    }, 250);
  }

  }
  function fmtAlarm(ms) {
    const d = new Date(ms);
    const k = keyOf(d);
    const day = k === todayKey() ? 'Today' : (k === addDays(todayKey(), 1) ? 'Tomorrow' : fmtShort(k));
    return `${day}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;

  }

  /* ---------- look: light or dark, text size, dyslexia-friendly display ---------- */
  function applyLook() {
    const s = state.settings;
    const root = document.documentElement;
    if (s.mode === 'light' || s.mode === 'dark') root.setAttribute('data-theme', s.mode); else root.removeAttribute('data-theme');
    root.style.setProperty('--scale', String(clamp(Number(s.scale) || 1, 0.85, 1.4)));
    document.body.classList.toggle('dys', !!s.dys);
  }

  /* ---------- calendar links and files ---------- */
  const stamp = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  function gcalUrl(title, start, end, details, recur) {
    const p = new URLSearchParams({ action: 'TEMPLATE', text: title, dates: `${stamp(start)}/${stamp(end)}`, details, ctz: TZ });
    if (recur) p.set('recur', recur);
    return 'https://calendar.google.com/calendar/render?' + p.toString();
  }
  function chunkDetails(c) {
    const d = c.deadline;
    const lines = [`Small step for: ${d.title}`];
    if (d.due) lines.push(`Due: ${fmtLong(d.due)}${d.how ? ' (' + d.how + ')' : ''}`);
    if (c.tip) lines.push('', c.tip);
    lines.push('', 'From Cap and Gown Planner');
    return lines.join('\n');
  }
  function chunkGcal(c) {
    const short = (COURSES[c.course] || COURSES.other).short;
    return gcalUrl(`${short}: ${c.title} (${c.mins} min)`, chunkStart(c), chunkEnd(c), chunkDetails(c));
  }
  function deadlineGcal(d) {
    const short = (COURSES[d.course] || COURSES.other).short;
    const start = atTime(d.due, d.dueTime || (DATA.defaults && DATA.defaults.dueTime) || '09:00');
    const label = d.kind === 'event' ? `${short}: ${d.title}` : `${short} due: ${d.title}`;
    return gcalUrl(label, start, new Date(start.getTime() + 30 * 60000), `${d.how || ''}\n${d.note || ''}\n\nFrom Cap and Gown Planner`.trim());
  }

  function icsEscape(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
  function icsFold(line) {
    const enc = new TextEncoder();
    if (enc.encode(line).length <= 75) return line;
    const parts = [];
    let cur = '';
    for (const ch of line) {
      const limit = parts.length ? 74 : 75;
      if (enc.encode(cur + ch).length > limit) { parts.push(cur); cur = ch; } else cur += ch;
    }
    parts.push(cur);
    return parts.join('\r\n ');
  }
  function buildIcs() {
    const list = deadlines();
    const today = todayKey();
    const dtstamp = stamp(new Date());
    const lines = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Cap and Gown Planner//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'X-WR-CALNAME:Study plan (PGCE and Assessor)', `X-WR-TIMEZONE:${TZ}`
    ];
    const pad2 = (n) => String(n).padStart(2, '0');
    const local = (d) => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
    const when = (key, d, wall) => (wall ? `${key};TZID=${TZ}:${local(d)}` : `${key}:${stamp(d)}`);
    const ev = (o) => {
      // Repeating events use wall-clock time in TZ, so they stay at the same hour after the clocks change.
      lines.push('BEGIN:VEVENT', `UID:${o.uid}@capgown-planner`, `DTSTAMP:${dtstamp}`, when('DTSTART', o.start, !!o.rrule), when('DTEND', o.end, !!o.rrule),
        `SUMMARY:${icsEscape(o.title)}`, `DESCRIPTION:${icsEscape(o.details)}`, `CATEGORIES:${icsEscape(o.cat)}`);
      if (o.rrule) lines.push(o.rrule);
      (o.exdates || []).forEach((x) => lines.push(when('EXDATE', x, true)));
      o.alarms.forEach((a) => lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(o.title)}`, `TRIGGER:${a}`, 'END:VALARM'));
      lines.push('END:VEVENT');
    };
    allChunks(list).forEach((c) => {
      if (c.done || c.dateEff < today) return;
      const short = (COURSES[c.course] || COURSES.other).short;
      ev({ uid: c.id, start: chunkStart(c), end: chunkEnd(c), title: `${short}: ${c.title} (${c.mins} min)`, details: chunkDetails(c), cat: short, alarms: ['-PT10M', 'PT0M'] });
    });
    list.forEach((d) => {
      if (!d.due || d.due < today) return;
      const short = (COURSES[d.course] || COURSES.other).short;
      const start = atTime(d.due, d.dueTime || (DATA.defaults && DATA.defaults.dueTime) || '09:00');
      const isEvent = d.kind === 'event';
      ev({
        uid: d.id + '-due', start, end: new Date(start.getTime() + 30 * 60000),
        title: isEvent ? `${short}: ${d.title}` : `${short} DUE: ${d.title}`,
        details: [d.how, d.note, STATUS_LABEL[d.status] && d.status !== 'confirmed' ? STATUS_LABEL[d.status] : ''].filter(Boolean).join('\n'),
        cat: short,
        alarms: isEvent ? ['-P1D', '-PT1H'] : ['-P7D', '-P2D', '-PT1H']
      });
    });
    if (REVIEW && TZ === 'Europe/London') {
      lines.splice(7, 0, 'BEGIN:VTIMEZONE', 'TZID:Europe/London',
        'BEGIN:DAYLIGHT', 'TZOFFSETFROM:+0000', 'TZOFFSETTO:+0100', 'TZNAME:BST', 'DTSTART:19700329T010000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'END:DAYLIGHT',
        'BEGIN:STANDARD', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0000', 'TZNAME:GMT', 'DTSTART:19701025T020000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD',
        'END:VTIMEZONE');
    }
    if (REVIEW) {
      let mon = mondayOf(today);
      while (!inReviewRange(mon) && mon <= REVIEW.end) mon = addDays(mon, 7);
      if (mon <= REVIEW.end) {
        const until = REVIEW.end.replace(/-/g, '') + 'T230000Z';
        [false, true].forEach((follow) => {
          let first = reviewDayKey(mon);
          if (follow) first = nextWeekday(addDays(first, 1));
          const start = atTime(first, state.settings.evening);
          const shift = daysBetween(reviewDayKey(mon), first);
          const exdates = (REVIEW.breaks || []).filter((b) => b >= mon).map((b) => atTime(addDays(reviewDayKey(b), shift), state.settings.evening));
          ev({
            uid: follow ? 'review-followup' : 'review-weekly', start, end: new Date(start.getTime() + (REVIEW.mins || 20) * 60000),
            title: follow ? 'PGCE: PebblePad review done? If not, do it tonight' : `PGCE: weekly PebblePad review (${REVIEW.mins || 20} min)`,
            details: 'Tick it off in the Portfolio tab of Cap and Gown Planner. An unfinished review stays on your Today screen until it is done.',
            cat: 'PGCE', alarms: ['-PT10M', 'PT0M'], rrule: `RRULE:FREQ=WEEKLY;UNTIL=${until}`, exdates
          });
        });
      }
    }
    lines.push('END:VCALENDAR');
    return lines.map(icsFold).join('\r\n') + '\r\n';
  }

  async function saveFile(filename, text, mime) {
    if (APP) {
      let ok = false;
      try { ok = APP.saveFile(filename, text, mime); } catch (e) { ok = false; }
      toast(ok ? 'Saved to the Downloads folder on your phone.' : 'That file could not be saved.');
      return;
    }
    if (IS_ARTIFACT) {
      const dl = await window.claude.use('downloads');
      if (!dl) { toast('Saving files is not available in this view.'); return; }
      try {
        await dl.save({ filename, data: text });
        toast('File saved.');
      } catch (e) {
        if (e && e.code === 'declined') return;
        if (e && e.code === 'rate_limited') toast('A save is already waiting for you. Try again in a moment.');
        else toast('That file could not be saved here.');
      }
      return;
    }
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast('Saved to your downloads.');
  }

  }
  async function enableNudges() {

  /* ---------- planning new work ---------- */
  const TEMPLATES = {

        for (let i = 1; i <= n; i++) s.push({ title: `Step ${i} of ${n}`, mins: m });
        return spread(s, o.due);

  function spread(steps, dueKey) {
    const today = todayKey();
    let days = [];
    for (let d = today; d < dueKey && days.length < 400; d = addDays(d, 1)) if (isWeekday(d)) days.push(d);
    if (!days.length) days = [today];
    const n = steps.length;
    let usable = days.length > n + 1 ? days.slice(0, -1) : days;
    const maxSpan = Math.max(n * 3, 10);
    if (usable.length > maxSpan) usable = usable.slice(usable.length - maxSpan);
    const load = loadMap();
    let last = 0;
    return steps.map((s, i) => {
      const target = n === 1 ? usable.length - 1 : Math.round((i * (usable.length - 1)) / (n - 1));
      const from = Math.max(target, last);
      let pick = -1;
      for (let j = from; j < usable.length; j++) if ((load[usable[j]] || 0) + s.mins <= capFor(usable[j])) { pick = j; break; }
      if (pick < 0) for (let j = from; j >= last; j--) if ((load[usable[j]] || 0) + s.mins <= capFor(usable[j])) { pick = j; break; }
      if (pick < 0) {
        // nothing fits under the limit: use the lightest evening that keeps the order
        pick = Math.min(from, usable.length - 1);
        for (let j = last; j < usable.length; j++) if ((load[usable[j]] || 0) < (load[usable[pick]] || 0)) pick = j;
      }
      load[usable[pick]] = (load[usable[pick]] || 0) + s.mins;
      last = pick;
      return { ...s, date: usable[pick] };
    });
  }

  /* ---------- the adaptive planner ----------
     Self-healing: a step whose evening has passed moves to the first weekday evening with room
     before its deadline, closest deadline first. Energy check-in: a low evening keeps only the
     most urgent step, a good evening pulls one step forward. Weekly reflection: a lighter or
     fuller week changes next week's evening limit. Every change goes in the log with its reason,
     and the ones that can be undone have an Undo button for a week. */
  const LOW_CAP = 20;
  const BREAKS = (REVIEW && REVIEW.breaks) || [];
  const inBreak = (k) => BREAKS.includes(mondayOf(k));
  const byUrgency = (a, b) => (a.deadline.due || '9999').localeCompare(b.deadline.due || '9999')
    || a.dateEff.localeCompare(b.dateEff) || (a.time || '').localeCompare(b.time || '');
  const plural = (n, word, many) => `${n} ${n === 1 ? word : (many || word + 's')}`;

  // Most minutes for one evening: the setting, changed for a week by a reflection, cut on a low-energy night.
  function capFor(k) {
    const base = Number(state.settings.cap) || 60;
    const wk = Number(state.weekCap && state.weekCap[mondayOf(k)]) || base;
    return state.energy && state.energy[k] === 'low' ? Math.min(wk, LOW_CAP) : wk;
  }

  // The last evening a step can sit on and still be ready for its deadline.
  function lastDayFor(c) {
    const d = c.deadline;
    if (!d || !d.due) return null;
    if (c.date && c.date > d.due) return addDays(c.date, 14); // a follow-up planned after an event
    let lim = d.due;
    if (d.kind !== 'event' && d.status !== 'target') {
      const t = d.dueTime || (DATA.defaults && DATA.defaults.dueTime) || '09:00';
      if (t < '17:00') lim = addDays(d.due, -1); // handed in by day, so the work happens the evening before
    }
    return c.date && c.date > lim ? c.date : lim;
  }

  // First weekday evening from fromKey with room, up to the step's last day. Christmas and Easter
  // weeks are skipped unless nothing else fits. Returns null when the last day has already gone.
  function findSlot(c, fromKey, load) {
    const lim = lastDayFor(c);
    const m = c.mins || 30;
    if (lim && lim < fromKey) return null;
    const end = lim || addDays(fromKey, 120);
    for (let d = fromKey; d <= end; d = addDays(d, 1)) {
      if (isWeekday(d) && !inBreak(d) && (load[d] || 0) + m <= capFor(d)) return { day: d, fits: true };
    }
    let best = null;
    for (let d = fromKey; d <= end; d = addDays(d, 1)) {
      if (isWeekday(d) && (best === null || (load[d] || 0) < (load[best] || 0))) best = d;
    }
    return { day: best || fromKey, fits: false };
  }

  function addLog(e) {
    state.log.unshift({ id: uid(), at: now().getTime(), ...e });
    if (state.log.length > 80) state.log.length = 80;
  }
  function undoEntry(e) {
    if (!e || !e.undo || e.undone) return false;
    Object.entries(e.undo.moved || {}).forEach(([id, prev]) => { if (prev) state.moved[id] = prev; else delete state.moved[id]; });
    Object.entries(e.undo.weekCap || {}).forEach(([mon, prev]) => { if (prev) state.weekCap[mon] = prev; else delete state.weekCap[mon]; });
    e.undone = true;
    return true;
  }

  // Missed steps whose deadline is still ahead move forward. Steps past their deadline stay put
  // and show on Home under "Check these", because the work may already have gone in.
  function heal() {
    if (state.settings.heal === false) return 0;
    const today = todayKey();
    const from = now().getHours() >= 21 ? addDays(today, 1) : today;
    const movable = allChunks(deadlines())
      .filter((c) => !c.done && c.dateEff < today)
      .filter((c) => { const lim = lastDayFor(c); return !lim || lim >= today; })
      .sort(byUrgency);
    if (!movable.length) return 0;
    const load = loadMap();
    const lines = [];
    let over = 0;
    movable.forEach((c) => {
      const slot = findSlot(c, from, load) || { day: today, fits: false };
      const seen = (state.missed[c.id] = state.missed[c.id] || []);
      if (!seen.includes(c.dateEff)) seen.push(c.dateEff);
      state.moved[c.id] = slot.day;
      load[slot.day] = (load[slot.day] || 0) + (c.mins || 30);
      if (!slot.fits) over++;
      lines.push(`${c.title}: ${fmtShort(c.dateEff)} to ${fmtShort(slot.day)}${slot.fits ? '' : ' (over your evening limit)'}`);
    });
    const n = movable.length;
    addLog({
      kind: 'heal',
      what: n === 1 ? `Moved a missed step to ${fmtShort(state.moved[movable[0].id])}` : `Moved ${n} missed steps to evenings with room`,
      why: `${n === 1 ? 'It was' : 'They were'} not ticked off on the night. Each one goes to the first weekday evening with room before its deadline, closest deadline first.${over ? ` ${plural(over, 'step')} only fitted by going over your evening limit, because the deadline is close.` : ''}`,
      lines
    });
    commit();
    return n;
  }

  // Evens out evenings that are over the limit: the step with the furthest deadline moves first,
  // and only later, to an evening with room before its own deadline.
  function balance(from, to) {
    const load = loadMap();
    const open = allChunks(deadlines()).filter((c) => !c.done && !c.time && c.dateEff >= from && c.dateEff <= to);
    const undo = {};
    const lines = [];
    for (let d = from; d <= to; d = addDays(d, 1)) {
      if (!isWeekday(d) || (load[d] || 0) <= capFor(d)) continue;
      const here = open.filter((c) => c.dateEff === d && !(c.id in undo)).sort(byUrgency).reverse();
      let left = here.length;
      for (const c of here) {
        if ((load[d] || 0) <= capFor(d) || left <= 1) break;
        const m = c.mins || 30;
        load[d] -= m;
        const slot = findSlot(c, addDays(d, 1), load);
        if (!slot || !slot.fits) { load[d] += m; continue; }
        undo[c.id] = state.moved[c.id] || null;
        state.moved[c.id] = slot.day;
        c.dateEff = slot.day;
        load[slot.day] = (load[slot.day] || 0) + m;
        left--;
        lines.push(`${c.title}: ${fmtShort(d)} to ${fmtShort(slot.day)}`);
      }
    }
    return { undo, lines };
  }

  function replan() {
    const healed = heal();
    const today = todayKey();
    const r = balance(today, addDays(today, 27));
    if (r.lines.length) {
      addLog({
        kind: 'replan',
        what: `Evened out ${plural(r.lines.length, 'step')} over the next four weeks`,
        why: 'Some evenings were over your limit. The step with the furthest deadline moved first, and only to an evening with room before its own deadline.',
        lines: r.lines,
        undo: { moved: r.undo }
      });
      commit();
    } else if (!healed) {
      const last = state.log[0];
      if (!(last && last.kind === 'check' && keyOf(new Date(last.at)) === today)) {
        addLog({ kind: 'check', what: 'Checked the next four weeks', why: `Nothing was missed and every evening is within your limit (${state.settings.cap} minutes). Nothing needed to move.` });
        commit();
      }
    }
    return { healed, moved: r.lines.length };
  }

  // Energy check-in. Changing your answer first undoes what the last answer did tonight.
  function setEnergy(level) {
    const today = todayKey();
    state.log.forEach((e) => { if (e.kind === 'energy' && e.day === today) undoEntry(e); });
    state.energy[today] = level;
    let result = { level, moved: 0, bonus: null };
    if (level === 'low' || level === 'high') {
      const load = loadMap();
      const undo = {};
      const lines = [];
      if (level === 'low') {
        const tonight = allChunks(deadlines()).filter((c) => !c.done && c.dateEff === today).sort(byUrgency);
        let kept = 0;
        const stayed = [];
        tonight.forEach((c, i) => {
          const m = c.mins || 30;
          if (i === 0 || c.time || kept + m <= LOW_CAP) { kept += m; return; }
          load[today] -= m;
          const slot = findSlot(c, addDays(today, 1), load);
          if (!slot || !slot.fits) { load[today] += m; kept += m; stayed.push(c.title); return; }
          undo[c.id] = state.moved[c.id] || null;
          state.moved[c.id] = slot.day;
          load[slot.day] = (load[slot.day] || 0) + m;
          lines.push(`${c.title}: moved to ${fmtShort(slot.day)}`);
        });
        result.moved = lines.length;
        addLog({
          kind: 'energy', day: today,
          what: lines.length ? `Lighter evening: ${plural(lines.length, 'step')} moved` : 'Lighter evening: nothing needed to move',
          why: tonight.length
            ? `You said your energy is low. Tonight keeps "${tonight[0].title}", the step with the closest deadline${stayed.length ? `, plus ${plural(stayed.length, 'step')} with no room before ${stayed.length === 1 ? 'its' : 'their'} deadline` : ''}.${lines.length ? ' The rest go to the next evenings with room.' : ''}`
            : 'You said your energy is low. Nothing was planned tonight, so nothing moved.',
          lines,
          undo: { moved: undo }
        });
      } else {
        const tl = load[today] || 0;
        const cand = allChunks(deadlines())
          .filter((c) => !c.done && !c.time && c.dateEff > today && c.dateEff <= addDays(today, 7) && tl + (c.mins || 30) <= capFor(today) + 30)
          .sort(byUrgency)[0];
        if (cand) {
          undo[cand.id] = state.moved[cand.id] || null;
          state.moved[cand.id] = today;
          lines.push(`${cand.title}: ${fmtShort(cand.dateEff)} to tonight`);
          result.bonus = cand;
        }
        addLog({
          kind: 'energy', day: today,
          what: cand ? `Bonus step tonight: ${cand.title}` : 'Good energy: nothing to pull forward',
          why: cand
            ? `You said you have good energy. This is the next step with the closest deadline (${cand.deadline.title}${cand.deadline.due ? ', due ' + fmtShort(cand.deadline.due) : ''}). Doing it tonight frees up ${fmtShort(cand.dateEff)}.`
            : 'Nothing in the next seven days fits tonight without going well over your evening limit.',
          lines,
          undo: { moved: undo }
        });
      }
    }
    commit();
    return result;
  }

  // Weekly reflection
  const MOODS = ['Tired', 'Busy at work', 'Focused', 'Confident', 'Stuck', 'Behind'];
  const HEAVY = ['Tired', 'Busy at work', 'Stuck', 'Behind'];
  const lighterCap = () => Math.max(30, (Number(state.settings.cap) || 60) - 20);
  const pushCap = () => Math.min(180, (Number(state.settings.cap) || 60) + 20);
  const planLabel = (p) => (p === 'lighter' ? `lighter, evenings up to ${lighterCap()} minutes` : p === 'push' ? `fuller, evenings up to ${pushCap()} minutes` : `the usual ${state.settings.cap} minutes an evening`);
  function suggestPlan(moods) {
    const list = moods || [];
    const heavy = list.filter((m) => HEAVY.includes(m));
    if (heavy.length) return { plan: 'lighter', why: `you picked ${heavy.map((m) => m.toLowerCase()).join(' and ')}` };
    if (list.length) return { plan: 'same', why: `you picked ${list.map((m) => m.toLowerCase()).join(' and ')}` };
    return { plan: 'same', why: '' };
  }
  function reflectionDue() {
    if (!REVIEW) return false;
    const today = todayKey();
    const mon = mondayOf(today);
    return inReviewRange(mon) && !state.reflections[mon] && today >= reviewDayKey(mon);
  }
  function saveReflection(mon, text, moods, plan) {
    state.log.forEach((e) => { if (e.kind === 'reflect' && e.week === mon) undoEntry(e); });
    const next = addDays(mon, 7);
    state.reflections[mon] = { text, moods, plan, at: now().getTime() };
    const undo = { moved: {}, weekCap: { [next]: state.weekCap[next] || null } };
    let lines = [];
    if (plan === 'lighter') {
      state.weekCap[next] = lighterCap();
      const r = balance(next, addDays(next, 6));
      undo.moved = r.undo;
      lines = r.lines;
    } else if (plan === 'push') {
      state.weekCap[next] = pushCap();
    } else {
      delete state.weekCap[next];
    }
    const capNext = state.weekCap[next] || state.settings.cap;
    addLog({
      kind: 'reflect', week: mon,
      what: plan === 'lighter' ? `Lighter week planned for ${weekLabel(next)}` : plan === 'push' ? `Fuller week allowed for ${weekLabel(next)}` : `Usual limit kept for ${weekLabel(next)}`,
      why: `From your reflection${moods.length ? ` (${moods.join(', ').toLowerCase()})` : ''}. Evenings in ${weekLabel(next)} go up to ${capNext} minutes${lines.length ? `, so ${plural(lines.length, 'step')} moved to evenings with room before ${lines.length === 1 ? 'its' : 'their'} deadline` : ''}.`,
      lines,
      undo
    });
    commit();
    return lines.length;
  }

  // What the app has noticed, from real ticks, misses, reflections and check-ins only.
  function patterns() {
    const out = [];
    const by = {};
    const bump = (k, field) => { const w = dow(k); if (w < 1 || w > 5) return; (by[w] = by[w] || { on: 0, missed: 0 })[field]++; };
    allChunks(deadlines()).forEach((c) => {
      const t = state.done[c.id];
      if (t && keyOf(new Date(t)) <= c.dateEff) bump(c.dateEff, 'on');
    });
    Object.values(state.missed).forEach((arr) => (arr || []).forEach((k) => bump(k, 'missed')));
    const rows = Object.entries(by).map(([w, v]) => ({ w: Number(w), on: v.on, n: v.on + v.missed, rate: v.on / (v.on + v.missed) })).filter((r) => r.n >= 2);
    if (rows.reduce((a, r) => a + r.n, 0) >= 6 && rows.length >= 2) {
      rows.sort((a, b) => b.rate - a.rate || b.n - a.n);
      const best = rows[0];
      const worst = rows[rows.length - 1];
      const days = (w) => DAY_NAMES[w - 1] + 's';
      out.push(`${days(best.w)} work best: ${best.on} of ${best.n} steps done on the night.${worst.rate < best.rate ? ` ${days(worst.w)} are hardest: ${worst.on} of ${worst.n}.` : ''}`);
    }
    const recent = Object.entries(state.reflections).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 4);
    const count = {};
    recent.forEach(([, r]) => (r.moods || []).forEach((m) => { count[m] = (count[m] || 0) + 1; }));
    const top = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
    if (top && top[1] >= 2) out.push(`You picked "${top[0]}" in ${top[1]} of your last ${recent.length} reflections.`);
    const since = addDays(todayKey(), -14);
    const lows = Object.entries(state.energy).filter(([k, v]) => v === 'low' && k > since).length;
    if (lows >= 3) out.push(`${lows} low-energy evenings in the last two weeks. A lighter week might help.`);
    return out;
  }

  // The single best thing to do now.
  function nextStep() {
    const today = todayKey();
    const open = allChunks(deadlines()).filter((c) => !c.done);
    const late = overdueReviews();
    const reviewOf = (w) => ({ type: 'review', week: w, mins: (REVIEW && REVIEW.mins) || 20 });
    if (late.length) return { ...reviewOf(late[0]), why: `The PebblePad review for ${weekLabel(late[0].mon)} is still open, and an open review always comes first until it is done.` };
    const tonight = open.filter((c) => c.dateEff <= today).filter((c) => { const lim = lastDayFor(c); return !lim || lim >= today; }).sort(byUrgency);
    const rw = thisWeekReview();
    const reviewTonight = rw && rw.state === 'tonight';
    if (tonight.length) {
      const c = tonight[0];
      const n = c.deadline.due ? daysBetween(today, c.deadline.due) : null;
      if (reviewTonight && (n === null || n > 3)) return { ...reviewOf(rw), why: 'The weekly review is due tonight, and none of tonight\'s steps has a deadline in the next three days.' };
      const when = n === null ? 'It has no deadline yet' : `Due ${fmtShort(c.deadline.due)}, ${n <= 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`}`;
      const among = tonight.length > 1 ? ` It has the closest deadline of the ${tonight.length} steps tonight.` : '';
      const low = state.energy[today] === 'low' ? ' Your energy is low, so the evening can stop after this one.' : '';
      return { type: 'step', c, why: `${when}.${among}${low}` };
    }
    if (reviewTonight) return { ...reviewOf(rw), why: 'The weekly review is due tonight. It takes about 20 minutes.' };
    const next = open.filter((c) => c.dateEff > today).sort((a, b) => a.dateEff.localeCompare(b.dateEff) || byUrgency(a, b))[0];
    if (next) return { type: 'ahead', c: next, why: `Nothing is left tonight. This is the next step in your plan, on ${fmtLong(next.dateEff)}.` };
    return null;
  }

  // Weekday evenings in a row where every planned step was done and nothing was missed.
  function streak() {
    const today = todayKey();
    const all = allChunks(deadlines());
    const missedOn = {};
    Object.values(state.missed).forEach((arr) => (arr || []).forEach((k) => { missedOn[k] = true; }));
    const start = (REVIEW && REVIEW.start) || addDays(today, -90);
    let n = 0;
    const tonight = all.filter((c) => c.dateEff === today);
    if (tonight.length && tonight.every((c) => c.done)) n++;
    for (let d = addDays(today, -1), i = 0; i < 120 && d >= start; d = addDays(d, -1), i++) {
      if (missedOn[d]) break;
      const items = all.filter((c) => c.dateEff === d);
      if (!items.length) continue;
      if (items.every((c) => c.done)) n++; else break;
    }
    return n;
  }

  // A plain summary of the plan, to paste into a Claude chat.
  function weekText() {
    const today = todayKey();
    const list = deadlines();
    const open = allChunks(list).filter((c) => !c.done);
    const short = (id) => (COURSES[id] || COURSES.other).short;
    const line = (c) => `${short(c.course)}: ${c.title} (${mins(c.mins || 30)}), for "${c.deadline.title}"${c.deadline.due ? `, due ${fmtShort(c.deadline.due)}` : ''}`;
    const out = [`My study plan from my Cap and Gown planner, ${fmtLong(today)} ${parseKey(today).getFullYear()}.`, ''];
    const tonight = open.filter((c) => c.dateEff === today).sort(byUrgency);
    out.push(isWeekday(today) ? 'Tonight:' : 'Today:');
    out.push(...(tonight.length ? tonight.map((c) => '- ' + line(c)) : ['- Nothing planned.']));
    const soon = open.filter((c) => c.dateEff > today && c.dateEff <= addDays(today, 7)).sort((a, b) => a.dateEff.localeCompare(b.dateEff));
    if (soon.length) { out.push('', 'Next seven days:'); soon.forEach((c) => out.push(`- ${fmtShort(c.dateEff)}, ${line(c)}`)); }
    const dues = list.filter((d) => d.due && d.due >= today && !d.complete).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 5);
    if (dues.length) {
      out.push('', 'Next deadlines:');
      dues.forEach((d) => out.push(`- ${fmtShort(d.due)}: ${d.title} (${short(d.course)}${d.status === 'target' ? ', my own target' : d.status === 'check' ? ', date still to check' : ''})`));
    }
    const stale = open.filter((c) => c.dateEff < today);
    if (stale.length) out.push('', `Not ticked off from earlier: ${plural(stale.length, 'step')} (${[...new Set(stale.map((c) => c.deadline.title))].slice(0, 3).join('; ')}).`);
    const ov = overdueReviews();
    if (ov.length) out.push(`Weekly PebblePad review still open for ${plural(ov.length, 'week')}.`);
    if (PORT) { const parts = portfolioParts(); const get = (id) => parts.find((x) => x.id === id) || { have: 0, need: 0 }; out.push(`Module 3 portfolio: ${portfolioPct()}% overall (KSBs ${get('ksb').have}/${get('ksb').need}, lead teaching hours ${get('lead').have}/${get('lead').need}, observation forms and reflections ${get('obs').have}/${get('obs').need}).`); }
    const e = state.energy[today];
    if (e === 'low' || e === 'high') out.push(`Energy tonight: ${e === 'low' ? 'low' : 'good'}.`);
    const lastR = Object.entries(state.reflections).sort((a, b) => b[0].localeCompare(a[0]))[0];
    if (lastR && lastR[1].text) out.push(`My last weekly reflection (${weekLabel(lastR[0])}): "${lastR[1].text.slice(0, 300)}"`);
    const wk = weakTopics(3);
    out.push(`Weakest topics in my quizzes: ${wk.map((t) => `${t.name} (${t.m == null ? 'not checked yet' : t.m + '%'})`).join(', ')}.`);
    try { const names = recommend().picks.slice(0, 3).map((p) => `${KIND_VERB[p.it.kind].toLowerCase()} "${p.it.title}"`); if (names.length) out.push(`Suggested from my library tonight: ${names.join('; ')}.`); } catch (e) { /* not essential */ }
    out.push('', 'My question: ');
    return out.join('\n');
  }
