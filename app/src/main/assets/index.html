    else if (n > 1) { big = String(n); small = 'days left'; }
    else { big = String(-n); small = d.kind === 'event' ? 'days ago' : 'days ago'; }
    return `<div class="due-box"><div class="big">${esc(big)}</div><div class="small">${esc(small)}</div></div>`;
  }

  function deadlineCard(d, opts = {}) {
    const pct = d.chunks.length ? Math.round((d.doneCount / d.chunks.length) * 100) : (d.complete ? 100 : 0);
    const dueLine = d.due ? `${d.kind === 'event' ? 'On' : 'Due'} ${fmtLong(d.due)} ${parseKey(d.due).getFullYear()}` : 'No date yet';
    const editing = editingDue === d.id;
    const deleting = confirmDelete === d.id;
    return `<article class="deadline ${esc(d.course)}" id="dl-${esc(d.id)}">
      <div class="deadline-top">
        <div>
          <div class="chips" style="gap:.35rem">${tag(d.course)}${d.status !== 'confirmed' ? statusTag(d.status) : ''}</div>
          <h3 style="margin-top:.4rem">${esc(d.title)}</h3>
          <p class="how">${esc(dueLine)}${d.how ? ' · ' + esc(d.how) : ''}</p>
        </div>
        ${dueBox(d)}
      </div>
      ${d.note ? `<p class="note">${esc(d.note)}</p>` : ''}
      ${d.chunks.length ? `<div class="bar" role="img" aria-label="${pct}% done"><span style="width:${pct}%"></span></div>
        <p class="bar-label">${d.doneCount} of ${d.chunks.length} steps done · ${esc(mins(d.chunks.reduce((a, c) => a + (c.done ? 0 : c.mins || 0), 0)))} left</p>` : ''}
      ${d.chunks.length && !opts.compact ? `<details${opts.open ? ' open' : ''}><summary>Steps</summary><ul class="steps">${d.chunks.slice().sort((a, b) => a.dateEff.localeCompare(b.dateEff)).map((c) => stepRow({ ...c, deadline: d }, { showDate: true, showFor: false, showCourse: false })).join('')}</ul></details>` : ''}
      ${opts.compact ? '' : `<div class="btn-row">
        ${d.due ? `<a class="btn small" href="${esc(deadlineGcal(d))}" target="_blank" rel="noopener">${ICON.cal} Deadline to calendar</a>` : ''}
        <button class="btn small" data-action="edit-due" data-id="${esc(d.id)}">${d.due ? 'Change date' : 'Set a date'}</button>
        ${d.custom ? `<button class="btn small danger" data-action="ask-delete" data-id="${esc(d.id)}">Delete</button>` : ''}
      </div>`}
      ${editing ? `<form class="field" data-form="due" data-id="${esc(d.id)}">
        <label for="due-${esc(d.id)}">New date</label>
        <div class="btn-row"><input type="date" id="due-${esc(d.id)}" value="${esc(d.due || '')}" required style="flex:1;min-height:2.6rem;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:.4rem .6rem">
        <button class="btn small primary" type="submit">Save</button><button class="btn small" type="button" data-action="cancel-due">Cancel</button></div>
        <span class="help">Steps keep their own dates. Use the arrow on a step to move it.</span>
      </form>` : ''}
      ${deleting ? `<div class="confirm-row"><span>Delete this and its steps?</span><button class="btn small danger" data-action="delete" data-id="${esc(d.id)}">Yes, delete</button><button class="btn small" data-action="cancel-delete">Keep it</button></div>` : ''}
    </article>`;
  }

  /* ---------- Home ---------- */
  function heroBar() {
    const today = todayKey();
    const hour = now().getHours();
    const upcoming = deadlines().filter((d) => d.due && d.due >= today && !d.complete).sort((a, b) => a.due.localeCompare(b.due))[0];
    let line = fmtLong(today);
    if (upcoming) {
      const n = daysBetween(today, upcoming.due);
      line += ` · next ${upcoming.kind === 'event' ? 'date' : 'deadline'} ${n === 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`}`;
    }
    const unseen = state.log.some((e) => e.at > (state.logSeen || 0));
    return `${capSvg('cap')}
      <h2>${hour < 12 ? 'Morning' : hour < 18 ? 'Afternoon' : 'Evening'}, ${esc(DATA.owner || 'there')}<span class="sub">${esc(line)}</span><span class="sync-pill" id="sync-pill"></span></h2>
      <button class="iconbtn" data-go="log" aria-label="How the plan has changed${unseen ? ', new changes' : ''}">${ICON.bell}${unseen ? '<span class="dot"></span>' : ''}</button>`;
  }

  function nextStepCard(ns) {
    if (ns.type === 'review') {
      const w = ns.week;
      return `<section class="card nextstep" aria-label="Your one next step">
        <span class="kicker">Your one next step</span>
        <h3>${w.state === 'overdue' ? 'Finish' : 'Do'} the PebblePad review for ${esc(weekLabel(w.mon))}</h3>
        <p class="meta"><span class="tag review">Portfolio</span><span>${esc(mins(ns.mins))}</span><span>${w.done} of ${w.total} checked</span></p>
        <p class="why">${esc(ns.why)}</p>
        <div class="btn-row"><button class="btn small light" data-action="open-review" data-id="${esc(w.mon)}">Open the review</button><button class="btn small on-ink" data-action="why-next">Why this?</button></div>
      </section>`;
    }
    const c = ns.c;
    const ahead = ns.type === 'ahead';
    return `<section class="card nextstep" aria-label="Your one next step">
      <span class="kicker">${ahead ? 'Next in your plan' : 'Your one next step'}</span>
      <h3>${esc(c.title)}</h3>
      <p class="meta">${tag(c.course)}<span>${esc(mins(c.mins || 30))}</span><span>for ${esc(c.deadline.title)}</span></p>
      ${c.tip && !ahead ? `<p class="tip">${esc(c.tip)}</p>` : ''}
      <p class="why">${esc(ns.why)}</p>
      <div class="btn-row">
        ${ahead
          ? `<button class="btn small light" data-action="pull" data-id="${esc(c.id)}">Do it tonight</button>`
          : `<button class="btn small light" data-action="tick-now" data-id="${esc(c.id)}">Done</button><button class="btn small on-ink" data-action="move" data-id="${esc(c.id)}">Not tonight</button>`}
        <button class="btn small on-ink" data-action="why-next">Why this?</button>
      </div>
    </section>`;
  }

  function energyCard() {
    const e = state.energy[todayKey()];
    const opts = [['low', 'Low, keep it light'], ['okay', 'Okay'], ['high', 'Good, push me']];
    const pill = e === 'low' ? '<span class="pill warn">Lighter evening</span>' : e === 'high' ? '<span class="pill good">Bonus step</span>' : '';
    const help = e === 'low' ? 'Tonight keeps the step with the closest deadline. The rest moved to evenings with room. Change your answer to undo it.'
      : e === 'high' ? 'One step from later in the week is on tonight instead. Change your answer to undo it.'
      : 'Low keeps only the most urgent step tonight. Good pulls one step forward from later in the week.';
    return `<section class="card">
      <div class="row between"><h3>How is your energy tonight?</h3>${pill}</div>
      <div class="chips" role="group" aria-label="Energy tonight">${opts.map(([id, l]) => `<button class="chip" data-action="energy" data-id="${id}" aria-pressed="${e === id}">${l}</button>`).join('')}</div>
      <p class="small-print">${help}</p>
    </section>`;
  }

  // Steps that were not ticked: past their deadline (or every missed step when self-healing is off).
  function staleCard(list, healOff) {
    const groups = {};
    list.forEach((c) => { (groups[c.deadline.id] = groups[c.deadline.id] || { d: c.deadline, items: [] }).items.push(c); });
    const body = Object.values(groups).map((g) => {
      const rows = `<ul class="steps">${g.items.map((c) => stepRow(c, { showDate: true, showFor: false, showTip: false })).join('')}</ul>`;
      return `<div class="stale-group">
        <div class="row between"><b class="grow">${esc(g.d.title)}</b>${healOff ? '' : `<button class="btn small" data-action="tick-group" data-id="${esc(g.d.id)}">It went in: tick ${g.items.length}</button>`}</div>
        ${g.items.length > 3 ? `<details><summary>${plural(g.items.length, 'step')}</summary>${rows}</details>` : rows}
      </div>`;
    }).join('');
    return `<section class="card warn-card">
      <div class="row between"><h3>${healOff ? 'Catch up' : 'Check these'}</h3>${healOff ? '<button class="btn small" data-action="move-all">Spread them over free evenings</button>' : ''}</div>
      <p class="small-print">${healOff
        ? 'These steps were not ticked off on the night.'
        : 'Not ticked off, and the deadline has passed, so the planner has left them where they were. If the work went in, tick them off. If not, talk to your tutor or assessor, then move them with the arrow.'}</p>
      ${body}
    </section>`;
  }

  function tonightCard() {
    const today = todayKey();
    const chunks = allChunks(deadlines());
    const todays = chunks.filter((c) => c.dateEff === today);
    const left = todays.filter((c) => !c.done);
    const total = left.reduce((a, c) => a + (c.mins || 0), 0);
    const weekend = !isWeekday(today);
    const rw = thisWeekReview();
    const overdue = overdueReviews();
    const reviewTonight = rw && rw.state === 'tonight';
    const reviewMins = REVIEW ? (REVIEW.mins || 20) : 0;
    const shownTotal = total + (reviewTonight || overdue.length ? reviewMins : 0);
    const head = `<div class="tonight-head"><h3>${weekend ? 'This weekend' : 'Tonight'} <span class="eyebrow">${esc(fmtShort(today))}</span></h3>${left.length || reviewTonight || overdue.length ? `<span class="mins">${esc(mins(shownTotal))}</span>` : ''}</div>`;
    let nudge = '';
    if (overdue.length) {
      const w = overdue[0];
      nudge = `<div class="nudge is-overdue"><p><strong>PebblePad review still open</strong> for ${esc(weekLabel(w.mon))}${overdue.length > 1 ? ` and ${plural(overdue.length - 1, 'more week')}` : ''}. ${w.done} of ${w.total} checked. It stays here until it is done.</p><div class="btn-row"><button class="btn small primary" data-action="open-review" data-id="${esc(w.mon)}">Finish the review</button></div></div>`;
    } else if (reviewTonight) {
      nudge = `<div class="nudge"><p><strong>Weekly PebblePad review tonight</strong>, about ${esc(mins(reviewMins))}. ${rw.done} of ${rw.total} checked so far.</p><div class="btn-row"><button class="btn small primary" data-action="open-review" data-id="${esc(rw.mon)}">Start the review</button></div></div>`;
    }
    let body = '';
    if (todays.length) {
      body = `<ul class="steps">${todays.slice().sort((a, b) => Number(a.done) - Number(b.done) || byUrgency(a, b)).map((c) => stepRow(c, { showTip: true })).join('')}</ul>`;
      if (!left.length) body = '<p><strong>All done for tonight.</strong> That is one less thing for later.</p>' + body;
    } else if (!nudge) {
      body = `<p class="small-print">${weekend ? 'Nothing planned. Enjoy the weekend.' : 'Nothing planned tonight.'}</p>`;
    }
    let alarmLine = '';
    if (APP) {
      alarmLine = state.settings.alarms === false
        ? '<p class="alarm-line">Alarms are off. <button class="linkish" data-go="settings">Turn them on</button></p>'
        : `<p class="alarm-line">${nextAlarmText()}</p>`;
    }
    return `<section class="card tonight">${head}${nudge}${body}${alarmLine}</section>`;
  }

  function statsRow() {
    const today = todayKey();
    const mon = mondayOf(today);
    const sun = addDays(mon, 6);
    const chunks = allChunks(deadlines());
    const startMs = parseKey(mon).getTime();
    const done = chunks.filter((c) => c.done && Number(state.done[c.id]) >= startMs).length;
    const left = chunks.filter((c) => !c.done && c.dateEff >= today && c.dateEff <= sun).reduce((a, c) => a + (c.mins || 0), 0);
    const st = streak();
    return `<div class="stats">
      <div class="stat-tile"><b style="color:var(--accent-ink)">${st}</b><span>${st === 1 ? 'evening' : 'evenings'} on plan in a row</span></div>
      <div class="stat-tile"><b>${done}</b><span>${done === 1 ? 'step' : 'steps'} done this week</span></div>
      <div class="stat-tile"><b>${esc(mins(left))}</b><span>left this week</span></div>
    </div>`;
  }

  function weekStrip() {
    const today = todayKey();
    const chunks = allChunks(deadlines());
    const mon = mondayOf(today);
    const week = [0, 1, 2, 3, 4].map((i) => addDays(mon, i));
    return `<section class="card"><div class="row between"><h3>This week</h3><button class="btn small" data-tab="plan">Planner</button></div>
      <div class="strip">${week.map((d) => {
        const items = chunks.filter((c) => c.dateEff === d);
        const rv = REVIEW && inReviewRange(mon) && reviewDayKey(mon) === d ? reviewWeek(mon) : null;
        const m = items.reduce((a, c) => a + (c.done ? 0 : c.mins || 0), 0) + (rv && !rv.complete ? (REVIEW.mins || 20) : 0);
        return `<div class="strip-day${d === today ? ' is-today' : ''}"><span class="dow">${esc(fmt(d, { weekday: 'short' }))}</span><span class="m">${m ? esc(m) : '–'}</span><span class="dots">${items.map((c) => `<i class="${esc(c.course)}${c.done ? ' done' : ''}"></i>`).join('')}${rv ? `<i class="review${rv.complete ? ' done' : ''}" title="PebblePad review"></i>` : ''}</span></div>`;
      }).join('')}</div>
      <p class="small-print">Minutes left each evening${state.weekCap[mon] ? `, up to ${state.weekCap[mon]} this week` : ''}. Round dots are steps, coloured by course. The square is the PebblePad review.</p></section>`;
  }

  function noticeFor(e) {
    return `<div class="notice"><span class="ic">${ICON.spark}</span><div><b>${esc(e.what)}</b><p>${esc(e.why || '')}</p><button class="linkish" data-go="log">See every change</button></div></div>`;
  }

  function renderHome() {
    const today = todayKey();
    const list = deadlines();
    const chunks = allChunks(list);
    const s = state.settings;
    let html = '';
    if (APP && !s.alarmSetupSeen) {
      html += `<div class="callout"><strong>Check your alarms once.</strong> Open Settings, fix anything marked with a red mark, then tap Test the alarm. It takes two minutes. <div class="btn-row" style="margin-top:.5rem"><button class="btn small primary" data-action="goto-alarms">Check the alarms</button><button class="btn small" data-action="dismiss-alarms">Later</button></div></div>`;
    } else if (!APP && !s.remindersSeen) {
      html += `<div class="callout"><strong>Get these on your phone.</strong> Each step has a calendar button, and Settings shows how to put the whole plan into Google Calendar with notifications. <div class="btn-row" style="margin-top:.5rem"><button class="btn small primary" data-action="goto-reminders">Set up reminders</button><button class="btn small" data-action="dismiss-reminders">Later</button></div></div>`;
    }
    const ns = nextStep();
    if (ns) html += nextStepCard(ns);
    const tonightSteps = chunks.filter((c) => c.dateEff === today && !c.done).length;
    if (s.energyCheck !== false && (isWeekday(today) || tonightSteps)) html += energyCard();
    html += tonightCard();
    const healOff = s.heal === false;
    const stale = chunks.filter((c) => !c.done && c.dateEff < today && (healOff || (lastDayFor(c) && lastDayFor(c) < today)));
    if (stale.length) html += staleCard(stale, healOff);
    if (reflectionDue()) {
      html += `<section class="card prompt"><span class="kicker">Weekly reflection · ${esc(weekLabel(mondayOf(today)))}</span><h3>How did this week go?</h3>
        <p class="small-print">Two minutes. A few lines and how the week felt. It decides how full next week's evenings are.</p>
        <div class="btn-row"><button class="btn small primary" data-go="reflect">Write it</button></div></section>`;
    }
    html += statsRow();
    const recent = state.log.find((e) => !e.undone && e.kind !== 'check' && e.at > now().getTime() - 3 * 86400000);
    if (recent) html += noticeFor(recent);
    html += weekStrip();
    const upcoming = list.filter((d) => d.due && d.due >= today && !d.complete && passesFilter(d.course)).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 3);
    html += `<div class="section"><div class="section-head"><h2>Coming up</h2><button class="btn small" data-go="deadlines">All deadlines</button></div>
      ${upcoming.length ? upcoming.map((d) => deadlineCard(d, { compact: true })).join('') : '<p class="empty">Nothing due. Add one from More, Add a deadline.</p>'}</div>`;
    const nodate = list.filter((d) => !d.due);
    if (nodate.length) {
      html += `<div class="section"><div class="section-head"><h2>Needs a date</h2></div><p class="empty">${plural(nodate.length, 'item')} waiting for a date: ${nodate.map((d) => esc(d.title)).join(', ')}. <button class="btn small" data-go="deadlines" style="margin-top:.5rem">Add the dates</button></p></div>`;
    }
    return html;
  }

  function filterChips() {
    const f = state.settings.course;
    const opts = [['all', 'Both'], ['pgce', 'PGCE'], ['assess', 'Assessor']];
    if ((state.custom || []).some((d) => d.course === 'other')) opts.push(['other', 'Other']);
    return `<div class="chips" role="group" aria-label="Show course">${opts.map(([id, label]) => `<button class="chip" data-action="filter" data-id="${id}" aria-pressed="${f === id}">${label}</button>`).join('')}</div>`;
  }

  function renderPlan() {
    const today = todayKey();
    const list = deadlines();
    const chunks = allChunks(list).filter((c) => passesFilter(c.course));
    const showPast = state.settings.showPast;
    const startKey = showPast ? '0000-00-00' : mondayOf(today);
    const byDate = {};
    chunks.forEach((c) => { if (c.dateEff >= startKey) (byDate[c.dateEff] = byDate[c.dateEff] || { chunks: [], marks: [] }).chunks.push(c); });
    list.filter((d) => d.due && passesFilter(d.course) && d.due >= startKey).forEach((d) => { (byDate[d.due] = byDate[d.due] || { chunks: [], marks: [] }).marks.push(d); });
    if (REVIEW && passesFilter('pgce')) {
      for (let mon = mondayOf(REVIEW.start); mon <= REVIEW.end; mon = addDays(mon, 7)) {
        if (!inReviewRange(mon)) continue;
        const day = reviewDayKey(mon);
        if (day < startKey) continue;
        (byDate[day] = byDate[day] || { chunks: [], marks: [] }).review = reviewWeek(mon);
      }
    }
    const keys = Object.keys(byDate).sort();
    const weeks = [];
    keys.forEach((k) => {
      const w = mondayOf(k);
      let wk = weeks[weeks.length - 1];
      if (!wk || wk.mon !== w) { wk = { mon: w, days: [] }; weeks.push(wk); }
      wk.days.push(k);
    });
    const lastPlan = state.log.find((e) => !e.undone && (e.kind === 'replan' || e.kind === 'heal' || e.kind === 'check') && e.at > now().getTime() - 2 * 86400000);
    let html = weekPicker(planWeek || mondayOf(today))
      + (lastPlan ? noticeFor(lastPlan) : '')
      + `<div class="row between">${filterChips()}<button class="btn small" data-action="toggle-past">${showPast ? 'Hide finished weeks' : 'Show finished weeks'}</button></div>`;
    if (!weeks.length) html += '<p class="empty">Nothing in the plan for this filter.</p>';
    weeks.forEach((wk) => {
      const all = wk.days.flatMap((k) => byDate[k].chunks || []);
      const left = all.filter((c) => !c.done);
      const isThis = wk.mon === mondayOf(today);
      html += `<section class="week" aria-label="Week commencing ${esc(fmtLong(wk.mon))}">
        <div class="week-head"><h3>${isThis ? 'This week' : 'w/c ' + esc(fmt(wk.mon, { day: 'numeric', month: 'short', year: parseKey(wk.mon).getFullYear() !== parseKey(today).getFullYear() ? 'numeric' : undefined }))}</h3>
        <span class="load">${left.length ? `${left.length} step${left.length === 1 ? '' : 's'} · ${esc(mins(left.reduce((a, c) => a + (c.mins || 0), 0)))}` : (all.length ? 'all done' : '')}</span></div>
        ${wk.days.map((k) => `<div class="day${k === today ? ' is-today' : ''}" id="day-${esc(k)}">
          <div class="day-date"><div class="dow">${esc(fmt(k, { weekday: 'short' }))}</div><div class="num">${parseKey(k).getDate()}</div><div class="dow">${esc(fmt(k, { month: 'short' }))}</div></div>
          <div class="day-items">
            ${byDate[k].marks.map((d) => `<div class="milestone ${esc(d.course)}"><span class="flag" aria-hidden="true">${d.kind === 'event' ? '●' : '⚑'}</span>${tag(d.course)}<span>${d.kind === 'event' ? '' : 'Due: '}${esc(d.title)}</span>${d.status !== 'confirmed' ? statusTag(d.status) : ''}</div>`).join('')}
            ${byDate[k].review ? reviewMilestone(byDate[k].review) : ''}
            ${byDate[k].chunks.length ? `<ul class="steps">${byDate[k].chunks.map((c) => stepRow(c, { showTip: k === today })).join('')}</ul>` : ''}
          </div></div>`).join('')}
      </section>`;
    });
    html += `<section class="card"><h3>How the planner decides</h3>
      <p class="small-print">Closest deadline first, inside the minutes you allow each evening. ${state.settings.heal === false ? 'Missed steps stay where they are until you move them (you can change this in Settings).' : 'A step you miss moves to the first weekday evening with room before its deadline.'} Christmas and Easter weeks stay free unless a deadline needs them. Re-plan evens out any evening over your limit, moving the step with the furthest deadline first. Every change is listed under How it adapts, with the reason.</p>
      <div class="btn-row"><button class="btn small" data-go="settings">Evening limit: ${esc(state.settings.cap)} min</button><button class="btn small" data-go="log">How it adapts</button></div></section>`;
    return html;
  }

  let planWeek = null; // the Monday shown in the week picker
  function weekPicker(mon) {
    const today = todayKey();
    const load = loadMap();
    const days = [0, 1, 2, 3, 4, 5, 6].map((i) => addDays(mon, i));
    const capWeek = state.weekCap[mon];
    return `<section class="card">
      <div class="row between"><button class="iconbtn" data-action="plan-week" data-id="-7" aria-label="Previous week">${ICON.back}</button><b>${mon === mondayOf(today) ? 'This week' : esc(weekLabel(mon))}</b><button class="iconbtn" data-action="plan-week" data-id="7" aria-label="Next week">${ICON.fwd}</button></div>
      <div class="weekpick">${days.map((d) => {
        const m = load[d] || 0;
        const cap = capFor(d);
        const pct = isWeekday(d) ? Math.min(100, Math.round((m / cap) * 100)) : (m ? 100 : 0);
        return `<button class="wday${d === today ? ' is-today' : ''}${isWeekday(d) && m > cap ? ' over' : ''}" data-action="plan-day" data-id="${d}" aria-label="${esc(fmtLong(d))}, ${m} minutes to do"><span>${esc(fmt(d, { weekday: 'short' }))}</span><b>${parseKey(d).getDate()}</b><span class="load"><i style="width:${pct}%"></i></span><span class="m">${m || '–'}</span></button>`;
      }).join('')}</div>
      <p class="small-print">Minutes still to do each evening, against your limit of ${capWeek || state.settings.cap} minutes${capWeek ? ' this week, set by your reflection' : ''}. Red means over the limit. Tap a day to jump to it.</p>
    </section>`;
  }

  let focusWeek = null;
  function reviewMilestone(w) {
    const label = w.complete ? (w.skipped ? 'skipped' : 'done') : `${w.done} of ${w.total}`;
    const late = w.state === 'overdue';
    return `<button class="milestone review${w.complete ? ' is-done' : ''}" data-action="open-review" data-id="${esc(w.mon)}"><span class="flag" aria-hidden="true">■</span><span class="tag review">Portfolio</span><span>PebblePad review</span><span class="tag ${late ? 'late' : 'status-confirmed'}">${esc(late ? 'Overdue, ' + label : label)}</span></button>`;
  }

  function reviewCard(w) {
    const pct = w.total ? Math.round((w.done / w.total) * 100) : 0;
    const eyebrow = { overdue: 'Overdue', tonight: 'Tonight', upcoming: 'This week', done: w.skipped ? 'Skipped' : 'Done' }[w.state];
    const items = w.items.map((it) => {
      const on = !!w.ticks[it.id];
      const fid = `rv-${w.mon}-${it.id}`;
      return `<li class="${on ? 'is-done' : ''}"><input type="checkbox" class="tick" id="${esc(fid)}" data-action="rtick" data-week="${esc(w.mon)}" data-id="${esc(it.id)}"${on ? ' checked' : ''}><label for="${esc(fid)}"><span class="step-title">${esc(it.title)}</span><span class="step-tip">${esc(it.tip || '')}</span></label></li>`;
    }).join('');
    return `<article class="review-card${w.state === 'overdue' ? ' is-overdue' : ''}" id="rv-${esc(w.mon)}">
      <div class="review-head">
        <div><span class="eyebrow" style="color:${w.state === 'overdue' ? 'var(--danger)' : 'var(--review)'}">${esc(eyebrow)}</span>
          <h3 style="margin-top:.25rem">PebblePad review, ${esc(weekLabel(w.mon))}</h3>
          <p class="small-print">${esc(DAY_NAMES[reviewDayNum() - 1])} ${esc(fmt(w.day, { day: 'numeric', month: 'long' }))} · about ${esc(mins(REVIEW.mins || 20))}</p></div>
        <div class="due-box"><div class="big">${w.done}/${w.total}</div><div class="small">checked</div></div>
      </div>
      <div class="bar" role="img" aria-label="${pct}% checked"><span style="width:${pct}%"></span></div>
      <p class="small-print">Tick each one once you have looked at it, even if there was nothing to add this week.</p>
      ${w.complete && !w.skipped ? `<details><summary>What you checked</summary><ul class="checks" style="margin-top:.6rem">${items}</ul></details>` : `<ul class="checks">${items}</ul>`}
      <div class="btn-row">
        ${w.complete ? '' : `<button class="btn small" data-action="review-all" data-id="${esc(w.mon)}">Tick them all</button>`}
        ${w.skipped ? `<button class="btn small" data-action="review-unskip" data-id="${esc(w.mon)}">Undo skip</button>` : (w.complete ? '' : `<button class="btn small" data-action="review-skip" data-id="${esc(w.mon)}">No review this week</button>`)}
      </div>
    </article>`;
  }

  function numField(key, label, target, help) {
    const v = state.portfolio.nums[key];
    const n = Number(v) || 0;
    const pct = target ? clamp(Math.round((n / target) * 100), 0, 100) : 0;
    return `<div class="counter"><label for="p-${esc(key)}">${esc(label)}</label>
      <div class="num-row"><input type="number" id="p-${esc(key)}" min="0" step="0.5" inputmode="decimal" value="${v == null || v === '' ? '' : esc(v)}" data-action="pnum" data-id="${esc(key)}" placeholder="0"><span class="of">of ${esc(target)}</span></div>
      <div class="bar" role="img" aria-label="${pct}%"><span style="width:${pct}%"></span></div>
      ${help ? `<span class="help small-print">${esc(help)}</span>` : ''}</div>`;
  }

  function renderPortfolio() {
    if (!REVIEW || !PORT) return '<p class="empty">No portfolio data in this version.</p>';
    const p = state.portfolio;
    const overdue = overdueReviews();
    const rw = thisWeekReview();
    const upcoming = rw || nextReview();
    let html = `<p class="small-print">Your Module 3 portfolio needs evidence for every KSB, ten observation forms and reflections, both placement reflections, your Safeguarding and Prevent certificates and 150 hours of lead teaching. A short check each week keeps it from piling up. An unfinished week stays on Today until you finish it.</p>`;
    if (overdue.length) html += `<div class="section"><h3>Still to finish</h3>${overdue.map(reviewCard).join('')}</div>`;
    if (upcoming && !overdue.some((w) => w.mon === upcoming.mon)) html += `<div class="section"><h3>${rw && upcoming.mon === rw.mon ? 'This week' : 'Next review'}</h3>${reviewCard(upcoming)}</div>`;
    const shown = overdue.map((w) => w.mon).concat(upcoming ? [upcoming.mon] : []);
    if (focusWeek && inReviewRange(focusWeek) && !shown.includes(focusWeek)) {
      html = html.replace('</p>', '</p>' + `<div class="section"><h3>The week you opened</h3>${reviewCard(reviewWeek(focusWeek))}</div>`);
    }
    const past = reviewWeeksSoFar().filter((w) => w.complete).reverse();
    if (past.length) {
      html += `<details class="section"><summary>Finished weeks (${past.length})</summary><div class="history">${past.map((w) => `<button data-action="open-review" data-id="${esc(w.mon)}"><span>${esc(weekLabel(w.mon))}</span><span>${w.skipped ? 'skipped' : 'done'}</span></button>`).join('')}</div></details>`;
    }
    // progress
    const obsDone = PORT.observations.reduce((a, o) => a + (p.obs['f' + o.n] ? 1 : 0) + (p.obs['r' + o.n] ? 1 : 0), 0);
    const checksDone = PORT.checks.filter((c) => p.checks[c.id]).length;
    const dutiesDone = PORT.duties.filter((d, i) => p.duties['d' + (i + 1)]).length;
    html += `<div class="section"><div class="section-head"><h2>Module 3 checklist</h2><span class="hint">Update the numbers in each weekly review</span></div>
      <div class="panel">
        <h3>Numbers so far</h3>
        <div class="counters">
          ${numField('ksb', 'KSBs with evidence', PORT.ksbTotal, 'K1 to K20, S1 to S25, B1 to B6. One piece each is the minimum.')}
          ${numField('hours', 'Lead teaching hours', PORT.hoursTarget, '100 of these in your subject.')}
          ${numField('setting', 'Hours in your setting', PORT.settingTarget, 'Everything on placement, teaching included.')}
          ${numField('remote', 'Remote teaching hours', PORT.remoteTarget, 'The handbook asks you to aim for 20.')}
        </div>
      </div>
      <div class="panel">
        <div class="section-head"><h3>Observations</h3><span class="hint">${obsDone} of ${PORT.observations.length * 2} uploaded</span></div>
        <p class="small-print">Each one needs the feedback form and your 200 to 300 word reflection in PebblePad.</p>
        <div class="obs-list">${PORT.observations.map((o) => `<div class="obs-row"><div class="what"><strong>${esc(o.label)}</strong> ${esc(o.kind)}${o.window ? `<span>${esc(o.window)}</span>` : ''}</div>
          <label class="mini" for="o-f${o.n}">Form<input type="checkbox" class="tick" id="o-f${o.n}" data-action="pobs" data-id="f${o.n}"${p.obs['f' + o.n] ? ' checked' : ''}></label>
          <label class="mini" for="o-r${o.n}">Reflection<input type="checkbox" class="tick" id="o-r${o.n}" data-action="pobs" data-id="r${o.n}"${p.obs['r' + o.n] ? ' checked' : ''}></label></div>`).join('')}</div>
      </div>
      <div class="panel">
        <div class="section-head"><h3>Placements, certificates and records</h3><span class="hint">${checksDone} of ${PORT.checks.length} done</span></div>
        <ul class="checks">${PORT.checks.map((c) => `<li class="${p.checks[c.id] ? 'is-done' : ''}"><input type="checkbox" class="tick" id="c-${esc(c.id)}" data-action="pcheck" data-id="${esc(c.id)}"${p.checks[c.id] ? ' checked' : ''}><label for="c-${esc(c.id)}"><span class="step-title">${esc(c.title)}</span><span class="step-tip">${esc(c.group)}</span></label></li>`).join('')}</ul>
      </div>
      <div class="panel">
        <div class="section-head"><h3>Professional discussion</h3><span class="hint">${dutiesDone} of 9 ready</span></div>
        <div class="field"><span class="label" id="ap-label">Your approach</span>
          <div class="seg" role="group" aria-labelledby="ap-label">${[['story', 'Visual storytelling'], ['qa', 'Question and answer'], ['', 'Not decided']].map(([id, l]) => `<button data-action="approach" data-id="${id}" aria-pressed="${(p.approach || '') === id}">${l}</button>`).join('')}</div>
          <span class="help">Nine stories or nine answers, one for each occupational duty, backed by evidence you can show on screen.</span></div>
        <ul class="checks">${PORT.duties.map((d, i) => `<li class="${p.duties['d' + (i + 1)] ? 'is-done' : ''}"><input type="checkbox" class="tick" id="d-${i + 1}" data-action="pduty" data-id="d${i + 1}"${p.duties['d' + (i + 1)] ? ' checked' : ''}><label for="d-${i + 1}"><span class="step-title">Duty ${i + 1}: ${esc(d)}</span><span class="step-tip">Story or answer drafted, with one piece of evidence to show</span></label></li>`).join('')}</ul>
      </div>
      <details class="panel"><summary>Learning outcomes for Modules 2 and 3</summary>
        ${Object.entries(PORT.los).map(([k, v]) => `<h3 style="margin-top:.7rem">${esc(k)}</h3><ul class="lo-list">${v.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}
      </details>
    </div>`;
    return html;
  }

  function renderDeadlines() {
    const today = todayKey();
    const list = deadlines().filter((d) => passesFilter(d.course));
    const nodate = list.filter((d) => !d.due);
    const open = list.filter((d) => d.due && !(d.complete) && !(d.due < today && !d.chunks.length)).sort((a, b) => a.due.localeCompare(b.due));
    const finished = list.filter((d) => d.due && (d.complete || (d.due < today && !d.chunks.length))).sort((a, b) => b.due.localeCompare(a.due));
    let html = `<div class="row between">${filterChips()}<button class="btn small" data-go="add">${ICON.plus} Add</button></div>`;
    if (nodate.length) {
      html += `<div class="section"><h3>Needs a date</h3><div class="panel">${nodate.map((d) => `<div style="display:flex;gap:.75rem;align-items:center;justify-content:space-between;flex-wrap:wrap">
        <div style="min-width:0">${tag(d.course)} <strong>${esc(d.title)}</strong><p class="small-print">${esc(d.how || '')}</p></div>
        <button class="btn small primary" data-action="set-date" data-id="${esc(d.id)}">Set a date</button></div>`).join('<hr style="border:0;border-top:1px solid var(--line);margin:0">')}</div></div>`;
    }
    html += `<div class="section">${open.length ? open.map((d) => deadlineCard(d)).join('') : '<p class="empty">Nothing open for this filter.</p>'}</div>`;
    if (finished.length) {
      html += `<details class="section"><summary>Finished and past (${finished.length})</summary><div class="section" style="margin-top:.6rem">${finished.map((d) => deadlineCard(d)).join('')}</div></details>`;
    }
    return html;
  }

      <form class="panel" data-form="add" id="add-form">
        <div class="two">

          <div class="field"><label for="f-words">Word count</label><input type="number" id="f-words" name="words" min="300" max="12000" step="100" value="${esc(p.words || 3000)}"></div>

      </form>`;
    if (addDraft) {

      html += `<div class="section" id="preview"><div class="section-head"><h2>Your steps</h2><span class="hint">${addDraft.steps.length} steps · ${esc(mins(addDraft.steps.reduce((a, s) => a + s.mins, 0)))}</span></div>
        ${addDraft.steps.length ? '' : '<p class="empty">No steps for this one. It goes in as a date in your plan.</p>'}

        <ul class="steps">${addDraft.steps.map((s) => `<li class="step ${esc(addDraft.course)}"><span class="tag ${esc(addDraft.course)}" style="align-self:center">${esc(fmtShort(s.date))}</span><div class="step-body"><span class="step-title">${esc(s.title)}</span><span class="step-meta">${esc(mins(s.mins))}${s.tip ? ' · ' + esc(s.tip) : ''}</span></div><span></span></li>`).join('')}</ul>
        <div class="btn-row"><button class="btn primary" data-action="confirm-add">Add to my plan</button><button class="btn" data-action="discard-add">Change something</button></div></div>`;

  function alarmPanel() {
    const s = state.settings;
    const st = appStatus();
    const on = s.alarms !== false;
    const vol = Number(st.alarmVolume || 0);
    const checks = [
      ['notifications', !!st.notifications, 'Notifications allowed', 'Needed for the alarm screen and its buttons.'],
      ['fullscreen', st.fullScreen !== false, 'Full-screen alarm allowed', 'Lets the alarm fill the screen when the phone is locked.'],
      ['exact', st.exact !== false, 'Alarms on the dot', 'Without this Android may ring a few minutes late.'],
      ['sound', vol > 0, vol > 0 ? 'Alarm volume is up' : 'Alarm volume is off', 'The app rings on your phone\'s alarm volume, like the Clock app.'],
      ['battery', !!st.battery, 'Battery saving will not stop the app', 'Recommended. Some phones close apps to save battery.']
    ];
    const leads = [0, 5, 10, 15];
    return `<div class="panel" id="alarms">
      <h3>Alarms</h3>
      <p>The app rings like an alarm clock on evenings that have steps. If the weekly review or earlier steps are still open, it rings again each weekday evening until you tick them off.</p>
      <div class="field"><span class="label" id="al-label">Alarms</span>
        <div class="seg" role="group" aria-labelledby="al-label">${[['on', 'On'], ['off', 'Off']].map(([id, l]) => `<button data-action="alarms" data-id="${id}" aria-pressed="${(on ? 'on' : 'off') === id}">${l}</button>`).join('')}</div></div>
      ${on ? `<p class="next-alarm" id="alarm-next">${nextAlarmText()}</p>
      <div class="two">
        <div class="field"><label for="f-lead">Ring before the start time</label>
          <select id="f-lead" data-action="alarm-lead">${leads.map((m) => `<option value="${m}"${Number(s.alarmLead == null ? 5 : s.alarmLead) === m ? ' selected' : ''}>${m ? m + ' min before' : 'At start time'}</option>`).join('')}</select>
          <span class="help">Your start time is ${esc(s.evening)}, set under Evenings.</span></div>
        <div class="field"><span class="label" id="cu-label">Catch-up evenings</span>

  function smartPanel() {
    const s = state.settings;
    const seg = (action, value, opts, labelId) => `<div class="seg" role="group" aria-labelledby="${labelId}">${opts.map(([id, l]) => `<button data-action="${action}" data-id="${id}" aria-pressed="${value === id}">${esc(l)}</button>`).join('')}</div>`;
    return `<div class="panel" id="smart">
      <h3>Smart planner</h3>
      <div class="field"><span class="label" id="heal-label">Missed steps</span>
        ${seg('heal', s.heal === false ? 'off' : 'on', [['on', 'Move them for me'], ['off', 'Leave them']], 'heal-label')}
        <span class="help">A step you miss moves to the first weekday evening with room before its deadline, and the alarm rings for it there. Every move is listed under How it adapts.</span></div>
      <div class="field"><span class="label" id="en-label">Energy check-in on Home</span>
        ${seg('energy-check', s.energyCheck === false ? 'off' : 'on', [['on', 'Show'], ['off', 'Hide']], 'en-label')}
        <span class="help">Low keeps only the most urgent step that evening. Good pulls one step forward.</span></div>
    </div>`;
  }

  function chatPanel() {
    const s = state.settings;
    return `<div class="panel" id="chat-settings">
      <h3>Claude chat</h3>
      <div class="field"><span class="label" id="cs-label">Open the Chat tab at</span>
        <div class="seg" role="group" aria-labelledby="cs-label">${[['project', 'PGCE project'], ['new', 'New chat']].map(([id, l]) => `<button data-action="chat-start" data-id="${id}" aria-pressed="${(s.chatStart || 'project') === id}">${l}</button>`).join('')}</div></div>
      <div class="field"><label for="f-project">PGCE project link</label>
        <input type="url" id="f-project" inputmode="url" autocomplete="off" value="${esc(s.claudeProject || '')}" data-action="claude-project" placeholder="https://claude.ai/project/...">

      ${chatReady() ? '<div class="btn-row"><button class="btn small" data-action="chat-help">How to sign in</button><button class="btn small danger" data-action="chat-signout">Sign out of Claude in this app</button></div>' : ''}
    </div>`;
  }

  /* ---------- More, reflection and the change log ---------- */
  function renderMore() {
    const today = todayKey();
    const mon = mondayOf(today);
    const open = deadlines().filter((d) => d.due && !d.complete && d.due >= today).length;
    const tiles = [
      ['deadlines', 'Deadlines', `${open} open`],
      ['add', 'Add a deadline', 'Split into small steps'],
      ['reflect', 'Weekly reflection', state.reflections[mon] ? 'Done this week' : (reflectionDue() ? 'Due now' : `On ${DAY_NAMES[reviewDayNum() - 1]}s`)],
      ['log', 'How it adapts', plural(state.log.length, 'change')],
      ['settings', 'Settings', 'Alarms, evenings, chat, colours']
    ];
    return `<div class="tiles">${tiles.map(([k, n, sub]) => `<button class="tile" data-go="${k}"><span class="tile-ic">${ICON[k]}</span><b>${esc(n)}</b><span>${esc(sub)}</span></button>`).join('')}</div>
      <p class="small-print">Deadlines last checked ${esc(fmtYear(DATA.updated || today))}.</p>`;
  }

  let reflectDraft = null;
  let reflectEditing = false;
  function renderReflect() {
    const today = todayKey();
    const mon = mondayOf(today);
    const next = addDays(mon, 7);
    const saved = state.reflections[mon];
    const editing = !saved || reflectEditing;
    if (!reflectDraft || reflectDraft.mon !== mon) {
      reflectDraft = { mon, text: saved ? saved.text || '' : '', moods: saved ? [...(saved.moods || [])] : [], plan: saved ? saved.plan : null };
    }
    const sug = suggestPlan(reflectDraft.moods);
    const plan = reflectDraft.plan || sug.plan;
    let html = '';
    if (editing) {
      html += `<section class="card">
        <span class="kicker">${esc(weekLabel(mon))}</span>
        <h3>What went well, and what got in the way?</h3>
        <p class="small-print">A few lines in your own words. You can copy them into PebblePad later.</p>
        <div class="field"><label class="sr-only" for="f-refl">Your reflection</label><textarea id="f-refl" data-action="refl-text" placeholder="For example: evenings after teaching were hard, but the short steps on Monday worked.">${esc(reflectDraft.text)}</textarea></div>
        <div class="field"><span class="label" id="mood-label">How did the week feel?</span>
          <div class="chips" role="group" aria-labelledby="mood-label">${MOODS.map((m) => `<button class="chip" data-action="mood" data-id="${esc(m)}" aria-pressed="${reflectDraft.moods.includes(m)}">${esc(m)}</button>`).join('')}</div></div>
        <div class="field"><span class="label" id="np-label">Next week, ${esc(weekLabel(next))}</span>
          <div class="seg" role="group" aria-labelledby="np-label">${[['lighter', `Lighter, ${lighterCap()} min`], ['same', `Usual, ${state.settings.cap} min`], ['push', `Fuller, ${pushCap()} min`]].map(([id, l]) => `<button data-action="reflect-plan" data-id="${id}" aria-pressed="${plan === id}">${esc(l)}</button>`).join('')}</div>
          <span class="help">${!reflectDraft.plan && sug.why ? `Suggested because ${esc(sug.why)}. ` : ''}Lighter moves the least urgent steps to evenings with room before their deadlines.</span></div>
        <div class="btn-row"><button class="btn primary" data-action="reflect-save">Save reflection</button>${saved ? '<button class="btn" data-action="reflect-cancel">Cancel</button>' : ''}</div>
      </section>`;
    } else {
      html += `<section class="card">
        <span class="kicker">${esc(weekLabel(mon))} · saved</span>
        ${saved.text ? `<p class="quote">${esc(saved.text)}</p>` : '<p class="small-print">No notes this week, just the check-in.</p>'}
        ${saved.moods && saved.moods.length ? `<div class="chips">${saved.moods.map((m) => `<span class="pill info">${esc(m)}</span>`).join('')}</div>` : ''}
        <p class="small-print">Next week: ${esc(planLabel(saved.plan))}.</p>
        <div class="btn-row"><button class="btn small" data-action="reflect-edit">Change it</button>${saved.text ? `<button class="btn small" data-action="copy-refl" data-id="${esc(mon)}">Copy the text</button>` : ''}</div>
      </section>`;
    }
    const pats = patterns();
    html += `<div class="notice"><span class="ic">${ICON.spark}</span><div><b>What the app sees in your weeks</b><p>${pats.length ? pats.map(esc).join(' ') : 'After a few weeks of ticks and reflections, this shows which evenings work best for you and what keeps coming up.'}</p></div></div>`;
    const past = Object.entries(state.reflections).filter(([k]) => k !== mon).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 8);
    if (past.length) {
      html += `<section class="card"><h3>Earlier weeks</h3><div class="list">${past.map(([k, r]) => `<div class="li"><div class="grow"><b>${esc(weekLabel(k))}</b>${r.moods && r.moods.length ? ` <span class="small-print">${esc(r.moods.join(', '))}</span>` : ''}${r.text ? `<p class="small-print">${esc(r.text)}</p>` : ''}</div>${r.text ? `<button class="btn small" data-action="copy-refl" data-id="${esc(k)}">Copy</button>` : ''}</div>`).join('')}</div></section>`;
    }
    return html;
  }

  const fmtStamp = (ms) => { const d = new Date(ms); return `${fmt(keyOf(d), { weekday: 'short', day: 'numeric', month: 'short' })}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  function renderLog() {
    const intro = '<p class="small-print">Every change the planner makes to your evenings, and why. Changes from the energy check-in, Re-plan and reflections can be undone for a week.</p>';
    if (!state.log.length) return intro + '<div class="empty">Nothing has changed yet. When the planner moves a step, or you use the energy check-in or a weekly reflection, it shows here with the reason.</div>';
    const cutoff = now().getTime() - 7 * 86400000;
    return intro + `<section class="card"><div class="list">${state.log.map((e) => `<div class="logi${e.undone ? ' is-undone' : ''}">
      <time>${esc(fmtStamp(e.at))}</time>
      <div><b>${esc(e.what)}</b>${e.undone ? '<span class="pill">Undone</span>' : ''}
        <p class="small-print">${esc(e.why || '')}</p>
        ${e.lines && e.lines.length ? `<ul class="loglines">${e.lines.slice(0, 8).map((l) => `<li>${esc(l)}</li>`).join('')}${e.lines.length > 8 ? `<li>and ${e.lines.length - 8} more</li>` : ''}</ul>` : ''}
        ${e.undo && !e.undone && e.at > cutoff ? `<button class="btn small" data-action="undo" data-id="${esc(e.id)}">Undo</button>` : ''}
      </div></div>`).join('')}</div></section>`;
  }

  /* ---------- Chat: claude.ai inside the Android app ----------
     The app lays a second web view over the empty screen area, between the top bar and the
     tab bar, signed in to your own Claude account. This page only says where it should sit. */
  const CHAT = { type: '', url: '' };
  const chatReady = () => !!(APP && typeof APP.chatShow === 'function');
  const isClaudeUrl = (u) => /^https:\/\/([a-z0-9-]+\.)*claude\.ai(\/|$)/i.test(String(u || ''));
  function chatUrl(where) {
    const s = state.settings;
    if (where === 'new') return 'https://claude.ai/new';
    if (where === 'recents') return 'https://claude.ai/recents';
    if (where === 'project') return isClaudeUrl(s.claudeProject) ? s.claudeProject : 'https://claude.ai/projects';
    return s.chatStart === 'new' ? 'https://claude.ai/new' : chatUrl('project');
  }
  function chatSubText() {
    if (!chatReady()) return 'Opens in your browser';
    const u = CHAT.url;
    if (/\/login|magic-link|\/verify/i.test(u)) return 'Sign in: tap Continue with email';
    if (CHAT.type === 'start') return 'Loading…';
    if (/\/project\//.test(u)) return 'PGCE project';
    return 'Your Claude account';
  }
  let sheetOpen = false;
  function positionChat() {
    if (!chatReady()) return;
    try {
      if (route !== 'chat' || sheetOpen) { APP.chatHide(); return; }
      const top = $('#appbar').getBoundingClientRect().bottom;
      const nr = $('#nav').getBoundingClientRect();
      const bottom = nr.height ? Math.max(0, window.innerHeight - nr.top) : 0;
      APP.chatShow(Math.round(top), Math.round(bottom), Math.round(window.innerWidth), chatUrl());
    } catch (e) { /* the chat shows next time the tab opens */ }
  }
  let chatTipShown = false;
  function renderChat() {
    if (chatReady()) {
      return `<div class="chat-hole"><div>${capSvg('')}<p><strong>Opening Claude…</strong></p><p class="small-print">If this stays, check your internet connection, then tap the three dots and Reload.</p></div></div>`;
    }
    return `<section class="card"><h3>Chat with Claude</h3>
      <p>In the Android app this tab opens your own Claude account inside the app, with your chats and your PGCE project. Here it opens in a new tab.</p>
      <div class="btn-row"><a class="btn primary" href="${esc(chatUrl())}" target="_blank" rel="noopener">Open Claude</a><button class="btn" data-action="copy-week">Copy my week</button></div>
      <p class="small-print">Copy my week puts tonight's steps, the next seven days and your deadlines on the clipboard, ready to paste into a chat.</p></section>`;
  }
  function signInHelp(first) {
    sheet(`<h3>Signing in to Claude here</h3>
      <ol class="signin">
        <li>Tap <strong>Continue with email</strong> and type the email you use for Claude. Google sign-in does not work inside apps, but your Gmail address works fine here.</li>
        <li>Open the email called <strong>Secure link to log in to Claude.ai</strong>.</li>
        <li><strong>Either</strong> hold the link, tap Copy link address, come back and tap <strong>Paste sign-in link</strong> below. <strong>Or</strong> tap the link: it opens in your browser and shows a six-digit code. Come back here and type the code.</li>
      </ol>
      <p class="small-print">You stay signed in after that. Your chats and the PGCE project are the same ones you see on the Claude app and website.</p>
      <button class="btn primary block" data-action="chat-paste">${ICON.link} Paste sign-in link</button>
      <button class="btn block" data-action="${first ? 'chat-tip-done' : 'close-sheet'}">Got it</button>`);
  }
  function chatMenu() {
    sheet(`<h3>Claude</h3>
      <div class="menu">
        <button data-action="chat-go" data-id="new">${ICON.plus} New chat</button>
        <button data-action="chat-go" data-id="project">${ICON.folder} PGCE project</button>
        <button data-action="chat-go" data-id="recents">${ICON.chats} Your chats</button>
        <button data-action="chat-week">${ICON.week} Put my week in the message box</button>
        <button data-action="chat-paste">${ICON.link} Paste sign-in link</button>
        <button data-action="chat-help">${ICON.help} How to sign in</button>
        <button data-action="chat-reload">${ICON.reload} Reload</button>
        <button data-action="chat-browser">${ICON.out} Open in your browser</button>
      </div>
      <button class="btn block" data-action="close-sheet">Close</button>`);
  }
  function copyText(text, okMsg) {
    let ok = false;
    if (APP && typeof APP.copyText === 'function') { try { ok = APP.copyText(text); } catch (e) { ok = false; } }
    if (ok) { toast(okMsg); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(okMsg), () => toast('Copy did not work here.'));
    else toast('Copy did not work here.');
  }
  function insertWeek() {
    if (chatReady()) { try { APP.chatInsert(weekText()); return; } catch (e) { /* fall back to copying */ } }
    copyText(weekText(), 'Your week is copied. Paste it into a Claude chat and add your question.');
  }

  /* ---------- the shell: top bar, screens, tabs, sheets ---------- */
  const TITLES = { plan: 'Plan', chat: 'Claude', portfolio: 'Portfolio', more: 'More', deadlines: 'Deadlines', add: 'Add a deadline', reflect: 'Weekly reflection', log: 'How it adapts', settings: 'Settings' };
  const SUBS = { portfolio: 'Weekly PebblePad review and Module 3', plan: 'Weekday evenings', deadlines: 'PGCE and Assessor Awards' };
  function appbarHtml() {
    if (route === 'home') return heroBar();
    const backBtn = TABS.includes(route) ? '' : `<button class="iconbtn" data-action="back" aria-label="Back">${ICON.back}</button>`;
    let right = '';
    if (route === 'plan') right = '<button class="btn small" data-action="replan">Re-plan</button>';
    if (route === 'chat') right = `<button class="iconbtn" data-action="chat-week" aria-label="Put my week in the message box">${ICON.week}</button><button class="iconbtn" data-action="chat-menu" aria-label="Chat options">${ICON.dots}</button>`;
    const sub = route === 'chat' ? `<span class="sub" id="chat-sub">${esc(chatSubText())}</span>` : (SUBS[route] ? `<span class="sub">${esc(SUBS[route])}</span>` : '');
    return `${backBtn}${capSvg('cap')}<h2>${esc(TITLES[route] || '')}${sub}</h2>${right}`;
  }
  const VIEWS = { home: renderHome, plan: renderPlan, chat: renderChat, portfolio: renderPortfolio, more: renderMore, deadlines: renderDeadlines, add: renderAdd, reflect: renderReflect, log: renderLog, settings: renderSettings };
  function renderNav() {
    const top = TABS.includes(route) ? route : (stack.length && TABS.includes(stack[0]) ? stack[0] : 'more');
    document.querySelectorAll('.tab').forEach((t) => { if (t.dataset.tab === top) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
  }
  function renderView() {
    if (route === 'log' && state.log.some((e) => e.at > (state.logSeen || 0))) { state.logSeen = now().getTime(); commit(); }
    document.body.dataset.route = route;
    const bar = $('#appbar');
    bar.className = 'appbar' + (route === 'home' ? ' hero' : '');
    bar.innerHTML = appbarHtml();
    $('#screen').innerHTML = `<div class="inner">${(VIEWS[route] || renderHome)()}</div>`;
    renderNav();
    Remote.setStatus(Remote.status);
    // First visit to Chat: show how to sign in before the chat appears.
    if (route === 'chat' && chatReady() && !state.settings.chatTipSeen && !chatTipShown) { chatTipShown = true; signInHelp(true); }
    positionChat();
  }
  function renderAll() { renderView(); }

  function go(r, opt) {
    const o = typeof opt === 'string' ? { anchor: opt } : (opt || {});
    r = routeOf(r);
    if (TABS.includes(r)) stack = [];
    else if (r !== route) stack.push(route);
    route = r;
    if (TABS.includes(r) && r !== 'chat') { try { localStorage.setItem(VIEW_KEY, r); } catch (e) { /* ignore */ } }
    if (sheetOpen) { sheetOpen = false; $('#layer').innerHTML = ''; }
    const t = $('#toast');
    if (t) t.hidden = true;
    renderView();
    const scr = $('#screen');
    const el = o.anchor ? document.getElementById(o.anchor) : null;
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); else scr.scrollTop = 0;
  }
  function back() {
    route = stack.pop() || 'home';
    renderView();
    $('#screen').scrollTop = 0;
  }

  function sheet(html) {
    sheetOpen = true;
    $('#layer').innerHTML = `<div class="scrim" data-action="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
    positionChat();
    const first = $('#layer .sheet button');
    if (first) first.focus({ preventScroll: true });
  }
  function closeSheet() {
    if (!sheetOpen) return;
    sheetOpen = false;
    $('#layer').innerHTML = '';
    positionChat();
  }
  function whyNextSheet() {
    sheet(`<h3>How the next step is chosen</h3>
      <p>The planner looks at everything planned for tonight and anything that slipped, then picks the step with the closest deadline.</p>
      <p class="small-print">An open PebblePad review always comes first, because it stays open until you finish it. On review night, the review comes first unless a step is due within three days. If nothing is left tonight, you see the next step in your plan and can do it tonight instead.</p>
      <p class="small-print">${state.energy[todayKey()] === 'low' ? 'You said your energy is low, so the evening can stop after this one.' : 'If your energy is low, say so on Home: tonight keeps only the most urgent step.'}</p>
      <button class="btn block" data-action="close-sheet">Got it</button>`);
  }

  let toastTimer = null;
  function toast(msg) {
    if (route === 'chat' && chatReady() && !sheetOpen && typeof APP.toast === 'function') { try { APP.toast(msg); return; } catch (e) { /* show it on the page */ } }
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3800);
  }
  function tossCap() {
    const cap = $('#cap');
    if (!cap) return;
    cap.classList.remove('toss');
    void cap.getBoundingClientRect();
    cap.classList.add('toss');
  }
  function reviewDone(mon) {
    const w = reviewWeek(mon);
    if (!w.complete || w.skipped) return;
    tossCap();
    const left = overdueReviews().length;
    toast(left ? `PebblePad review for ${weekLabel(mon)} done. ${left} more week${left === 1 ? '' : 's'} to catch up.` : `PebblePad review for ${weekLabel(mon)} done.`);
  }
  function celebrate(d) {
    tossCap();
    toast(`Every step done for "${d.title}". Cap in the air.`);
  }

  /* ---------- actions ---------- */
  function tick(id, on) {
    if (on) state.done[id] = Date.now(); else delete state.done[id];
    commit();
    renderAll();
    if (on) {
      const d = deadlines().find((x) => x.chunks.some((c) => c.id === id));
      if (d && d.complete) celebrate(d);
    }
  }
  // The arrow on a step: the next evening with room, before the deadline where possible.
  function moveChunk(id) {
    const c = allChunks(deadlines()).find((x) => x.id === id);
    if (!c) return;
    const today = todayKey();
    const from = c.dateEff < today ? today : addDays(c.dateEff, 1);
    const slot = findSlot(c, from, loadMap(id));
    const to = slot ? slot.day : nextFreeEvening(from, c.mins || 30, id);
    state.moved[id] = to;
    commit();
    renderAll();
    const note = c.deadline.due && to > c.deadline.due ? '. That is after the deadline, so check it still works.'
      : (slot && !slot.fits ? '. That evening is over your limit, because the deadline is close.' : '.');
    toast(`Moved to ${fmtLong(to)}${note}`);
  }
  // "Do it tonight" on the next step.
  function pullToTonight(id) {
    const c = allChunks(deadlines()).find((x) => x.id === id);
    if (!c) return;
    const today = todayKey();
    const undo = { [id]: state.moved[id] || null };
    state.moved[id] = today;
    addLog({ kind: 'pull', what: `Brought forward: ${c.title}`, why: `You chose to do it tonight instead of ${fmtLong(c.dateEff)}.`, lines: [], undo: { moved: undo } });
    commit();
    renderAll();
    toast('On tonight. Tick it off when it is done.');
  }
  function moveAllBehind() {
    const today = todayKey();
    const behind = allChunks(deadlines()).filter((c) => !c.done && c.dateEff < today);
    behind.forEach((c) => { state.moved[c.id] = nextFreeEvening(today, c.mins || 30, c.id); commit(); });
    renderAll();
    toast(`${behind.length} step${behind.length === 1 ? '' : 's'} moved to free evenings.`);
  }

  document.addEventListener('click', (e) => {
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) { go(tabBtn.dataset.tab); return; }
    const link = e.target.closest('[data-tab-link], [data-go]');
    if (link) { go(link.dataset.go || link.dataset.tabLink); return; }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const a = el.dataset.action;
    const id = el.dataset.id;
    const s = state.settings;
    switch (a) {
      case 'back': back(); break;
      case 'close-sheet': closeSheet(); break;
      case 'move': moveChunk(id); break;
      case 'tick-now': tick(id, true); toast('Done. Nice one.'); break;
      case 'pull': pullToTonight(id); break;
      case 'why-next': whyNextSheet(); break;
      case 'tick-group': {
        const today = todayKey();
        const items = allChunks(deadlines()).filter((c) => c.deadline.id === id && !c.done && c.dateEff < today);
        items.forEach((c) => { state.done[c.id] = Date.now(); });
        commit();
        renderAll();
        const d = deadlines().find((x) => x.id === id);
        if (d && d.complete) celebrate(d); else toast(`${plural(items.length, 'step')} ticked off.`);
        break;
      }
      case 'energy': {
        const r = setEnergy(id);
        renderAll();
        if (id === 'low') toast(r.moved ? `Lighter evening. ${plural(r.moved, 'step')} moved to later evenings.` : 'Lighter evening. Nothing needed to move.');
        else if (id === 'high') toast(r.bonus ? `Bonus step tonight: ${r.bonus.title}.` : 'Nothing from later in the week fits tonight.');
        else toast('Tonight is back to the plan.');
        break;
      }
      case 'replan': {
        const r = replan();
        renderAll();
        toast(r.healed || r.moved ? `Plan updated: ${[r.healed ? plural(r.healed, 'missed step') + ' moved' : '', r.moved ? plural(r.moved, 'step') + ' evened out' : ''].filter(Boolean).join(', ')}.` : 'Checked. Nothing needed to move.');
        break;
      }
      case 'plan-week': planWeek = addDays(planWeek || mondayOf(todayKey()), Number(id) || 0); renderView(); break;
      case 'plan-day': {
        const el2 = document.getElementById('day-' + id);
        if (el2) { el2.scrollIntoView({ behavior: 'smooth', block: 'start' }); el2.classList.remove('flash'); void el2.offsetWidth; el2.classList.add('flash'); }
        else toast(id < mondayOf(todayKey()) && !s.showPast ? 'That day is in a finished week. Tap Show finished weeks.' : `Nothing planned on ${fmtLong(id)}.`);
        break;
      }
      case 'undo': {
        const entry = state.log.find((x) => x.id === id);
        if (undoEntry(entry)) {
          if (entry.kind === 'energy' && entry.day) state.energy[entry.day] = 'okay';
          if (entry.kind === 'reflect' && state.reflections[entry.week]) state.reflections[entry.week].plan = 'same';
          commit();
          renderAll();
          toast('Undone. Those steps are back where they were.');
        }
        break;
      }
      case 'mood': {
        if (!reflectDraft) break;
        const i = reflectDraft.moods.indexOf(id);
        if (i >= 0) reflectDraft.moods.splice(i, 1); else reflectDraft.moods.push(id);
        renderView();
        break;
      }
      case 'reflect-plan': if (reflectDraft) { reflectDraft.plan = id; renderView(); } break;
      case 'reflect-edit': reflectEditing = true; reflectDraft = null; renderView(); break;
      case 'reflect-cancel': reflectEditing = false; reflectDraft = null; renderView(); break;
      case 'reflect-save': {
        if (!reflectDraft) break;
        const plan = reflectDraft.plan || suggestPlan(reflectDraft.moods).plan;
        const moved = saveReflection(reflectDraft.mon, reflectDraft.text.trim(), reflectDraft.moods.slice(), plan);
        reflectEditing = false;
        reflectDraft = null;
        renderView();
        $('#screen').scrollTop = 0;
        toast(plan === 'lighter' ? `Saved. Next week is lighter${moved ? `, and ${plural(moved, 'step')} moved` : ''}.` : plan === 'push' ? 'Saved. Next week can be fuller.' : 'Saved. Next week keeps the usual limit.');
        break;
      }
      case 'copy-refl': { const r = state.reflections[id]; if (r && r.text) copyText(r.text, 'Reflection copied. Paste it into PebblePad.'); break; }
      case 'copy-week': copyText(weekText(), 'Your week is copied. Paste it into a Claude chat and add your question.'); break;
      case 'heal': {
        s.heal = id === 'on';
        commit();
        const n = s.heal ? heal() : 0;
        renderAll();
        toast(s.heal ? (n ? `On. ${plural(n, 'missed step')} moved.` : 'On. Missed steps will move to evenings with room.') : 'Off. Missed steps stay where they are.');
        break;
      }
      case 'energy-check': s.energyCheck = id === 'on'; commit(); renderView(); break;
      case 'chat-start': s.chatStart = id; commit(); renderView(); break;
      case 'chat-menu': chatMenu(); break;
      case 'chat-help': signInHelp(false); break;
      case 'chat-tip-done': s.chatTipSeen = true; commit(); closeSheet(); break;
      case 'chat-week': closeSheet(); insertWeek(); break;
      case 'chat-go': closeSheet(); if (chatReady()) { try { APP.chatGo(chatUrl(id)); } catch (err) { /* ignore */ } } break;
      case 'chat-reload': closeSheet(); if (chatReady()) { try { APP.chatReload(); } catch (err) { /* ignore */ } } break;
      case 'chat-browser': closeSheet(); if (chatReady()) { try { APP.chatOpenBrowser(); } catch (err) { /* ignore */ } } break;
      case 'chat-paste': {
        if (!chatReady()) break;
        let r = '';
        try { r = APP.chatPasteLink(); } catch (err) { r = ''; }
        if (r === 'ok') {
          s.chatTipSeen = true;
          commit();
          if (route !== 'chat') go('chat'); else closeSheet();
          toast('Opening your sign-in link…');
        } else {
          toast(r === 'nolink' ? 'What you copied is not a link. In the email, hold the sign-in link and tap Copy link address.' : 'Nothing copied yet. In the email, hold the sign-in link and tap Copy link address.');
        }
        break;
      }
      case 'chat-signout':
        sheet(`<h3>Sign out of Claude in this app?</h3><p class="small-print">This only signs out the Chat tab. Your Claude account, chats and projects are not touched.</p>
          <button class="btn danger block" data-action="chat-signout-yes">Sign out</button><button class="btn block" data-action="close-sheet">Cancel</button>`);
        break;
      case 'chat-signout-yes': closeSheet(); if (chatReady()) { try { APP.chatSignOut(); toast('Signed out of Claude in this app.'); } catch (err) { /* ignore */ } } break;
      case 'open-review': focusWeek = id; go('portfolio', 'rv-' + id); break;
      case 'review-all': {
        const w = reviewWeek(id);
        const t = (state.reviews[id] = state.reviews[id] || {});
        w.items.forEach((it) => { if (!t[it.id]) t[it.id] = Date.now(); });
        commit(); renderAll(); reviewDone(id); break;
      }
      case 'review-skip': { (state.reviews[id] = state.reviews[id] || {}).__skip = Date.now(); commit(); renderAll(); toast('Marked as no review this week.'); break; }
      case 'review-unskip': { if (state.reviews[id]) delete state.reviews[id].__skip; commit(); renderAll(); break; }
      case 'approach': state.portfolio.approach = id; commit(); renderView(); break;
      case 'move-all': moveAllBehind(); break;
      case 'filter': s.course = id; commit(); renderView(); break;
      case 'toggle-past': s.showPast = !s.showPast; commit(); renderView(); break;
      case 'theme': s.theme = id; commit(); applyLook(); renderView(); break;
      case 'mode': s.mode = id; commit(); applyLook(); renderView(); break;
      case 'font': s.font = id; commit(); applyLook(); renderView(); break;
      case 'scale-down': s.scale = clamp(Math.round(((Number(s.scale) || 1) - 0.05) * 100) / 100, 0.85, 1.5); commit(); applyLook(); renderView(); break;
      case 'scale-up': s.scale = clamp(Math.round(((Number(s.scale) || 1) + 0.05) * 100) / 100, 0.85, 1.5); commit(); applyLook(); renderView(); break;
      case 'goto-reminders': s.remindersSeen = true; commit(); go('settings', 'reminders'); break;
      case 'goto-alarms': s.alarmSetupSeen = true; commit(); go('settings', 'alarms'); break;
      case 'dismiss-alarms': s.alarmSetupSeen = true; commit(); renderView(); break;
      case 'dismiss-reminders': s.remindersSeen = true; commit(); renderView(); break;
      case 'download-ics': saveFile('study-plan.ics', buildIcs(), 'text/calendar'); break;
      case 'alarms': s.alarms = id === 'on'; commit(); renderAll(); toast(s.alarms ? 'Alarms are on.' : 'Alarms are off. Nothing will ring.'); break;
      case 'alarm-catchup': s.alarmCatchup = id === 'on'; commit(); renderView(); break;
      case 'alarm-test': if (APP) { try { APP.testAlarm(15); toast('Test alarm in 15 seconds. Lock your phone now.'); } catch (e) { toast('The test alarm could not be set.'); } } break;
      case 'alarm-fix': if (APP) { try { APP.fix(id); } catch (e) { /* ignore */ } } break;
      case 'nudges-on': enableNudges(); break;
      case 'nudges-off': disableNudges(); break;
      case 'backup': saveFile(`cap-and-gown-backup-${todayKey()}.json`, JSON.stringify(state, null, 2), 'application/json'); break;
      case 'copy-backup': {
        const text = JSON.stringify(state);
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Backup copied. Paste it into a note to keep it.'), () => toast('Copy did not work here. Use Save a backup instead.'));
        else toast('Copy did not work here. Use Save a backup instead.');
        break;
      }
      case 'ask-reset': confirmReset = true; renderView(); break;
      case 'cancel-reset': confirmReset = false; renderView(); break;
      case 'reset': {
        const keep = { ...state.settings };
        state = freshState();
        state.settings = keep;
        confirmReset = false;
        commit();
        renderAll();
        toast('Progress cleared.');
        break;
      }
      case 'edit-due': editingDue = id; confirmDelete = null; renderView(); break;
      case 'cancel-due': editingDue = null; renderView(); break;
      case 'ask-delete': confirmDelete = id; editingDue = null; renderView(); break;
      case 'cancel-delete': confirmDelete = null; renderView(); break;
      case 'delete': state.custom = state.custom.filter((d) => d.id !== id); confirmDelete = null; commit(); renderAll(); toast('Deleted.'); break;
      case 'set-date': {
        const d = deadlines().find((x) => x.id === id);
        if (!d) break;
        prefill = { fromId: d.id, title: d.title, course: d.course, template: d.template || 'custom', how: d.how };
        addDraft = null;
        go('add');
        break;
      }
      case 'clear-prefill': prefill = null; addDraft = null; renderView(); break;
      case 'discard-add': addDraft = null; renderView(); break;
      case 'confirm-add': {
        if (!addDraft) break;
        const dl = {
          id: uid(), custom: true, course: addDraft.course, kind: addDraft.kind, title: addDraft.title, due: addDraft.due,
          dueTime: addDraft.time, status: 'confirmed', how: addDraft.how, note: addDraft.note, template: addDraft.template,
          chunks: addDraft.steps.map((st) => ({ id: uid(), date: st.date, mins: st.mins, title: st.title, tip: st.tip }))
        };
        state.custom.push(dl);
        if (addDraft.fromId) state.hidden[addDraft.fromId] = true;
        addDraft = null;
        prefill = null;
        commit();
        go('deadlines');
        setTimeout(() => { const el = document.getElementById('dl-' + dl.id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60);
        toast(`Added with ${dl.chunks.length} step${dl.chunks.length === 1 ? '' : 's'}.`);
        break;
      }
      default: break;
    }
  });

  document.addEventListener('change', (e) => {
    const el = e.target;
    const a = el.dataset && el.dataset.action;
    const s = state.settings;
    if (a === 'tick') { tick(el.dataset.id, el.checked); return; }
    if (a === 'rtick') {
      const mon = el.dataset.week;
      const t = (state.reviews[mon] = state.reviews[mon] || {});
      if (el.checked) t[el.dataset.id] = Date.now(); else delete t[el.dataset.id];
      commit(); renderAll();
      if (el.checked) reviewDone(mon);
      const back = document.getElementById(el.id); if (back) back.focus({ preventScroll: true });
      return;
    }
    if (a === 'pobs' || a === 'pcheck' || a === 'pduty') {
      const bucket = { pobs: 'obs', pcheck: 'checks', pduty: 'duties' }[a];
      if (el.checked) state.portfolio[bucket][el.dataset.id] = Date.now(); else delete state.portfolio[bucket][el.dataset.id];
      commit(); renderView();
      const back = document.getElementById(el.id); if (back) back.focus({ preventScroll: true });
      return;
    }
    if (a === 'pnum') {
      const v = el.value === '' ? '' : clamp(Number(el.value) || 0, 0, 9999);
      state.portfolio.nums[el.dataset.id] = v;
      commit(); renderView();
      return;
    }
    if (a === 'review-day') { s.reviewDay = clamp(Number(el.value) || 5, 1, 7); commit(); renderAll(); toast(`Weekly review moved to ${DAY_NAMES[s.reviewDay - 1]}. Update the calendar reminders too.`); return; }
    if (a === 'custom-colour') { s.custom = el.value; s.theme = 'custom'; commit(); applyLook(); renderView(); return; }
    if (a === 'evening' && /^\d\d:\d\d$/.test(el.value)) { s.evening = el.value; commit(); renderAll(); return; }
    if (a === 'cap') { s.cap = clamp(Number(el.value) || 60, 15, 180); commit(); return; }
    if (a === 'claude-project') {
      const v = el.value.trim();
      if (!v) { s.claudeProject = DEFAULT_SETTINGS.claudeProject; commit(); renderView(); toast('Back to the original project link.'); return; }
      if (!isClaudeUrl(v)) { toast('That is not a claude.ai link. Copy the address from the project page on claude.ai.'); el.value = s.claudeProject || ''; return; }
      s.claudeProject = v;
      commit();
      toast('Project link saved.');
      return;
    }
    if (a === 'alarm-lead') { s.alarmLead = clamp(Number(el.value) || 0, 0, 60); commit(); renderView(); return; }
    if (a === 'scale') { s.scale = clamp(Number(el.value) / 100, 0.85, 1.5); commit(); applyLook(); renderView(); return; }
    if (a === 'restore' && el.files && el.files[0]) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (!parsed || typeof parsed !== 'object' || !parsed.settings) throw new Error('not a backup');
          state = normalise(parsed);
          commit();
          applyLook();
          renderAll();
          toast('Backup restored.');
        } catch (err) { toast('That file is not a Cap and Gown backup.'); }
      };
      reader.readAsText(el.files[0]);
      return;
    }
    if (el.id === 'f-template') {
      document.querySelectorAll('[data-only]').forEach((n) => { n.hidden = n.dataset.only !== el.value; });
    }
  });

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.action === 'refl-text') { if (reflectDraft) reflectDraft.text = el.value; return; }
    if (el.dataset && el.dataset.action === 'scale') {
      const out = $('#scale-out');
      if (out) out.textContent = `${el.value}%`;
      document.documentElement.style.setProperty('--scale', String(clamp(Number(el.value) / 100, 0.85, 1.5)));
    }
  });

  document.addEventListener('paste', (e) => {
    if (route !== 'settings') return;
    const text = e.clipboardData && e.clipboardData.getData('text');
    if (!text || text.trim()[0] !== '{') return;
    try {
      const parsed = JSON.parse(text);
      if (!parsed.settings) return;
      state = normalise(parsed);
      commit();
      applyLook();
      renderAll();
      toast('Backup restored from pasted text.');
    } catch (err) { /* not ours */ }
  });

  document.addEventListener('submit', (e) => {
    const form = e.target;
    if (!form.dataset || !form.dataset.form) return;
    e.preventDefault();
    if (form.dataset.form === 'due') {
      const id = form.dataset.id;
      const v = form.querySelector('input[type="date"]').value;
      if (!v) return;
      const base = (DATA.deadlines || []).find((d) => d.id === id);
      if (base && !base.due) {
        // a "needs a date" item: plan it properly through the Add form instead
        prefill = { fromId: id, title: base.title, course: base.course, template: base.template || 'custom', how: base.how, due: v };
        editingDue = null;
        go('add');
        return;
      }
      const custom = state.custom.find((d) => d.id === id);
      if (custom) custom.due = v; else state.due[id] = v;
      editingDue = null;
      commit();
      renderAll();
      toast(`Date changed to ${fmtLong(v)}.`);
      return;
    }
    if (form.dataset.form === 'add') {
      const f = new FormData(form);
      const o = Object.fromEntries(f.entries());
      if (!o.due || !o.title) return;
      if (o.due < todayKey()) { toast('That date has already passed. Pick a date from today on.'); return; }
      const tpl = TEMPLATES[o.template] || TEMPLATES.custom;
      prefill = { ...(prefill || {}), ...o };
      addDraft = {
        fromId: prefill.fromId || null,
        course: o.course,
        template: o.template,
        kind: o.template === 'observation' || o.template === 'event' ? 'event' : 'submission',
        title: o.title.trim(),
        due: o.due,
        time: o.time || '09:00',
        how: (o.how || '').trim(),
        note: (o.note || '').trim(),
        steps: tpl.build(o)
      };
      renderView();
      setTimeout(() => { const el = $('#preview'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30);
    }
  });

  /* ---------- start ---------- */
  let lastDay = todayKey();
  applyLook();
  heal();
  renderAll();
  Remote.setStatus(Remote.status);
  Remote.connect();
  writeNudgeSnapshot();
  if (APP) {
    syncAlarms();
    if (!loadLocal()) saveLocal();
    // Called by the Android side: alarm screen buttons, coming back to the app, the back button and the chat.
    window.__capgownGo = (v) => { if (ROUTE_NAMES.concat('today').includes(v)) go(v); };
    window.__capgownResume = () => { lastDay = todayKey(); heal(); syncAlarms(); renderAll(); };
    window.__capgownBack = () => {
      if (sheetOpen) { closeSheet(); return true; }
      if (stack.length) { back(); return true; }
      if (route !== 'home') { go('home'); return true; }
      return false;
    };
    window.__capgownChatEvent = (type, url) => {
      CHAT.type = type || '';
      CHAT.url = url || '';
      const sub = $('#chat-sub');
      if (sub) sub.textContent = chatSubText();
    };
    window.__capgownChatInserted = (ok) => toast(ok ? 'Your week is in the message box. Add your question and send.' : 'Your week is copied. Tap the message box, hold, then tap Paste.');
  }

  // The keyboard: hide the tab bar while typing, and keep the chat lined up with the bars.
  let fullH = window.innerHeight;
  let fullW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (window.innerWidth !== fullW) { fullW = window.innerWidth; fullH = window.innerHeight; }
    if (window.innerHeight > fullH) fullH = window.innerHeight;
    document.body.classList.toggle('kb', window.innerHeight < fullH - 150);
    positionChat();
  });

  // A new day while the app is open (e.g. left open overnight): move missed steps and redraw.
  function newDay() { lastDay = todayKey(); heal(); renderAll(); }
  setInterval(() => { if (todayKey() !== lastDay) newDay(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && todayKey() !== lastDay) newDay(); });

  if (!IS_ARTIFACT && !APP && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is optional */ }); });
  }

  // Exposed for testing only
  window.__planner = { buildIcs, deadlines, spread, TEMPLATES, reviewWeeksSoFar, overdueReviews, alarmPlan, heal, replan, balance, setEnergy, saveReflection, nextStep, patterns, streak, weekText, lastDayFor, capFor, go, get route() { return route; }, get state() { return state; } };
})();

</script>
