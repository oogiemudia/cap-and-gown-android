    { id: '6.2', q: 'Summarise quality assurance and standardisation procedures in own area of practice.', t: 'qa',
      learn: [['The IQA cycle', 'Gravells (2016) describes it as: identify what is to be quality assured, plan, check assessment practice and decisions, give feedback and support to assessors, and review.'],
        ['Quality assurance procedures you will meet', 'A sampling plan that covers every assessor, unit, method and site, at interim and summative stages. Observation of you assessing, and interviews with candidates. Checks that records are accurate, signed and dated. Countersigning of your decisions until you are qualified. EQA visits or remote sampling. Checks on assessors’ qualifications and CPD.'],
        ['Standardisation', 'Assessors independently assess the same evidence, compare their decisions and agree the standard. They use the awarding organisation’s exemplars and common documents, and keep records of the meetings for the EQA.']],
      check: [['What happens in a standardisation meeting?', ['Assessors judge the same evidence and compare their decisions', 'The IQA marks all the work again', 'Candidates present their portfolios'], 0, 'The aim is a shared reading of the standard.'],
        ['Interim sampling takes place…', ['During the programme, so problems are put right early', 'Only after certificates are issued', 'Once every five years'], 0, 'Summative sampling then happens before certification is claimed.']],
      cover: ['Quality assurance procedures: sampling plan, observation of assessors, record checks, countersigning and EQA', 'Standardisation: assessors comparing decisions to agree a standard', 'Your own centre’s actual procedures'],
      trap: 'Writing only about quality assurance, or only about standardisation. The question asks for both.',
      own: 'How it works at your centre: who is your IQA, how often do you standardise, and what have you taken to a meeting?',
      start: ['In my centre, quality assurance includes…', 'Standardisation takes place…'], src: ['gr16', 'ofqual'] },
    { id: '6.3', q: 'Summarise the procedures to follow when there are disputes concerning assessment in own area of practice.', t: 'qa',
      learn: [['The right to challenge', 'Candidates can challenge an assessment decision. Awarding organisations must have an appeals process, and every approved centre has its own procedure. Disputes should be settled fairly, promptly and at the lowest level possible (Gravells, 2021).'],
        ['The usual stages', 'Informal: the candidate raises it with the assessor, who explains the decision against the criteria. Formal: a written appeal to the IQA, within a set time. An independent review by someone who was not involved. A centre appeals panel. Then the awarding organisation. Last, a complaint to Ofqual if the awarding organisation did not follow its own procedure.'],
        ['Your part as the assessor', 'Keep full, clear records so the decision can be reviewed. Stay professional, and never treat a candidate worse for appealing. Act on the outcome, and share what was learned at standardisation.']],
      check: [['What is the first stage in most appeals procedures?', ['A complaint to Ofqual', 'A letter to the awarding organisation', 'An informal discussion with the assessor'], 2, 'Most disputes end at the informal stage, once the decision is explained against the criteria.'],
        ['What most helps a decision stand up at appeal?', ['The assessor’s confidence', 'How long the assessment took', 'Clear records of the evidence and the reasons'], 2, 'Records are what the reviewer looks at.']],
      cover: ['A staged procedure: informal, formal, independent review, awarding organisation', 'Timescales and written records', 'The assessor’s part in it', 'Your own centre’s procedure'],
      trap: 'Going straight to the awarding organisation. The centre’s stages come first.',
      own: 'Find your centre’s appeals procedure: what are its stages and time limits?',
      start: ['If a learner disagrees with my decision, first…', 'The formal stage requires…'], src: ['ofqual', 'gr21', 'eqa'] },
    { id: '7.1', q: 'Explain the importance of following procedures for the management of information relating to assessment.', t: 'records',
      learn: [['What information', 'Assessment plans, evidence, observation and questioning records, witness testimonies, decisions, feedback, tracking and certification claims. Together these decide whether a candidate gets a qualification.'],
        ['Why the procedures matter', 'Audit trail: signed and dated records let the IQA, the EQA and the awarding organisation check each decision. If it is not recorded, there is no proof it happened. Certification claims must rest on complete records. Records are the evidence in appeals and malpractice investigations, and they must be kept for the period the awarding organisation sets (Gravells, 2021).'],
        ['The law and good practice', 'Records are personal data under the Data Protection Act 2018 and UK GDPR: used for a stated purpose, accurate, kept no longer than needed, and secure. Photos and videos need consent. Use the centre’s secure system, not personal devices, and report any data breach at once.']],
      check: [['Why does an unrecorded assessment cause a problem?', ['There is no proof it took place, so it cannot be quality assured', 'It saves time', 'The candidate will forget it'], 0, 'The audit trail is what quality assurance and certification rest on.'],
        ['Videos of a candidate at work, kept as evidence, should be stored…', ['On your own phone', 'In a shared social media group', 'In the centre’s secure system, with consent'], 2, 'They are personal data, so consent and secure storage are required.']],
      cover: ['The audit trail for IQA and EQA', 'Accurate certification claims', 'Awarding organisation requirements and how long records are kept', 'Evidence for appeals and malpractice', 'Data protection and confidentiality'],
      trap: 'Describing the records without explaining why the procedures matter.',
      own: 'Where do your assessment records live, who can see them, and how long are they kept?',
      start: ['Following the procedures matters because…', 'In my own practice, records are…'], src: ['gr21', 'dpa', 'ofqual'] },
    { id: '7.2', q: 'Explain how feedback and questioning contribute to the assessment process.', t: 'records',
      learn: [['Questioning', 'Questioning is an assessment method in its own right, and it completes the evidence from other methods (Read, 2016). It confirms the knowledge behind what you saw, checks that work is the candidate’s own, covers criteria you did not see, and tests “what if” situations that cannot safely be set up.'],
        ['Good questions', 'Planned against the criteria, open and probing, pitched at the right level (Anderson and Krathwohl, 2001), and recorded so that the IQA can see the answers.'],
        ['Feedback', 'Feedback tells the candidate the decision against the criteria, what is not yet met and what happens next. Hattie and Timperley (2007) give three questions: where am I going, how am I going, and where to next. Keep it specific, prompt and about the work, not the person (Kluger and DeNisi, 1996). Make it two-way, and record it.']],
      check: [['Which is NOT something questioning does in assessment?', ['Confirms underpinning knowledge', 'Replaces the need for criteria', 'Checks that work is authentic'], 1, 'Questions are planned against the criteria. They do not replace them.'],
        ['Feedback works best when it focuses on…', ['The task and the criteria', 'The candidate’s personality', 'Other candidates’ results'], 0, 'Kluger and DeNisi (1996) found that feedback aimed at the person can lower performance.']],
      cover: ['Questioning as a method: knowledge, authenticity and sufficiency', 'What makes questions effective, and that they are recorded', 'Feedback: confirms the decision, the gaps and the next steps', 'Feedback is specific, two-way and recorded'],
      trap: 'Writing about classroom questioning. Keep it to the assessment process.',
      own: 'One question you asked a learner after an observation, and what the answer told you.',
      start: ['Questioning contributes by…', 'Feedback contributes by…'], src: ['read', 'bloom', 'hattie', 'kluger'] },
    { id: '8.1', q: 'Explain legal issues, policies, and procedures relevant to assessment, including those for confidentiality, health, safety and welfare.', t: 'law',
      learn: [['Confidentiality', 'Data Protection Act 2018 and UK GDPR: candidate information is used only for assessment, kept accurate and secure, and not kept longer than needed. Follow your centre’s policy and the employer’s rules on site. Confidentiality has a limit: a safeguarding concern must go to the designated safeguarding lead.'],
        ['Health and safety', 'Health and Safety at Work etc. Act 1974: you have a duty of care, you follow site rules, and you stop an assessment if the candidate works unsafely. Unsafe practice cannot be judged competent. Regulations under the Act cover risk assessment, work equipment (PUWER), hazardous substances (COSHH) and incident reporting (RIDDOR).'],
        ['Welfare and other law', 'Safeguarding: Keeping children safe in education for learners under 18, DBS checks, and the Prevent duty. Wellbeing: notice stress and refer to support. Also the Equality Act 2010, copyright law on plagiarism, and the centre’s and awarding organisation’s policies on appeals, malpractice, conflicts of interest and AI.']],
      check: [['A candidate tells you something that raises a safeguarding concern and asks you to keep it secret. You…', ['Keep it secret, because it is confidential', 'Pass it to the designated safeguarding lead', 'Tell their employer first'], 1, 'Confidentiality has limits. Never promise to keep a safeguarding concern secret.'],
        ['During an observation the candidate removes a machine guard. You should…', ['Stop the assessment', 'Wait, and mention it in feedback', 'Ignore it if the product is good'], 0, 'Stop at once. Unsafe practice cannot be judged competent.']],
      cover: ['Confidentiality: data protection, and its limits', 'Health and safety law as it applies during assessment', 'Welfare and safeguarding, including Prevent', 'Equality, copyright, and centre or awarding organisation policies', 'Each one explained, not only listed'],
      trap: 'Thinking confidentiality means never sharing. Safeguarding concerns must be reported.',
      own: 'Your centre’s policies: who is the safeguarding lead, and what site rules apply where you assess?',
      start: ['The law on confidentiality means that I…', 'If a learner works unsafely during assessment, I…'], src: ['dpa', 'hswa', 'kcsie', 'eqa'] },
    { id: '8.2', q: 'Explain the contribution that technology can make to the assessment process.', t: 'law',
      learn: [['What technology adds', 'It can make assessment more efficient, more accessible and easier to quality assure. Jisc (2020) sets five principles for assessment in a digital age: authentic, accessible, appropriately automated, continuous and secure.'],
        ['Examples', 'E-portfolios: evidence is uploaded and mapped to criteria, decisions and feedback are recorded, the IQA can sample remotely, and time stamps give an audit trail. Photo, video and audio evidence. Remote observation and online discussion, where allowed. Online tests. In engineering: CAD files and version histories. Accessibility: text-to-speech and speech-to-text. Online standardisation.'],
        ['Limits to manage', 'Authenticity: work written by AI or copied. AI detectors are unreliable on their own, so authenticate through questioning (Joint Council for Qualifications, 2025). Digital exclusion: not everyone has the devices or the skills. Data security, and consent for recordings. System failures. The assessor still checks VACSR (Gravells, 2021).']],
      check: [['How should you authenticate work you suspect was produced with AI?', ['Rely on an AI detector score alone', 'Ignore it', 'Question the candidate about the work'], 2, 'Detectors are unreliable on their own. A candidate who did the work can explain it.'],
        ['Which is a contribution of an e-portfolio?', ['It lets the IQA sample remotely, with a time-stamped audit trail', 'It makes decisions for the assessor', 'It removes the need for criteria'], 0, 'Technology supports the process. The assessor still makes the decision.']],
      cover: ['Contributions, with examples: e-portfolios, recorded evidence, remote assessment and accessibility', 'Benefits for quality assurance and standardisation', 'Limitations: authenticity and AI, access, and security', 'The assessor still judges the evidence'],
      trap: 'Only listing tools. Say what each one contributes, and its limits.',
      own: 'The technology you actually use to assess, for example Teams, Forms, a tracker or an e-portfolio.',
      start: ['Technology contributes to assessment by…', 'A limitation I have to manage is…'], src: ['jisc', 'jcq', 'gr21'] },
    { id: '8.3', q: 'Evaluate requirements for equality and diversity and, where appropriate, bilingualism in relation to assessment.', t: 'law',
      learn: [['Equality and diversity', 'The Equality Act 2010 protects nine characteristics. For an assessor it means no direct or indirect discrimination, harassment or victimisation, and reasonable adjustments for disabled candidates. Public bodies such as colleges also have the Public Sector Equality Duty.'],
        ['In practice', 'Check materials and questions for bias. Remove language demands that are not part of the competence. Plan around religious observance, caring, pregnancy or disability. Decide only on the evidence, and guard against stereotypes about who belongs in the occupation.'],
        ['Bilingualism', 'In Wales, the Welsh Language (Wales) Measure 2011 gives Welsh official status, and candidates may be assessed in Welsh where the qualification is offered in it. In England, candidates with English as an additional language should not be penalised for language that is not part of the competence. Cummins (1979) shows that everyday fluency comes much sooner than academic language.'],
        ['Weighing it up', 'These requirements make assessment fairer and more valid. But adjustments must never lower the standard, and they take time and resources. Gipps and Murphy (1994) show that fairness has to be designed in. The judgement: treat candidates equitably, not identically.']],
      check: [['How many protected characteristics are in the Equality Act 2010?', ['Six', 'Nine', 'Twelve'], 1, 'Age, disability, gender reassignment, marriage and civil partnership, pregnancy and maternity, race, religion or belief, sex, and sexual orientation.'],
        ['Treating candidates equitably means…', ['Treating everyone identically', 'Removing barriers that are irrelevant to the competence, while keeping the standard', 'Lowering the standard for some'], 1, 'Equity is an equal chance to show competence against the same standard.']],
      cover: ['Equality Act 2010: protected characteristics and reasonable adjustments', 'What the assessor does in practice', 'Bilingualism: Welsh, and English as an additional language', 'A judgement: equitable, not identical, with the standard kept'],
      trap: 'Describing the law without evaluating it, or leaving out bilingualism.',
      own: 'A learner whose first language is not English, or who needed an adjustment: what did you keep the same, and what did you change?',
      start: ['The requirements make assessment fairer because…', 'The tension is that… I resolve it by…'], src: ['eqa', 'gipps', 'cummins', 'welsh'] },
    { id: '8.4', q: 'Explain the value of reflective practice and continuing professional development in the assessment process.', t: 'law',
      learn: [['Two linked ideas', 'Reflective practice is reviewing your own assessment practice and decisions in order to improve them. Continuing professional development (CPD) is keeping your occupational knowledge and your assessment practice up to date. Assessment strategies require assessors to stay occupationally competent.'],
        ['Reflective practice', 'Schön (1983) separates reflection-in-action (adjusting during an assessment, such as rephrasing a question) from reflection-on-action (reviewing afterwards). Gibbs (1988) gives a cycle: description, feelings, evaluation, analysis, conclusion and action plan. Sources include IQA feedback, standardisation, candidate feedback and appeals. Its value is fairer, more consistent decisions and better feedback.'],
        ['CPD', 'Occupational: industry updates, new technology and changes to standards (Eraut, 1994). Assessment: qualification updates, standardisation, and training on AI, safeguarding and equality. Its value: decisions stay valid and current, the awarding organisation’s requirements are met, and you have credibility. It is recorded in a CPD log that the IQA checks. Reflection finds what to improve, and CPD puts it right.']],
      check: [['Rephrasing a question during an assessment, because the candidate misunderstood it, is…', ['Reflection-in-action', 'Reflection-on-action', 'Standardisation'], 0, 'Schön: in-action happens during the event, and on-action happens afterwards.'],
        ['Why must an assessor keep occupational CPD up to date?', ['To earn more', 'So that decisions are made against current industry practice', 'It is optional'], 1, 'Out-of-date knowledge leads to invalid decisions.']],
      cover: ['The value of reflective practice for an assessor, with a named model', 'The value of CPD: occupational and assessment currency', 'How the two link', 'Your own examples'],
      trap: 'Covering only reflection, or only CPD. The question needs both.',
      own: 'One thing you changed in your assessing after feedback, and one piece of CPD you have done or planned.',
      start: ['Reflective practice is valuable because…', 'CPD keeps my decisions…'], src: ['schon', 'gibbs', 'eraut94', 'gr21'] }
  ];
  AW.forEach((q) => { q.lo = Number(q.id[0]); q.verb = q.q.split(' ')[0]; });
  const AW_BY = {};

  // Five minutes a day for the change project, so the write-up builds itself. One comes up each day, in turn.
  const CP_DAILY = [

  /* ---------- the coach's plan: what is left, the days to go, and so how much today ---------- */
  const COACH_PATHS = [['aw', 'Workbook'], ['ksb', 'KSBs'], ['cp', 'Change project']];
  const awU = (id) => state.coach.aw[id] || {};
  const awSet = (id) => { const u = (state.coach.aw[id] = state.coach.aw[id] || {}); if (!u.t || typeof u.t !== 'object') u.t = {}; if (!u.q || typeof u.q !== 'object') u.q = {}; return u; };
  const awLearned = (u) => !!(u.k || u.w || u.h);
  const awWritten = (u) => !!(u.w || u.h);
  // An outcome whose hand-in is ticked off on the planner counts as handed in, unless you switch it yourself.
  function awHandedLo() {
    const dl = {};
    deadlines().forEach((d) => { dl[d.id] = d; });
    const out = {};
    for (let lo = 1; lo <= 8; lo++) { const d = dl[AW_DL[lo]]; out[lo] = !!(d && d.chunks.length && d.complete); }
    return out;
  }
  const awE = (q, HL) => { const u = awU(q.id); return { ...u, h: typeof u.h === 'boolean' ? u.h : !!(HL || awHandedLo())[q.lo] }; };
  const awStatus = (u) => (u.h ? ['good', 'Handed in'] : u.w ? ['good', 'Written'] : u.k ? ['gold', 'Learned'] : (u.r || wordCount(u.a)) ? ['info', 'Started'] : ['', 'New']);
  // Questions whose hand-in date is still ahead come first; the rest follow in workbook order.
  function awOrder() {
    const today = todayKey();
    const dl = {};
    deadlines().forEach((d) => { dl[d.id] = d; });
    const key = (q) => { const d = dl[AW_DL[q.lo]]; return d && d.due && d.due >= today && !d.complete ? d.due : '9999'; };
    return AW.map((q, i) => ({ q, i, k: key(q) })).sort((a, b) => a.k.localeCompare(b.k) || a.i - b.i).map((x) => x.q);
  }
  // Each question is two short sittings: learn it (lesson and check), then write it (plan and answer).
  function awSittings() {
    const out = [];
    const HL = awHandedLo();
    awOrder().forEach((q) => {
      const u = awE(q, HL);
      if (!awLearned(u)) out.push({ q, s: 'learn', m: 10 });
      if (!awWritten(u)) out.push({ q, s: 'write', m: 20 });
    });
    return out;
  }
  function awEnd() {
    const today = todayKey();
    if (state.coach.end.aw) return state.coach.end.aw;
    const wb = deadlines().find((d) => d.id === 'as-wb');
    // the planner's own aim: the last step before the hand-in, so the break stays a break
    const aim = wb && wb.chunks.length > 1 ? wb.chunks[wb.chunks.length - 2].dateEff : null;
    if (aim && aim >= today) return aim;
    if (wb && wb.due && wb.due >= today) return wb.due;
    return addDays(today, 21);
  }
  function coachPace(left, end) {
    const today = todayKey();
    const days = Math.max(1, daysBetween(today, end) + 1);
    return { left, end, days, per: left ? Math.ceil(left / days) : 0, late: end < today };
  }
  function awDoneToday() {
    const today = todayKey();
    return AW.reduce((n, q) => { const u = awU(q.id); return n + (u.k === today ? 1 : 0) + (u.w === today ? 1 : 0); }, 0);
  }
  // Today's workbook sittings. Low energy: one light one (a lesson you can listen to). Good energy: one more.
  function awToday() {
    const sit = awSittings();
    const P = coachPace(sit.length, awEnd());
    const energy = state.energy[todayKey()];
    let quota = clamp(P.per, 1, 4);
    if (energy === 'high') quota = Math.min(4, quota + 1);
    if (energy === 'low') quota = 1;
    const done = awDoneToday();
    let todo = sit.slice(0, Math.max(0, quota - done));
    if (energy === 'low' && todo.length && todo[0].s !== 'learn') { const light = sit.find((x) => x.s === 'learn'); if (light) todo = [light]; }
    return { sit, P, quota, done, todo, energy };
  }
  const ksbU = (k) => state.coach.ksb[k] || {};
  const ksbSet = (k) => (state.coach.ksb[k] = state.coach.ksb[k] || {});
  // KSBs with no evidence yet. Those that count towards the most duties come first.
  function ksbGaps() {
    const cov = ksbCovered();
    const weight = (k) => DUTY_KSBS.filter((l) => l.includes(k)).length;
    return KSB_IDS.filter((k) => !cov.has(k)).map((k, i) => ({ k, i, w: weight(k) })).sort((a, b) => b.w - a.w || a.i - b.i).map((x) => x.k);
  }
  function ksbEnd() {
    const today = todayKey();
    if (state.coach.end.ksb) return state.coach.end.ksb;
    const pd = deadlines().find((d) => d.id === 'pg-pd');
    const c = pd && pd.chunks.find((x) => /KSB check/i.test(x.title));
    if (c && c.dateEff >= today) return c.dateEff;
    if (pd && pd.due && pd.due >= today) return pd.due;
    return addDays(today, 60);
  }
  function ksbToday() {
    const today = todayKey();
    const gaps = ksbGaps();
    const P = coachPace(gaps.length, ksbEnd());
    const weeks = Math.max(1, Math.ceil(P.days / 7));
    const perWeek = gaps.length ? Math.ceil(gaps.length / weeks) : 0;
    const fresh = gaps.filter((k) => !ksbU(k).d);
    const parked = gaps.filter((k) => ksbU(k).d);
    const doneToday = KSB_IDS.filter((k) => ksbU(k).d === today).length;
    const quota = perWeek > 7 ? 2 : 1;
    const pick = sub.ck && KSBS[sub.ck] ? sub.ck : (fresh[0] || parked[0] || null);
    return { gaps, P, weeks, perWeek, fresh, parked, doneToday, quota, pick, left: gaps.length ? Math.max(0, quota - doneToday) : 0 };
  }
  function cpSteps() { return allChunks(deadlines().filter((d) => d.id === 'pg-cp' || d.id === 'pg-m2')).filter((c) => !c.done); }
  const cpDaily = () => CP_DAILY[Math.abs(daysBetween('2026-01-01', todayKey())) % CP_DAILY.length];
  const cpDoneToday = () => !!state.coach.cp[todayKey()];
  // Everything the coach asks for today, most pressing first.
  function coachToday() {
    const out = [];
    awToday().todo.forEach((x) => out.push({ path: 'aw', id: x.q.id, s: x.s, m: x.m, title: `${x.q.id} ${x.s === 'learn' ? 'Learn it' : 'Write it'}`, sub: x.q.q }));
    if (PORT) { const K = ksbToday(); if (K.left && K.pick) out.push({ path: 'ksb', id: K.pick, m: 10, title: `${K.pick}: today’s KSB`, sub: KSBS[K.pick] }); }
    if (cpSteps().length && !cpDoneToday()) out.push({ path: 'cp', id: '', m: 5, title: 'Change project: five minutes', sub: cpDaily() });
    return out;

  function coachStreak() {
    let n = 0;
    let d = todayKey();
    if (!state.coach.days[d]) d = addDays(d, -1);

    return n;
  }
  function coachDid(m) {

  const awLessonText = (q) => [`Question ${q.id.replace('.', ' point ')}. ${q.q}`].concat(q.learn.map(([h, b]) => `${h}. ${b}`)).join('\n');
  function awAllText() {
    const done = AW.filter((q) => wordCount(awU(q.id).a));
    if (!done.length) return '';
    return ['Unit D/601/5313: Understanding the principles and practices of assessment', 'My answers', ''].concat(done.map((q) => `${q.id} ${q.q}\n\n${String(awU(q.id).a).trim()}\n`)).join('\n');
  }

  /* ---------- what the coach hands to Claude: the question, the checklist, where you are, and the rules ---------- */
  const COACH_RULES = 'Do not write my answer for me, not even a model paragraph or replacement sentences: my assessor wants it in my own words, and I have to declare any AI tool I use.';
  function awTeachPrompt(q) {
    const u = awU(q.id);
    const right = q.check.filter((c, i) => u.q && u.q[i] === c[2]).length;
    const where = [u.r ? 'I have read the short lesson in my app' : 'I have not read the lesson yet', u.k ? `I got ${right} of ${q.check.length} check questions right` : '', u.f ? `my confidence is ${['', 'low', 'medium', 'high'][u.f]}` : ''].filter(Boolean).join('; ');
    return `Be my study coach for my Level 3 assessor award, Unit D/601/5313 (Understanding the principles and practices of assessment). I teach T Level Engineering in a further education college and I am training as an assessor.\n\nThe workbook question I am learning for: "${q.id} ${q.q}"\n\nCoach me in small steps, one at a time, and wait for my reply after each step:\n1. Ask me one question to find out what I already know.\n2. Teach what I am missing in short parts (under 120 words each), from the assessor's role (judging a learner's evidence against standards), not the teacher's role. Use examples from assessing engineering learners.\n3. Check I understood with two quick questions, one at a time.\n4. Help me plan my own answer: remind me what "${q.verb}" asks for, and ask me for an example from my own practice.\nThen stop. ${COACH_RULES}\n\nWhat a good answer covers (my checklist):\n${q.cover.map((c) => '- ' + c).join('\n')}\nA common slip: ${q.trap}\nWhere I am: ${where}.${String(u.n || '').trim() ? `\nMy notes so far: ${String(u.n).trim().slice(0, 1500)}` : ''}`;

    }

      const done = AW.filter((q) => awWritten(awE(q))).length;
      return `Be my study coach for my Level 3 assessor award workbook, Unit D/601/5313 (Understanding the principles and practices of assessment). I teach T Level Engineering in a further education college and I am training as an assessor. I have written ${done} of ${AW.length} answers. The award is not graded, so my aim is every answer accepted first time.\n\nAsk me which question I am on. Then quiz me on what its verb asks for (explain, evaluate, summarise and so on) and on the idea behind it, one question at a time, and wait for my reply. Tell me what a complete answer has to cover, as a list of points, and ask me for an example from my own assessing. ${COACH_RULES}`;
    }
    return `Act as an internal quality assurer looking over my assessment records before I send them to my assessor. I teach T Level Engineering in a further education college and I am working towards my Level 3 assessor awards. My evidence is assessment records for two learners, two observations of me assessing, and notes from standardisation meetings.\n\nAsk me to describe one record at a time: the plan, the method and why I chose it, the evidence, my decision and the feedback I gave. Check each against valid, authentic, current, sufficient and reliable, and tell me what an assessor would send back. Wait for my reply each time. Do not ask for learners’ names, and remind me to leave them out. Do not write the records for me.`;
  }

  /* ---------- the Assessment screens ---------- */
  // The card on Home until you have chosen: the early plan is ready to look at.
  function axHomeCard() {
    if (state.ax.early != null) return '';
    const n = axMoves(todayKey()).length;
    if (!n) return '';
    return `<div class="card" id="ax-card"><div class="label">Assessment</div>
      <h3 style="font-size:17px">A plan to finish every assessment early</h3>
      <div class="small muted">It moves ${plural(n, 'step')} to earlier evenings, so the last two weeks before each hand-in stay light.</div>
      <div class="row"><button class="btn sm" data-act="ax-all">See the plan</button><button class="btn sm ghost" data-act="ax-later">Not now</button></div></div>`;
  }
  function axEarlyCard(list) {
    const a = state.ax;
    const on = a.early === true && axIsDay(a.since);
    const since = on ? a.since : todayKey();
    const early = axEarlyFrom(since);
    const moves = axMoves(since);
    // The evenings the plan uses, added up with everything else on them, against your evening limit.
    const load = {};
    (list || deadlines()).forEach((d) => d.chunks.forEach((c) => { if (!c.done) { const k = state.moved[c.id] || early[c.id] || c.date; load[k] = (load[k] || 0) + (c.mins || 0); } }));
    const over = moves.map((m) => m.to).filter((k, i, a) => a.indexOf(k) === i && (load[k] || 0) > capFor(k)).length;
    const rows = AX_DLS.map((id) => axDl(id, list)).filter((d) => d && axOpen(d) && d.chunks.some((c) => early[c.id] && !c.done)).map((d) => {
      const was = axMargin(d, {});
      const will = axMargin(d, early);
      if (!will) return '';
      const same = was && was.days === will.days;
      return `<div class="li"><span class="cdot" style="background:${colOf(d.course)}"></span><div class="grow" style="min-width:0"><b class="small" style="display:block">${esc(d.title)}</b><span class="small muted" style="display:block">Due ${esc(fmtShort(d.due))} · the work ends ${esc(fmtShort(will.last))}${same || !was ? '' : ` (it was ${esc(fmtShort(was.last))})`}</span></div>${axDaysPill(will.days)}</div>`;
    }).join('');
    const what = moves.length ? `<details><summary class="small" style="color:var(--accent);font-weight:700;cursor:pointer">${on ? 'What moved' : 'What moves'} (${moves.length})</summary><ul class="vlist" style="margin-top:6px">${moves.map((m) => `<li class="small">${esc(m.c.title)}: ${esc(fmtShort(m.from))} to <b>${esc(fmtShort(m.to))}</b></li>`).join('')}</ul></details>` : '';
    if (!on && !moves.length) {
      return `<div class="card" id="ax-early"><h3>Finishing early</h3><div class="small muted">Nothing is left to move earlier. Every step in the early plan is done, has passed, or has a date you chose yourself.</div></div>`;
    }
    return `<div class="card" id="ax-early"><div class="row between"><h3>${on ? 'The early plan is on' : 'A plan to finish early'}</h3>${on ? `<span class="pill good">${ic('check', 12)} On</span>` : ''}</div>
      <div class="small muted">${on ? `Since ${esc(fmtShort(since))}, ${plural(moves.length, 'step')} ${moves.length === 1 ? 'sits' : 'sit'} on an earlier evening.` : `${plural(moves.length, 'step')} ${moves.length === 1 ? 'moves' : 'move'} to an earlier evening.`} The real work on each of these then ends two weeks or more before it is due. ${over ? `${plural(over, 'evening')} in it ${over === 1 ? 'goes' : 'go'} over your evening limit, so move a step if that is too much.` : 'No evening in it goes over your evening limit.'}</div>
      <div class="list">${rows}</div>
      ${what}
      <div class="small muted">Left close to the day on purpose: a file check, the upload, speaking practice. Steps tied to a class, an observation or a learner’s own dates do not move. Learner 2 starts two weeks sooner in this plan, so agree it with the learner and Andrea.</div>
      <div class="btnrow">${on ? '<button class="btn sm ghost" data-act="ax-early-off">Switch it off</button>' : `<button class="btn sm" data-act="ax-early-on">Use the early plan</button>${a.early == null ? '<button class="btn sm ghost" data-act="ax-later">Not now</button>' : ''}`}</div></div>`;
  }
  V.assessment = () => {
    const list = deadlines();
    const open = sub.ax && AX_BY[sub.ax] ? AX_BY[sub.ax] : null;
    if (open) return axDocView(open, list);
    const dated = AX.flatMap((a) => axDls(a, list)).filter((d) => d.due);
    const done = dated.filter((d) => d.complete || d.due < todayKey()).length;
    const next = dated.filter(axOpen).sort((x, y) => x.due.localeCompare(y.due))[0];

  function axDocView(a, list) {

      return `<div class="li"><div class="grow" style="min-width:0"><b class="small" style="display:block">${esc(d.title)}</b><span class="small muted" style="display:block">${esc(when)}${d.chunks.length ? ` · ${d.doneCount} of ${d.chunks.length} steps done` : ''}${m ? ` · the work ends ${esc(fmtShort(m.last))}` : ''}</span></div>${d.due && (d.complete || d.due < todayKey()) ? `<span class="pill">${d.complete && d.chunks.length ? 'Done' : 'Past'}</span>` : m ? axDaysPill(m.days) : ''}</div>`;
    };
    const link = a.link[0] === 'go' ? `<button class="btn sm ghost" data-go="${a.link[1]}">${esc(a.link[2])}</button>` : a.link[0] === 'tab' ? `<button class="btn sm ghost" data-tab="${a.link[1]}">${esc(a.link[2])}</button>` : `<button class="btn sm ghost" data-act="deadlines-for" data-id="${a.link[1]}">${esc(a.link[2])}</button>`;
    let html = `<div class="card"><div class="label">${esc(a.sub)}</div>
        <h3 style="font-size:18px">${esc(a.title)}</h3>
        <span class="pill gold" style="align-self:flex-start">${esc(a.aim)}</span>
        <div class="small muted">${esc(a.grade)}</div></div>
      <div class="card"><h3>What you hand in</h3><ul class="vlist">${a.what.map((t) => `<li class="small">${esc(t)}</li>`).join('')}</ul>
        <div class="small muted">${esc(a.from)}</div></div>
      <div class="card" id="ax-dates"><h3>Dates and steps</h3><div class="list">${dls.map(drow).join('') || '<div class="small muted">Nothing in your plan for this one yet.</div>'}</div>
        <div class="btnrow"><button class="btn sm ghost" data-act="deadlines-for" data-id="${a.course}">Open the steps</button><button class="btn sm ghost" data-act="ax-all">The early plan</button></div></div>`;
    if (a.id === 'm2') {
      const rated = M2_LO.filter(([n]) => axRate(n));
      const low = rated.length ? rated.slice().sort((x, y) => axRate(x[0]) - axRate(y[0]) || x[0] - y[0])[0] : null;
      html += `<div class="card" id="ax-rate"><div class="row between"><h3>Where is my work now?</h3><span class="pill info num">${rated.length} of 4 rated</span></div>
        <div class="small muted">Rate your plan or draft against each outcome, honestly. The top band asks for detailed, critical analysis on all four.</div>
        ${M2_LO.map(([n, name, , top]) => `<div class="step"><b class="small">LO${n}: ${esc(name)}</b><div class="small muted">Top band: ${esc(top)}</div>
          <div class="chips wrap">${[1, 2, 3, 4].map((b) => `<button class="chip" data-act="ax-rate" data-id="${n}" data-n="${b}" aria-pressed="${axRate(n) === b}">${AX_BANDS[b]}</button>`).join('')}</div>
          ${axRate(n) ? `<div class="small muted">${axRate(n) === 4 ? 'You rate this at the top band. Check that with your tutor or a peer before you rely on it.' : `${AX_BANDS[axRate(n)]} reads as “${AX_BAND_SAYS[axRate(n)]}”. To lift it: ${esc(AX_LIFT[n])}`}</div>` : ''}</div>`).join('')}
        ${low && axRate(low[0]) < 4 ? `<div class="notice"><div><p><b>Work on LO${low[0]} first.</b> It is your lowest, and the presentation is only as strong as its weakest outcome.</p></div></div>` : ''}
        <div class="btnrow"><button class="btn sm" data-act="ax-live" data-id="${a.id}">${ic('spark', 14)} Check it against the top band with Claude</button><button class="btn sm ghost" data-act="m2-ladder">The ladder</button></div></div>`;
    } else if (a.id === 'm3') {
      const los = (AX_PORT.los && Object.entries(AX_PORT.los).find(([k]) => /Module 3/.test(k))) || null;
      if (los) html += `<div class="card"><h3>What Module 3 looks for</h3><ul class="vlist">${los[1].map((t) => `<li class="small">${esc(t)}</li>`).join('')}</ul></div>`;
    } else if (a.id === 'wb') {
      html += `<div class="card"><h3>The eight outcomes</h3><ol class="steps">${AW_LO.slice(1).map((t) => `<li class="small">${esc(t)}</li>`).join('')}</ol>
        <div class="small muted">${AW.filter((q) => awWritten(awE(q))).length} of ${AW.length} answers written in the Coach.</div></div>`;
    }
    html += `<div class="card"><h3>What top work looks like</h3><ol class="steps">${a.top.map(([h, b]) => `<li><b>${esc(h)}</b> ${esc(b)}</li>`).join('')}</ol>${a.topNote ? `<div class="small muted">${esc(a.topNote)}</div>` : ''}
        ${a.id === 'm2' ? '' : `<div class="btnrow"><button class="btn sm" data-act="ax-live" data-id="${a.id}">${ic('spark', 14)} ${a.id === 'm3' ? 'Practise the discussion with Claude' : a.id === 'wb' ? 'Get ready to write with Claude' : 'Check my records with Claude'}</button></div>`}</div>
      <div class="card" id="ax-must"><div class="row between"><h3>Before you hand it in</h3><span class="pill ${ticks === a.musts.length ? 'good' : 'info'} num">${ticks} of ${a.musts.length}</span></div>
        <div class="list">${a.musts.map(([id, t]) => `<button class="li tap" data-act="ax-must" data-id="${id}" role="checkbox" aria-checked="${!!state.ax.must[id]}" style="width:100%;text-align:left"><span class="cotick${state.ax.must[id] ? ' on' : ''}">${state.ax.must[id] ? ic('check', 14) : ''}</span><span class="grow small" style="min-width:0">${esc(t)}</span></button>`).join('')}</div></div>
      <div class="btnrow">${link}<button class="btn sm ghost" data-act="ax-all">All assessments</button></div>`;
    return html;
  }

  /* ---------- Ask tutor: your own Claude account, inside the app ----------
     On Android a second web view with claude.ai sits under the tutor's top bar.
     Suggestions and "Ask tutor" buttons put your week and the question into the message box. */
  const CHAT = { type: '', url: '' };
  let tutorOpen = false;
  const chatReady = () => !!(APP && typeof APP.chatShow === 'function');
  const isClaudeUrl = (u) => /^https:\/\/([a-z0-9-]+\.)*claude\.ai(\/|$)/i.test(String(u || ''));
  function chatUrl(where) {
    const s = state.settings;
    if (where === 'new') return 'https://claude.ai/new';
    if (where === 'recents') return 'https://claude.ai/recents';
    if (where === 'project') return isClaudeUrl(s.claudeProject) ? s.claudeProject : 'https://claude.ai/projects';
    return s.chatStart === 'new' ? 'https://claude.ai/new' : chatUrl('project');

  function chatSubText() {
    if (!chatReady()) return 'Opens Claude in your browser';
    if (/\/login|magic-link|\/verify/i.test(CHAT.url)) return 'Sign in: tap Continue with email';
    if (CHAT.type === 'start') return 'Loading…';
    return /\/project\//.test(CHAT.url) ? 'PGCE project' : 'Your account';
  }
  function positionChat() {
    if (!chatReady()) return;
    try {
      if (!tutorOpen || sheetOpen) { APP.chatHide(); return; }
      const top = $('#tutor-sugg').getBoundingClientRect().bottom;
      APP.chatShow(Math.round(top), 0, Math.round(window.innerWidth), chatUrl());
    } catch (e) { /* shown next time */ }
  }
  const SUGG = ['What should I study tonight?', 'Help me plan my next deadline', 'Quiz me on my weakest topic', 'What is missing from my portfolio?'];
  function openTutor(prompt) {
    const el = $('#tutor');
    el.innerHTML = `<div class="appbar"><button class="back" type="button" data-act="close-tutor" aria-label="Close">${ic('x', 16)}</button><h2>Tutor <span class="small muted" style="font-family:var(--f-body);font-weight:600">· Claude</span><span class="sub" id="chat-sub">${esc(chatSubText())}</span></h2><button class="iconbtn" type="button" data-act="chat-menu" aria-label="Chat options">${ic('dots', 18)}</button></div>
      <div class="chips" id="tutor-sugg">${SUGG.map((s) => `<button class="chip" type="button" data-act="ask" data-q="${esc(s)}" data-week="1">${esc(s)}</button>`).join('')}</div>
      <div class="tutor-hole">${chatReady() ? '<div><p><b>Opening Claude…</b></p><p class="small">If this stays, check your connection, then tap the three dots and Reload.</p></div>' : `<div class="card" style="text-align:left"><h3>Your Claude tutor</h3><p class="small">In the Android app, this opens your own Claude account here, with your week ready to paste. In a browser, open Claude in a new tab and paste your question.</p><div class="btnrow"><a class="btn" href="${esc(chatUrl())}" target="_blank" rel="noopener">Open Claude</a><button class="btn ghost" type="button" data-act="copy-week">Copy my week</button></div></div>`}</div>`;
    el.hidden = false;
    tutorOpen = true;
    if (chatReady() && !state.settings.chatTipSeen) { signInHelp(true); return; }
    positionChat();
    if (prompt) setTimeout(() => sendToTutor(prompt), 250);
  }
  function closeTutor() {
    tutorOpen = false;
    $('#tutor').hidden = true;
    positionChat();
  }
  function sendToTutor(text) {
    if (chatReady()) { try { APP.chatInsert(text); return; } catch (e) { /* copy instead */ } }
    copyText(text, 'Copied. Paste it into Claude and send.');
  }
  // From a suggestion chip: the week first, then the question. From anywhere else: the question as written.
  function ask(q, withWeek) {
    const text = withWeek ? weekText().replace(/My question: $/, 'My question: ' + q) : q;
    if (!tutorOpen) openTutor(text); else sendToTutor(text);
  }
  function signInHelp(first) {
    sheet(`<h3>Signing in to Claude here</h3>
      <ol class="steps"><li>Tap <b>Continue with email</b> and type the email you use for Claude. Google sign-in does not work inside apps, but your Gmail address works here.</li>

      <div class="small muted">You stay signed in after that. Your chats and the PGCE project are the same ones as on the Claude app and website.</div>
      <button class="btn block" data-act="chat-paste">${ic('link', 16)} Paste sign-in link</button>

  function chatMenu() {
    sheet(`<h3>Claude</h3><div class="menu">
      <button data-act="chat-go" data-id="new">${ic('plus')} New chat</button>
      <button data-act="chat-go" data-id="project">${ic('folder')} PGCE project</button>
      <button data-act="chat-go" data-id="recents">${ic('chats')} Your chats</button>
      <button data-act="chat-week">${ic('list')} Put my week in the message box</button>

      <button class="btn ghost block" data-act="close-sheet">Close</button>`);

  /* ---------- actions ---------- */
  function tick(id, on) {
    if (on) state.done[id] = Date.now(); else delete state.done[id];
    commit();
    render();
    if (on) {
      const d = deadlines().find((x) => x.chunks.some((c) => c.id === id));
      if (d && d.complete) celebrate(d); else toast(`<b>Done.</b> Evening streak: ${streak()}.`);
    }
  }
  function moveChunk(id, why) {
    const c = allChunks(deadlines()).find((x) => x.id === id);
    if (!c) return;
    const today = todayKey();
    const from = c.dateEff < today ? today : addDays(c.dateEff, 1);
    const slot = findSlot(c, from, loadMap(id));
    const to = slot ? slot.day : nextFreeEvening(from, c.mins || 30, id);
    const undo = { [id]: state.moved[id] || null };
    state.moved[id] = to;
    if (why === 'miss') {
      addLog({ kind: 'miss', what: `Re-planned: ${c.title}`, why: `You said you would miss it tonight. It moved to ${fmtLong(to)}, the next evening with room before ${c.deadline.due ? 'the deadline (' + fmtShort(c.deadline.due) + ')' : 'its deadline'}.`, lines: [], undo: { moved: undo } });
    }
    commit();
    closeSheet(true);
    render();
    const note = c.deadline.due && to > c.deadline.due ? ' That is after the deadline, so check it still works.' : (slot && !slot.fits ? ' That evening is over your limit, because the deadline is close.' : '');
    toast(`<b>${why === 'miss' ? 'Re-planned.' : 'Moved.'}</b> ${esc(c.title)} is now on ${esc(fmtShort(to))}.${note}`);
  }
  function pullToTonight(id) {
    const c = allChunks(deadlines()).find((x) => x.id === id);
    if (!c) return;
    const undo = { [id]: state.moved[id] || null };
    state.moved[id] = todayKey();
    addLog({ kind: 'pull', what: `Brought forward: ${c.title}`, why: `You chose to do it tonight instead of ${fmtLong(c.dateEff)}.`, lines: [], undo: { moved: undo } });
    commit();
    render();
    toast('On tonight. Tick it off when it is done.');
  }
  let timerT = null;
  function runTimer() {
    clearInterval(timerT);
    if (!timer || !timer.running) return;
    timerT = setInterval(() => {
      if (!timer || !timer.running) { clearInterval(timerT); return; }
      timer.left = Math.max(0, timer.left - 1);
      const el = $('#timer');
      if (el) el.textContent = `${pad(Math.floor(timer.left / 60))}:${pad(timer.left % 60)}`;
      if (timer.left === 0) { timer.running = false; clearInterval(timerT); toast('<b>Time is up.</b> Tick it off if it is done.'); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ } if (route === 'learn') render(); }
    }, 1000);
  }

  document.addEventListener('click', (e) => {
    const tabBtn = e.target.closest('[data-tab]');
    if (tabBtn) { go(tabBtn.dataset.tab); return; }
    const goEl = e.target.closest('[data-go]');
    if (goEl && !e.target.closest('[data-act]')) { go(goEl.dataset.go); return; }
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const a = el.dataset.act;
    const id = el.dataset.id;
    const s = state.settings;
    const p = state.portfolio;
    switch (a) {
      case 'back': back(); break;
      case 'close-sheet': closeSheet(); break;
      case 'close-tutor': closeTutor(); break;
      case 'ask': closeSheet(true); ask(el.dataset.q || '', !!el.dataset.week); break;
      // Module 2, week by week
      case 'm2-all': closeSheet(true); sub.mw = null; sub.ms = null; if (route !== 'module') go('module'); else { render(); $('#screen').scrollTop = 0; } break;
      case 'm2-open': { const w = M2_BY[Number(id)]; if (w) { closeSheet(true); sub.mw = w.n; sub.ms = el.dataset.s || null; if (route !== 'module') go('module'); else { render(); $('#screen').scrollTop = 0; } } break; }
      case 'm2-step': if (M2_STEPS.some(([k]) => k === id)) { sub.ms = id; render(); $('#screen').scrollTop = 0; } break;

        addDraft = null; prefill = null; commit();
        go('deadlines', { replace: true });
        toast(`<b>Added</b> with ${plural(dl.chunks.length, 'step')}.`);
        break;
      }
      // Settings
      case 'set-toggle': { s[id] = !(id === 'heal' || id === 'energyCheck' || id === 'readAloud' || id === 'dictate' ? s[id] !== false : !!s[id]); commit(); applyLook(); if (id === 'heal' && s.heal) heal(); if (id === 'readAloud' && !s.readAloud) listenCmd('stop'); if (id === 'dictate' && !s.dictate) dictStop(); render(); break; }
      case 'mode': s.mode = id; commit(); applyLook(); render(); break;
      case 'alarms': s.alarms = s.alarms === false; commit(); render(); toast(s.alarms ? 'Alarms are on.' : 'Alarms are off. Nothing will ring.'); break;

  // The library's topic filter, the Add sheet's smart filing, and edits to your own items.
  document.addEventListener('change', (e) => {

  document.addEventListener('input', (e) => {

    window.__capgownBack = () => {
      if (DICT.on) dictStop();
      if (sheetOpen) { closeSheet(); return true; }
      if (tutorOpen) { closeTutor(); return true; }

      if (route !== 'home') { go('home'); return true; }
      return false;
    };
    window.__capgownChatEvent = (type, url) => { CHAT.type = type || ''; CHAT.url = url || ''; const x = $('#chat-sub'); if (x) x.textContent = chatSubText(); };
    window.__capgownChatInserted = (ok) => toast(ok ? 'Your question is in the message box. Check it, then tap send.' : 'Copied. Tap the message box, hold, then Paste.');

      liveMsg = st === 'ready' ? `Version ${Number(n)} is ready.` : st === 'none' ? 'You have the latest version.' : st === 'busy' ? 'Already checking.' : 'Could not check. Are you online?';

    };
    // Tell the app this page works, so it keeps it. If a downloaded page fails its own check, go back to the built-in one.
    try {
      const st = liveStatus();
      if (selfTest()) { if (typeof APP.pageReady === 'function') APP.pageReady(PAGE); }
      else if (st && PAGE > (Number(st.bundled) || 0) && typeof APP.revertUpdate === 'function') APP.revertUpdate();
    } catch (e) { /* an older app without live updates */ }
    takeSavedLinks();
    videoTaken(); // a video that ended in the app's own player while this page was closed
    setTimeout(liveWaiting, 4000);
  }
  // The keyboard: hide the tabs and Ask tutor while typing, and keep the chat lined up.
  let fullH = window.innerHeight;
  let fullW = window.innerWidth;
  window.addEventListener('resize', () => {
    if (window.innerWidth !== fullW) { fullW = window.innerWidth; fullH = window.innerHeight; }

})();
