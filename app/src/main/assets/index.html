        ['Curriculum design in your subject', 'Order matters. In engineering some ideas unlock others, such as units before calculations and drawing conventions before reading a drawing. Planning that order, and saying why, is analysis for LO1.']
      ],
      wrong: [['A good engineer is automatically a good teacher of engineering.', 'Expertise can hide the steps a novice needs. PCK has to be learned.'], ['General teaching methods are enough.', 'LO2 asks for pedagogy special to your subject.'], ['Occupational currency means holding a qualification.', 'It means staying up to date with current practice.']],
      ask: ['What would count as a signature way of teaching in my subject?', 'How do I show occupational currency in the presentation?', 'How subject-specific does the pedagogy need to be for LO2?'],
      check: [
        ['Pedagogical content knowledge is best described as…', ['Knowing a lot about your subject', 'Knowing how to make particular subject content learnable for particular learners', 'Knowing general classroom management'], 1, 'PCK joins the subject to the teaching of it: examples, order and likely mistakes.'],
        ['Dual professionalism means…', ['Teaching two subjects', 'Being both an occupational expert and a teacher, and keeping both current', 'Working in two colleges'], 1, 'You are a professional in your occupation and in teaching.']
      ],
      go: 'Pick one topic you teach next week. Write the misconception learners usually have and the example or demonstration you use to shift it. That note is PCK made visible.',
      dist: 'Name the knowledge only a teacher of your subject would have, show a planning decision that came from it, and weigh it against a general alternative.',
      cards: [['What is pedagogical content knowledge (PCK), and who named it?', 'Knowing how to make particular subject content learnable: the examples, the order and the common mistakes. Shulman (1986).'], ['What is dual professionalism?', 'Being a professional in your occupation and in teaching, and keeping both up to date.'], ['What does occupational currency mean?', 'Your knowledge of the occupation matches what workplaces do now.']],
      read: ['Shulman, L. S. (1986). Those who understand: Knowledge growth in teaching. Educational Researcher, 15(2), 4–14.', 'Lucas, B., Spencer, E., & Claxton, G. (2012). How to teach vocational education: A theory of vocational pedagogy. City & Guilds Centre for Skills Development.'] },
    { n: 4, d: '2026-09-30', k: 'Taught session', mins: 20, t: '', lo: [1, 3],
      title: 'Curriculum, skills and employability: is the curriculum fit for purpose?',
      topics: ['Curriculum evaluation', 'Employability and skills priorities', 'Curriculum responsiveness', 'Occupational currency', 'Future skills and labour market trends', 'Curriculum improvement'],
      big: 'A curriculum is a set of choices about what is worth learning and in what order. “Fit for purpose” asks: fit for whose purpose?',
      learn: [
        ['Three questions', 'A common way to judge a curriculum is by intent, implementation and impact: what it sets out to do, how it is taught, and what learners can do as a result. Ofsted used these three words in its 2019 inspection framework.'],
        ['Responsive to work', 'A responsive curriculum keeps pace with employers and the local labour market. T Levels were designed with employers and include an industry placement. Labour market information (LMI) shows which skills are in demand.'],
        ['More than job skills', 'Employability includes technical skill, but also English, maths, digital skills, and habits such as reliability and teamwork. A curriculum can serve the employer, the learner and society, and these do not always agree.'],
        ['Who is left out', 'Judging a curriculum includes asking who it works for. Entry requirements, assessment style, access to placements and the examples you use can all favour some learners. That question links this week to LO3.']
      ],
      wrong: [['The curriculum is the specification.', 'The specification is the minimum. The curriculum is everything you plan and order around it.'], ['Fit for purpose means fit for employers.', 'Learners and society have purposes too, and a critical answer weighs them.'], ['I cannot change the curriculum.', 'You control the order, the examples, the emphasis and the enrichment.']],
      ask: ['Whose purpose should I judge my curriculum against in the presentation?', 'Where can I find labour market information for my sector and region?', 'How much freedom do I have to change the order of a T Level specification?'],
      check: [
        ['Intent, implementation and impact are…', ['Three stages of Lewin’s model', 'Three questions for judging a curriculum: what it sets out to do, how it is taught, what learners gain', 'Three kinds of assessment'], 1, 'They ask what the curriculum is for, how it is delivered and what difference it makes.'],
        ['A curriculum is “responsive” when…', ['It follows last year’s scheme of work exactly', 'It adapts to current employer needs, the labour market and its learners', 'It covers only what is in the exam'], 1, 'Responsive means it keeps pace with work and with the learners in front of you.']
      ],
      go: 'Take one unit you teach. Note one thing employers now need that it does not cover well, and one small thing you could add or move.',
      dist: 'Do not only describe your scheme of work. Judge it: what it assumes, who it serves, what you changed and why, with evidence from employers or labour market data.',
      cards: [['What do intent, implementation and impact ask about a curriculum?', 'What it sets out to do, how it is taught, and what learners can do as a result.'], ['What is LMI and why does a teacher use it?', 'Labour market information: data on the jobs and skills in demand. It helps keep the curriculum current.'], ['Give two things a teacher controls inside a set specification.', 'Any two of: the order, the examples, the emphasis, the links to work, the enrichment.']],
      read: ['Department for Education. (2021). Skills for jobs: Lifelong learning for opportunity and growth.'] },
    { n: 5, d: '2026-10-07', k: 'Taught session', mins: 20, t: 'change', lo: [1, 4],
      title: 'Shaping your change project: the proposal',
      topics: ['Identifying problems in practice', 'Planning change', 'Measuring impact', 'Professional networks', 'Refining practitioner inquiry proposals'],
      big: 'A proposal is a promise you can keep: one problem, one change, and a way to tell whether it helped.',
      learn: [
        ['From a worry to a question', 'Start with something you have noticed, then check it is real with evidence you already hold: marks, attendance, work, what learners say. Turn it into a question you can answer in a term.'],
        ['The change', 'Say exactly what you will do differently, with which groups, how often and for how long. If a colleague could not run it from your description, it is not clear enough yet.'],
        ['Measuring impact', 'Collect a baseline before you start, then the same measure after. Add a second kind of evidence, such as learner voice or your own dated notes, so that one weak measure does not carry the whole claim. This is triangulation.'],
        ['People who help', 'A mentor, a subject colleague, a quality lead or a subject network can test your plan and your reading of the results. Naming who challenged your thinking is evidence of professional practice.']
      ],
      wrong: [['Impact means a rise in scores.', 'Impact is any evidenced change: understanding, confidence, participation, or your own practice.'], ['I can collect the baseline later.', 'Without a “before” there is nothing to compare the “after” with.'], ['Ethics only applies to big studies.', 'Any study of your own learners needs consent, anonymity and fairness.']],
      ask: ['Is my baseline strong enough?', 'What second kind of evidence would suit my project?', 'Who has to approve my proposal, and what conditions might they set?'],
      check: [
        ['Triangulation means…', ['Teaching in three ways', 'Using more than one kind of evidence to test the same claim', 'Having three groups'], 1, 'Scores, learner voice and your notes together are stronger than any one alone.'],
        ['Why collect a baseline?', ['To fill the slides', 'So there is a “before” to compare with the “after”', 'Because the law requires it'], 1, 'A change can only be shown against where things started.']
      ],
      go: 'Gather the “before” for your project this week: the scores or work you already hold for both groups, with names removed.',
      dist: 'Justify every design choice: why this measure, why this length, what you could not control. A distinction method slide argues. It does not only list.',
      cards: [['What is a baseline?', 'Evidence collected before the change, to compare with evidence collected after.'], ['What is triangulation?', 'Using more than one kind of evidence, such as scores, learner voice and notes, to test the same claim.'], ['Name three ethical duties in a study of your own learners.', 'Any three of: informed consent, the right to withdraw, anonymity, no learner disadvantaged, the college’s permission, safe storage of data.']],
      read: ['British Educational Research Association. (2024). Ethical guidelines for educational research (5th ed.).', 'McNiff, J. (2017). Action research: All you need to know. SAGE.'] },
    { n: 6, d: '2026-10-14', k: 'Taught session', mins: 20, t: 'retrieval', lo: [2, 4],
      title: 'Cognitive science in practice',
      topics: ['Retrieval practice', 'Interleaving and spacing', 'Dual coding', 'Professional judgement', 'Evidence-informed teaching'],
      big: 'Memory grows by being used. Cognitive science offers strong hints for teaching, and your judgement decides how they fit your subject and your learners.',
      learn: [
        ['Working memory and long-term memory', 'Working memory holds only a few new things at once. Long-term memory is vast. Learning means building knowledge in long-term memory, so that working memory is free for the next step. Overload happens when too much is new at once.'],
        ['Retrieval, spacing, interleaving', 'Recalling an idea strengthens it more than rereading. Coming back after a gap strengthens it more than cramming. Mixing problem types makes learners choose the method, which is harder now and better later.'],
        ['Dual coding', 'Words and a matching picture together give two routes to the same idea. In engineering that is natural: a labelled diagram, a drawing beside a description. Decoration does not count. The picture has to carry the meaning.'],
        ['Evidence-informed, not evidence-led', 'Much of this research came from laboratories, schools and universities, often with short delays and simple material. The Education Endowment Foundation’s 2021 review found the classroom evidence thinner and more mixed than the headlines suggest. Your professional judgement fills the gap.']
      ],
      wrong: [['Retrieval practice is a weekly test.', 'It is low stakes, with feedback, and the questions return after a gap.'], ['If it feels easy, it is working.', 'Useful difficulty feels harder. Rereading feels fluent and teaches little.'], ['Cognitive science tells me what to do.', 'It tells you what tends to work. The subject, the learners and the timing are your call.'], ['Learning styles are part of cognitive science.', 'Matching teaching to a “style” has not been supported by the evidence.']],
      ask: ['How long should the gap be before a question returns?', 'How do I use retrieval for understanding and applying, not only for facts?', 'What does the evidence say about retrieval practice in vocational or further education settings?'],
      check: [
        ['Which of these is retrieval practice?', ['Rereading notes', 'Answering questions from memory, then checking', 'Highlighting key terms'], 1, 'Retrieval means bringing the idea back from memory. The other two feel productive but build little.'],
        ['Interleaving helps because…', ['Learners see each topic only once', 'Learners must choose which method fits each problem', 'It makes practice feel easier'], 1, 'Choosing the method is the part that blocked practice leaves out.'],
        ['Why is professional judgement still needed with cognitive science?', ['The research is all wrong', 'Most studies were not done with your subject, learners or setting', 'Judgement is quicker than reading'], 1, 'The principles are well supported. How they transfer to your classroom is not settled.']
      ],
      go: 'In one lesson this week, bring back three questions from two or three weeks ago, unannounced and unmarked. Note which one most learners missed and what you did next.',
      dist: 'This is the research base of your project. Use several sources, show where they disagree or stop short of vocational learning, and say how that limits your claim.',
      cards: [['Why does retrieval beat rereading?', 'Bringing an idea back from memory strengthens it. Rereading feels fluent but builds little.'], ['What is the spacing effect?', 'Practice spread over time lasts longer than the same practice crammed together.'], ['What is interleaving?', 'Mixing problem types in one session, so that learners must choose the method.'], ['Give one limit of cognitive science research for a further education teacher.', 'Most studies used schools, universities or laboratories, simple material and short delays, so transfer to vocational learning is not proven.']],
      read: ['Roediger, H. L., & Karpicke, J. D. (2006). Test-enhanced learning: Taking memory tests improves long-term retention. Psychological Science, 17(3), 249–255.', 'Dunlosky, J., Rawson, K. A., Marsh, E. J., Nathan, M. J., & Willingham, D. T. (2013). Improving students’ learning with effective learning techniques. Psychological Science in the Public Interest, 14(1), 4–58.', 'Perry, T., Lea, R., Jørgensen, C. R., Cordingley, P., Shapiro, K., & Youdell, D. (2021). Cognitive science in the classroom: Evidence and practice review. Education Endowment Foundation.', 'Agarwal, P. K., Nunes, L. D., & Blunt, J. R. (2021). Retrieval practice consistently benefits student learning. Educational Psychology Review, 33, 1409–1453.'] },
    { n: 7, d: '2026-10-21', k: 'Taught session', mins: 20, t: 'agency', lo: [2, 3],
      title: 'Developing learner agency and independence',
      topics: ['Metacognition', 'Self-regulation', 'MARGE framework', 'Learner agency'],
      big: 'Independent learners are made, not found. They plan, check and adjust their own learning because someone taught them how.',
      learn: [
        ['Metacognition', 'Metacognition is thinking about your own thinking: knowing what you know, what the task needs and which strategy fits. It is taught best inside the subject, by a teacher thinking aloud while solving a real problem.'],
        ['Self-regulation', 'Self-regulated learners plan before a task, monitor during it and evaluate after it. The Education Endowment Foundation’s guidance describes this plan, monitor, evaluate cycle and recommends teaching it openly.'],
        ['MARGE', 'Shimamura’s MARGE names five things that help learning: Motivate, Attend, Relate, Generate, Evaluate. Generate means producing an answer yourself. Evaluate means checking what you really know. Both link straight to retrieval practice.'],
        ['Agency', 'Agency is a learner’s power to make real choices and act on them. It grows when learners get choice with structure, and feedback they can use. Independence without the tools is only being left alone.']
      ],
      wrong: [['Independent learning means working alone.', 'It means directing your own learning. At first it often needs more teaching, not less.'], ['Some learners just are not independent.', 'The strategies can be taught, modelled and practised.'], ['Metacognition is a general study-skills lesson.', 'It works best taught inside real subject tasks.']],
      ask: ['How do I teach metacognition inside a practical engineering task?', 'How can I evidence growing independence in my learners?', 'Where does MARGE fit beside the other frameworks we have met?'],
      check: [
        ['The self-regulation cycle is…', ['Unfreeze, change, refreeze', 'Plan, monitor, evaluate', 'Describe, explain, analyse'], 1, 'Plan before, monitor during, evaluate after.'],
        ['In MARGE, “Generate” asks learners to…', ['Read the notes again', 'Produce answers or explanations themselves', 'Watch a demonstration'], 1, 'Generating an answer is active, which is why it links to retrieval practice.']
      ],
      go: 'Before a task this week, ask learners to predict their score or name the step they expect to find hardest. Afterwards, compare. That gap is a metacognition lesson.',
      dist: 'Show learners using the strategy without you, and weigh how far a short project can claim to have built independence.',
      cards: [['What is metacognition?', 'Thinking about your own thinking: knowing what you know and which strategy fits the task.'], ['Name the three phases of self-regulated learning.', 'Plan, monitor, evaluate.'], ['What do the letters of MARGE stand for?', 'Motivate, Attend, Relate, Generate, Evaluate (Shimamura).']],
      read: ['Shimamura, A. P. (2018). MARGE: A whole-brain learning approach for students and teachers.', 'Quigley, A., Muijs, D., & Stringer, E. (2018). Metacognition and self-regulated learning: Guidance report. Education Endowment Foundation.', 'Zimmerman, B. J. (2002). Becoming a self-regulated learner: An overview. Theory Into Practice, 41(2), 64–70.'] },
    { n: 8, d: '2026-11-04', k: 'Guest speaker', mins: 20, t: 'afl', lo: [1, 2],
      title: 'Subject-specific assessment',
      topics: ['Assessment within specialist contexts', 'Assessment validity and reliability', 'Qualification requirements', 'IQA and EQA processes', 'Feedback and learner progress', 'Assessment decision-making'],
      big: 'An assessment is only useful if it measures the right thing, consistently, and the learner can act on what it shows.',
      learn: [
        ['Valid and reliable', 'Valid means the task measures what it claims to. A written test of a practical skill may not be valid. Reliable means the same work would get the same decision from another assessor or on another day.'],
        ['Qualification rules', 'Each qualification sets how it must be assessed: exams, set assignments, observed practical work, a portfolio. Knowing the rules for your qualification tells you what you can adapt and what you cannot.'],
        ['IQA and EQA', 'Internal quality assurance samples assessment decisions inside the college and keeps assessors in line with each other. External quality assurance is the awarding organisation checking the centre. Together they protect the value of the certificate.'],
        ['Feedback and decisions', 'Feedback helps when it tells the learner where they are going, how they are doing and what to do next, and when they then act on it. An assessment decision should rest on evidence against the standard, not on effort or liking.']
      ],
      wrong: [['A reliable test is a valid test.', 'A test can give consistent results and still measure the wrong thing.'], ['Formative assessment means the small tests.', 'It is any check you use to change what happens next.'], ['Feedback is done when it is given.', 'It is done when the learner has used it.']],
      ask: ['How do I make a practical assessment both valid and reliable?', 'What may I adapt for a learner without changing the standard?', 'How do the measures in my change project stand up as valid evidence?'],
      check: [
        ['A written quiz is used to judge whether a learner can set up a lathe safely. The main weakness is…', ['Reliability', 'Validity', 'Cost'], 1, 'It may be consistent, but writing about a task is not the same as doing it.'],
        ['IQA is…', ['The awarding organisation’s visit', 'The centre’s own sampling and standardising of assessment decisions', 'A learner’s appeal'], 1, 'Internal quality assurance happens inside the centre. The awarding organisation’s check is EQA.']
      ],
      go: 'Look at one assessment you set this term. Ask: does it measure the skill, or the writing about the skill? Note one change that would make it more valid.',
      dist: 'Turn the question on your own project: are your measures valid for the learning you claim? Saying where they are not is critical evaluation.',
      cards: [['What is the difference between valid and reliable?', 'Valid: it measures what it claims to. Reliable: it gives the same decision across assessors and occasions.'], ['What do IQA and EQA do?', 'IQA checks and standardises decisions inside the centre. EQA is the awarding organisation checking the centre.'], ['Feedback should answer which three questions?', 'Where am I going, how am I doing, and where to next? (Hattie and Timperley, 2007).']],
      read: ['Hattie, J., & Timperley, H. (2007). The power of feedback. Review of Educational Research, 77(1), 81–112.', 'Black, P., & Wiliam, D. (1998). Inside the black box: Raising standards through classroom assessment.'] },
    { n: 9, d: '2026-11-11', k: 'Taught session', mins: 20, t: 'adaptive', lo: [2, 3],
      title: 'Adaptive and responsive teaching',
      topics: ['Adaptive teaching', 'Responsive teaching', 'Hinge questions', 'Feedback loops', 'Inclusive teaching', 'Micro-adaptations in practice'],
      big: 'Adaptive teaching keeps the goal the same for everyone and changes the support. Responsive teaching finds out what learners understood and acts on it in the lesson.',
      learn: [
        ['Adaptive, not three worksheets', 'Older “differentiation” often meant different tasks for different groups, which could lower expectations. Adaptive teaching holds one ambitious goal and adjusts scaffolds, examples, time and grouping so that more learners reach it.'],
        ['Responsive teaching', 'Plan the check as carefully as the explanation. Ask, look at every learner’s answer, then decide: move on, reteach, or split the group. Dylan Wiliam describes good teaching as adjusted by evidence of learning as the lesson goes on.'],
        ['Hinge questions', 'A hinge question sits at a turning point in the lesson. Every learner answers quickly, and each wrong option points to a known misconception. The answers tell you which way the lesson should go.'],
        ['Micro-adaptations', 'Small moves in the moment: rewording, a second example, a visual, pairing, a worked step, more wait time. They are quick, they cost nothing, and together they are what inclusion looks like in an ordinary lesson.']
      ],
      wrong: [['Adaptive teaching means a separate plan for each learner.', 'It means one goal with flexible support.'], ['A hinge question checks who was listening.', 'It finds a specific misconception so that you can act on it.'], ['Inclusion is for learners with a support plan.', 'Adaptations planned for some usually help many.']],
      ask: ['How do I write wrong options that reveal a misconception?', 'What do I do when the hinge question splits the class in half?', 'How do I evidence micro-adaptations that happen in the moment?'],
      check: [
        ['A good hinge question…', ['Takes ten minutes to answer', 'Is answered by everyone quickly, with wrong options that reveal misconceptions', 'Is asked only of volunteers'], 1, 'It is quick, everyone answers, and the wrong answers tell you what to do next.'],
        ['Adaptive teaching differs from older differentiation because it…', ['Sets easier goals for some learners', 'Keeps the goal and adapts the support', 'Uses no scaffolds'], 1, 'One ambitious goal, with the support flexed to reach it.']
      ],
      go: 'Write one hinge question for a lesson this week, with a wrong option for each common mistake. Use mini whiteboards or fingers so that you see every answer, and note what you did next.',
      dist: 'Show the loop closing: what the check revealed, what you changed, and who it helped. Then weigh it: who still did not get there, and why?',
      cards: [['What is a hinge question?', 'A quick check at a turning point, answered by everyone, whose wrong options reveal misconceptions.'], ['How does adaptive teaching differ from older differentiation?', 'One ambitious goal for all, with the support adapted, instead of different tasks and goals for different groups.'], ['Give three micro-adaptations.', 'Any three of: rewording, another example, a visual, a worked step, pairing, more wait time.']],
      read: ['Wiliam, D. (2011). Embedded formative assessment. Solution Tree Press.', 'Education Endowment Foundation. (2020). Special educational needs in mainstream schools: Guidance report.'] },
    { n: 10, d: '2026-11-18', k: 'Taught session', mins: 20, t: 'reflect', lo: [1, 4],
      title: 'Developing adaptive expertise and professional judgement',
      topics: ['Adaptive expertise', 'Routine expertise', 'Professional judgement', 'Reflection and deliberate practice', 'Critical incidents', 'Expert teaching'],
      big: 'Routine experts do the familiar thing well. Adaptive experts understand why it works, so they can change it when the situation is new.',
      learn: [
        ['Two kinds of expertise', 'Hatano and Inagaki separated routine expertise, which is fast and accurate in familiar cases, from adaptive expertise, which copes with new cases because it rests on understanding. Teaching needs both: routines free your attention for judgement.'],
        ['Professional judgement', 'Judgement is deciding what to do when the rule does not fit. It draws on evidence, experience, knowledge of these learners and your values. You can explain a good judgement afterwards, even if you made it in a second.'],
        ['Deliberate practice', 'Ericsson’s idea: improvement comes from practising one specific thing just beyond your current level, with feedback, not from years of repetition. For a teacher that might be rehearsing one explanation or one questioning routine.'],
        ['Critical incidents', 'Tripp’s point is that an incident becomes “critical” through how you analyse it. An ordinary moment, looked at closely, can show an assumption you did not know you held.']
      ],
      wrong: [['Experience makes experts.', 'Experience with feedback and reflection does. Repetition alone can fix habits in place.'], ['A critical incident is a crisis.', 'It is any moment you choose to analyse because it reveals something.'], ['Routines are the enemy of adaptive teaching.', 'Good routines free attention for the judgement calls.']],
      ask: ['How do I show professional judgement in a presentation?', 'What counts as deliberate practice for a teacher?', 'Could a critical incident be part of my project evidence?'],
      check: [
        ['Adaptive expertise is…', ['Doing familiar tasks quickly', 'Understanding well enough to respond to new situations', 'Following the scheme of work'], 1, 'It rests on knowing why a method works, so it bends to new cases.'],
        ['What makes an incident “critical” in Tripp’s sense?', ['It was dangerous', 'The teacher analysed it and it revealed something about practice', 'A manager reported it'], 1, 'The analysis makes it critical, not the size of the event.']
      ],
      go: 'Pick one small moment from this week’s teaching that surprised you. Write what happened, what you assumed, and what else could explain it.',
      dist: 'A distinction ending shows how the project changed your judgement, not only your method: what you now do differently in cases the project never covered.',
      cards: [['Routine or adaptive expertise: which copes with a new situation, and why?', 'Adaptive expertise, because it rests on understanding why a method works.'], ['What is deliberate practice?', 'Practising one specific thing just beyond your level, with feedback (Ericsson).'], ['What is a critical incident?', 'An ordinary moment made significant by analysing what it reveals about practice (Tripp).']],
      read: ['Hatano, G., & Inagaki, K. (1986). Two courses of expertise. In H. Stevenson, H. Azuma, & K. Hakuta (Eds.), Child development and education in Japan (pp. 262–272). Freeman.', 'Tripp, D. (1993). Critical incidents in teaching: Developing professional judgement. Routledge.', 'Ericsson, K. A., Krampe, R. T., & Tesch-Römer, C. (1993). The role of deliberate practice in the acquisition of expert performance. Psychological Review, 100(3), 363–406.'] },
    { n: 11, d: '2026-11-25', k: 'Workshop', mins: 20, t: 'change', lo: [1, 2, 3, 4],
      title: 'Workshop: your change project, with exemplars',
      topics: ['Exemplars (WAGOLLs)', 'Assignment support', 'Practitioner inquiry development', 'Presentation preparation', 'Exemplars and critical evaluation'],
      big: 'A workshop is where you get feedback on your own plan. Arrive with your project in four sentences, the rubric in mind and three questions ready.',
      learn: [
        ['What the session is', 'WAGOLL means “what a good one looks like”. Expect to see model or past presentations, judge them against the grading rubric, work on your own inquiry, and start thinking about your 20 minutes.'],
        ['What a distinction asks', 'The top band asks for detailed, critical analysis on every outcome. For research it adds a range of sources and their impact on practice. The marks go in steps: 74, 81, 89, 96.'],
        ['The ladder', 'Describe says what happened. Explain says why. Analyse breaks the evidence apart to find a pattern. Evaluate weighs it: how far can this be trusted, and so what? Most marks are lost on the bottom two rungs.'],
        ['How to judge an exemplar', 'Ask one question for each outcome. LO1: are planning decisions analysed, or only described? LO2: is the pedagogy special to the subject? LO3: who gained and who did not? LO4: are sources weighed and limits named? Decide a band before the tutor says.'],
        ['Your own project tonight', 'Say it in four sentences: the problem you saw, the change you are making, how you will know it worked, and the research that made you choose it. Take your proposal and any scores you already hold.']
      ],
      wrong: [['It is a workshop, so there is nothing to prepare.', 'It is where you get feedback on your own plan. No plan, no feedback.'], ['An exemplar is a template to copy.', 'It shows a standard. Your structure must fit your project, and copying is an academic conduct risk.'], ['Critical means finding fault.', 'It means weighing: strengths, limits, other explanations, and so what.'], ['More references means a higher mark.', 'The rubric rewards a range that is evaluated and tied to practice, not a count.']],
      ask: ['In the exemplars, what one thing separated a 74 from a 68?', 'What counts as a range of research for LO4?', 'For LO3, how wide should I go: the whole subject curriculum, or the part my project touches?', 'If my results are flat or mixed, how should I present that?', 'Under AITS 2, what exactly may I use AI for, and how detailed should the statement on the opening slide be?'],
      check: [
        ['Which words mark the distinction band on every outcome?', ['Some analysis', 'Detailed and critical', 'Clear and well presented'], 1, 'Every outcome’s top band asks for detailed, critical work.'],
        ['“Scores rose, but the unit was also revisited in workshops, so I can claim a pattern, not proof.” Which rung is this?', ['Describe', 'Explain', 'Evaluate'], 2, 'It weighs another explanation and limits the claim. That is evaluation.'],
        ['How long is the presentation?', ['10 minutes plus 5 of questions', '20 minutes plus up to 10 of questions', '30 minutes with no questions'], 1, 'Twenty minutes to present, then up to ten minutes of questions.']
      ],
      go: 'After class, spend 15 minutes writing what you took from the workshop: one habit to copy from the exemplars, one to avoid, and one change to your own plan.',
      dist: 'Use the exemplars to set your own bar: note what the strongest one did on each outcome, then plan where your presentation will do the same with your own evidence.',
      cards: [['Name the four rungs from describing to evaluating.', 'Describe, explain, analyse, evaluate.'], ['What does the distinction band ask for on LO4?', 'Detailed, critical evaluation of a range of research and its impact on practice.'], ['What must the opening slide of the presentation include?', 'Module code and title, your name, student number, the assignment title, a statement on AI use, and a learning contract note if you have one.']],
      read: ['Your Module 2 handbook: the assessment brief and the grading rubric.'] },
    { n: 12, d: '2026-12-02', k: 'Guest speakers', mins: 20, t: '', lo: [2, 3],
      title: 'Learning technology and assistive technology',
      topics: ['ILT tools (content based on trainee needs and requests)', 'Assistive technology', 'Digital teaching tools', 'Accessibility', 'Inclusive digital practice', 'Technology-enhanced learning'],
      big: 'Technology earns its place when it removes a barrier, or does something the lesson could not do without it.',
      learn: [
        ['Technology with a purpose', 'ILT means information and learning technology. Start from the learning problem, then choose the tool. The SAMR model is one way to ask what a tool adds: does it only stand in for paper, or does it change the task?'],
        ['Assistive technology', 'Assistive technology helps a learner do what a barrier would otherwise stop: screen readers, text to speech, speech to text, captions, magnifiers, alternative keyboards. Much of it is already built into phones, Windows and Microsoft 365.'],
        ['Accessible by default', 'Simple habits make materials usable for more people: real headings, good contrast, readable fonts, alt text on images, captions on video, and files that can be read aloud. Doing this for everyone means fewer special arrangements later.'],
        ['The law and the limits', 'The Equality Act 2010 expects reasonable adjustments for disabled learners, thought about in advance. Technology can also exclude: not everyone has a device, data or the skills. A critical view weighs both.']
      ],
      wrong: [['Assistive technology is only for learners with a diagnosis.', 'Captions, read-aloud and dictation help many learners.'], ['More technology means better teaching.', 'A tool that only replaces paper adds little.'], ['Accessibility is the support team’s job.', 'The materials you make are yours to make accessible.']],
      ask: ['Which assistive tools are available on the college’s systems?', 'How do I find out what my learners already use?', 'What evidence would show a tool improved learning, and not only engagement?'],
      check: [
        ['Which of these is assistive technology?', ['A louder projector', 'Text to speech that reads a document aloud', 'A new whiteboard pen'], 1, 'It removes a barrier to reading for the learner who needs it.'],
        ['In SAMR, “substitution” means the technology…', ['Transforms the task', 'Replaces an old tool with no real change to the task', 'Removes the teacher'], 1, 'Substitution is the lowest level: same task, new tool.']
      ],
      go: 'Run the accessibility checker on one slide deck or handout you will use next week, fix what it finds, and try the read-aloud on it yourself.',
      dist: 'Link a digital choice to a named barrier and to evidence that it helped, then weigh the risks: access, distraction, and what the research does not yet show.',
      cards: [['What is assistive technology?', 'Technology that helps a learner get past a barrier, such as text to speech, speech to text, captions or a screen reader.'], ['Name four habits that make a document more accessible.', 'Any four of: real headings, good contrast, a readable font, alt text, captions, plain language, a file that can be read aloud.'], ['What does the SAMR model ask about a tool?', 'Whether it only substitutes for an old tool, or augments, modifies or redefines the task.']],
      read: ['Equality Act 2010, section 20 (the duty to make adjustments).', 'Puentedura, R. R. (2006). Transformation, technology, and education (the SAMR model).'] },
    { n: 13, d: '2026-12-09', k: 'Guest speaker', mins: 20, t: '', lo: [2, 4],
      title: 'Getting started with AI in the classroom',
      topics: ['AI in education', 'Responsible use of AI', 'AI and assessment', 'AI and safeguarding', 'Digital literacy', 'Preparing learners for AI-enabled workplaces'],
      big: 'Generative AI is a tool learners will meet at work. Teaching them to use it well includes teaching them when not to trust it.',
      learn: [
        ['What it is', 'Generative AI produces text, images or code by predicting what is likely to come next, from patterns in the material it was trained on. It can be fluent and wrong at the same time, and it can repeat the bias in that material.'],
        ['Responsible use', 'Three habits: check its output against a trusted source, keep personal and sensitive data out of public tools, and say when you have used it. Your own module works this way: AI may shape your work, and you declare it.'],
        ['AI and assessment', 'If AI can do the task, the task may not be measuring the learner. Awarding organisations treat undeclared AI use as malpractice. Answers include assessing the process, using observed or spoken work, and setting tasks rooted in the learner’s own practice.'],
        ['Safeguarding and literacy', 'Risks include harmful or false content, faked images and voices, and over-sharing data. Digital literacy now includes knowing roughly how these tools work, questioning their output, and seeing how your occupation is starting to use them.']
      ],
      wrong: [['AI detectors can prove a learner cheated.', 'Detectors are unreliable. Evidence of the process, and a conversation, are stronger.'], ['AI output is neutral.', 'It reflects what it was trained on, including the bias and the gaps.'], ['Banning AI solves the problem.', 'Learners will meet it at work. They need to learn to use it and to question it.']],
      ask: ['What is the college’s policy on learners using AI in coursework?', 'How should I adapt an assessment that AI could complete?', 'How do I teach learners to check AI output in my subject?'],
      check: [
        ['Why can generative AI give a confident wrong answer?', ['It is designed to deceive', 'It predicts likely text and does not check facts', 'It only knows maths'], 1, 'Fluency comes from prediction, not from checking.'],
        ['Which is the safest habit with a public AI tool?', ['Paste in learner names to save time', 'Keep personal and sensitive data out of it', 'Trust it for regulations and standards'], 1, 'Personal data should stay out, and technical standards should be checked at the source.']
      ],
      go: 'Ask an AI tool a technical question from your subject where you know the answer and the standard. Note what it got right and wrong, and use that for a five-minute discussion with learners.',
      dist: 'Treat AI as contested ground: set the claims for it against the evidence so far, which is young, and connect it to assessment validity and inclusion.',
      cards: [['Why can generative AI be fluent and wrong?', 'It predicts likely text from patterns in its training material. It does not check facts.'], ['Give three habits for responsible AI use.', 'Check the output, keep personal data out, and declare your use.'], ['How can an assessment be made more robust to AI?', 'Assess the process, use observed or spoken work, and root tasks in the learner’s own practice.']],
      read: ['Department for Education. Generative artificial intelligence (AI) in education (policy paper, updated from time to time).', 'Joint Council for Qualifications. AI use in assessments: Protecting the integrity of qualifications.'] },
    { n: 14, d: '2026-12-16', k: 'Online taught lesson', mins: 20, t: '', lo: [2, 3],
      title: 'How to teach online and blended',
      topics: ['Online pedagogy', 'Blended learning', 'Active learning online', 'Digital assessment', 'Teacher presence', 'Online safeguarding'],
      big: 'Online teaching is not a classroom lesson on camera. Attention is shorter, silence hides more, and presence has to be designed.',
      learn: [
        ['Three kinds of presence', 'The Community of Inquiry model says good online learning needs teaching presence (design and direction), social presence (people feel real to each other) and cognitive presence (learners build meaning). Weakness in one shows up as silence.'],
        ['Blended and flipped', 'Blended learning mixes online and face-to-face so that each does what it does best. In a flipped design learners meet new content first on their own, and class time is used for practice and questions.'],
        ['Active learning online', 'Plan something for learners to do every few minutes: a poll, the chat, a shared whiteboard, a breakout task with something to produce, a quiz. Using names keeps people present. Check understanding more often than you would in a room.'],
        ['Assessment and safety', 'Digital assessment can give instant feedback, but check it is valid for the skill. Online safeguarding covers recording, cameras, private messaging, suitable spaces and how to report a concern. Follow your college’s policy.']
      ],
      wrong: [['A good classroom lesson works the same online.', 'It needs shorter inputs and more planned activity.'], ['Cameras on means engaged.', 'Engagement is what learners produce, not what you can see.'], ['Online is always less effective.', 'The design matters more than the medium.']],
      ask: ['How will the online microteach be run, and how long is my slot?', 'What are the rules on recording and cameras?', 'Which tools may I use for interaction in the microteach?'],
      check: [
        ['The three presences in the Community of Inquiry model are…', ['Teaching, social, cognitive', 'Plan, monitor, evaluate', 'Visual, auditory, kinaesthetic'], 0, 'Teaching presence, social presence and cognitive presence.'],
        ['Which keeps learners most active online?', ['A 40-minute talk with slides', 'A short input, then a task with something to produce', 'Asking “any questions?” at the end'], 1, 'A task with a product gives every learner something to do and gives you something to check.']
      ],
      go: 'Plan your online microteach as a strip: for every three to five minutes, write what learners will do, not what you will say.',
      dist: 'Analyse what the online format did to your subject pedagogy: what could not be taught that way, what worked better, and who was helped or shut out.',
      cards: [['Name the three presences of the Community of Inquiry model.', 'Teaching presence, social presence and cognitive presence (Garrison, Anderson and Archer).'], ['What is flipped learning?', 'Learners meet new content on their own first, and class time is used for practice and questions.'], ['Give three ways to make an online session active.', 'Any three of: polls, chat tasks, a shared whiteboard, breakout tasks with a product, quizzes, questions by name.']],
      read: ['Garrison, D. R., Anderson, T., & Archer, W. (2000). Critical inquiry in a text-based environment: Computer conferencing in higher education. The Internet and Higher Education, 2(2–3), 87–105.'] },
    { n: 15, d: '2027-01-06', k: 'Online microteach', mins: 10, t: '', lo: [2],
      title: 'Online microteach (first week)',
      topics: ['Online lesson delivery', 'Digital teaching strategies', 'Reflection and feedback', 'Professional discussion'],
      big: 'A microteach is a short lesson taught to your peers, then picked apart kindly. The feedback and your reflection are the point.',
      learn: [
        ['One small outcome', 'Choose one thing learners will be able to do by the end, small enough to teach and check in the time. Say it at the start and check it at the end.'],
        ['Design for doing', 'Plan an activity every few minutes, and a check that shows you every learner’s answer. Test your tools, your sound and your sharing beforehand, and have a plan for when something fails.'],
        ['Giving and taking feedback', 'Useful peer feedback is specific, about the teaching and not the person, and offers a next step. When you receive it, listen, ask a question and note it. You decide later what to act on.'],
        ['Reflect afterwards', 'Write it up the same day with a model such as Gibbs: what happened, what you felt, what went well and badly, why, and what you would change. It is evidence for your portfolio.']
      ],
      wrong: [['The microteach is a performance to get right.', 'It is a rehearsal to learn from.'], ['Good feedback is praise.', 'Good feedback is specific and can be used.']],
      ask: ['How long is my slot, and how will the feedback be given?', 'Can the microteach count as evidence for my portfolio?'],
      check: [
        ['The best outcome for a short microteach is…', ['To cover a whole unit', 'One small thing learners can do and you can check', 'To show every tool you know'], 1, 'Small enough to teach and to check in the time.'],
        ['Which is the most useful peer feedback?', ['“That was great.”', '“Your poll at minute five showed three people were lost. A second example there might help.”', '“I would have taught something else.”'], 1, 'It is specific, about the teaching, and offers a next step.']
      ],
      go: 'Teach the same idea to one of your own groups this week, and compare how it went with the microteach.',
      dist: 'Use the microteach as evidence of adapting your subject pedagogy to a new medium, and be exact about what the feedback made you change.',
      cards: [['What makes peer feedback useful?', 'It is specific, about the teaching, and offers a next step.'], ['Name the stages of Gibbs’ reflective cycle.', 'Description, feelings, evaluation, analysis, conclusion, action plan.']],
      read: ['Gibbs, G. (1988). Learning by doing: A guide to teaching and learning methods.'] },
    { n: 16, d: '2027-01-13', k: 'Online microteach', mins: 10, t: '', lo: [2],
      title: 'Online microteach (second week)',
      topics: ['Online lesson delivery', 'Digital teaching strategies', 'Reflection and feedback', 'Professional discussion'],
      big: 'Watching others teach is half the learning. Take one idea from each microteach you see.',
      learn: [
        ['Watch like a teacher', 'As a peer, note the moment learning was checked, the moment attention dipped, and one move you could borrow. Write the feedback you would want to receive.'],
        ['If you have taught already', 'Reflect while it is fresh. Compare the feedback you were given with your own view. Where they differ is the interesting part.'],
        ['If you teach today', 'Use what you saw last week: what kept people active, and what lost them.']
      ],
      wrong: [['When I am not teaching, I am the audience.', 'You are a learner and an observer, and both give you evidence.']],
      ask: ['What should my written reflection on the microteach include?'],
      go: 'Borrow one move you saw in a peer’s microteach and use it in a lesson this week. Note how it went.',
      dist: 'Comparing your own teaching with a peer’s, and saying what you would and would not borrow and why, is analysis.' },
    { n: 17, d: '2027-01-20', k: 'Taught session', mins: 20, t: '', lo: [3, 4],
      title: 'Inequality in education',
      topics: ['Social justice', 'Bourdieu and habitus', 'Deprivation', 'Intersectionality', 'Educational disadvantage', 'Participation and attainment', 'Equity in education'],
      big: 'Unequal outcomes are not only about individual effort. They follow patterns of class, ethnicity, sex, disability and place, and education can widen or narrow them.',
      learn: [
        ['Bourdieu’s tools', 'Capital is what people can draw on: economic (money), social (who you know) and cultural (the knowledge, language and ways of behaving that institutions reward). Habitus is the set of expectations you absorb from your background. Field is the setting with its own rules, such as a college.'],
        ['How it plays out', 'When a college quietly rewards one kind of cultural capital, learners who have it look “bright” and others look “weak”. Bourdieu’s point is that inherited advantage then passes for merit.'],
        ['Intersectionality', 'Crenshaw’s term: disadvantages combine. A learner is not only working class, or only a woman, or only disabled. The combination can produce barriers that looking at one label at a time misses.'],
        ['Equity and social justice', 'Equality gives everyone the same. Equity gives each what they need to reach the same goal. A social justice view asks who the system works for, not what is wrong with the learner. That is the opposite of deficit thinking.']
      ],
      wrong: [['Disadvantage comes from low aspiration.', 'Studies often find high aspirations and unequal means to reach them.'], ['Treating everyone the same is fair.', 'The same treatment keeps unequal starting points in place.'], ['Bourdieu says working-class learners lack culture.', 'He says institutions value some culture over other culture.']],
      ask: ['How does inequality show up in engineering and in who chooses a T Level?', 'How do I use Bourdieu critically, and not as a label for my learners?', 'What data does the college hold on gaps in participation and achievement?'],
      check: [
        ['Cultural capital is…', ['Money available for trips', 'Knowledge, language and behaviours that institutions reward', 'The number of qualifications a college offers'], 1, 'It is the know-how that schools and colleges treat as ability.'],
        ['Intersectionality means…', ['Mixing topics in one lesson', 'Forms of disadvantage combine and cannot be understood one at a time', 'Teaching across departments'], 1, 'The combination matters, not each label on its own.'],
        ['Equity means…', ['Everyone gets the same', 'Each learner gets what they need to reach the same goal', 'Lower goals for some'], 1, 'The goal stays the same. The support differs.']
      ],
      go: 'Look at who chose your course and who succeeds on it, by sex, ethnicity and disability if you can. Note one pattern, and one thing in your own practice that might feed it.',
      dist: 'Apply a theory to your own curriculum and data, then turn on the theory: what does Bourdieu not explain, and what do his critics say?',
      cards: [['Name Bourdieu’s three forms of capital.', 'Economic, social and cultural.'], ['What is habitus?', 'The expectations a person absorbs from their background, which shape what feels natural or possible.'], ['What is intersectionality, and who named it?', 'The way forms of disadvantage combine. Kimberlé Crenshaw (1989).'], ['Equality or equity: which gives each learner what they need?', 'Equity.']],
      read: ['Bourdieu, P. (1986). The forms of capital. In J. Richardson (Ed.), Handbook of theory and research for the sociology of education (pp. 241–258). Greenwood.', 'Crenshaw, K. (1989). Demarginalizing the intersection of race and sex. University of Chicago Legal Forum, 1989(1), 139–167.', 'Reay, D. (2017). Miseducation: Inequality, education and the working classes. Policy Press.'] },
    { n: 18, d: '2027-01-27', k: 'Taught session', mins: 20, t: '', lo: [3],
      title: 'Creating equitable education: diversifying and decolonising the curriculum',
      topics: ['Decolonising the curriculum', 'Diversifying the curriculum', 'EEDI', 'Policy and practice', 'Representation', 'Inclusive curriculum design'],
      big: 'Diversifying adds missing voices to the curriculum. Decolonising goes further and asks why those voices were missing and whose knowledge counts.',
      learn: [
        ['Diversify', 'Diversifying widens the examples, people and sources learners meet, so that more of them can see themselves in the subject. In engineering that could be whose inventions, which countries’ projects and which workplaces appear in your materials.'],
        ['Decolonise', 'Decolonising asks deeper questions: how did this knowledge come to be the standard, who was left out or exploited, and what other ways of knowing exist? It is contested, and a critical account says so and weighs the arguments.'],
        ['Policy', 'The Equality Act 2010 names nine protected characteristics, and the public sector equality duty asks colleges to advance equality, not only to avoid discrimination. EEDI stands for equity, equality, diversity and inclusion.'],
        ['Practice', 'Start small and real: audit one unit for who appears and who does not, change examples and case studies, check images and names, invite learners’ own knowledge, and notice who speaks in your room.']
      ],
      wrong: [['Decolonising means removing content.', 'It usually means adding, questioning and setting in context.'], ['This does not apply to technical subjects.', 'Examples, histories, standards and who is shown as an engineer are all choices.'], ['Representation alone makes a curriculum inclusive.', 'Access, assessment and belonging matter as much.']],
      ask: ['What would decolonising look like in a technical curriculum?', 'How do I audit a unit for representation?', 'How do I handle disagreement about this in my team or classroom?'],
      check: [
        ['How many protected characteristics does the Equality Act 2010 name?', ['Five', 'Seven', 'Nine'], 2, 'Nine: age, disability, gender reassignment, marriage and civil partnership, pregnancy and maternity, race, religion or belief, sex, and sexual orientation.'],
        ['Compared with diversifying, decolonising…', ['Only adds new examples', 'Also questions how knowledge became the standard and whose it is', 'Applies only to history'], 1, 'Diversifying widens what is included. Decolonising also asks why it was narrow.']
      ],
      go: 'Audit one set of your slides: who is pictured, named or quoted? Change two examples so that more of your learners can see themselves in the subject.',
      dist: 'Go past representation: evaluate how your curriculum’s content, examples and assessment include or exclude, and use both supporters and critics of the ideas.',
      cards: [['Diversifying or decolonising: which asks whose knowledge counts, and why?', 'Decolonising. Diversifying widens the voices and examples included.'], ['What does the public sector equality duty ask of a college?', 'To eliminate discrimination, advance equality of opportunity and foster good relations.'], ['Name five of the nine protected characteristics.', 'Any five of: age, disability, gender reassignment, marriage and civil partnership, pregnancy and maternity, race, religion or belief, sex, sexual orientation.']],
      read: ['Equality Act 2010, section 149 (the public sector equality duty).', 'Arday, J., & Mirza, H. S. (Eds.). (2018). Dismantling race in higher education: Racism, whiteness and decolonising the academy. Palgrave Macmillan.'] },
    { n: 19, d: '2027-02-03', k: 'Workshop', mins: 10, t: 'standards', lo: [],
      title: 'Workshop: portfolios',
      topics: ['Portfolio development', 'Professional discussion preparation', 'Assignment support', 'Evidence mapping'],
      big: 'A portfolio is an argument that you meet the standard. Each piece of evidence needs a KSB and a sentence saying why it shows it.',
      learn: [
        ['Evidence mapping', 'Mapping means linking each piece of evidence to the knowledge, skills and behaviours it shows. One strong piece can cover several. Gaps on the map tell you what to collect next.'],
        ['Quality over quantity', 'Choose evidence that is real, recent and clearly yours, and add a short note saying what it shows. One lesson plan with your reflection beats ten plans with none.'],
        ['The professional discussion', 'In the discussion you talk through your evidence. Prepare by picking your best example for each duty, and practise saying what you did, why, and what changed for learners.'],
        ['Bring to the workshop', 'Your current map, your list of gaps, and two pieces of evidence you are unsure about.']
      ],
      wrong: [['More evidence is safer.', 'Evidence without an explanation is weak evidence.'], ['The portfolio is separate from Module 2.', 'Your change project is rich portfolio evidence.']],
      ask: ['Which of my gaps are most urgent?', 'Is this piece of evidence strong enough for the KSBs I have mapped it to?', 'How is the professional discussion structured?'],
      go: 'Map this week’s teaching: pick one lesson, tag the KSBs it shows on your Portfolio tab, and write two lines on why.',
      dist: 'The same critical habit applies here: do not only claim a KSB, weigh how well the evidence shows it.',
      cards: [['What is evidence mapping?', 'Linking each piece of evidence to the knowledge, skills and behaviours it shows.']] },
    { n: 20, d: '2027-02-10', k: 'Taught session', mins: 20, t: '', lo: [2, 3],
      title: 'Behaviour and difficult conversations',
      topics: ['Behaviour as communication', 'Complex learner behaviours', 'Restorative approaches', 'Professional conversations', 'Professional judgement', 'Behaviour in inclusive settings'],
      big: 'Behaviour tells you something. The skill is to hear what it says, keep the relationship, and still hold the line.',
      learn: [
        ['Behaviour as communication', 'Behaviour often signals something unmet: the work is too hard or too easy, something happened before the lesson, a need is not being met, or the learner is saving face. Asking “what is this telling me?” opens more options than “how do I stop this?”'],
        ['Prevent first', 'Clear routines, consistent expectations, good relationships and well-pitched work prevent most problems. Learners in further education respond to being treated as adults, with reasons given.'],
        ['Restorative approaches', 'A restorative conversation asks what happened, who was affected, and what needs to happen to put it right. It aims to repair harm and keep the learner in the group, and it still holds them responsible.'],
        ['Difficult conversations', 'Prepare the facts, choose a private place and a calm time, describe the behaviour and its effect without labelling the person, listen, agree a next step and record it. Know when to refer on: safeguarding and specialist needs are not yours to handle alone.']
      ],
      wrong: [['Restorative means no consequences.', 'It means consequences that repair, and the learner is still held responsible.'], ['Understanding behaviour means excusing it.', 'You can understand the cause and still hold the expectation.'], ['Behaviour is a school issue.', 'Learners of 16 to 19 and adults bring complex lives into college.']],
      ask: ['How do I hold a restorative conversation with a 17-year-old who does not want to talk?', 'Where is the line between my role and a referral?', 'How do I record a difficult conversation properly?'],
      check: [
        ['Seeing behaviour as communication means…', ['Ignoring poor behaviour', 'Asking what need or barrier the behaviour is signalling', 'Sending the learner out'], 1, 'You look for the cause, and you still hold the expectation.'],
        ['Which question belongs to a restorative conversation?', ['“Why are you always like this?”', '“Who was affected, and what needs to happen to put it right?”', '“Do you want to be removed from the course?”'], 1, 'Restorative questions look at harm and repair, not at labels or threats.']
      ],
      go: 'Before your next lesson with a group you find hard, pick one learner and plan one positive, private contact in the first five minutes. Note what changed.',
      dist: 'Connect behaviour to curriculum and pedagogy: what in your planning feeds it or prevents it? Weigh restorative practice against its critics and the evidence for it.',
      cards: [['What three questions shape a restorative conversation?', 'What happened? Who was affected? What needs to happen to put it right?'], ['What does “behaviour is communication” ask a teacher to do?', 'Look for the need or barrier the behaviour is signalling, while still holding the expectation.'], ['Give four steps for a difficult conversation.', 'Any four of: prepare the facts, choose a private and calm moment, describe the behaviour and its effect, listen, agree a next step, record it.']],
      read: ['Education Endowment Foundation. (2019). Improving behaviour in schools: Guidance report.', 'Bennett, T. (2017). Creating a culture: How school leaders can optimise behaviour. Department for Education.'] },
    { n: 21, d: '2027-02-24', k: 'Guest speaker', mins: 20, t: '', lo: [3],
      title: 'Trauma-informed practice',
      topics: ['Trauma-informed education', 'Adverse experiences and learning', 'Emotional safety', 'Relational practice', 'Inclusive support strategies'],
      big: 'Trauma-informed practice asks “what happened to you?” before “what is wrong with you?”, and builds safety so that learning can happen.',
      learn: [
        ['Adverse experiences', 'Adverse childhood experiences (ACEs) include abuse, neglect and serious difficulty at home. The first ACE study linked more of them to worse health in adult life. Many learners in further education carry such experiences, and you will not always know who.'],
        ['What stress does to learning', 'A learner who feels under threat is busy staying safe: watchful, quick to react, or shut down. Attention and memory suffer. What looks like defiance or laziness can be a stress response.'],
        ['What helps', 'Predictable routines, calm and consistent adults, choice where possible, warning before changes, and a way to step out and come back. Widely used principles include safety, trust, choice, collaboration and empowerment.'],
        ['Your limits', 'You are a teacher, not a therapist. Your job is a safe room, a steady relationship and a prompt referral. Follow safeguarding procedures, and look after yourself: hearing hard stories has a cost.']
      ],
      wrong: [['Trauma-informed means lowering expectations.', 'It means high expectations with high support.'], ['I need to know each learner’s history.', 'The approach works for everyone without anyone having to tell you.'], ['An ACE score predicts an individual’s future.', 'The research shows risk across a population, not fate for a person.']],
      ask: ['What does trauma-informed practice look like in a workshop with safety rules?', 'How do I respond in the moment when a learner shuts down or flares up?', 'What support is there for staff?'],
      check: [
        ['A trauma-informed teacher’s first aim is…', ['To find out what happened to each learner', 'To make the room feel safe and predictable', 'To avoid all challenge'], 1, 'Safety comes first. Nobody has to disclose anything for it to work.'],
        ['ACE research is best used to understand…', ['Exactly how one learner will turn out', 'Patterns of risk across a population', 'Which learners to exclude'], 1, 'It describes groups, not the future of any one person.']
      ],
      go: 'Add one predictable routine to the start of your lessons this week, and tell learners in advance about any change to the usual plan.',
      dist: 'Evaluate, do not only adopt: the evidence for trauma-informed approaches in education is still developing, and critics warn about labelling. Say what you can and cannot claim.',
      cards: [['What question sums up a trauma-informed approach?', '“What happened to you?” instead of “What is wrong with you?”'], ['What are ACEs?', 'Adverse childhood experiences such as abuse, neglect and serious difficulty at home, linked across populations to worse later outcomes.'], ['Name three things that build emotional safety in a classroom.', 'Any three of: predictable routines, calm consistent adults, choice, warning of changes, a way to step out and return.']],
      read: ['Felitti, V. J., Anda, R. F., Nordenberg, D., et al. (1998). Relationship of childhood abuse and household dysfunction to many of the leading causes of death in adults. American Journal of Preventive Medicine, 14(4), 245–258.', 'Substance Abuse and Mental Health Services Administration. (2014). SAMHSA’s concept of trauma and guidance for a trauma-informed approach.'] },
    { n: 22, d: '2027-03-03', k: 'Guest speaker', mins: 20, t: 'adaptive', lo: [2, 3],
      title: 'Working effectively with SEND support practitioners',
      topics: ['Roles and responsibilities', 'Building effective partnerships', 'Support versus dependence', 'Communication', 'Challenges', 'Person-centred practice'],
      big: 'A support practitioner is a colleague, not a spare pair of hands. The lesson works best when you plan together and the learner does the thinking.',
      learn: [
        ['Who does what', 'You remain responsible for every learner’s learning. Support staff add to your teaching. They do not replace it. Learners with the greatest needs should get at least as much of the teacher’s time as anyone else.'],
        ['Support, not dependence', 'Research on teaching assistants found that poorly directed support can reduce progress, because the helper does the task or the learner waits for help. Good support gives the least help first: wait, prompt, clue, model, and only then show.'],
        ['Communicate', 'Share the plan before the lesson: the goal, the key words, where the learner may struggle, and what you would like the supporter to do. Ask for their observations afterwards. A two-minute handover is better than none.'],
        ['Person-centred', 'A plan such as an education, health and care plan (EHCP) sets out outcomes the learner and family helped choose. Person-centred practice means the learner has a say in how they are supported, and is spoken to, not about.']
      ],
      wrong: [['The support worker looks after “their” learner.', 'The teacher stays responsible for that learner’s learning.'], ['More help means more learning.', 'Too much help builds dependence. Least help first.'], ['There is no time to plan together.', 'Two minutes and a shared note change the lesson.']],
      ask: ['What can I ask a support practitioner to do, and what must stay with me?', 'How do I share plans when we have no time together?', 'How do I reduce a learner’s dependence without taking support away?'],
      check: [

    { n: 23, d: '2027-03-10', k: 'Taught session', mins: 20, t: 'adaptive', lo: [2, 3],

    { n: 24, d: '2027-03-17', k: 'Educational visit or independent study', mins: 20, t: '', lo: [1, 3],
      title: 'Embedding Education for Sustainable Development (ESD)',
      topics: ['Sustainability', 'Education for Sustainable Development', 'Green skills', 'Ethical practice', 'Subject-specific sustainability', 'Global and local challenges'],
      big: 'Education for Sustainable Development means learners leave able to do their job in a way that does not cost the future.',
      learn: [
        ['What it is', 'Sustainable development meets today’s needs without stopping future generations meeting theirs. It has three linked sides: environmental, social and economic. UNESCO’s Education for Sustainable Development asks every subject to build the knowledge, skills and values for it.'],
        ['Green skills', 'Every occupation is changing. In engineering that means energy efficiency, low-carbon technologies, choice of materials, waste, repair and whole-life cost. Green skills are becoming ordinary job skills.'],
        ['Embed, do not bolt on', 'A one-off “green week” teaches little. Embedding means sustainability shows up inside normal tasks: the material you choose in a design brief, the energy calculation, the disposal step in a method statement.'],
        ['Local and global', 'The United Nations’ 17 Sustainable Development Goals give a shared map. Local examples make it real: a nearby employer’s net-zero plan, or the college’s own energy use. Ethical practice includes being honest about trade-offs.']
      ],
      wrong: [['Sustainability is about recycling.', 'It covers environment, society and economy together.'], ['It is an extra topic to fit in.', 'It belongs inside the tasks you already teach.'], ['It does not apply to my subject.', 'Every occupation’s practice is changing.']],
      ask: ['Where does sustainability already sit in my specification?', 'Which local employers could give a real example?', 'How do I evidence ESD for my portfolio?'],
      check: [
        ['The three sides of sustainable development are…', ['Environmental, social, economic', 'Local, national, global', 'Reduce, reuse, recycle'], 0, 'Environment, society and economy, taken together.'],
        ['Embedding ESD means…', ['One special sustainability day a year', 'Sustainability built into ordinary subject tasks', 'A poster in the workshop'], 1, 'It shows up inside the work learners already do.']
      ],
      go: 'Add one sustainability decision to a task you already set, such as a choice of material with a reason, and ask learners to justify it.',
      dist: 'Treat ESD as a curriculum question: what your specification includes and leaves out, what you added, and how learners responded.',

  const M2_BY = {};
  M2.forEach((w) => { M2_BY[w.n] = w; });

  const LESSONS = {
    retrieval: { sum: 'Retrieval practice means learners pull information out of memory rather than reading it again. A short low-stakes quiz at the start of a lesson is the classic form. Mixing in questions from two or three weeks ago adds spacing, which makes the learning last.', steps: [['The problem', 'Your Electrical group forgot Ohm’s law rearrangements a fortnight after the unit.'], ['Plan the round', 'Five questions: two from last lesson, two from two weeks ago, one from a month ago. At least one asks learners to explain or apply.'], ['Run it low-stakes', 'Five minutes, no names, answers on mini whiteboards, check straight away.'], ['Act on it', 'Note the most-missed question and reteach that step before moving on.'], ['Check later', 'Bring the same idea back in three weeks and compare scores with the first attempt.']] },
    memory: { sum: 'Working memory holds only a few new things at once. Break new material into steps, remove anything that distracts, and use worked examples before asking learners to solve problems alone. Pair words with a clear diagram so learners have two routes back to the idea.', steps: [['The problem', 'Learners struggle to calculate the moment of a force from a wordy question.'], ['Reduce the load', 'Show one labelled diagram and one fully worked example, nothing else on the slide.'], ['Fade the help', 'Second example with blanks to fill, then a third on their own.'], ['Check', 'Ask one learner to explain the step most people get wrong.']] },
    change: { sum: 'Lewin describes change in three stages. Unfreeze: show why the current way is not working and loosen old habits. Change: introduce the new practice with support. Refreeze: build it into routines so it lasts. A force field analysis helps you see what pushes the change forward and what holds it back.', steps: [['Unfreeze', 'Share the baseline: scores on questions from September were low when they came back in November.'], ['Change', 'Introduce weekly retrieval rounds with returning questions in both groups.'], ['Refreeze', 'Write the rounds into the scheme of learning and share the template with your colleague.'], ['Forces', 'Driving: better recall, learner feedback. Restraining: lesson time, absence. Plan for each.']] },
    adaptive: { sum: 'Adaptive teaching keeps the same ambitious goal for everyone and adjusts support during the lesson: scaffolds, questioning, grouping, resources. The SEND Code of Practice (2015) covers ages 0 to 25 and uses a graduated approach: assess, plan, do, review. Check support plans and EHC plans before you plan, not after.', steps: [['Start from the plan', 'Read support plans: who needs enlarged text, extra time or a reader?'], ['Same goal', 'Everyone will wire and test the circuit.'], ['Adjust support', 'Step cards for those who need them, extension questions for those who finish early.'], ['Review', 'After the lesson, note what worked for each learner and update the plan.']] },
    afl: { sum: 'Assessment for learning is assessment that changes the next step in teaching. Use hinge questions at key points, check the whole group (mini whiteboards, cards), and give feedback that tells learners what to do next. Ipsative feedback compares a learner with their own earlier work.', steps: [['Hinge question', 'Before moving on from series circuits, ask one multiple-choice question with tempting wrong answers.'], ['Read the room', 'All learners show an answer at once.'], ['Decide', 'If fewer than about four in five are right, reteach the step instead of moving on.'], ['Feed forward', 'Give each learner one thing to do in the next practical.']] },
    agency: { sum: 'Learner agency is learners taking ownership: setting goals, choosing strategies and checking their own progress. Build it with clear success criteria, self-check lists and choices within a structure, then fade the support as habits form.', steps: [['Make criteria visible', 'Share what a good test report looks like.'], ['Self-check', 'Learners tick a checklist before handing in.'], ['Choice', 'Offer two ways to show understanding: a labelled diagram or a short explanation.'], ['Fade', 'Remove the checklist once most learners use it without prompting.']] },
    ofsted: { sum: 'From November 2025 Ofsted inspects FE providers with report cards: each evaluation area gets one of five grades, from urgent improvement to exceptional. FE initial teacher education is mapped to the Learning and Skills Teacher occupational standard, which is what your portfolio evidences.', steps: [['Know the scale', 'Exceptional, strong standard, expected standard, needs attention, urgent improvement.'], ['Link to your practice', 'Curriculum and teaching, inclusion and achievement all show in your lessons.'], ['Evidence it', 'Tag lesson evidence to the KSBs it shows in your portfolio.']] },
    standards: { sum: 'Your portfolio is assessed against the Learning and Skills Teacher occupational standard: 20 knowledge, 25 skills and 6 behaviours, grouped under nine duties. One piece of evidence can cover several KSBs. The professional discussion asks for one story or answer per duty.', steps: [['Pick evidence', 'Your Obs 4 lesson plan and feedback.'], ['Tag it', 'K5 (inclusive strategies), S4 (variety of methods), S11 (ongoing feedback).'], ['Link to a duty', 'Duty 4: evidence-informed teaching, assessment and safe use of technology.'], ['Upload', 'Upload to the portfolio and note it in the evidence log.']] },
    reflect: { sum: 'Reflection turns experience into better practice. Gibbs: description, feelings, evaluation, analysis, conclusion, action plan. Brookfield adds four lenses: your own, your learners’, colleagues’ and the literature. A good observation reflection argues with the feedback a little and ends with one concrete action.', steps: [['Describe briefly', 'What happened in two sentences.'], ['Use a second lens', 'What did learners or your mentor see that you did not?'], ['Analyse with a source', 'Link one point to a reading.'], ['Action', 'One specific change for the next lesson.']] },
    vacsr: { sum: 'Every assessment decision rests on evidence that is valid (measures the right thing), authentic (the learner’s own), current (shows what they can do now), sufficient (enough to cover the criteria) and reliable (the same decision whoever assesses it).', steps: [['Check valid', 'Does the task match the criterion?'], ['Check authentic', 'Did you see it, or can you confirm it is theirs?'], ['Check current', 'Is it recent and against the current standard?'], ['Check sufficient', 'Is every criterion covered?'], ['Check reliable', 'Would a colleague reach the same decision?']] },
    methods: { sum: 'Choose methods to suit the criteria and the learner: observation for practical competence, questioning to check knowledge, products, witness testimony, professional discussion, and recognition of prior learning so nothing is assessed twice.', steps: [['Match the method', 'Practical skill: observe it. Knowledge: question it.'], ['Consider the learner', 'Oral questioning instead of written for a learner with dyslexia, where allowed.'], ['Use RPL', 'Credit what they can already show.']] },
    planning: { sum: 'Plan assessment with the learner: what, how, when, where and who. Look for holistic opportunities where one activity covers several criteria, and think about risks such as unfairness, overload or plagiarism.', steps: [['Agree the plan', 'With the learner and employer.'], ['Go holistic', 'One observed task that covers three criteria.'], ['Spot risks', 'Time pressure, a noisy workshop, a learner who copies. Plan for each.']] },
    involve: { sum: 'Involving learners and others (employers, colleagues) makes assessment fairer and more meaningful. Learners need the criteria, the plan and the appeals process. Peer and self-assessment build responsibility, and reasonable adjustments let everyone show what they can do against the same standard.', steps: [['Share information', 'Criteria, dates, how decisions are made, how to appeal.'], ['Self-assess first', 'Learner judges their own work against the criteria.'], ['Adjust', 'Extra time or a reader where needed, same standard.']] },
    decisions: { sum: 'Make decisions only against the specified criteria, using VACSR evidence. If the evidence falls short, say so clearly, explain why and agree what is needed next. Record the decision and the feedback.', steps: [['Judge', 'Compare evidence with each criterion.'], ['Decide', 'Met, or not yet met.'], ['Feed back', 'What was good, what is missing, what to do next.'], ['Record', 'Sign and date with the learner.']] },
    qa: { sum: 'Quality assurance keeps decisions consistent and fair. Internal QA samples decisions and observes assessors; standardisation meetings compare judgements on the same evidence; external QA comes from the awarding organisation. Disputes go through the centre’s appeals procedure.', steps: [['Standardise', 'Bring one assessed piece to the meeting.'], ['Compare', 'Would others reach the same decision?'], ['Act', 'Note what you will change.']] },
    records: { sum: 'Assessment information must be accurate, signed and dated, and stored securely, because it is the audit trail for quality assurance and it holds personal data. Questioning and feedback are part of assessment too: questions check the knowledge behind a performance, and feedback tells the learner where they stand.', steps: [['Record', 'Plan, evidence, decision, feedback.'], ['Store', 'In the approved system, not on a personal device.'], ['Question', 'Note the question, the answer and your judgement.']] },
    law: { sum: 'Assessment sits inside the law and policy: the Equality Act 2010 (including reasonable adjustments), health and safety, safeguarding, and data protection (UK GDPR and the Data Protection Act 2018). Technology can help (online portfolios, Forms, video), and reflective practice and CPD keep assessors current.', steps: [['Equality', 'Plan adjustments before the assessment.'], ['Safety', 'Risk assess practical assessments.'], ['Data', 'Share records only with those who need them.'], ['CPD', 'Log what you have done to stay current.']] }
  };

  /* ---------- Home ---------- */
  V.home = () => {
    const today = todayKey();

    let html = '';

      html += `<div class="card ready tap" data-go="progress">
