<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cap and Gown Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ff8a3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Lexend:wght@400;700&display=swap">
<style>
/* Layout: phone-first single column. A colourful hero band carries the cap and tonight's work,
   the plan reads as a diary of weekday evenings, and a fixed tab bar sits at the bottom. */
:root {
  --bg: #f4f5fa;
  --surface: #ffffff;
  --surface-2: #eceef6;
  --ink: #18213d;
  --muted: #586180;
  --line: #dadff0;
  --pgce: #d9364f;
  --pgce-soft: rgba(217, 54, 79, 0.12);
  --assess: #0b8f7d;
  --assess-soft: rgba(11, 143, 125, 0.13);
  --other: #6b5bd2;
  --other-soft: rgba(107, 91, 210, 0.13);
  --ok: #1f8a4c;
  --warn: #b45309;
  --warn-soft: rgba(217, 119, 6, 0.14);
  --danger: #c62c45;
  --danger-soft: rgba(198, 44, 69, 0.12);
  --review: #a35a00;
  --review-soft: rgba(196, 110, 0, 0.13);

  /* Set by the theme picker in app.js */
  --hero-a: #ffc23d;
  --hero-b: #ff6a4d;
  --on-hero: #18213d;
  --cap-board: #18213d;
  --tassel: #ffe066;
  --accent: #ff7a2f;
  --accent-ink-l: #a34400;
  --accent-ink-d: #ffb37d;
  --accent-ink: var(--accent-ink-l);
  --accent-soft: rgba(255, 122, 47, 0.14);
  --on-accent: #18213d;

  --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --radius: 16px;
  --tabbar-h: 4.25rem;
  --scale: 1;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-mode="light"]) {
    --bg: #0e1222;
    --surface: #161c31;
    --surface-2: #1e2640;
    --ink: #eef0fa;
    --muted: #a5adc8;
    --line: #2a3352;
    --pgce: #ff6b81;
    --pgce-soft: rgba(255, 107, 129, 0.16);
    --assess: #3dd6bf;
    --assess-soft: rgba(61, 214, 191, 0.15);
    --other: #a99bff;
    --other-soft: rgba(169, 155, 255, 0.16);
    --ok: #4ade80;
    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.14);
    --danger: #ff7389;
    --danger-soft: rgba(255, 115, 137, 0.14);
    --review: #ffb454;
    --review-soft: rgba(255, 180, 84, 0.15);
    --accent-ink: var(--accent-ink-d);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-mode="light"]),
:root[data-mode="dark"] {
  --bg: #0e1222;
  --surface: #161c31;
  --surface-2: #1e2640;
  --ink: #eef0fa;
  --muted: #a5adc8;
  --line: #2a3352;
  --pgce: #ff6b81;
  --pgce-soft: rgba(255, 107, 129, 0.16);
  --assess: #3dd6bf;
  --assess-soft: rgba(61, 214, 191, 0.15);
  --other: #a99bff;
  --other-soft: rgba(169, 155, 255, 0.16);
  --ok: #4ade80;
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.14);
  --danger: #ff7389;
  --danger-soft: rgba(255, 115, 137, 0.14);
  --review: #ffb454;
  --review-soft: rgba(255, 180, 84, 0.15);
  --accent-ink: var(--accent-ink-d);
  color-scheme: dark;
}

html {
  font-size: calc(100% * var(--scale));
  -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body.font-lexend { --font-body: "Lexend", "Segoe UI", Roboto, system-ui, sans-serif; }
body.font-system { --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

h1, h2, h3 {
  font-family: var(--font-display);
  line-height: 1.15;
  margin: 0;
  text-wrap: balance;
  letter-spacing: -0.01em;
}
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap {
  max-width: 46rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* App shell (Studypath layout in Cap and Gown colours): a top bar for each screen,
   one scrolling screen and a five-tab bar. Home's top bar is the colourful hero with the cap. */
html, body { height: 100%; }
body { overflow: hidden; }
.app {
  position: relative;
  height: 100%;
  max-width: 46rem;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.appbar {
  flex: none;
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  min-height: 3.75rem;
  padding: 0.6rem max(16px, env(safe-area-inset-right, 0px)) 0.65rem max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.appbar h2 { flex: 1; min-width: 0; font-size: 1.25rem; font-weight: 800; }
.appbar .sub { display: block; font-family: var(--font-body); font-size: 0.8rem; font-weight: 700; color: var(--muted); letter-spacing: 0; margin-top: 0.15rem; }
.appbar .btn.small { min-height: 2.4rem; }
.appbar.hero {
  background:
    linear-gradient(120deg, transparent 0 62%, rgba(255, 255, 255, 0.16) 62% 68%, transparent 68%),
    linear-gradient(135deg, var(--hero-a), var(--hero-b));
  color: var(--on-hero);
  border-bottom: 0;
  border-radius: 0 0 24px 24px;
  padding-block: 0.9rem 1.05rem;
}
.appbar.hero h2 { font-size: 1.4rem; }
.appbar.hero .sub { color: inherit; opacity: 0.88; }
.iconbtn {
  width: 2.5rem;
  height: 2.5rem;
  flex: none;
  position: relative;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 12px;
  background: var(--surface-2);
  color: var(--ink);
  cursor: pointer;
}
.iconbtn svg { width: 1.2rem; height: 1.2rem; }
.appbar.hero .iconbtn { background: rgba(255, 255, 255, 0.3); color: var(--on-hero); }
.iconbtn .dot { position: absolute; top: 6px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }
.screen {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
.inner {
  display: grid;
  gap: 1rem;
  padding: 1rem max(16px, env(safe-area-inset-right, 0px)) 1.75rem max(16px, env(safe-area-inset-left, 0px));
}
body[data-route="chat"] .screen { overflow: hidden; }
.cap {
  width: 2.2rem;
  height: 2.2rem;
  flex: none;
  transform-origin: 50% 80%;
}
.appbar.hero .cap { width: 3.4rem; height: 3.4rem; }
.cap .board { fill: var(--cap-board); }
.cap .edge { fill: var(--cap-board); opacity: 0.75; }
.cap .tassel { fill: var(--tassel); }
.cap .cord { stroke: var(--tassel); }
.cap .tassel-group { transform-origin: 404px 252px; animation: swing 2.8s ease-in-out 0.3s 2; }
.cap.toss { animation: toss 1.1s cubic-bezier(.3,.7,.4,1); }
@keyframes swing { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(9deg); } 65% { transform: rotate(-6deg); } }
@keyframes toss { 0% { transform: translateY(0) rotate(0); } 45% { transform: translateY(-2.2rem) rotate(-200deg); } 100% { transform: translateY(0) rotate(-360deg); } }
@media (prefers-reduced-motion: reduce) {
  .cap .tassel-group, .cap.toss { animation: none; }
  * { scroll-behavior: auto !important; transition: none !important; }
}
.sync-pill {
  display: inline-block;
  margin-top: 0.35rem;
  font-family: var(--font-body);
  font-size: 0.66rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.3);
  white-space: nowrap;
}
.sync-pill:empty { display: none; }
.tonight-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.eyebrow {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  color: var(--muted);
}
.tonight-head .mins { font-family: var(--font-display); font-weight: 700; color: var(--accent-ink); }

.section { display: grid; gap: 0.65rem; }
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.section-head .hint { font-size: 0.85rem; color: var(--muted); }

/* Course chips and filter */
.chips { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.chip {
  border: 1.5px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 0.35rem 0.85rem;
  font-size: 0.9rem;
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.12rem 0.5rem;
  border-radius: 999px;
  white-space: nowrap;
}
.tag.pgce { background: var(--pgce-soft); color: var(--pgce); }
.tag.assess { background: var(--assess-soft); color: var(--assess); }
.tag.other { background: var(--other-soft); color: var(--other); }
.tag.status-check, .tag.status-estimate { background: var(--warn-soft); color: var(--warn); }
.tag.status-target { background: var(--accent-soft); color: var(--accent-ink); }
.tag.status-confirmed { background: var(--surface-2); color: var(--muted); }
.tag.late { background: var(--danger-soft); color: var(--danger); }

/* A step row */
.steps { display: grid; gap: 0.5rem; list-style: none; margin: 0; padding: 0; }
.step {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 0.7rem;
  align-items: start;
  padding: 0.7rem 0.75rem;
  background: var(--surface);
  border-radius: 12px;
  border-left: 4px solid var(--c, var(--line));
}
.step.pgce { --c: var(--pgce); }
.step.assess { --c: var(--assess); }
.step.other { --c: var(--other); }
.card .step, .deadline .step { background: var(--surface-2); }
.step.is-done .step-title { text-decoration: line-through; color: var(--muted); }
.step-body { min-width: 0; display: grid; gap: 0.2rem; }
.step-title { font-weight: 700; }
.step-meta { font-size: 0.85rem; color: var(--muted); display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
.step-tip { font-size: 0.88rem; color: var(--muted); }
.step-for { font-size: 0.85rem; color: var(--muted); font-style: italic; }
.step-actions { display: flex; gap: 0.35rem; align-items: center; }

.tick {
  appearance: none;
  -webkit-appearance: none;
  width: 1.7rem;
  height: 1.7rem;
  margin: 0;
  border-radius: 50%;
  border: 2px solid var(--c, var(--muted));
  background: transparent;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background 0.15s;
}
.tick:checked { background: var(--c, var(--ok)); }
.tick:checked::after {
  content: "";
  width: 0.45rem;
  height: 0.8rem;
  border: solid var(--surface);
  border-width: 0 3px 3px 0;
  transform: translateY(-1px) rotate(45deg);
}

.icon-btn {
  width: 2.2rem;
  height: 2.2rem;
  display: inline-grid;
  place-items: center;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  text-decoration: none;
  flex: none;
}
.icon-btn svg { width: 1.15rem; height: 1.15rem; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  min-height: 2.75rem;
  padding: 0.55rem 1rem;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--surface);
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  color: var(--ink);
}
.btn svg { width: 1.1rem; height: 1.1rem; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { min-height: 2.2rem; padding: 0.35rem 0.75rem; font-size: 0.88rem; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }

/* Deadlines */
.deadline {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 1rem;
  display: grid;
  gap: 0.6rem;
  border-top: 5px solid var(--c, var(--line));
}
.deadline.pgce { --c: var(--pgce); }
.deadline.assess { --c: var(--assess); }
.deadline.other { --c: var(--other); }
.deadline-top { display: flex; justify-content: space-between; gap: 0.75rem; align-items: start; }
.deadline-top > div { min-width: 0; }
.due-box { text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.due-box .big { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; line-height: 1; }
.due-box .small { font-size: 0.78rem; color: var(--muted); }
.deadline .how { font-size: 0.9rem; color: var(--muted); }
.deadline .note { font-size: 0.88rem; background: var(--surface-2); border-radius: 10px; padding: 0.5rem 0.7rem; }
.bar { height: 0.55rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--c, var(--accent)); }
.bar-label { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
details > summary { cursor: pointer; font-weight: 700; color: var(--accent-ink); list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; }
details[open] > summary::before { content: "– "; }
details .steps { margin-top: 0.6rem; }

/* Plan: weeks and days */
.week { display: grid; gap: 0.6rem; }
.week-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 2px solid var(--line);
  padding-bottom: 0.35rem;
  gap: 0.5rem;
}
.week-head .load { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.day { display: grid; grid-template-columns: 3.4rem 1fr; gap: 0.6rem; scroll-margin-top: 0.75rem; }
.day.flash { animation: flash 1.6s ease; border-radius: 12px; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
.day-date { text-align: center; padding-top: 0.35rem; }
.day-date .dow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.day-date .num { font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; line-height: 1.05; }
.day.is-today .day-date .num { color: var(--accent-ink); }
.day.is-today .day-date .dow { color: var(--accent-ink); }
.day-items { display: grid; gap: 0.45rem; min-width: 0; }
.milestone {
  display: flex;
  gap: 0.5rem;
  align-items: center;
  flex-wrap: wrap;
  padding: 0.55rem 0.75rem;
  border-radius: 12px;
  border: 2px dashed var(--c, var(--line));
  font-weight: 700;
}
.milestone.pgce { --c: var(--pgce); }
.milestone.assess { --c: var(--assess); }
.milestone.other { --c: var(--other); }
.milestone .flag { color: var(--c); }

/* Week strip on the Today view */
.strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; }
.strip-day {
  background: var(--surface-2);
  border-radius: 12px;
  padding: 0.5rem 0.3rem;
  text-align: center;
  display: grid;
  gap: 0.25rem;
  border: 2px solid transparent;
}
.strip-day.is-today { border-color: var(--accent); }
.strip-day .dow { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.strip-day .m { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.dots { display: flex; justify-content: center; gap: 3px; min-height: 8px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.dots i.pgce { --c: var(--pgce); }
.dots i.assess { --c: var(--assess); }
.dots i.other { --c: var(--other); }
.dots i.done { opacity: 0.3; }

.empty {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 1rem;
  color: var(--muted);
}
.callout {
  background: var(--warn-soft);
  border-radius: 12px;
  padding: 0.75rem 0.9rem;
  font-size: 0.92rem;
}

/* Forms and settings */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 1rem;
  display: grid;
  gap: 0.9rem;
}
.field { display: grid; gap: 0.35rem; }
.field label, .field .label { font-weight: 700; font-size: 0.95rem; }
.field .help { font-size: 0.85rem; color: var(--muted); }
.field input[type="url"], .field input[type="text"], .field input[type="date"], .field input[type="time"], .field input[type="number"], .field select, .field textarea {
  width: 100%;
  min-height: 2.75rem;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--bg);
  padding: 0.5rem 0.7rem;
}
.field textarea { min-height: 5rem; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.two > * { min-width: 0; }
@media (max-width: 380px) { .two { grid-template-columns: 1fr; } }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button {
  flex: 1;
  border: 0;
  background: var(--surface);
  padding: 0.55rem 0.4rem;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.9rem;
}
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr)); gap: 0.5rem; }
.swatch {
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 0.35rem;
  background: var(--surface);
  cursor: pointer;
  display: grid;
  gap: 0.3rem;
  font-size: 0.75rem;
  font-weight: 700;
  text-align: center;
}
.swatch span.paint { display: block; height: 2.2rem; border-radius: 8px; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
.range-row { display: flex; align-items: center; gap: 0.75rem; }
.range-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.range-row output { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 3.2rem; text-align: right; }
.preview-text { background: var(--surface-2); border-radius: 10px; padding: 0.6rem 0.8rem; }
.colour-input { display: flex; gap: 0.6rem; align-items: center; }
.colour-input input[type="color"] { width: 3rem; height: 2.6rem; border: 0; background: none; padding: 0; cursor: pointer; }
ol.howto { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.35rem; font-size: 0.95rem; }
.small-print { font-size: 0.85rem; color: var(--muted); }
.confirm-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; background: var(--danger-soft); padding: 0.6rem; border-radius: 10px; }

/* Bottom tab bar */
.tabbar {
  flex: none;
  position: relative;
  z-index: 3;
  background: var(--surface);

nd how decisions stay valid, reliable and fair."}, {"id": "as-o36-4", "date": "2026-11-05", "mins": 35, "title": "Outcome 6: quality assurance", "tip": "Why QA matters, how standardisation works where you are, and what happens if a learner disputes a decision."}, {"id": "as-o36-5", "date": "2026-11-06", "mins": 25, "title": "Read through 3 to 6 and email Andrea", "tip": "Check every question number has an answer. Send it before the weekend."}]}, {"id": "pg-tp", "course": "pgce", "kind": "target", "title": "Alternative placement reflection (TotalPeople) in PebblePad", "due": "2026-11-20", "status": "target", "how": "Upload to PebblePad", "note": "Carried over from Year 1. The date is your own target, not a university deadline.", "chunks": [{"id": "pg-tp-1", "date": "2026-11-17", "mins": 20, "title": "Rough notes from the placement", "tip": "What you saw, what surprised you, one thing you would take into your own lessons."}, {"id": "pg-tp-2", "date": "2026-11-19", "mins": 30, "title": "Write the reflection", "tip": "Your notebook pages from the visit are a good starting point."}, {"id": "pg-tp-3", "date": "2026-11-20", "mins": 15, "title": "Map to the OS and upload to PebblePad"}]}, {"id": "as-l1u1", "course": "assess", "kind": "submission", "title": "Assessment records for learner 1 (one whole unit)", "due": "2026-11-30", "status": "confirmed", "how": "Email to Andrea", "chunks": [{"id": "as-l1u1-1", "date": "2026-11-16", "mins": 20, "title": "List the unit criteria and the evidence you already hold", "tip": "Three columns: criterion, evidence, where it is. The gaps tell you what to do next."}, {"id": "as-l1u1-2", "date": "2026-11-18", "mins": 30, "title": "Gather the assessment plan and observation records"}, {"id": "as-l1u1-3", "date": "2026-11-23", "mins": 40, "title": "Write up missing records and Q&A", "tip": "Questioning records count. Note the question, the answer and your judgement."}, {"id": "as-l1u1-4", "date": "2026-11-25", "mins": 30, "title": "Feedback and sign-off check", "tip": "Each decision needs feedback to the learner. Every record signed and dated by both of you."}, {"id": "as-l1u1-5", "date": "2026-11-27", "mins": 15, "title": "Final check, then email the records"}]}, {"id": "pg-osr", "course": "pgce", "kind": "target", "title": "OS professional discussion 2: reflection and portfolio updates", "due": "2026-12-11", "status": "target", "how": "PebblePad", "note": "Your tutor recommended portfolio updates after the second formative discussion. The date is your own target.", "chunks": [{"id": "pg-osr-1", "date": "2026-11-24", "mins": 20, "title": "List what came out of the discussion", "tip": "Include each update your tutor asked for, so nothing gets missed."}, {"id": "pg-osr-2", "date": "2026-11-26", "mins": 30, "title": "Write the reflection"}, {"id": "pg-osr-3", "date": "2026-12-08", "mins": 30, "title": "Portfolio updates, first half"}, {"id": "pg-osr-4", "date": "2026-12-10", "mins": 30, "title": "Portfolio updates, second half, and check the OS mapping"}, {"id": "pg-osr-5", "date": "2026-12-11", "mins": 15, "title": "Upload to PebblePad"}]}, {"id": "as-o78", "course": "assess", "kind": "submission", "title": "Workbook outcomes 7 and 8 (7.1, 7.2, 8.1 to 8.4)", "due": "2026-12-07", "status": "confirmed", "how": "Email to Andrea", "chunks": [{"id": "as-o78-1", "date": "2026-11-30", "mins": 30, "title": "Answer Q7.1", "tip": "Managing assessment information: why the procedures matter (records, storage, data protection)."}, {"id": "as-o78-2", "date": "2026-12-01", "mins": 30, "title": "Answer Q7.2", "tip": "How feedback and questioning feed into assessment. One real example from learner 1 works well."}, {"id": "as-o78-3", "date": "2026-12-02", "mins": 45, "title": "Answer Q8.1 and Q8.2", "tip": "Legal issues and policies (confidentiality, health and safety, welfare), then how technology helps, such as Teams, Forms and your tracker."}, {"id": "as-o78-4", "date": "2026-12-03", "mins": 45, "title": "Answer Q8.3 a <script>

  /* ---------- small helpers ---------- */
  const $ = (sel, root = document) => root.querySelector(sel);

    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  // Dates are handled as 'YYYY-MM-DD' keys in local time.
  const now = () => (window.__NOW ? new Date(window.__NOW) : new Date());
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => keyOf(now());
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const dow = (k) => parseKey(k).getDay();
  const isWeekday = (k) => { const w = dow(k); return w >= 1 && w <= 5; };
  const mondayOf = (k) => { const w = dow(k); return addDays(k, w === 0 ? -6 : 1 - w); };

  const mins = (m) => (m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}` : `${m} min`);
  const prevWeekday = (k) => { let d = k; while (!isWeekday(d)) d = addDays(d, -1); return d; };
  const nextWeekday = (k) => { let d = k; while (!isWeekday(d)) d = addDays(d, 1); return d; };
  const minusWorkingDays = (k, n) => { let d = k; let left = n; while (left > 0) { d = addDays(d, -1); if (isWeekday(d)) left--; } return d; };

  /* ---------- state and saving ---------- */
  function freshState() {

      v: 1, updatedAt: 0, done: {}, moved: {}, due: {}, hidden: {}, custom: [], reviews: {}, portfolio: freshPortfolio(), settings: { ...DEFAULT_SETTINGS },
      // version 2: energy by date, the change log, evening limits set by reflections, reflections by week, missed dates by step
      energy: {}, log: [], weekCap: {}, reflections: {}, missed: {}, logSeen: 0

    ['nums', 'obs', 'checks', 'duties'].forEach((k) => { if (!out.portfolio[k] || typeof out.portfolio[k] !== 'object') out.portfolio[k] = {}; });
    return out;
  }
  function loadLocal() {
    try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function saveLocal() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage can be blocked */ }
  }

  function loadFromApp() {
    if (!APP) return null;
    try { const raw = APP.loadState(); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  let state = normalise(loadLocal() || loadFromApp());
  // Five tabs; the other screens open from More (or from links) and have a back button.
  const TABS = ['home', 'plan', 'chat', 'portfolio', 'more'];
  const ROUTE_NAMES = ['home', 'plan', 'chat', 'portfolio', 'more', 'deadlines', 'add', 'reflect', 'log', 'settings'];
  const routeOf = (v) => (v === 'today' ? 'home' : (ROUTE_NAMES.includes(v) ? v : 'home'));
  let route = 'home';
  let stack = [];
  try { route = routeOf(localStorage.getItem(VIEW_KEY) || 'home'); } catch (e) { /* ignore */ }
  if (route === 'chat' || !TABS.includes(route)) route = 'home';
  if (/^#[a-z]+$/.test(location.hash) && ROUTE_NAMES.concat('today').includes(location.hash.slice(1))) route = routeOf(location.hash.slice(1));
  let addDraft = null; // the plan preview in the Add view
  let prefill = null;
  let confirmReset = false;
  let editingDue = null;
  let confirmDelete = null;

  const Remote = {
    ref: null,
    writing: false,
    pending: false,
    timer: null,
    status: IS_ARTIFACT ? 'connecting' : 'device',
    async connect() {
      if (!IS_ARTIFACT) return;
      try {
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (!db || !user) { this.setStatus('device'); return; }
        const id = await user.id();
        if (!id) { this.setStatus('device'); return; }
        this.ref = db.collection('data/users/' + id).doc('planner');
        this.ref.onSnapshot((snap) => {
          if (snap.metadata && snap.metadata.hasPendingWrites) return;
          if (!snap.exists) { this.setStatus('synced'); if (state.updatedAt) this.queue(); return; }
          const remote = normalise(snap.data());
          if ((remote.updatedAt || 0) > (state.updatedAt || 0)) {
            state = remote;
            saveLocal();
            applyLook();
            heal();
            renderAll();
          } else if ((remote.updatedAt || 0) < (state.updatedAt || 0)) {

      } catch (e) {
        this.setStatus('device');

      if (!this.ref) return;

    async flush() {
      if (!this.ref) return;
      if (this.writing) { this.pending = true; return; }

    }
  };

  function commit() {

  }

  /* ---------- the model ---------- */
  function deadlines() {
    const base = (DATA.deadlines || []).filter((d) => !state.hidden[d.id]);
    return base.concat(state.custom || []).map((d) => {
      const course = COURSES[d.course] ? d.course : 'other';

      const chunks = (d.chunks || []).map((c) => ({
        ...c,
        dl: d.id,
        course,
        dateEff: state.moved[c.id] || c.date,
        done: !!state.done[c.id]

      const doneCount = chunks.filter((c) => c.done).length;
      const custom = !!d.custom;

      const complete = chunks.length ? doneCount === chunks.length : (due ? due < todayKey() : false);

  }
  function allChunks(list) {
    const out = [];

    return out.sort((a, b) => (a.dateEff + (a.time || '')).localeCompare(b.dateEff + (b.time || '')));
  }
  function loadMap(exceptId) {

    allChunks(deadlines()).forEach((c) => {

  /* ---------- weekly PebblePad review ---------- */

  function thisWeekReview() {

  }
  function nextReview() {
    if (!REVIEW) return null;
    for (let mon = mondayOf(todayKey()); mon <= REVIEW.end; mon = addDays(mon, 7)) {

  function weekLabel(mon) { return 'w/c ' + fmt(mon, { day: 'numeric', month: 'short' }); }
  function reviewRecurGcal(followUp) {
    if (!REVIEW) return '#';
    let mon = mondayOf(todayKey());

    const end = new Date(start.getTime() + (REVIEW.mins || 20) * 60000);
    const until = REVIEW.end.replace(/-/g, '') + 'T230000Z';
    const title = followUp ? 'PGCE: PebblePad review done? If not, do it tonight' : `PGCE: weekly PebblePad review (${REVIEW.mins || 20} min)`;
    const details = 'Mentor meeting record, hours log, observation paperwork, this week\'s session, KSB mapping, placements, feedback actions.\n\nTick it off in the Portfolio tab of Cap and Gown Planner.';
    return gcalUrl(title, start, end, details, `RRULE:FREQ=WEEKLY;UNTIL=${until}`);
  }

  /* ---------- alarms (Android app only) ----------
     The page works out the alarms for the next four weeks from what is still open and hands
     them to the app, which sets the next one with the phone's alarm clock. Every tick sends a
     fresh list, so finished work goes quiet and unfinished work keeps ringing. */
  function alarmPlan() {
    const s = state.settings;
    if (s.alarms === false) return { on: false, alarms: [] };
    const lead = clamp(Number(s.alarmLead == null ? 5 : s.alarmLead) || 0, 0, 60);
    const catchup = s.alarmCatchup !== false;
    const today = todayKey();
    const nowMs = now().getTime();
    const undone = allChunks(deadlines()).filter((c) => !c.done);
    const breaks = (REVIEW && REVIEW.breaks) || [];
    const quietWeek = (d) => breaks.includes(mondayOf(d));
    const stepLine = (c) => `${c.title} (${mins(c.mins || 30)})`;
    const out = [];
    for (let i = 0; i < 28; i++) {
      const d = addDays(today, i);
      const groups = {};
      undone.filter((c) => c.dateEff === d).forEach((c) => {
        const t = c.time || s.evening;
        (groups[t] = groups[t] || []).push(c);
      });
      // weekly review: this week's on its day, unfinished earlier weeks on every weekday after
      const reviewLines = [];
      let reviewMins = 0;
      if (REVIEW) {
        let dueToday = false;
        const late = [];
        for (let mon = mondayOf(REVIEW.start); mon <= mondayOf(d) && mon <= REVIEW.end; mon = addDays(mon, 7)) {
          if (!inReviewRange(mon)) continue;
          const w = reviewWeek(mon);
          if (w.complete) continue;
          if (w.day === d) dueToday = true;
          else if (w.day < d && isWeekday(d) && !quietWeek(d)) late.push(w);
        }
        if (late.length) reviewLines.push(late.length === 1 ? `PebblePad review for ${weekLabel(late[0].mon)} is still open` : `PebblePad review still open for ${late.length} weeks`);
        if (dueToday) reviewLines.push(`Weekly PebblePad review (${mins(REVIEW.mins || 20)})`);
        if (late.length || dueToday) reviewMins = REVIEW.mins || 20;
      }
      const behind = catchup && isWeekday(d) && !quietWeek(d) ? undone.filter((c) => c.dateEff < d).length : 0;
      if (!groups[s.evening] && (reviewLines.length || behind)) groups[s.evening] = [];
      Object.keys(groups).sort().forEach((t) => {
        const steps = groups[t];
        const isEvening = t === s.evening;
        const lines = steps.slice(0, 5).map(stepLine);
        if (steps.length > 5) lines.push(`and ${steps.length - 5} more`);
        let total = steps.reduce((a, c) => a + (c.mins || 30), 0);
        if (isEvening) {
          lines.push(...reviewLines);
          total += reviewMins;
          if (behind) lines.push(`${behind} earlier step${behind === 1 ? '' : 's'} not ticked off yet`);
        }
        if (!lines.length) return;
        let title;
        if (steps.length) title = `Study time: ${mins(total)}`;
        else if (reviewLines.length) title = reviewLines.some((l) => l.includes('still open')) ? 'PebblePad review still open' : 'Weekly PebblePad review';
        else title = 'Catch-up evening';
        const at = atTime(d, t).getTime() - lead * 60000;
        if (at <= nowMs + 60000) return;
        out.push({ at, day: d, title, lines });
      });
    }
    return { on: true, generated: Date.now(), lead, alarms: out };
  }
  let alarmTimer = null;
  function syncAlarms() {
    if (!APP) return;
    clearTimeout(alarmTimer);
    alarmTimer = setTimeout(() => {
      try { APP.setAlarms(JSON.stringify(alarmPlan())); } catch (e) { /* the app will keep its last list */ }
      if (route === 'settings') { const p = $('#alarm-next'); if (p) p.innerHTML = nextAlarmText(); }
      if (state.settings.alarms !== false) { const line = $('.tonight .alarm-line'); if (line) line.innerHTML = nextAlarmText(); }
    }, 250);
  }
  function appStatus() {
    if (!APP) return {};
    try { return JSON.parse(APP.status() || '{}') || {}; } catch (e) { return {}; }
  }
  function fmtAlarm(ms) {
    const d = new Date(ms);
    const k = keyOf(d);
    const day = k === todayKey() ? 'Today' : (k === addDays(todayKey(), 1) ? 'Tomorrow' : fmtShort(k));
    return `${day}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function nextAlarmText() {
    if (state.settings.alarms === false) return 'Alarms are off.';
    const st = appStatus();
    if (st.snoozeAt && st.snoozeAt > Date.now() && (!st.next || st.snoozeAt < st.next)) return `Snoozed until ${esc(fmtAlarm(st.snoozeAt))}`;
    return st.next ? `Next alarm: ${esc(fmtAlarm(st.next))}` : 'No alarm needed in the next four weeks.';
  }

  /* ---------- colours and type ---------- */
  function hexToRgb(h) {
    let x = h.replace('#', '');
    if (x.length === 3) x = x.split('').map((c) => c + c).join('');
    const n = parseInt(x, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const rgbToHex = (r, g, b) => '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b); const min = Math.min(r, g, b);
    let h = 0; let s = 0; const l = (max + min) / 2;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }
  function hslToHex(h, s, l) {
    h = ((h % 360) + 360) % 360;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    const m = l - c / 2;
    let r = 0; let g = 0; let b = 0;
    if (h < 60) [r, g, b] = [c, x, 0];
    else if (h < 120) [r, g, b] = [x, c, 0];
    else if (h < 180) [r, g, b] = [0, c, x];
    else if (h < 240) [r, g, b] = [0, x, c];
    else if (h < 300) [r, g, b] = [x, 0, c];
    else [r, g, b] = [c, 0, x];
    return rgbToHex((r + m) * 255, (g + m) * 255, (b + m) * 255);
  }
  function lum(hex) {
    const [r, g, b] = hexToRgb(hex).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  const contrast = (a, b) => { const la = lum(a); const lb = lum(b); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); };
  function inkFor(bg, target, lighten) {
    const [h, s, l0] = rgbToHsl(...hexToRgb(bg));
    let l = l0;
    for (let i = 0; i < 40; i++) {
      const hex = hslToHex(h, s, l);
      if (contrast(hex, target) >= 4.6) return hex;
      l = lighten ? Math.min(0.96, l + 0.025) : Math.max(0.08, l - 0.025);
    }
    return hslToHex(h, s, l);
  }
  function themeColours() {
    const s = state.settings;
    let t = THEMES.find((x) => x.id === s.theme) || THEMES[0];
    if (t.id === 'custom') {
      const base = /^#[0-9a-f]{6}$/i.test(s.custom) ? s.custom : '#14b8a6';
      const [h, sat, l] = rgbToHsl(...hexToRgb(base));
      t = { id: 'custom', a: base, b: hslToHex(h + 38, clamp(sat, 0.45, 0.95), clamp(l - 0.14, 0.18, 0.6)), accent: base };
    }
    return t;
  }
  function applyLook() {
    const s = state.settings;
    const root = document.documentElement;
    const t = themeColours();
    const navy = '#18213d';
    const white = '#ffffff';
    const heroText = Math.min(contrast(navy, t.a), contrast(navy, t.b)) >= Math.min(contrast(white, t.a), contrast(white, t.b)) ? navy : white;
    const onAccent = contrast(navy, t.accent) >= contrast(white, t.accent) ? navy : white;
    const [r, g, b] = hexToRgb(t.accent);
    const vars = {
      '--hero-a': t.a,
      '--hero-b': t.b,
      '--on-hero': heroText,
      '--cap-board': heroText === navy ? navy : '#f4f5fa',
      '--tassel': '#ffe066',
      '--accent': t.accent,
      '--accent-soft': `rgba(${r}, ${g}, ${b}, 0.16)`,
      '--on-accent': onAccent,
      '--accent-ink-l': inkFor(t.accent, '#ffffff', false),
      '--accent-ink-d': inkFor(t.accent, '#161c31', true),
      '--scale': String(clamp(Number(s.scale) || 1, 0.85, 1.5))
    };
    Object.entries(vars).forEach(([k, v]) => root.style.setProperty(k, v));
    if (s.mode === 'light' || s.mode === 'dark') root.setAttribute('data-mode', s.mode);
    else root.removeAttribute('data-mode');
    document.body.classList.toggle('font-lexend', s.font === 'lexend');
    document.body.classList.toggle('font-system', s.font === 'system');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t.a);
  }

  /* ---------- calendar links and files ---------- */
  const stamp = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  function gcalUrl(title, start, end, details, recur) {
    const p = new URLSearchParams({ action: 'TEMPLATE', text: title, dates: `${stamp(start)}/${stamp(end)}`, details, ctz: TZ });
    if (recur) p.set('recur', recur);
    return 'https://calendar.google.com/calendar/render?' + p.toString();
  }
  function chunkDetails(c) {
    const d = c.deadline;
    const lines = [`Small step for: ${d.title}`];
    if (d.due) lines.push(`Due: ${fmtLong(d.due)}${d.how ? ' (' + d.how + ')' : ''}`);
    if (c.tip) lines.push('', c.tip);
    lines.push('', 'From Cap and Gown Planner');
    return lines.join('\n');
  }
  function chunkGcal(c) {
    const short = (COURSES[c.course] || COURSES.other).short;
    return gcalUrl(`${short}: ${c.title} (${c.mins} min)`, chunkStart(c), chunkEnd(c), chunkDetails(c));
  }
  function deadlineGcal(d) {
    const short = (COURSES[d.course] || COURSES.other).short;
    const start = atTime(d.due, d.dueTime || (DATA.defaults && DATA.defaults.dueTime) || '09:00');
    const label = d.kind === 'event' ? `${short}: ${d.title}` : `${short} due: ${d.title}`;
    return gcalUrl(label, start, new Date(start.getTime() + 30 * 60000), `${d.how || ''}\n${d.note || ''}\n\nFrom Cap and Gown Planner`.trim());
  }

  function icsEscape(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
  function icsFold(line) {
    const enc = new TextEncoder();
    if (enc.encode(line).length <= 75) return line;
    const parts = [];
    let cur = '';
    for (const ch of line) {
      const limit = parts.length ? 74 : 75;
      if (enc.encode(cur + ch).length > limit) { parts.push(cur); cur = ch; } else cur += ch;
    }
    parts.push(cur);
    return parts.join('\r\n ');
  }
  function buildIcs() {
    const list = deadlines();
    const today = todayKey();
    const dtstamp = stamp(new Date());
    const lines = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Cap and Gown Planner//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'X-WR-CALNAME:Study plan (PGCE and Assessor)', `X-WR-TIMEZONE:${TZ}`
    ];
    const pad2 = (n) => String(n).padStart(2, '0');
    const local = (d) => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
    const when = (key, d, wall) => (wall ? `${key};TZID=${TZ}:${local(d)}` : `${key}:${stamp(d)}`);
    const ev = (o) => {
      // Repeating events use wall-clock time in TZ, so they stay at the same hour after the clocks change.
      lines.push('BEGIN:VEVENT', `UID:${o.uid}@capgown-planner`, `DTSTAMP:${dtstamp}`, when('DTSTART', o.start, !!o.rrule), when('DTEND', o.end, !!o.rrule),
        `SUMMARY:${icsEscape(o.title)}`, `DESCRIPTION:${icsEscape(o.details)}`, `CATEGORIES:${icsEscape(o.cat)}`);
      if (o.rrule) lines.push(o.rrule);
      (o.exdates || []).forEach((x) => lines.push(when('EXDATE', x, true)));
      o.alarms.forEach((a) => lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(o.title)}`, `TRIGGER:${a}`, 'END:VALARM'));
      lines.push('END:VEVENT');
    };
    allChunks(list).forEach((c) => {
      if (c.done || c.dateEff < today) return;
      const short = (COURSES[c.course] || COURSES.other).short;
      ev({ uid: c.id, start: chunkStart(c), end: chunkEnd(c), title: `${short}: ${c.title} (${c.mins} min)`, details: chunkDetails(c), cat: short, alarms: ['-PT10M', 'PT0M'] });
    });
    list.forEach((d) => {
      if (!d.due || d.due < today) return;
      const short = (COURSES[d.course] || COURSES.other).short;
      const start = atTime(d.due, d.dueTime || (DATA.defaults && DATA.defaults.dueTime) || '09:00');
      const isEvent = d.kind === 'event';
      ev({
        uid: d.id + '-due', start, end: new Date(start.getTime() + 30 * 60000),
        title: isEvent ? `${short}: ${d.title}` : `${short} DUE: ${d.title}`,
        details: [d.how, d.note, STATUS_LABEL[d.status] && d.status !== 'confirmed' ? STATUS_LABEL[d.status] : ''].filter(Boolean).join('\n'),
        cat: short,
        alarms: isEvent ? ['-P1D', '-PT1H'] : ['-P7D', '-P2D', '-PT1H']
      });
    });
    if (REVIEW && TZ === 'Europe/London') {
      lines.splice(7, 0, 'BEGIN:VTIMEZONE', 'TZID:Europe/London',
        'BEGIN:DAYLIGHT', 'TZOFFSETFROM:+0000', 'TZOFFSETTO:+0100', 'TZNAME:BST', 'DTSTART:19700329T010000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'END:DAYLIGHT',
        'BEGIN:STANDARD', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0000', 'TZNAME:GMT', 'DTSTART:19701025T020000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD',
        'END:VTIMEZONE');
    }
    if (REVIEW) {
      let mon = mondayOf(today);
      while (!inReviewRange(mon) && mon <= REVIEW.end) mon = addDays(mon, 7);
      if (mon <= REVIEW.end) {
        const until = REVIEW.end.replace(/-/g, '') + 'T230000Z';
        [false, true].forEach((follow) => {
          let first = reviewDayKey(mon);
          if (follow) first = nextWeekday(addDays(first, 1));
          const start = atTime(first, state.settings.evening);
          const shift = daysBetween(reviewDayKey(mon), first);
          const exdates = (REVIEW.breaks || []).filter((b) => b >= mon).map((b) => atTime(addDays(reviewDayKey(b), shift), state.settings.evening));
          ev({
            uid: follow ? 'review-followup' : 'review-weekly', start, end: new Date(start.getTime() + (REVIEW.mins || 20) * 60000),
            title: follow ? 'PGCE: PebblePad review done? If not, do it tonight' : `PGCE: weekly PebblePad review (${REVIEW.mins || 20} min)`,
            details: 'Tick it off in the Portfolio tab of Cap and Gown Planner. An unfinished review stays on your Today screen until it is done.',
            cat: 'PGCE', alarms: ['-PT10M', 'PT0M'], rrule: `RRULE:FREQ=WEEKLY;UNTIL=${until}`, exdates
          });
        });
      }
    }
    lines.push('END:VCALENDAR');
    return lines.map(icsFold).join('\r\n') + '\r\n';
  }

  async function saveFile(filename, text, mime) {
    if (APP) {
      let ok = false;
      try { ok = APP.saveFile(filename, text, mime); } catch (e) { ok = false; }
      toast(ok ? 'Saved to the Downloads folder on your phone.' : 'That file could not be saved.');
      return;
    }
    if (IS_ARTIFACT) {
      const dl = await window.claude.use('downloads');
      if (!dl) { toast('Saving files is not available in this view.'); return; }
      try {
        await dl.save({ filename, data: text });
        toast('File saved.');
      } catch (e) {
        if (e && e.code === 'declined') return;
        if (e && e.code === 'rate_limited') toast('A save is already waiting for you. Try again in a moment.');
        else toast('That file could not be saved here.');
      }
      return;
    }
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast('Saved to your downloads.');
  }

  /* ---------- notifications (installed app only) ---------- */
  async function writeNudgeSnapshot() {
    if (IS_ARTIFACT || APP || !('caches' in window)) return;
    try {
      const today = todayKey();
      const list = deadlines();
      const items = allChunks(list)
        .filter((c) => !c.done && c.dateEff >= today && c.dateEff <= addDays(today, 21))
        .map((c) => ({ date: c.dateEff, title: c.title, mins: c.mins, course: (COURSES[c.course] || COURSES.other).short }));
      const dues = list.filter((d) => d.due && d.due >= today && d.due <= addDays(today, 21) && !d.complete)
        .map((d) => ({ date: d.due, title: d.title, course: (COURSES[d.course] || COURSES.other).short, kind: d.kind }));
      const cache = await caches.open('capgown-state');
      await cache.put(new Request('planner-state.json'), new Response(JSON.stringify({ items, dues, nudges: !!state.settings.nudges, evening: state.settings.evening }), { headers: { 'Content-Type': 'application/json' } }));
    } catch (e) { /* not essential */ }
  }
  async function enableNudges() {
    if (IS_ARTIFACT) return;
    if (!('Notification' in window) || !('serviceWorker' in navigator)) { toast('This browser cannot show notifications. Use the calendar route instead.'); return; }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications are switched off for this app. You can allow them in Chrome site settings.'); return; }
    state.settings.nudges = true;
    commit();
    let note = 'Daily nudges are on.';
    try {
      const reg = await navigator.serviceWorker.ready;
      if ('periodicSync' in reg) {
        let ok = true;
        try {
          const st = await navigator.permissions.query({ name: 'periodic-background-sync' });
          ok = st.state === 'granted';
        } catch (e) { /* query not supported */ }
        if (ok) await reg.periodicSync.register('study-nudge', { minInterval: 12 * 60 * 60 * 1000 });
        else note = 'Notifications are allowed, but Android only runs background nudges for installed apps you use often. Keep the calendar reminders as well.';
      } else {
        note = 'Notifications are allowed, but this browser has no background nudges. Keep the calendar reminders as well.';
      }
      reg.showNotification('Nudges are on', { body: 'This is what a nudge looks like. Your calendar reminders still do the main job.', icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'nudge-test' });
    } catch (e) { /* ignore */ }
    toast(note);
    renderView();
  }
  async function disableNudges() {
    state.settings.nudges = false;
    commit();
    try {
      const reg = await navigator.serviceWorker.ready;
      if ('periodicSync' in reg) await reg.periodicSync.unregister('study-nudge');
    } catch (e) { /* ignore */ }
    toast('Daily nudges are off.');
    renderView();
  }

  /* ---------- planning new work ---------- */
  const TEMPLATES = {
    assignment: {
      label: 'Written assignment or essay',
      build(o) {
        const words = clamp(Number(o.words) || 3000, 300, 12000);
        const parts = clamp(Math.ceil(words / 700), 2, 8);
        const per = Math.round(words / parts / 50) * 50;
        const s = [
          { title: 'Read the brief and the marking criteria', mins: 20, tip: 'Highlight the command words, such as evaluate or analyse. They tell you how deep to go.' },
          { title: 'List the evidence you already have', mins: 20, tip: 'Observation feedback, mentor notes, learner work, your own reflections.' },
          { title: 'Find four to six sources you will really use', mins: 40, tip: 'Save each APA 7 reference as you go, with the DOI.' },
          { title: 'Plan: one line per section', mins: 30, tip: 'Write the point each section makes. That line can become its first sentence.' }
        ];
        for (let i = 1; i <= parts; i++) s.push({ title: `Draft part ${i} of ${parts} (about ${per} words)`, mins: 45 });
        s.push({ title: 'Check it against the marking criteria', mins: 30, tip: 'Find the weakest section and improve that one.' });
        s.push({ title: 'References, word count and AI declaration', mins: 25 });
        s.push({ title: 'Read it aloud once, then submit', mins: 25, tip: 'Reading aloud catches the sentences that do not sound like you.' });
        return spread(s, o.due);
      }
    },
    observation: {
      label: 'Teaching observation',
      build(o) {
        const due = o.due;
        const rel = [
          { off: -10, title: 'Agree the group, room and time with your observers', mins: 10 },
          { off: -7, title: 'Plan the lesson on the planning pro-forma', mins: 45, tip: 'Start from the targets on your last observation form.' },
          { off: -6, title: 'Prep form: how you have acted on your last targets', mins: 30 },
          { off: -5, title: 'Build or adapt resources and check support plans', mins: 45, tip: 'Cream copies, enlarged text or a printed version for anyone who needs them.' },
          { work: 2, title: 'Send the prep form and lesson plan to tutor and mentor', mins: 10, tip: 'They need it two working days before the observation.' },
          { off: -1, title: 'Print, check the room, tech and seating plan', mins: 20 },
          { off: 1, title: 'Rough notes while it is fresh', mins: 20, tip: 'What went well, what you would change, what the observers said.' },
          { off: 3, title: 'Write the reflection, upload to PebblePad and map to the OS', mins: 40 }
        ];
        const today = todayKey();
        return rel.map((r) => {
          let d = r.work ? minusWorkingDays(due, r.work) : addDays(due, r.off);
          d = r.off > 0 ? nextWeekday(d) : prevWeekday(d);
          if (d < today) d = nextWeekday(today);
          return { title: r.title, mins: r.mins, tip: r.tip, date: d };
        }).sort((a, b) => a.date.localeCompare(b.date));
      }
    },
    assessor: {
      label: 'Assessor evidence or records',
      build(o) {
        return spread([
          { title: 'List the criteria and tick the evidence you already hold', mins: 20 },
          { title: 'Gather plans, observation records and products', mins: 30 },
          { title: 'Write up missing records and Q&A', mins: 40 },
          { title: 'Check every decision has feedback', mins: 30 },
          { title: 'Signed, dated and VACSR check', mins: 20, tip: 'Valid, authentic, current, sufficient, reliable.' },
          { title: 'Email it to your assessor', mins: 10 }
        ], o.due);
      }
    },
    reflection: {
      label: 'PebblePad reflection',
      build(o) {
        return spread([
          { title: 'Rough notes: what happened and what you noticed', mins: 20 },
          { title: 'Link to a model and pick one or two sources', mins: 25, tip: 'Gibbs, Kolb or Brookfield\'s lenses all work.' },
          { title: 'Write the reflection in your own words', mins: 35 },
          { title: 'Map to the Occupational Standards and upload', mins: 20 }
        ], o.due);
      }
    },
    event: {
      label: 'Meeting or event (no steps)',
      build(o) {
        const d = prevWeekday(addDays(o.due, -1));
        if (d < todayKey()) return [];
        return [{ title: 'Get ready: check time, place and anything to bring', mins: 15, date: d }];
      }
    },
    custom: {
      label: 'Something else (choose the steps)',
      build(o) {
        const n = clamp(Number(o.steps) || 4, 1, 20);
        const m = clamp(Number(o.mins) || 30, 5, 120);
        const s = [];
        for (let i = 1; i <= n; i++) s.push({ title: `Step ${i} of ${n}`, mins: m });
        return spread(s, o.due);
      }
    }
  };

  function spread(steps, dueKey) {
    const today = todayKey();
    let days = [];
    for (let d = today; d < dueKey && days.length < 400; d = addDays(d, 1)) if (isWeekday(d)) days.push(d);
    if (!days.length) days = [today];
    const n = steps.length;
    let usable = days.length > n + 1 ? days.slice(0, -1) : days;
    const maxSpan = Math.max(n * 3, 10);
    if (usable.length > maxSpan) usable = usable.slice(usable.length - maxSpan);
    const load = loadMap();
    let last = 0;
    return steps.map((s, i) => {
      const target = n === 1 ? usable.length - 1 : Math.round((i * (usable.length - 1)) / (n - 1));
      const from = Math.max(target, last);
      let pick = -1;
      for (let j = from; j < usable.length; j++) if ((load[usable[j]] || 0) + s.mins <= capFor(usable[j])) { pick = j; break; }
      if (pick < 0) for (let j = from; j >= last; j--) if ((load[usable[j]] || 0) + s.mins <= capFor(usable[j])) { pick = j; break; }
      if (pick < 0) {
        // nothing fits under the limit: use the lightest evening that keeps the order
        pick = Math.min(from, usable.length - 1);
        for (let j = last; j < usable.length; j++) if ((load[usable[j]] || 0) < (load[usable[pick]] || 0)) pick = j;
      }
      load[usable[pick]] = (load[usable[pick]] || 0) + s.mins;
      last = pick;
      return { ...s, date: usable[pick] };
    });
  }

  /* ---------- the adaptive planner ----------
     Self-healing: a step whose evening has passed moves to the first weekday evening with room
     before its deadline, closest deadline first. Energy check-in: a low evening keeps only the
     most urgent step, a good evening pulls one step forward. Weekly reflection: a lighter or
     fuller week changes next week's evening limit. Every change goes in the log with its reason,
     and the ones that can be undone have an Undo button for a week. */
  const LOW_CAP = 20;
  const BREAKS = (REVIEW && REVIEW.breaks) || [];
  const inBreak = (k) => BREAKS.includes(mondayOf(k));
  const byUrgency = (a, b) => (a.deadline.due || '9999').localeCompare(b.deadline.due || '9999')
    || a.dateEff.localeCompare(b.dateEff) || (a.time || '').localeCompare(b.time || '');
  const plural = (n, word, many) => `${n} ${n === 1 ? word : (many || word + 's')}`;

  // Most minutes for one evening: the setting, changed for a week by a reflection, cut on a low-energy night.
  function capFor(k) {
    const base = Number(state.settings.cap) || 60;
    const wk = Number(state.weekCap && state.weekCap[mondayOf(k)]) || base;
    return state.energy && state.energy[k] === 'low' ? Math.min(wk, LOW_CAP) : wk;
  }

  // The last evening a step can sit on and still be ready for its deadline.
  function lastDayFor(c) {
    const d = c.deadline;
    if (!d || !d.due) return null;
    if (c.date && c.date > d.due) return addDays(c.date, 14); // a follow-up planned after an event
    let lim = d.due;
    if (d.kind !== 'event' && d.status !== 'target') {
      const t = d.dueTime || (DATA.defaults && DATA.defaults.dueTime) || '09:00';
      if (t < '17:00') lim = addDays(d.due, -1); // handed in by day, so the work happens the evening before
    }
    return c.date && c.date > lim ? c.date : lim;
  }

  // First weekday evening from fromKey with room, up to the step's last day. Christmas and Easter
  // weeks are skipped unless nothing else fits. Returns null when the last day has already gone.
  function findSlot(c, fromKey, load) {
    const lim = lastDayFor(c);
    const m = c.mins || 30;
    if (lim && lim < fromKey) return null;
    const end = lim || addDays(fromKey, 120);
    for (let d = fromKey; d <= end; d = addDays(d, 1)) {
      if (isWeekday(d) && !inBreak(d) && (load[d] || 0) + m <= capFor(d)) return { day: d, fits: true };
    }
    let best = null;
    for (let d = fromKey; d <= end; d = addDays(d, 1)) {
      if (isWeekday(d) && (best === null || (load[d] || 0) < (load[best] || 0))) best = d;
    }
    return { day: best || fromKey, fits: false };
  }

  function addLog(e) {
    state.log.unshift({ id: uid(), at: now().getTime(), ...e });
    if (state.log.length > 80) state.log.length = 80;
  }
  function undoEntry(e) {
    if (!e || !e.undo || e.undone) return false;
    Object.entries(e.undo.moved || {}).forEach(([id, prev]) => { if (prev) state.moved[id] = prev; else delete state.moved[id]; });
    Object.entries(e.undo.weekCap || {}).forEach(([mon, prev]) => { if (prev) state.weekCap[mon] = prev; else delete state.weekCap[mon]; });
    e.undone = true;
    return true;
  }

  // Missed steps whose deadline is still ahead move forward. Steps past their deadline stay put
  // and show on Home under "Check these", because the work may already have gone in.
  function heal() {
    if (state.settings.heal === false) return 0;
    const today = todayKey();
    const from = now().getHours() >= 21 ? addDays(today, 1) : today;
    const movable = allChunks(deadlines())
      .filter((c) => !c.done && c.dateEff < today)
      .filter((c) => { const lim = lastDayFor(c); return !lim || lim >= today; })
      .sort(byUrgency);
    if (!movable.length) return 0;
    const load = loadMap();
    const lines = [];
    let over = 0;
    movable.forEach((c) => {
      const slot = findSlot(c, from, load) || { day: today, fits: false };
      const seen = (state.missed[c.id] = state.missed[c.id] || []);
      if (!seen.includes(c.dateEff)) seen.push(c.dateEff);
      state.moved[c.id] = slot.day;
      load[slot.day] = (load[slot.day] || 0) + (c.mins || 30);
      if (!slot.fits) over++;
      lines.push(`${c.title}: ${fmtShort(c.dateEff)} to ${fmtShort(slot.day)}${slot.fits ? '' : ' (over your evening limit)'}`);
    });
    const n = movable.length;
    addLog({
      kind: 'heal',
      what: n === 1 ? `Moved a missed step to ${fmtShort(state.moved[movable[0].id])}` : `Moved ${n} missed steps to evenings with room`,
      why: `${n === 1 ? 'It was' : 'They were'} not ticked off on the night. Each one goes to the first weekday evening with room before its deadline, closest deadline first.${over ? ` ${plural(over, 'step')} only fitted by going over your evening limit, because the deadline is close.` : ''}`,
      lines
    });
    commit();
    return n;
  }

  // Evens out evenings that are over the limit: the step with the furthest deadline moves first,
  // and only later, to an evening with room before its own deadline.
  function balance(from, to) {
    const load = loadMap();
    const open = allChunks(deadlines()).filter((c) => !c.done && !c.time && c.dateEff >= from && c.dateEff <= to);
    const undo = {};
    const lines = [];
    for (let d = from; d <= to; d = addDays(d, 1)) {
      if (!isWeekday(d) || (load[d] || 0) <= capFor(d)) continue;
      const here = open.filter((c) => c.dateEff === d && !(c.id in undo)).sort(byUrgency).reverse();
      let left = here.length;
      for (const c of here) {
        if ((load[d] || 0) <= capFor(d) || left <= 1) break;
        const m = c.mins || 30;
        load[d] -= m;
        const slot = findSlot(c, addDays(d, 1), load);
        if (!slot || !slot.fits) { load[d] += m; continue; }
        undo[c.id] = state.moved[c.id] || null;
        state.moved[c.id] = slot.day;
        c.dateEff = slot.day;
        load[slot.day] = (load[slot.day] || 0) + m;
        left--;
        lines.push(`${c.title}: ${fmtShort(d)} to ${fmtShort(slot.day)}`);
      }
    }
    return { undo, lines };
  }

  function replan() {
    const healed = heal();
    const today = todayKey();
    const r = balance(today, addDays(today, 27));
    if (r.lines.length) {
      addLog({
        kind: 'replan',
        what: `Evened out ${plural(r.lines.length, 'step')} over the next four weeks`,
        why: 'Some evenings were over your limit. The step with the furthest deadline moved first, and only to an evening with room before its own deadline.',
        lines: r.lines,
        undo: { moved: r.undo }
      });
      commit();
    } else if (!healed) {
      const last = state.log[0];
      if (!(last && last.kind === 'check' && keyOf(new Date(last.at)) === today)) {
        addLog({ kind: 'check', what: 'Checked the next four weeks', why: `Nothing was missed and every evening is within your limit (${state.settings.cap} minutes). Nothing needed to move.` });
        commit();
      }
    }
    return { healed, moved: r.lines.length };
  }

  // Energy check-in. Changing your answer first undoes what the last answer did tonight.
  function setEnergy(level) {
    const today = todayKey();
    state.log.forEach((e) => { if (e.kind === 'energy' && e.day === today) undoEntry(e); });
    state.energy[today] = level;
    let result = { level, moved: 0, bonus: null };
    if (level === 'low' || level === 'high') {
      const load = loadMap();
      const undo = {};
      const lines = [];
      if (level === 'low') {
        const tonight = allChunks(deadlines()).filter((c) => !c.done && c.dateEff === today).sort(byUrgency);
        let kept = 0;
        const stayed = [];
        tonight.forEach((c, i) => {
          const m = c.mins || 30;
          if (i === 0 || c.time || kept + m <= LOW_CAP) { kept += m; return; }
          load[today] -= m;
          const slot = findSlot(c, addDays(today, 1), load);
          if (!slot || !slot.fits) { load[today] += m; kept += m; stayed.push(c.title); return; }
          undo[c.id] = state.moved[c.id] || null;
          state.moved[c.id] = slot.day;
          load[slot.day] = (load[slot.day] || 0) + m;
          lines.push(`${c.title}: moved to ${fmtShort(slot.day)}`);
        });
        result.moved = lines.length;
        addLog({
          kind: 'energy', day: today,
          what: lines.length ? `Lighter evening: ${plural(lines.length, 'step')} moved` : 'Lighter evening: nothing needed to move',
          why: tonight.length
            ? `You said your energy is low. Tonight keeps "${tonight[0].title}", the step with the closest deadline${stayed.length ? `, plus ${plural(stayed.length, 'step')} with no room before ${stayed.length === 1 ? 'its' : 'their'} deadline` : ''}.${lines.length ? ' The rest go to the next evenings with room.' : ''}`
            : 'You said your energy is low. Nothing was planned tonight, so nothing moved.',
          lines,
          undo: { moved: undo }
        });
      } else {
        const tl = load[today] || 0;
        const cand = allChunks(deadlines())
          .filter((c) => !c.done && !c.time && c.dateEff > today && c.dateEff <= addDays(today, 7) && tl + (c.mins || 30) <= capFor(today) + 30)
          .sort(byUrgency)[0];
        if (cand) {
          undo[cand.id] = state.moved[cand.id] || null;
          state.moved[cand.id] = today;
          lines.push(`${cand.title}: ${fmtShort(cand.dateEff)} to tonight`);
          result.bonus = cand;
        }
        addLog({
          kind: 'energy', day: today,
          what: cand ? `Bonus step tonight: ${cand.title}` : 'Good energy: nothing to pull forward',
          why: cand
            ? `You said you have good energy. This is the next step with the closest deadline (${cand.deadline.title}${cand.deadline.due ? ', due ' + fmtShort(cand.deadline.due) : ''}). Doing it tonight frees up ${fmtShort(cand.dateEff)}.`
            : 'Nothing in the next seven days fits tonight without going well over your evening limit.',
          lines,
          undo: { moved: undo }
        });
      }
    }
    commit();
    return result;
  }

  // Weekly reflection
  const MOODS = ['Tired', 'Busy at work', 'Focused', 'Confident', 'Stuck', 'Behind'];
  const HEAVY = ['Tired', 'Busy at work', 'Stuck', 'Behind'];
  const lighterCap = () => Math.max(30, (Number(state.settings.cap) || 60) - 20);
  const pushCap = () => Math.min(180, (Number(state.settings.cap) || 60) + 20);
  const planLabel = (p) => (p === 'lighter' ? `lighter, evenings up to ${lighterCap()} minutes` : p === 'push' ? `fuller, evenings up to ${pushCap()} minutes` : `the usual ${state.settings.cap} minutes an evening`);
  function suggestPlan(moods) {
    const list = moods || [];
    const heavy = list.filter((m) => HEAVY.includes(m));
    if (heavy.length) return { plan: 'lighter', why: `you picked ${heavy.map((m) => m.toLowerCase()).join(' and ')}` };
    if (list.length) return { plan: 'same', why: `you picked ${list.map((m) => m.toLowerCase()).join(' and ')}` };
    return { plan: 'same', why: '' };
  }
  function reflectionDue() {
    if (!REVIEW) return false;
    const today = todayKey();
    const mon = mondayOf(today);
    return inReviewRange(mon) && !state.reflections[mon] && today >= reviewDayKey(mon);
  }
  function saveReflection(mon, text, moods, plan) {
    state.log.forEach((e) => { if (e.kind === 'reflect' && e.week === mon) undoEntry(e); });
    const next = addDays(mon, 7);
    state.reflections[mon] = { text, moods, plan, at: now().getTime() };
    const undo = { moved: {}, weekCap: { [next]: state.weekCap[next] || null } };
    let lines = [];
    if (plan === 'lighter') {
      state.weekCap[next] = lighterCap();
      const r = balance(next, addDays(next, 6));
      undo.moved = r.undo;
      lines = r.lines;
    } else if (plan === 'push') {
      state.weekCap[next] = pushCap();
    } else {
      delete state.weekCap[next];
    }
    const capNext = state.weekCap[next] || state.settings.cap;
    addLog({
      kind: 'reflect', week: mon,
      what: plan === 'lighter' ? `Lighter week planned for ${weekLabel(next)}` : plan === 'push' ? `Fuller week allowed for ${weekLabel(next)}` : `Usual limit kept for ${weekLabel(next)}`,
      why: `From your reflection${moods.length ? ` (${moods.join(', ').toLowerCase()})` : ''}. Evenings in ${weekLabel(next)} go up to ${capNext} minutes${lines.length ? `, so ${plural(lines.length, 'step')} moved to evenings with room before ${lines.length === 1 ? 'its' : 'their'} deadline` : ''}.`,
      lines,
      undo
    });
    commit();
    return lines.length;
  }

  // What the app has noticed, from real ticks, misses, reflections and check-ins only.
  function patterns() {
    const out = [];
    const by = {};
    const bump = (k, field) => { const w = dow(k); if (w < 1 || w > 5) return; (by[w] = by[w] || { on: 0, missed: 0 })[field]++; };
    allChunks(deadlines()).forEach((c) => {
      const t = state.done[c.id];
      if (t && keyOf(new Date(t)) <= c.dateEff) bump(c.dateEff, 'on');
    });
    Object.values(state.missed).forEach((arr) => (arr || []).forEach((k) => bump(k, 'missed')));
    const rows = Object.entries(by).map(([w, v]) => ({ w: Number(w), on: v.on, n: v.on + v.missed, rate: v.on / (v.on + v.missed) })).filter((r) => r.n >= 2);
    if (rows.reduce((a, r) => a + r.n, 0) >= 6 && rows.length >= 2) {
      rows.sort((a, b) => b.rate - a.rate || b.n - a.n);
      const best = rows[0];
      const worst = rows[rows.length - 1];
      const days = (w) => DAY_NAMES[w - 1] + 's';
      out.push(`${days(best.w)} work best: ${best.on} of ${best.n} steps done on the night.${worst.rate < best.rate ? ` ${days(worst.w)} are hardest: ${worst.on} of ${worst.n}.` : ''}`);
    }
    const recent = Object.entries(state.reflections).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 4);
    const count = {};
    recent.forEach(([, r]) => (r.moods || []).forEach((m) => { count[m] = (count[m] || 0) + 1; }));
    const top = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
    if (top && top[1] >= 2) out.push(`You picked "${top[0]}" in ${top[1]} of your last ${recent.length} reflections.`);
    const since = addDays(todayKey(), -14);
    const lows = Object.entries(state.energy).filter(([k, v]) => v === 'low' && k > since).length;
    if (lows >= 3) out.push(`${lows} low-energy evenings in the last two weeks. A lighter week might help.`);
    return out;
  }

  // The single best thing to do now.
  function nextStep() {
    const today = todayKey();
    const open = allChunks(deadlines()).filter((c) => !c.done);
    const late = overdueReviews();
    const reviewOf = (w) => ({ type: 'review', week: w, mins: (REVIEW && REVIEW.mins) || 20 });
    if (late.length) return { ...reviewOf(late[0]), why: `The PebblePad review for ${weekLabel(late[0].mon)} is still open, and an open review always comes first until it is done.` };
    const tonight = open.filter((c) => c.dateEff <= today).filter((c) => { const lim = lastDayFor(c); return !lim || lim >= today; }).sort(byUrgency);
    const rw = thisWeekReview();
    const reviewTonight = rw && rw.state === 'tonight';
    if (tonight.length) {
      const c = tonight[0];
      const n = c.deadline.due ? daysBetween(today, c.deadline.due) : null;
      if (reviewTonight && (n === null || n > 3)) return { ...reviewOf(rw), why: 'The weekly review is due tonight, and none of tonight\'s steps has a deadline in the next three days.' };
      const when = n === null ? 'It has no deadline yet' : `Due ${fmtShort(c.deadline.due)}, ${n <= 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`}`;
      const among = tonight.length > 1 ? ` It has the closest deadline of the ${tonight.length} steps tonight.` : '';
      const low = state.energy[today] === 'low' ? ' Your energy is low, so the evening can stop after this one.' : '';
      return { type: 'step', c, why: `${when}.${among}${low}` };
    }
    if (reviewTonight) return { ...reviewOf(rw), why: 'The weekly review is due tonight. It takes about 20 minutes.' };
    const next = open.filter((c) => c.dateEff > today).sort((a, b) => a.dateEff.localeCompare(b.dateEff) || byUrgency(a, b))[0];
    if (next) return { type: 'ahead', c: next, why: `Nothing is left tonight. This is the next step in your plan, on ${fmtLong(next.dateEff)}.` };
    return null;
  }

  // Weekday evenings in a row where every planned step was done and nothing was missed.
  function streak() {
    const today = todayKey();
    const all = allChunks(deadlines());
    const missedOn = {};
    Object.values(state.missed).forEach((arr) => (arr || []).forEach((k) => { missedOn[k] = true; }));
    const start = (REVIEW && REVIEW.start) || addDays(today, -90);
    let n = 0;
    const tonight = all.filter((c) => c.dateEff === today);
    if (tonight.length && tonight.every((c) => c.done)) n++;
    for (let d = addDays(today, -1), i = 0; i < 120 && d >= start; d = addDays(d, -1), i++) {
      if (missedOn[d]) break;
      const items = all.filter((c) => c.dateEff === d);
      if (!items.length) continue;
      if (items.every((c) => c.done)) n++; else break;
    }
    return n;
  }

  // A plain summary of the plan, to paste into a Claude chat.
  function weekText() {
    const today = todayKey();
    const list = deadlines();
    const open = allChunks(list).filter((c) => !c.done);
    const short = (id) => (COURSES[id] || COURSES.other).short;
    const line = (c) => `${short(c.course)}: ${c.title} (${mins(c.mins || 30)}), for "${c.deadline.title}"${c.deadline.due ? `, due ${fmtShort(c.deadline.due)}` : ''}`;
    const out = [`My study plan from my Cap and Gown planner, ${fmtLong(today)} ${parseKey(today).getFullYear()}.`, ''];
    const tonight = open.filter((c) => c.dateEff === today).sort(byUrgency);
    out.push(isWeekday(today) ? 'Tonight:' : 'Today:');
    out.push(...(tonight.length ? tonight.map((c) => '- ' + line(c)) : ['- Nothing planned.']));
    const soon = open.filter((c) => c.dateEff > today && c.dateEff <= addDays(today, 7)).sort((a, b) => a.dateEff.localeCompare(b.dateEff));
    if (soon.length) { out.push('', 'Next seven days:'); soon.forEach((c) => out.push(`- ${fmtShort(c.dateEff)}, ${line(c)}`)); }
    const dues = list.filter((d) => d.due && d.due >= today && !d.complete).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 5);
    if (dues.length) {
      out.push('', 'Next deadlines:');
      dues.forEach((d) => out.push(`- ${fmtShort(d.due)}: ${d.title} (${short(d.course)}${d.status === 'target' ? ', my own target' : d.status === 'check' ? ', date still to check' : ''})`));
    }
    const stale = open.filter((c) => c.dateEff < today);
    if (stale.length) out.push('', `Not ticked off from earlier: ${plural(stale.length, 'step')} (${[...new Set(stale.map((c) => c.deadline.title))].slice(0, 3).join('; ')}).`);
    const ov = overdueReviews();
    if (ov.length) out.push(`Weekly PebblePad review still open for ${plural(ov.length, 'week')}.`);
    const e = state.energy[today];
    if (e === 'low' || e === 'high') out.push(`Energy tonight: ${e === 'low' ? 'low' : 'good'}.`);
    const lastR = Object.entries(state.reflections).sort((a, b) => b[0].localeCompare(a[0]))[0];
    if (lastR && lastR[1].text) out.push(`My last weekly reflection (${weekLabel(lastR[0])}): "${lastR[1].text.slice(0, 300)}"`);
    out.push('', 'My question: ');
    return out.join('\n');
  }

  /* ---------- rendering ---------- */
  const ICON = {
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M12 12.5v6M9 15.5h6"/></svg>',
    move: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h12M13 7l5 5-5 5"/></svg>'
  };
  const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  Object.assign(ICON, {
    back: svg('<path d="M15 5l-7 7 7 7"/>'),
    fwd: svg('<path d="M9 5l7 7-7 7"/>'),
    bell: svg('<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>'),
    spark: svg('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>'),
    dots: svg('<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>'),
    week: svg('<path d="M8 6h12M8 12h12M8 18h8"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    folder: svg('<path d="M3 7.5a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
    chats: svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.3-4.6A8 8 0 1 1 21 12z"/>'),
    link: svg('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'),
    help: svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.4M12 17h.01"/>'),
    reload: svg('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'),
    out: svg('<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
    deadlines: svg('<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'),
    add: svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>'),
    reflect: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
    log: svg('<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/>'),
    settings: svg('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>')
  });
  const CAP_PATHS = `<polygon class="edge" points="70,230 256,310 442,230 442,244 256,324 70,244"/>
        <path class="board" d="M150 262 V342 C150 396 362 396 362 342 V262 L256 309 Z"/>
        <polygon class="board" points="256,138 442,218 256,298 70,218"/>
        <polygon points="256,152 410,218 256,284 102,218" fill="#ffffff" fill-opacity="0.08"/>
        <g class="tassel-group">
          <path class="cord" d="M256 218 L404 252 L404 326" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          <circle class="tassel" cx="404" cy="330" r="14"/>
          <path class="tassel" d="M390 338 H418 L430 400 H378 Z"/>
        </g>
        <circle class="tassel" cx="256" cy="218" r="14"/>`;
  const capSvg = (id) => `<svg class="cap"${id ? ` id="${id}"` : ''} viewBox="0 0 512 512" aria-hidden="true">${CAP_PATHS}</svg>`;

  function tag(course) {
    const c = COURSES[course] || COURSES.other;
    return `<span class="tag ${esc(course)}">${esc(c.short)}</span>`;
  }
  function statusTag(s) {
    if (!STATUS_LABEL[s]) return '';
    return `<span class="tag status-${esc(s)}">${esc(STATUS_LABEL[s])}</span>`;
  }

  function stepRow(c, opts = {}) {
    const today = todayKey();
    const late = !c.done && c.dateEff < today;
    const moved = state.moved[c.id] && state.moved[c.id] !== c.date;
    const pastDue = c.deadline.due && c.dateEff > c.deadline.due;
    const meta = [];
    if (opts.showCourse !== false) meta.push(tag(c.course));
    meta.push(`<span>${esc(mins(c.mins || 0))}</span>`);
    if (opts.showDate) meta.push(`<span>${esc(fmtShort(c.dateEff))}</span>`);
    if (late) meta.push('<span class="tag late">Behind</span>');
    if (pastDue) meta.push('<span class="tag late">After the deadline</span>');
    else if (moved) meta.push('<span>moved</span>');
    return `<li class="step ${esc(c.course)}${c.done ? ' is-done' : ''}">
      <input type="checkbox" class="tick" data-action="tick" data-id="${esc(c.id)}" aria-label="Done: ${esc(c.title)}"${c.done ? ' checked' : ''}>
      <div class="step-body">
        <span class="step-title">${esc(c.title)}</span>
        <span class="step-meta">${meta.join('<span aria-hidden="true">·</span>')}</span>
        ${opts.showFor !== false ? `<span class="step-for">for ${esc(c.deadline.title)}</span>` : ''}
        ${c.tip && opts.showTip !== false ? `<span class="step-tip">${esc(c.tip)}</span>` : ''}
      </div>
      <div class="step-actions">
        ${c.done ? '' : `<button class="icon-btn" data-action="move" data-id="${esc(c.id)}" aria-label="Move to the next free evening" title="Move to the next free evening">${ICON.move}</button>`}
        <a class="icon-btn" href="${esc(chunkGcal(c))}" target="_blank" rel="noopener" aria-label="Add to Google Calendar" title="Add to Google Calendar">${ICON.cal}</a>
      </div>
    </li>`;
  }

  function dueBox(d) {
    const today = todayKey();
    if (!d.due) return '<div class="due-box"><div class="big">?</div><div class="small">no date yet</div></div>';
    if (d.complete && d.chunks.length) return `<div class="due-box"><div class="big" style="color:var(--ok)">Done</div><div class="small">${esc(fmtYear(d.due))}</div></div>`;
    const n = daysBetween(today, d.due);
    let big; let small;
    if (n === 0) { big = 'Today'; small = fmtShort(d.due); }
    else if (n === 1) { big = '1'; small = 'day left'; }
