name: Check a change

# Runs on every pull request. Nothing is published from here: it only says whether the change is safe.
# The planner page on main goes live on phones without a new install, so the page is tested by a robot
# that opens every screen and taps every button before a change is merged.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page:
    name: Planner page and test robot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Page number, links and script
        env:
          BASE: ${{ github.base_ref }}
        run: python3 tools/check_page.py "origin/$BASE"

      - name: Install the test browser
        working-directory: tools/qa
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Every screen opens
        run: node tools/qa/smoke.js

      - name: Behaviour checks
        run: node tools/qa/logic.js

      - name: Small phones and large text
        run: node tools/qa/bigtext.js

      - name: Odd clocks, weeks of use, long sittings, damaged data, backups
        run: |
          pids=""
          for job in "clocks" "walk" "monkey" "backup" "damage 0 3" "damage 1 3" "damage 2 3"; do
            node tools/qa/props.js $job > deep-$(echo $job | tr ' ' '-').log 2>&1 &
            pids="$pids $!"
          done
          fail=0
          for pid in $pids; do wait $pid || fail=1; done
          tail -n 6 deep-*.log
          exit $fail

      - name: Tap every button on every screen
        run: |
          pids=""
          for mode in app browser; do
            for part in 0 1; do
              node tools/qa/clicker.js $mode $part 2 > robot-$mode-$part.log 2>&1 &
              pids="$pids $!"
            done
          done
          fail=0
          for pid in $pids; do wait $pid || fail=1; done
          tail -n 4 robot-*.log
          grep -h PROBLEM robot-*.log | sort -u | head -n 60 || true
          exit $fail

  app:
    name: The app builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the app file (not published)
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Keep the test build with this run
        uses: actions/upload-artifact@v4
        with:
          name: CapAndGown-test-build
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
