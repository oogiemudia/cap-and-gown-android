name: Build the app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the signed app file
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Save the result to the ci branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/build.log 2>/dev/null || echo "no log" > out/build.log
          cp app/build/outputs/apk/release/app-release.apk out/CapAndGown.apk 2>/dev/null || true
          echo "${{ steps.build.outcome }} run=${{ github.run_number }} commit=${{ github.sha }}" > out/status.txt
          cd out
          git init -q -b ci
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci

      - name: Publish the app file as the latest release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/CapAndGown.apk \
            --title "Cap and Gown, build ${{ github.run_number }}" \
            --notes "On your phone: download CapAndGown.apk, open it and tap Install. It installs over the old version and keeps your ticks."

      - name: Stop here if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1
